ruleset:
  # Every operation in the published HTTP spec is covered by breaking-change
  # enforcement, with no exemptions. Story 4.4 briefly ran with an
  # `exclude_operations_with_extension: x-draft` exemption while its contracts
  # settled across stacked branches; that is done, and the exemption is gone
  # so a bypass cannot be reintroduced by tagging a contract file alone.
  - breaking-changes
