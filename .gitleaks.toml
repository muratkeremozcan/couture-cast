title = "Couture Cast gitleaks config"

[extend]
useDefault = true

# Gitleaks 8.24.3 correctly applies this top-level path allowlist during `detect`
# for BMAD vendor files that trigger generic-api-key false positives.
[allowlist]
paths = [
  '''_bmad/_config/files-manifest\.csv''',
  '''_bmad/wds/workflows/6-asset-generation/steps-p/step-01-load-context\.md''',
  '''\.claude/''',
  # jwt.ts contains PEM header strings as regex patterns for parsing, not actual private keys
  '''packages/k6-utils/src/jwt\.ts''',
]
regexes = [
  # Fixed UUID used only as an idempotency-key fixture in wardrobe service tests
  '''^34eff0f2-39b2-454e-b6b1-44a9ebfdb8ec$''',
  # Fixed HMAC key used only to sign and verify locally generated test tokens
  '''^wardrobe-test-secret-at-least-32-bytes$''',
  # Fixed UUID used only as the capsule idempotency-key fixture in Pact contracts
  '''^3f1e8c2a-9b47-4d21-8f6e-5a0c7d3b1e94$''',
  # Fixed UUID used only as the My Form commit idempotency-key fixture in
  # wardrobe-silhouette.controller.spec.ts
  '''^4b6b3b0a-1c8a-4a9e-8b8e-1a2b3c4d5e6f$''',
  # Fixed fake JWT (payload is just {"sub":"user-1"}, no real signature) used as
  # a mobile wardrobe test fixture in Story 4.4 Task 6; a subsequent commit on
  # this same branch replaced the literal with a runtime-constructed equivalent,
  # but gitleaks scans every commit's diff in history, so this allowlist entry
  # covers the already-committed literal rather than requiring a history rewrite.
  '''^header\.eyJzdWIiOiJ1c2VyLTEifQ\.signature$''',
]
