name: Run schema validation
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  schema-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4

      - name: Read Node version from .nvmrc
        id: node_version
        run: echo "NODE_VERSION=$(cat .nvmrc)" >> $GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Story 6.1: the shared HTTP contracts import `CLIMATE_BANDS` from
      # `@couture/utils`, so `generate:http-openapi` now needs that package
      # built. `npm ci --ignore-scripts` above skips every prepare hook, so
      # nothing else in this job would build it and the generate step fails
      # with `Cannot find module '@couture/utils/dist/index.js'`. Only utils
      # is built: it is the one workspace the contracts and the generator
      # reach for, checked by grepping their `@couture/*` imports.
      - name: Build the shared utils package the contracts import
        run: npm run build --workspace @couture/utils

      - name: Optic lint base OpenAPI spec ahead of other checks
        run: npm run optic:lint

      - name: Generate OpenAPI spec from code
        run: npm run generate:http-openapi

      # `optic:diff` fetches origin/main itself and diffs against the
      # remote-tracking ref, so no separate fetch step is needed here. Keeping
      # the fetch inside the npm script means a local run gates against the
      # same commit CI does; the previous `--base main` compared against
      # whatever the local `main` ref happened to point at, which silently
      # reported false breaking changes in worktrees with a stale `main`.
      - name: Optic diff (OpenAPI diff vs snapshot on main)
        run: npm run optic:diff

      # The socket-event schema document is generated by `gen:openapi:events` and was
      # checked in with no guard of any kind: no freshness spec like the HTTP document has,
      # and no workflow that ran its generator. Drift in it was worse than unguarded, it was
      # invisible, because nothing in CI ever produced the file to compare against.
      #
      # Settled before this step was added rather than after: a local regenerate on
      # 2026-09-06 produced a byte-identical document, so this guard starts from a green
      # baseline. A guard added over already-stale output fails on its first run and gets
      # read as a tooling problem instead of as the finding.
      #
      # It runs before the SDK step because it is cheap: only `tsx` over the shared Zod
      # types, where that step downloads the openapi-generator JAR. It does need the
      # `@couture/utils` build above, because `socket-events.ts` imports `CLIMATE_BANDS`.
      - name: Fail when the checked-in socket-event schemas are stale (regenerate them and commit the result)
        run: |
          npm run gen:openapi:events --workspace @couture/api-client
          if ! git diff --exit-code -- packages/api-client/docs/socket-events.openapi.json; then
            echo "::error::packages/api-client/docs/socket-events.openapi.json is behind packages/api-client/src/types/socket-events.ts. Run 'npm run gen:openapi:events --workspace @couture/api-client' locally and commit the result."
            exit 1
          fi

      # The checked-in OpenAPI document is kept honest by
      # `packages/api-client/testing/http-openapi.spec.ts`, which fails when it differs from a
      # freshly built one. The SDK generated *from* that document, under
      # `packages/api-client/src/generated`, had no equivalent guard: it could sit several
      # contract changes behind the JSON with every job in this workflow still green, and the
      # apps would keep compiling against types that no longer describe the API. Regenerating it
      # here and failing on a diff closes that gap.
      #
      # This runs last on purpose. `npm ci --ignore-scripts` above skipped the
      # openapi-generator-cli postinstall, so this first `generate` call is what downloads the
      # generator JAR; the cheaper Optic checks get to fail before that cost is paid. It also has
      # to run after the `@couture/utils` build above, because `generate:api-client` re-runs
      # `generate:http-openapi` as its first step.
      - name: Fail when the checked-in SDK is stale (regenerate it and commit the result)
        run: |
          npm run generate:api-client
          if ! git diff --exit-code -- packages/api-client/src/generated; then
            echo "::error::packages/api-client/src/generated is behind packages/api-client/docs/http.openapi.json. Run 'npm run generate:api-client' locally and commit the result."
            exit 1
          fi
