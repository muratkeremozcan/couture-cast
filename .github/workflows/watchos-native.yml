name: watchOS native

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: watchos-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  watchos-native:
    name: watchOS native
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate watchOS prebuild
        run: npm run test:watchos-prebuild --workspace mobile
