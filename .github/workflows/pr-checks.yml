# Step 7 step 1 owner: searchable owner anchor
# Step 7 step 7 owner: wire monorepo workspace coverage directories and badge inputs in `.github/workflows/pr-checks.yml`
name: PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      clock_offset:
        description: libfaketime offset for tests-year-ahead, for a longer look ahead (+3650d)
        required: false
        default: +365d

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The ephemeral service container declared on `tests`, not a shared
  # environment. `RLS_TEST_DATABASE_URL` falls back to this, so one URL serves
  # both the schema suites and the RLS actor matrix.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  # Story 1.2b: the real-database location suites run here and fail, never
  # skip, when their schema probe fails.
  LOCATION_PREFERENCES_REAL_DB_INTEGRATION: 'true'
  COVERAGE_GIST_ID: 64348ebdc6e662b93ade9f40bdc03442

jobs:
  # The quality checks run as parallel jobs so none of them holds a PR for the
  # sum of the others; `quality-gate` below aggregates them. Each job states the
  # same check it ran as a step of the single former job.
  runtime-deps:
    name: Web aliased runtime dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Verify web aliased runtime dependencies
        run: npm run check:web:aliased-runtime-deps

  typecheck:
    name: Typecheck workspaces
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Generate Prisma Client
        id: prisma
        run: npm run db:generate

      - name: Typecheck workspaces
        run: npm run typecheck

  lint:
    name: Lint sources
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Generate Prisma Client
        id: prisma
        run: npm run db:generate

      - name: Lint sources
        run: npm run lint

  lighthouse:
    name: Lighthouse accessibility gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Generate Prisma Client
        id: prisma
        run: npm run db:generate

      - name: Build packages
        id: build
        run: npm run build

      - name: Install Playwright Chromium
        id: chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse accessibility gate
        id: lighthouse
        run: npm run test:a11y:lighthouse

      - name: Upload Lighthouse accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-${{ github.event.pull_request.number || github.sha }}
          path: playwright/artifacts/lighthouse/

  # One job for all workspaces took 19m41s of a 20 minute limit. The shards split it, and
  # `scripts/ci/coverage-shards.mjs` keeps every workspace in exactly one of them.
  tests-shard:
    name: Workspace coverage (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [api, mobile, other]
    # `packages/db/test/**` holds the RLS actor matrix and every schema
    # constraint assertion, and it talks to a real PostgreSQL. It only started
    # running here when story 5.1 added `test:coverage` to that workspace, at
    # which point it failed with ECONNREFUSED: the job-level DATABASE_URL points
    # at `secrets.DATABASE_URL_PREVIEW`, which is not a secret this repository
    # has, so it resolved to an empty string.
    #
    # An ephemeral container rather than a shared environment is deliberate.
    # These suites create and drop policies and switch roles; pointing them at
    # the dev database would violate the environment-separation rule and would
    # make two concurrent runs corrupt each other.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis comes with the database, not separately. Several
      # `apps/api/integration` suites probe for the schema and take a
      # Redis-backed path only when they find it, so a job with PostgreSQL and
      # no Redis is the one combination that hangs: `wardrobe-silhouette`
      # reaches `reapPreviousRunQueues()` and its `beforeAll` dies on the 10s
      # timeout. Verified locally against this exact pair, where that suite's
      # nine tests pass.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        id: setup
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Generate Prisma Client
        id: prisma
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run db:generate

      # The migrations assume a Supabase database. A stock PostgreSQL image
      # provides neither the three roles (91 GRANT statements name
      # `authenticated` alone) nor `auth.jwt()`, which eight policies call, so
      # `migrate deploy` fails on the first grant without this.
      #
      # This must run BEFORE any migration attempt: a half-applied migration
      # leaves a failed row in `_prisma_migrations` and every later deploy stops
      # with P3009.
      #
      # `auth.jwt()` is Supabase's own definition, not an approximation. The RLS
      # suite drives it by setting `request.jwt.claims` with `set_config`, which
      # is exactly the path this reads.
      - name: Provision Supabase-compatible roles and auth schema
        id: roles
        if: ${{ !cancelled() }}
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(
              nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), '')
            )::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;

          -- WITHOUT THIS LINE THE RLS SUITE'S NEGATIVE ASSERTIONS ARE VACUOUS.
          --
          -- Supabase grants the client roles default privileges on every table
          -- created in `public`. That is why the migrations carry
          -- `REVOKE ALL ON TABLE ... FROM authenticated, anon` on the three
          -- commerce catalog tables: on Supabase there is something to revoke.
          -- On a stock image there is not, so those REVOKEs are no-ops and
          -- `expect(clientGrants.rows).toEqual([])` passes whether or not they
          -- exist. Measured: deleting all three REVOKE statements left the RLS
          -- suite at 49/49 green. The control that stops `authenticated`
          -- reading the partner catalog was unfalsifiable in CI.
          --
          -- Scope is exact and both halves of it are load-bearing.
          -- FOUR DML PRIVILEGES ONLY, never ALL: `GRANT ALL` also confers
          -- REFERENCES, TRIGGER and TRUNCATE, which is the artefact the web
          -- pane measured against a real `supabase start`, and the suites
          -- assert an exact privilege set, so it fails 8 tests.
          -- TO `authenticated` ONLY, never `anon`: the suites require `anon` to
          -- hold zero grants everywhere, so including it fails 6 tests.
          --
          -- Verified against postgres:17-alpine: the real migration gives
          -- 97/97 including 5.1-DB-020, and the REVOKE-deleted mutant now fails
          -- 2 tests instead of passing silently.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL

      - name: Apply migrations to the test database
        id: migrations
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.roles.outcome == 'success' }}
        run: node scripts/prisma-migrate-deploy.mjs

      # Together, because a slow apt mirror once added 2 minutes to the Chromium install and more than
      # 4 in another run. Only `apps/mobile` runs tests in a browser.
      - name: Build packages and install Playwright Chromium
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.prisma.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          chromium=
          if [ "$SHARD" = mobile ]; then
            npx playwright install --with-deps chromium &
            chromium=$!
          fi
          npm run build
          if [ -n "$chromium" ]; then wait "$chromium"; fi

      - name: Run tests with coverage
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.migrations.outcome == 'success' }}
        id: tests
        continue-on-error: true
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
          # The Prisma and build steps above already did what each workspace's pre-hook repeats.
          COVERAGE_SHARED_DEPS_BUILT: 'true'
        run: npm run test:coverage

      - name: Record this shard's result
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        env:
          SHARD: ${{ matrix.shard }}
          OUTCOME: ${{ steps.tests.outcome }}
          DIRS: ${{ steps.tests.outputs.coverage_dirs }}
          FAILURES: ${{ steps.tests.outputs.failures }}
        run: node scripts/ci/coverage-shards.mjs record

      # The result file sits at the repository root, which keeps every coverage path repo-relative in
      # the artifact: its root is the deepest folder the uploaded files share.
      - name: Upload this shard's coverage
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          overwrite: true
          retention-days: 1
          path: |
            coverage-shard-result-${{ matrix.shard }}.json
            apps/*/coverage/coverage-summary.json
            apps/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info

      # In a shard because it needs `yaml` from the install, and in one shard because once is enough.
      - name: Require later checks to run after an earlier check fails
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && matrix.shard == 'other' }}
        run: node --test scripts/ci/workflow-step-shadowing.test.mjs

      - name: Fail if tests failed
        if: ${{ always() && steps.tests.outcome == 'failure' }}
        run: |
          echo "::error::Workspace tests failed"
          exit 1

  # Every workspace suite once more with every clock a year ahead: the test processes (Node and
  # the Prisma engine inside it) through libfaketime, and PostgreSQL through the same library in
  # its container. A pinned test clock stays pinned. A fixture that seeds an expiry, window or
  # retention from a pinned clock while the code reads the real one passes on the day it lands
  # and fails here at once, instead of a year later on every PR: on 2026-11-11 a seeded 7-day
  # ban from a clock pinned at 2026-11-04 expired at 12:00 UTC and turned the api shard red.
  tests-year-ahead:
    name: Workspace tests a year ahead (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [api, mobile, other]
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/postgres
      YEAR_AHEAD: ${{ inputs.clock_offset || '+365d' }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # The coverage shards' database with libfaketime added, a year ahead. A service container
      # cannot add the library, so this one is built and started here.
      - name: Start PostgreSQL a year ahead
        id: database
        run: |
          printf 'FROM postgres:17-alpine\nRUN apk add --no-cache libfaketime\n' |
            docker build -q -t postgres-year-ahead -
          docker run -d --name postgres -p 5432:5432 \
            -e POSTGRES_PASSWORD=postgres \
            -e LD_PRELOAD=/usr/lib/faketime/libfaketime.so.1 \
            -e FAKETIME="$YEAR_AHEAD" -e DONT_FAKE_MONOTONIC=1 \
            postgres-year-ahead
          for attempt in $(seq 1 60); do
            docker exec postgres pg_isready -U postgres && break
            sleep 1
          done
          docker exec postgres psql -U postgres -tAc 'SELECT now()'

      - name: Install libfaketime for the test processes
        id: faketime
        if: ${{ !cancelled() }}
        run: |
          sudo apt-get install -y -qq libfaketime
          ls /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1

      - name: Setup Node environment
        id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Generate Prisma Client
        id: prisma
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run db:generate

      # The coverage shards' own provisioning SQL, read from their step so the two cannot drift.
      - name: Provision Supabase-compatible roles and auth schema
        id: roles
        if: ${{ !cancelled() && steps.database.outcome == 'success' && steps.setup.outcome == 'success' }}
        run: |
          node --input-type=module -e "import('./scripts/integration-postgres.mjs').then((m) => process.stdout.write(m.qualityGateProvisioningSql()))" |
            psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1

      - name: Apply migrations to the test database
        id: migrations
        if: ${{ !cancelled() && steps.roles.outcome == 'success' }}
        run: node scripts/prisma-migrate-deploy.mjs

      - name: Build packages and install Playwright Chromium
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' && steps.prisma.outcome == 'success' }}
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          chromium=
          if [ "$SHARD" = mobile ]; then
            npx playwright install --with-deps chromium &
            chromium=$!
          fi
          npm run build
          if [ -n "$chromium" ]; then wait "$chromium"; fi

      - name: Run tests a year ahead
        id: tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' && steps.migrations.outcome == 'success' && steps.faketime.outcome == 'success' }}
        env:
          COVERAGE_SHARD: ${{ matrix.shard }}
          COVERAGE_SHARED_DEPS_BUILT: 'true'
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/faketime/libfaketime.so.1
          FAKETIME: ${{ env.YEAR_AHEAD }}
          DONT_FAKE_MONOTONIC: '1'
        run: |
          node -e "console.log('test clock', new Date().toISOString())"
          npm run test:coverage

  # The name every reader knows. It reports all shards as one coverage comment and goes red unless
  # every shard passed, so a skipped or cancelled shard is a failure too.
  tests:
    name: Workspace tests with coverage
    needs: [tests-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node
        id: setup
        if: ${{ !cancelled() }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Download every shard's coverage
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
          path: .

      - name: Merge shard results
        id: tests
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node scripts/ci/coverage-shards.mjs merge

      # Named `tests` so the comment reads the same outputs a single job gave it.
      - name: Coverage report and PR comment
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        uses: ./.github/actions/unit-test-coverage-comment
        with:
          coverage-path: ./coverage
          coverage-summary-path: ./coverage/coverage-summary.json
          report-name: coverage-report-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.tests.outputs.outcome }}
          workspace-dirs: ${{ steps.tests.outputs.coverage_dirs }}
          failures: ${{ steps.tests.outputs.failures }}
          diff-coverage-threshold: '80'
          badge-gist-id: ${{ env.COVERAGE_GIST_ID }}
          badge-filename-prefix: couture-cast
          badge-gist-auth: ${{ secrets.COVERAGE_GIST_TOKEN }}

      - name: Keep every workspace in exactly one coverage shard
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: node --test scripts/ci/coverage-shards.test.mjs

      # `always()` so this names the real cause when the comment step above dies on missing coverage.
      - name: Fail unless every shard passed
        if: ${{ always() && (needs.tests-shard.result != 'success' || steps.tests.outputs.outcome != 'success') }}
        env:
          SHARDS: ${{ needs.tests-shard.result }}
          OUTCOME: ${{ steps.tests.outputs.outcome }}
        run: |
          echo "::error::Workspace tests failed: shards ${SHARDS:-unknown}, merged outcome ${OUTCOME:-unknown}"
          exit 1

  # The one job a ruleset or reader needs: red when any quality check is red,
  # cancelled or skipped, with every result named.
  quality-gate:
    name: quality-gate
    needs: [runtime-deps, typecheck, lint, lighthouse, tests]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every quality check to pass
        env:
          RESULTS: >-
            tests=${{ needs.tests.result }} lighthouse=${{ needs.lighthouse.result }}
            lint=${{ needs.lint.result }} typecheck=${{ needs.typecheck.result }}
            runtime-deps=${{ needs.runtime-deps.result }}
        run: |
          for result in $RESULTS; do
            if [ "${result#*=}" != "success" ]; then
              echo "::error::Quality gate failed: $RESULTS"
              exit 1
            fi
          done
          echo "Quality gate passed: $RESULTS"

  community-realtime-budget:
    name: Community realtime cold-handshake budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --conditions=development
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Prepare generated dependencies before the measured phase
        run: |
          npm run db:generate
          npm run build:packages
      - name: Provision isolated CI roles
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), ''))::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL
      # One test worker, its own runner and services, no concurrent builds or suites.
      # The product keeps its 1950 ms deadline, five-connection pool and 100 cold members.
      # Each proof runs the burst twice: on this runner's own disk, then with 100 ms
      # durable commits and a 150 ms flag provider, the production shape.
      - name: Require five independent cold-start budget proofs
        id: proofs
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p .cache/realtime-budget
          for attempt in 1 2 3 4 5; do
            npx vitest run --config vitest.realtime-budget.config.ts --reporter=default --reporter=json --outputFile=".cache/realtime-budget/run-$attempt.json" 2>&1 | tee ".cache/realtime-budget/run-$attempt.log"
          done
      - name: Require execution of every budget proof
        if: ${{ !cancelled() && (steps.proofs.outcome == 'success' || steps.proofs.outcome == 'failure') }}
        working-directory: apps/api
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          for (let attempt = 1; attempt <= 5; attempt++) {
            const report = JSON.parse(fs.readFileSync(`.cache/realtime-budget/run-${attempt}.json`, 'utf8'))
            if (report.numTotalTests !== 2 || report.numPassedTests !== 2 ||
                report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
              throw new Error(`Incomplete realtime budget proof: ${attempt}`)
          }
          JS
      - name: Upload cold-handshake timings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-realtime-budget
          path: apps/api/.cache/realtime-budget/
          if-no-files-found: error

  community-screening-gates:
    name: Community corpus and mixed workload budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMUNITY_NSFW_SCREENER: tensorflow
      NODE_OPTIONS: --conditions=development
      COMMUNITY_SCREENING_RUN_PRODUCT_DIR: .cache/community-screening
      RUN_COMMENT_RESOURCE_MEASUREMENT: 'true'
      # The text corpus specs are excluded from every other apps/api run.
      RUN_COMMUNITY_TEXT_CORPUS: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The pinned model and WASM artifacts ship in npm packages. This action restores
      # their lockfile-keyed npm cache; the manifest verification also runs on cache hits.
      - uses: ./.github/actions/setup-node-env
      - name: Generate Prisma client and shared packages
        id: packages
        run: |
          npm run db:generate
          npm run build:packages
      - name: Provision isolated CI cluster roles
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), ''))::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL
      - name: Verify cached pinned model and compile the production worker
        id: compile
        run: |
          node scripts/verify-community-screening-model.mjs
          npm run build --workspace api
      - name: Mandatory seven-locale release corpus evaluation
        working-directory: apps/api
        run: npx vitest run src/modules/community/community-text-corpus.evaluation.spec.ts --reporter=default --reporter=json --outputFile=.cache/community-screening/corpus-ci-tests.json
      # Pure data checks over the development corpora, run without coverage
      # instrumentation and one file at a time. Measured 2026-10-27 with coverage in
      # the shared quality-gate run on this runner size, the slowest cases took 9.5 s
      # (a locale with the default budget) and 23.8 s (the retired-corpora loop with
      # its own 20 s budget); locally without coverage they take 2.0-2.7 s and
      # 5.6-6.8 s. 15 s per case is 1.6x the worst covered, contended measurement for
      # the cases on the default budget, and an awaited hang still fails at 15 s. The
      # step timeout stops a synchronous loop: the two files take 82 s of CPU locally,
      # and 10 minutes is over 7x that.
      - name: Mandatory corpus development specs without coverage instrumentation
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        working-directory: apps/api
        timeout-minutes: 10
        run: npx vitest run src/modules/community/community-text-round3-development.spec.ts src/modules/community/community-text-round5-development.spec.ts --maxWorkers=1 --testTimeout=15000 --reporter=default --reporter=json --outputFile=.cache/community-screening/development-ci-tests.json
      - name: Mandatory compiled mixed workload and resource budgets
        if: ${{ !cancelled() && steps.compile.outcome == 'success' }}
        working-directory: apps/api
        run: npx vitest run integration/community-comments-measurement.integration.spec.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.cache/community-screening/mixed-ci-tests.json
      # The development specs are frozen, so their count is exact: 181 round3 cases
      # and 43 round5 cases. A dropped or renamed fixture set changes it.
      - name: Require complete execution with every opt-in case enabled
        if: ${{ !cancelled() && steps.packages.outcome == 'success' }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const problems = []
          for (const [file, minimum, exact] of [['corpus-ci-tests.json',52],['mixed-ci-tests.json',1],['development-ci-tests.json',224,224]]) {
            const name = `apps/api/.cache/community-screening/${file}`
            if (!fs.existsSync(name)) { problems.push(`${file}: no report`); continue }
            const report = JSON.parse(fs.readFileSync(name,'utf8'))
            if (report.numTotalTests < minimum || (exact !== undefined && report.numTotalTests !== exact) ||
                report.numPassedTests !== report.numTotalTests || report.numPendingTests !== 0 ||
                report.numFailedTests !== 0 || report.numTodoTests !== 0)
              problems.push(`${file}: ${report.numPassedTests}/${report.numTotalTests} passed`)
          }
          if (problems.length) throw new Error(`Incomplete mandatory screening execution: ${problems.join('; ')}`)
          JS
      - name: Upload corpus and compiled-worker measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-screening-gates
          path: apps/api/.cache/community-screening/
          if-no-files-found: error
