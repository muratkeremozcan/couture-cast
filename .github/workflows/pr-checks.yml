# Step 7 step 1 owner: searchable owner anchor
name: PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  # The ephemeral service container declared on `quality-gate`, not a shared
  # environment. `RLS_TEST_DATABASE_URL` falls back to this, so one URL serves
  # both the schema suites and the RLS actor matrix.
  DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
  # Story 1.2b: the real-database location suites run here and fail, never
  # skip, when their schema probe fails.
  LOCATION_PREFERENCES_REAL_DB_INTEGRATION: 'true'
  COVERAGE_GIST_ID: 64348ebdc6e662b93ade9f40bdc03442

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # `packages/db/test/**` holds the RLS actor matrix and every schema
    # constraint assertion, and it talks to a real PostgreSQL. It only started
    # running here when story 5.1 added `test:coverage` to that workspace, at
    # which point it failed with ECONNREFUSED: the job-level DATABASE_URL points
    # at `secrets.DATABASE_URL_PREVIEW`, which is not a secret this repository
    # has, so it resolved to an empty string.
    #
    # An ephemeral container rather than a shared environment is deliberate.
    # These suites create and drop policies and switch roles; pointing them at
    # the dev database would violate the environment-separation rule and would
    # make two concurrent runs corrupt each other.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # Redis comes with the database, not separately. Several
      # `apps/api/integration` suites probe for the schema and take a
      # Redis-backed path only when they find it, so a job with PostgreSQL and
      # no Redis is the one combination that hangs: `wardrobe-silhouette`
      # reaches `reapPreviousRunQueues()` and its `beforeAll` dies on the 10s
      # timeout. Verified locally against this exact pair, where that suite's
      # nine tests pass.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Verify web aliased runtime dependencies
        run: npm run check:web:aliased-runtime-deps

      - name: Generate Prisma Client
        run: npm run db:generate

      # The migrations assume a Supabase database. A stock PostgreSQL image
      # provides neither the three roles (91 GRANT statements name
      # `authenticated` alone) nor `auth.jwt()`, which eight policies call, so
      # `migrate deploy` fails on the first grant without this.
      #
      # This must run BEFORE any migration attempt: a half-applied migration
      # leaves a failed row in `_prisma_migrations` and every later deploy stops
      # with P3009.
      #
      # `auth.jwt()` is Supabase's own definition, not an approximation. The RLS
      # suite drives it by setting `request.jwt.claims` with `set_config`, which
      # is exactly the path this reads.
      - name: Provision Supabase-compatible roles and auth schema
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'anon') THEN
              CREATE ROLE anon NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'service_role') THEN
              CREATE ROLE service_role NOLOGIN BYPASSRLS;
            END IF;
          END
          $$;
          CREATE SCHEMA IF NOT EXISTS auth;
          CREATE OR REPLACE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(
              nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), '')
            )::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;

          -- WITHOUT THIS LINE THE RLS SUITE'S NEGATIVE ASSERTIONS ARE VACUOUS.
          --
          -- Supabase grants the client roles default privileges on every table
          -- created in `public`. That is why the migrations carry
          -- `REVOKE ALL ON TABLE ... FROM authenticated, anon` on the three
          -- commerce catalog tables: on Supabase there is something to revoke.
          -- On a stock image there is not, so those REVOKEs are no-ops and
          -- `expect(clientGrants.rows).toEqual([])` passes whether or not they
          -- exist. Measured: deleting all three REVOKE statements left the RLS
          -- suite at 49/49 green. The control that stops `authenticated`
          -- reading the partner catalog was unfalsifiable in CI.
          --
          -- Scope is exact and both halves of it are load-bearing.
          -- FOUR DML PRIVILEGES ONLY, never ALL: `GRANT ALL` also confers
          -- REFERENCES, TRIGGER and TRUNCATE, which is the artefact the web
          -- pane measured against a real `supabase start`, and the suites
          -- assert an exact privilege set, so it fails 8 tests.
          -- TO `authenticated` ONLY, never `anon`: the suites require `anon` to
          -- hold zero grants everywhere, so including it fails 6 tests.
          --
          -- Verified against postgres:17-alpine: the real migration gives
          -- 97/97 including 5.1-DB-020, and the REVOKE-deleted mutant now fails
          -- 2 tests instead of passing silently.
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL

      - name: Apply migrations to the test database
        run: node scripts/prisma-migrate-deploy.mjs

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint sources
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse accessibility gate
        id: lighthouse
        continue-on-error: true
        run: npm run test:a11y:lighthouse

      - name: Upload Lighthouse accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-${{ github.event.pull_request.number || github.sha }}
          path: playwright/artifacts/lighthouse/

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: npm run test:coverage

      - name: Coverage report and PR comment
        uses: ./.github/actions/unit-test-coverage-comment
        with:
          coverage-path: ./coverage
          coverage-summary-path: ./coverage/coverage-summary.json
          report-name: coverage-report-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.tests.outcome }}
          workspace-dirs: ${{ steps.tests.outputs.coverage_dirs }}
          diff-coverage-threshold: '80'
          badge-gist-id: ${{ env.COVERAGE_GIST_ID }}
          badge-filename-prefix: couture-cast
          badge-gist-auth: ${{ secrets.COVERAGE_GIST_TOKEN }}

      # `always()` so this runs even when the coverage-comment step above has
      # already failed. `continue-on-error` on the test step is deliberate and
      # should stay: it is what lets the coverage comment post on a red run,
      # which is when it is most useful. But it means a failing test run reaches
      # the comment step, which then dies on the missing lcov and takes the job
      # down with an error about a missing file rather than about the tests.
      # The gate held either way; the reported cause was wrong. This step now
      # always runs and names the real one. It still exits 0 when the tests
      # passed, so a comment step that fails for its own reasons is not masked.
      - name: Fail if tests failed
        if: always() && (steps.tests.outcome == 'failure' || steps.lighthouse.outcome == 'failure')
        run: |
          echo "::error::Quality gate failed: tests=${{ steps.tests.outcome }} lighthouse=${{ steps.lighthouse.outcome }}"
          exit 1

  community-realtime-budget:
    name: Community realtime cold-handshake budget
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --conditions=development
      REDIS_URL: redis://127.0.0.1:6379
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-node-env
      - name: Prepare generated dependencies before the measured phase
        run: |
          npm run db:generate
          npm run build:packages
      - name: Provision isolated CI roles
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), ''))::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL
      # One test worker, its own runner and services, no concurrent builds or suites.
      # The product keeps its 1950 ms deadline, five-connection pool and 100 cold members.
      - name: Require five independent cold-start budget proofs
        working-directory: apps/api
        run: |
          set -euo pipefail
          mkdir -p .cache/realtime-budget
          for attempt in 1 2 3 4 5; do
            npx vitest run --config vitest.realtime-budget.config.ts --reporter=default --reporter=json --outputFile=".cache/realtime-budget/run-$attempt.json" 2>&1 | tee ".cache/realtime-budget/run-$attempt.log"
          done
      - name: Require execution of every budget proof
        working-directory: apps/api
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          for (let attempt = 1; attempt <= 5; attempt++) {
            const report = JSON.parse(fs.readFileSync(`.cache/realtime-budget/run-${attempt}.json`, 'utf8'))
            if (report.numTotalTests !== 1 || report.numPassedTests !== 1 ||
                report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
              throw new Error(`Incomplete realtime budget proof: ${attempt}`)
          }
          JS
      - name: Upload cold-handshake timings and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-realtime-budget
          path: apps/api/.cache/realtime-budget/
          if-no-files-found: error

  community-screening-gates:
    name: Community corpus and mixed workload budgets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMMUNITY_NSFW_SCREENER: tensorflow
      NODE_OPTIONS: --conditions=development
      COMMUNITY_SCREENING_RUN_PRODUCT_DIR: .cache/community-screening
      RUN_COMMENT_RESOURCE_MEASUREMENT: 'true'
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # The pinned model and WASM artifacts ship in npm packages. This action restores
      # their lockfile-keyed npm cache; the manifest verification also runs on cache hits.
      - uses: ./.github/actions/setup-node-env
      - name: Generate Prisma client and shared packages
        run: |
          npm run db:generate
          npm run build:packages
      - name: Provision isolated CI cluster roles
        run: |
          psql "$DATABASE_URL" -q -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN;
          CREATE ROLE authenticated NOLOGIN;
          CREATE ROLE service_role NOLOGIN BYPASSRLS;
          CREATE SCHEMA auth;
          CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS $fn$
            SELECT coalesce(nullif(current_setting('request.jwt.claim', true), ''),
              nullif(current_setting('request.jwt.claims', true), ''))::jsonb
          $fn$;
          GRANT USAGE ON SCHEMA auth TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO authenticated;
          SQL
      - name: Verify cached pinned model and compile the production worker
        run: |
          node scripts/verify-community-screening-model.mjs
          npm run build --workspace api
      - name: Mandatory seven-locale release corpus evaluation
        working-directory: apps/api
        run: npx vitest run src/modules/community/community-text-corpus.evaluation.spec.ts --reporter=default --reporter=json --outputFile=.cache/community-screening/corpus-ci-tests.json
      - name: Mandatory compiled mixed workload and resource budgets
        working-directory: apps/api
        run: npx vitest run integration/community-comments-measurement.integration.spec.ts --maxWorkers=1 --reporter=default --reporter=json --outputFile=.cache/community-screening/mixed-ci-tests.json
      - name: Require complete execution with every opt-in case enabled
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          for (const [file, minimum] of [['corpus-ci-tests.json',52],['mixed-ci-tests.json',1]]) {
            const report = JSON.parse(fs.readFileSync(`apps/api/.cache/community-screening/${file}`,'utf8'))
            if (report.numTotalTests < minimum || report.numPassedTests !== report.numTotalTests ||
                report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
              throw new Error(`Incomplete mandatory screening execution: ${file}`)
          }
          JS
      - name: Upload corpus and compiled-worker measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: community-screening-gates
          path: apps/api/.cache/community-screening/
          if-no-files-found: error
