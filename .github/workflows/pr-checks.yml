# Step 7 step 1 owner: searchable owner anchor
name: PR checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  DATABASE_URL: ${{ secrets.DATABASE_URL_PREVIEW }}
  COVERAGE_GIST_ID: 64348ebdc6e662b93ade9f40bdc03442

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    # Story 5.1 Task 1 added `test:coverage` to `packages/db/package.json` so
    # `scripts/run-workspace-test-coverage.mjs` would pick the workspace up and,
    # in its own words, so "these suites actually run on a PR". Picking the
    # workspace up was necessary and not sufficient: this job had no database, so
    # the six live-PostgreSQL specs there (the RLS actor matrix, every schema
    # check constraint, the commerce seed) failed on connection rather than
    # running, and took the coverage merge down with them for want of an
    # lcov.info.
    #
    # `secrets.DATABASE_URL_PREVIEW` does not fill this gap and never did. It is
    # genuinely empty, not merely masked: a masked secret prints as `***` in the
    # log the way `GITHUB_TOKEN` does, and this one prints as nothing on every
    # run including the last green one.
    #
    # So the database is stood up here the same way `pr-pw-e2e-local.yml` does
    # it. Redis comes along because giving the suites a reachable database
    # un-skips API integration specs that also expect one.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node environment
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Verify web aliased runtime dependencies
        run: npm run check:web:aliased-runtime-deps

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Typecheck workspaces
        run: npm run typecheck

      - name: Lint sources
        run: npm run lint

      - name: Build packages
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse accessibility gate
        id: lighthouse
        continue-on-error: true
        run: npm run test:a11y:lighthouse

      - name: Upload Lighthouse accessibility reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-accessibility-${{ github.event.pull_request.number || github.sha }}
          path: playwright/artifacts/lighthouse/

      - name: Start local Supabase services
        uses: ./.github/actions/start-local-supabase

      # Migrations and seeds, not just migrations. `commerce-seed.spec.ts`
      # asserts on the seeded `sample-partner` catalog, so a migrated-but-unseeded
      # database would fail it for the wrong reason.
      - name: Reset the local database
        run: npm run db:reset
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}

      - name: Run tests with coverage
        id: tests
        continue-on-error: true
        run: npm run test:coverage
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          # `packages/db/test/**` reads this one first; the API integration specs
          # read INTEGRATION_TEST_DATABASE_URL then DATABASE_URL. Setting both
          # means every suite points at the database this job just prepared
          # rather than at a default that happens to match it.
          RLS_TEST_DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          INTEGRATION_TEST_DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          REDIS_URL: redis://127.0.0.1:6379

      - name: Coverage report and PR comment
        uses: ./.github/actions/unit-test-coverage-comment
        with:
          coverage-path: ./coverage
          coverage-summary-path: ./coverage/coverage-summary.json
          report-name: coverage-report-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.tests.outcome }}
          workspace-dirs: ${{ steps.tests.outputs.coverage_dirs }}
          diff-coverage-threshold: '80'
          badge-gist-id: ${{ env.COVERAGE_GIST_ID }}
          badge-filename-prefix: couture-cast
          badge-gist-auth: ${{ secrets.COVERAGE_GIST_TOKEN }}

      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure' || steps.lighthouse.outcome == 'failure'
        run: exit 1
