name: TEA Test Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

# Deny-all baseline for GITHUB_TOKEN. Not the same as omitting the key, which
# falls back to the repository default; each job opts back in below.
permissions: {}

jobs:
  review:
    name: test review
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The fork guard is only for the pull_request path; the mention path is
    # gated inside the action (OWNER/MEMBER/COLLABORATOR, never a bot).
    if: github.event_name == 'issue_comment' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      pull-requests: write # for the review comment
    steps:
      # Each review step automatically tags comments/artifacts with its agent name
      # so both agents post separate PR comments without overwriting each other.
      # A '@codex ...' or '@claude ...' comment re-runs on demand, and text after
      # the mention becomes focus. Checkout and base-ref resolution are the action's own job.
      - name: Review with Codex
        uses: muratkeremozcan/tea-test-review@v2
        with:
          prompt: '@codex'
          agent: codex
          model: gpt-5.6-luna
          mode: manual
          agent-args: -c model_reasoning_effort=low
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-playwright-utils: 'true'
          use-pactjs-utils: 'true'

      - name: Review with Claude
        uses: muratkeremozcan/tea-test-review@v2
        with:
          prompt: '@claude'
          agent: claude
          mode: manual
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          use-playwright-utils: 'true'
          use-pactjs-utils: 'true'
