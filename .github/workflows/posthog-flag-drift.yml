# Fails when the production PostHog project (couturecast-prod, 329012) disagrees with a flag
# declared in packages/config/src/flags.ts: missing, inactive, not a uniform boolean release, or
# released at a value other than its declared default or pinned override. On 2026-11-11
# production read a project that defined 4 of the 14 declared flags, and community push
# deliveries re-deferred for a day with nothing reporting it. The hourly run turns drift into a
# red scheduled run, which GitHub emails to the workflow's owner. A pull request that declares a
# new flag runs it too, so the flag exists in production before the code that reads it merges.
#
# Two inputs: POSTHOG_FLAG_READ_KEY, a repository secret holding a personal API key limited to
# feature_flag:read and project:read on project 329012, reads the flag definitions (targeting,
# rollout, variants) and the project's Discard client IP data setting, which the analytics privacy
# boundary needs on;
# POSTHOG_PROD_PROJECT_TOKEN, a repository variable holding the public project token the runtime
# ships with, runs the server-side evaluation probes. The job fails closed without either.
name: PostHog flag drift

on:
  pull_request:
    paths:
      - 'packages/config/src/flags.ts'
      - 'scripts/ci/posthog-flag-drift.mjs'
      - 'scripts/ci/posthog-flag-drift.test.mjs'
      - '.github/workflows/posthog-flag-drift.yml'
  push:
    branches: [main]
    paths:
      - 'packages/config/src/flags.ts'
      - 'scripts/ci/posthog-flag-drift.mjs'
      - 'scripts/ci/posthog-flag-drift.test.mjs'
      - '.github/workflows/posthog-flag-drift.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

concurrency:
  group: posthog-flag-drift-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  drift:
    name: Declared flags exist in production PostHog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check the drift script
        run: node --test scripts/ci/posthog-flag-drift.test.mjs

      # Runs even when the script's own tests fail, so a broken test never hides real drift. A pull
      # request from a fork gets neither the secret nor the variable, so it runs the script's tests
      # only; the hourly and main runs compare production.
      - name: Compare declared flags with production PostHog
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          POSTHOG_FLAG_READ_KEY: ${{ secrets.POSTHOG_FLAG_READ_KEY }}
          POSTHOG_PROD_PROJECT_TOKEN: ${{ vars.POSTHOG_PROD_PROJECT_TOKEN }}
        run: node scripts/ci/posthog-flag-drift.mjs
