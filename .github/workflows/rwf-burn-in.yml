# Step 7 step 3 owner: searchable owner anchor
name: Burn-in changed Playwright specs

on:
  workflow_call:
    inputs:
      base-ref:
        type: string
        description: Base ref to diff against
        default: 'origin/main'
      test-directory:
        type: string
        description: Directory containing Playwright tests and burn-in script
        default: 'playwright/'
      install-command:
        type: string
        description: Dependency install command
        default: 'npm ci'
    outputs:
      runE2E:
        description: Whether downstream E2E should run
        value: ${{ jobs.report.outputs.runE2E }}
    secrets:
      GUARDIAN_INVITE_JWT_SECRET:
        required: false

jobs:
  # Detects changed specs and sizes the burn-in matrix, so a wide PR fans out across shards
  # instead of running past the 20-minute PR job limit in one job. No Supabase or browsers.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.detect-changed.outputs.changed }}
      base-ref: ${{ steps.base-ref.outputs.value }}
      runs: ${{ steps.plan.outputs.runs }}
      total: ${{ steps.plan.outputs.total }}
      shards: ${{ steps.plan.outputs.shards }}
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Resolve base ref
        id: base-ref
        run: |
          INPUT_BASE_REF="${{ inputs.base-ref }}"
          PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
          EFFECTIVE_BASE_REF="$INPUT_BASE_REF"

          if [[ "${{ github.event_name }}" == "pull_request" && -n "$PR_BASE_SHA" ]]; then
            if [[ -z "$INPUT_BASE_REF" || "$INPUT_BASE_REF" == "origin/main" ]]; then
              EFFECTIVE_BASE_REF="$PR_BASE_SHA"
            fi
          fi

          echo "value=$EFFECTIVE_BASE_REF" >> "$GITHUB_OUTPUT"
          echo "Resolved base ref: $EFFECTIVE_BASE_REF"

      - name: Detect changed Playwright specs
        id: detect-changed
        run: |
          BASE_REF="${{ steps.base-ref.outputs.value }}"
          if [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            # If the commit is already present locally, no fetch is required.
            git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null || git fetch origin "$BASE_REF" --quiet || true
          else
            REMOTE_REF="$BASE_REF"
            LOCAL_REF="$BASE_REF"
            if [[ "$BASE_REF" =~ ^origin/ ]]; then
              REMOTE_REF="${BASE_REF#origin/}"
            fi
            git fetch origin "$REMOTE_REF" --quiet || true
            git branch -f "$LOCAL_REF" "origin/$REMOTE_REF" || true
          fi

          CHANGED=$(git diff "$BASE_REF"...HEAD --name-only | grep -E '^${{ inputs.test-directory }}.*\.(spec|test)\.(ts|tsx)$' || true)

          if [[ -z "$CHANGED" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changed Playwright specs. Skipping burn-in.";
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed specs:"; echo "$CHANGED"
          fi

      - name: Setup Node and install deps
        if: steps.detect-changed.outputs.changed == 'true'
        uses: ./.github/actions/install
        with:
          install-command: ${{ inputs.install-command }}

      # The library's own analyzer selects the specs, and `playwright test --list` counts
      # the runs, repeats included; `shardCount` in playwright/scripts/burn-in-changed.ts
      # turns that into the matrix size. The shards then split by recorded test duration.
      - name: Plan the burn-in shards
        id: plan
        if: steps.detect-changed.outputs.changed == 'true'
        run: |
          npm run prepare:playwright
          npx tsx playwright/scripts/burn-in-changed.ts \
            --base-branch="${{ steps.base-ref.outputs.value }}" \
            --plan-out="$GITHUB_OUTPUT"

  burn-in:
    needs: plan
    if: needs.plan.outputs.changed == 'true' && needs.plan.outputs.total != ''
    runs-on: ubuntu-latest
    # The plan caps a shard at 200 test runs, about 4.5 min at one worker, on top of about
    # 8 min of setup: about 13 min, which leaves 7 min for slow Supabase start attempts.
    timeout-minutes: 20
    strategy:
      # Every shard reports; one red shard must not hide another.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    permissions:
      actions: read
      contents: read
    # LOCAL_DATABASE_URL comes from configure-ci-supabase-ports, the first step after checkout.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and the URLs derived from them from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports

      - name: Setup Node and install deps
        uses: ./.github/actions/install
        with:
          install-command: ${{ inputs.install-command }}

      - name: Setup Playwright browsers
        uses: ./.github/actions/setup-playwright-browsers

      - name: Start local Supabase services
        uses: ./.github/actions/start-local-supabase

      - name: Reset local burn-in database
        run: npm run db:reset
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}

      - name: Prepare base branch for diff
        run: |
          BASE_REF="${{ needs.plan.outputs.base-ref }}"
          if [[ "$BASE_REF" =~ ^[0-9a-f]{40}$ ]]; then
            git cat-file -e "${BASE_REF}^{commit}" 2>/dev/null || git fetch origin "$BASE_REF" --quiet || true
          else
            REMOTE_REF="$BASE_REF"
            LOCAL_REF="$BASE_REF"
            if [[ "$BASE_REF" =~ ^origin/ ]]; then
              REMOTE_REF="${BASE_REF#origin/}"
            fi
            git fetch origin "$REMOTE_REF" --quiet || true
            # Align local ref to remote to avoid ambiguous ref errors.
            git branch -f "$LOCAL_REF" "origin/$REMOTE_REF" || true
          fi

      - name: Record git SHA
        id: git-sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Balances the shards by past test durations, read from the history the main E2E suite
      # publishes from main (same tests, same project; a repeat is priced like its test). It
      # exports PSP_ARGS, which burn-in-changed.ts appends to this shard's Playwright command,
      # and the finish step in pr-pw-e2e-local.yml checks that every run happened once.
      # Fallback mode samples with its own --shard, so the step stays off there.
      - name: Balance burn-in shards by duration
        if: needs.plan.outputs.mode == 'targeted'
        uses: muratkeremozcan/playwright-smart-parallelization@v1

      - name: Run burn-in for this shard
        id: burn-in-step
        working-directory: ${{ inputs.test-directory }}
        run: |
          HUSKY=0 NEXT_DISABLE_ESLINT=1 NEXT_PRIVATE_SKIP_TYPE_CHECK=1 npm run build --workspace web
          SHARD_FLAG=()
          if [[ "${{ needs.plan.outputs.mode }}" == "targeted" ]]; then
            SHARD_FLAG=(--shard="${{ matrix.shard }}/${{ needs.plan.outputs.total }}")
          fi
          npm run test:pw:burn-in-changed -- --base-branch=${{ needs.plan.outputs.base-ref }} "${SHARD_FLAG[@]}"
        env:
          # Align health check SHA with the build produced in this workflow; use HEAD, not the PR merge ref
          EXPECTED_SHA: ${{ steps.git-sha.outputs.sha }}
          GITHUB_SHA: ${{ steps.git-sha.outputs.sha }}
          # Deliberately step-scoped, not hoisted to the job or workflow `env`.
          # `TEST_ENV=local` is what `allowsTestOnlySecrets()` keys on, so
          # hoisting it would switch on test-only secret fallbacks for every
          # step in this job, and three api specs assert the
          # NON-test-environment behaviour of exactly that helper. Least
          # privilege here is not a style preference: widening the scope makes
          # those three specs assert the wrong branch.
          TEST_ENV: local
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          GUARDIAN_INVITE_JWT_SECRET: ${{ secrets.GUARDIAN_INVITE_JWT_SECRET }}

      # Blocks the upload when a report or trace carries a secret this job
      # holds. Fails closed: if the scan cannot run, nothing is uploaded.
      - name: Check burn-in artifacts for secret values
        id: secret-scan
        if: ${{ always() && steps.burn-in-step.outcome == 'failure' }}
        env:
          GUARDIAN_INVITE_JWT_SECRET: ${{ secrets.GUARDIAN_INVITE_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TEST_DIRECTORY: ${{ inputs.test-directory }}
        run: >-
          node scripts/check-artifact-secrets.mjs
          --names GUARDIAN_INVITE_JWT_SECRET,GH_TOKEN
          "$TEST_DIRECTORY/playwright-report" "$TEST_DIRECTORY/test-results"

      - name: Upload burn-in failure artifacts
        id: upload-burn-in-artifacts
        if: ${{ always() && steps.burn-in-step.outcome == 'failure' && steps.secret-scan.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-shard-${{ matrix.shard }}
          path: |
            ${{ inputs.test-directory }}/playwright-report
            ${{ inputs.test-directory }}/test-results
          if-no-files-found: warn

  # One verdict and one PR comment for all shards, and the gate output callers read.
  report:
    needs: [plan, burn-in]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      pull-requests: write
    outputs:
      runE2E: ${{ steps.set-output.outputs.runE2E }}
      status: ${{ steps.set-output.outputs.status }}
    steps:
      - name: Resolve burn-in outcome
        id: outcome
        run: |
          if [[ "${{ needs.plan.result }}" != "success" ]]; then
            OUTCOME=failure
          elif [[ "${{ needs.plan.outputs.changed }}" != "true" ]]; then
            OUTCOME=skipped
          else
            OUTCOME="${{ needs.burn-in.result }}"
          fi
          echo "value=$OUTCOME" >> "$GITHUB_OUTPUT"
          echo "Burn-in outcome: $OUTCOME (plan ${{ needs.plan.result }}, shards ${{ needs.plan.outputs.total }}, runs ${{ needs.plan.outputs.runs }})"

      - name: Resolve burn-in artifact URL
        id: resolve-url
        if: ${{ always() && github.event_name == 'pull_request' && steps.outcome.outputs.value == 'failure' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/github-script@v7
        with:
          script: |
            let reportUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            try {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100,
              });
              // Several red shards each upload a report; the run page lists them all, so link
              // straight to a report only when exactly one shard produced one.
              const reports = artifacts.filter((artifact) => artifact.name.startsWith('playwright-report-shard-'));
              if (reports.length === 1 && reports[0].id) reportUrl = `${reportUrl}/artifacts/${reports[0].id}`;
            } catch (error) {
              core.warning(`Could not resolve burn-in report URL: ${error instanceof Error ? error.message : String(error)}`);
            }
            core.setOutput('report_url', reportUrl);

      - name: Comment burn-in result on PR
        if: ${{ always() && github.event_name == 'pull_request' && needs.plan.outputs.changed == 'true' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- playwright-burn-in-report -->';
            const burnInOutcome = '${{ steps.outcome.outputs.value }}';
            const reportUrl = '${{ steps.resolve-url.outputs.report_url }}';

            let body;
            if (burnInOutcome === 'failure') {
              body = [
                marker,
                '## 🔥 Burn-in Failed',
                '',
                'The burn-in tests for changed specs failed. E2E is **blocked** until burn-in passes.',
                '',
                `📦 **[Download Burn-in Report & Traces](${reportUrl})**`,
                '',
                '_Fix the failing tests and push again to re-run burn-in._',
              ].join('\n');
            } else if (burnInOutcome === 'success') {
              body = [
                marker,
                '## ✅ Burn-in Passed',
                '',
                'The burn-in tests for changed specs passed. E2E will proceed.',
              ].join('\n');
            } else if (burnInOutcome === 'cancelled') {
              body = [
                marker,
                '## ⚠️ Burn-in Cancelled',
                '',
                'The burn-in run was cancelled.',
              ].join('\n');
            } else {
              body = [
                marker,
                '## ⏭️ Burn-in Skipped',
                '',
                'Burn-in did not run — a setup step failed or was skipped before tests could execute.',
              ].join('\n');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });

            const existing = comments.find((comment) =>
              comment.user?.login === 'github-actions[bot]' &&
              comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
              core.info(`Updated existing burn-in comment (id: ${existing.id})`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
              core.info('Created new burn-in comment');
            }

      - name: Set downstream gating output
        id: set-output
        if: always()
        run: |
          OUTCOME="${{ steps.outcome.outputs.value }}"
          if [[ "$OUTCOME" == "skipped" ]]; then
            echo "runE2E=true" >> "$GITHUB_OUTPUT"
            echo "status=skipped" >> "$GITHUB_OUTPUT"
            echo "✅ Burn-in skipped (no changed specs)";
            exit 0
          fi

          RUN_E2E="true"
          if [[ "$OUTCOME" != "success" ]]; then
            RUN_E2E="false"
          fi

          echo "runE2E=${RUN_E2E}" >> "$GITHUB_OUTPUT"
          echo "status=${OUTCOME}" >> "$GITHUB_OUTPUT"

          if [[ "$RUN_E2E" == "true" ]]; then
            echo "✅ Burn-in gate passed"
          else
            echo "❌ Burn-in gate blocked"
            exit 1
          fi
