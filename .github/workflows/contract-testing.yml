# Step 7 step 5 owner: searchable owner anchor
name: Contract testing

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # The lanes this push wakes (scripts/ci/lanes.mjs). Each job a lane gates needs this one and
  # is skipped when its lane is false; this job's summary says why. It installs nothing, so it
  # holds the jobs it gates for seconds.
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.lanes.outputs.plan }}
      coverage_shards: ${{ steps.lanes.outputs.coverage_shards }}
    steps:
      - name: Checkout the lane map and workspace manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/ci/lanes.mjs
            apps/*/package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Plan the lanes
        id: lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANES_WORKFLOW: contract-testing.yml
        run: node scripts/ci/lanes.mjs

  # Its own job on every pull request: a secret can land in any file, so no lane plan skips
  # this scan. A push to main scans nothing (the commits were scanned on their pull request),
  # so it does not start a runner there.
  secrets:
    name: Gitleaks secrets scan
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # gitleaks scans every commit of the pull request.
          fetch-depth: 0

      - name: Gitleaks secrets scan
        if: ${{ github.event_name != 'push' }}
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload gitleaks report
        if: ${{ always() && github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: ignore
          retention-days: 5

  local-contracts:
    name: Local schema and Pact contracts
    needs: lanes
    if: fromJSON(needs.lanes.outputs.plan)['contract']
    runs-on: ubuntu-latest
    # 2.7 minutes at p50, 3.1 at p95 (last 20 runs, 2026-11-12), before schema validation
    # (2.4 at p95) joined it.
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history, as before the secrets scan moved out: the Optic diff reads origin/main.
          fetch-depth: 0

      # The schema checks were a workflow of their own until 2026-11-12, a runner and a queue
      # slot per push against the account's 20 concurrent jobs. Each is a named step here, run
      # whatever the others did, so a failure still names its check
      # (scripts/ci/pr-pipeline-shape.test.mjs). The secrets scan, folded in on the same day,
      # moved to the `secrets` job above when lane selection let a plan skip this job.
      - name: Setup Node environment
        id: setup
        if: ${{ !cancelled() }}
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'false'

      - name: Build the shared utils package the contracts import
        id: utils
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: npm run build --workspace @couture/utils

      - name: Schema validation, Optic lint base OpenAPI spec
        if: ${{ !cancelled() && github.event_name != 'push' && steps.setup.outcome == 'success' }}
        run: npm run optic:lint

      - name: Schema validation, generate OpenAPI spec from code
        id: openapi
        if: ${{ !cancelled() && github.event_name != 'push' && steps.utils.outcome == 'success' }}
        run: npm run generate:http-openapi

      - name: Schema validation, Optic diff against main
        if: ${{ !cancelled() && github.event_name != 'push' && steps.openapi.outcome == 'success' }}
        run: npm run optic:diff

      - name: Schema validation, checked-in socket-event schemas are current
        if: ${{ !cancelled() && github.event_name != 'push' && steps.utils.outcome == 'success' }}
        run: |
          npm run gen:openapi:events --workspace @couture/api-client
          if ! git diff --exit-code -- packages/api-client/docs/socket-events.openapi.json; then
            echo "::error::packages/api-client/docs/socket-events.openapi.json is behind packages/api-client/src/types/socket-events.ts. Run 'npm run gen:openapi:events --workspace @couture/api-client' locally and commit the result."
            exit 1
          fi

      - name: Schema validation, checked-in SDK is current
        if: ${{ !cancelled() && github.event_name != 'push' && steps.utils.outcome == 'success' }}
        run: |
          npm run generate:api-client
          if ! git diff --exit-code -- packages/api-client/src/generated; then
            echo "::error::packages/api-client/src/generated is behind packages/api-client/docs/http.openapi.json. Run 'npm run generate:api-client' locally and commit the result."
            exit 1
          fi

      - name: Run blocking Pact workflow
        id: pact
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        continue-on-error: true
        run: npm run test:pact

      - name: Pact report and comment
        if: always()
        uses: ./.github/actions/pact-report-comment
        with:
          report-name: contract-testing-diagnostics-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.pact.outcome }}
          check-label: 'Local schema, consumer, and provider contracts'

      - name: Fail if Pact workflow failed
        if: ${{ !cancelled() && steps.pact.outcome == 'failure' }}
        run: exit 1
