# Story 6.15 D6: the iOS native jobs. No macOS job runs on a pull request or gates a merge (owner
# rule, 2026-11-13), so these run nightly and by manual dispatch only. The development client and
# the Release app build on macos-26 with Xcode 26.4 or later, which SDK 56 needs; the shards and
# Expo Go run that client on the iOS 18.5 simulator of macos-15 (Xcode 16.4), since the iOS 26.5
# simulator of macos-26 was not stable enough for them (C-16). Two workflows call them for one
# commit, `sha`:
#
#   ios-native.yml           nightly on main, which keeps the development client cache warm, and
#                            a manual dispatch.
#   ios-native-canary.yml    nightly, with ios26-canary: the shards and Expo Go on macos-26's
#                            iOS 26.5 simulator. It gates nothing.
#
# Shape: ios-build keys the development client by its native inputs and builds, scans and caches
# it only on a miss; four ios-shard jobs and ios-expo-go restore exactly that scanned client and
# run in parallel; ios-evidence proves every shard reported its exact cases; ios-app-build builds
# the Release app beside them. Wall time about 75 minutes (client build up to 31 when its key
# misses, then the longest shard, 44 at p95).
#
# On a dispatch ios-build always builds the commit's own client, scans it and hands it to the
# shards and Expo Go as an artifact of this run, kept for one day. Every cache save skips a
# dispatch, a dispatch installs with npm alone and no local action, and setup caches are off for
# it, so a dispatch of any ref leaves main's caches as the nightly run wrote them.
#
# Every job checks out `sha` and fails unless HEAD is exactly that commit, which the callers' run
# names carry.
name: iOS native jobs

on:
  workflow_call:
    inputs:
      sha:
        description: 'Full 40-character commit SHA to test'
        required: true
        type: string
      # Only ios-native-canary.yml passes it: the shards and Expo Go then run on macos-26 with Xcode
      # 26.4 or later, on the iOS 26.5 simulator they left for C-16.
      ios26-canary:
        description: 'Run the shards and Expo Go on the macos-26 iOS 26.5 simulator'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60
    env: &runtime_env
      PLAYWRIGHT_SKIP_DB_RESET: 'true'
      CC68_HARNESS_DIR: _bmad-output/test-artifacts/story-6-8/runtime
      MAESTRO_CLI_NO_ANALYTICS: '1'
    outputs:
      app-key: ${{ steps.native_key.outputs.key }}
      app-path: ${{ steps.native_key.outputs.path }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      # The run name carries this commit, which nightly triage matches; every job proves it
      # checked out exactly that commit before anything else.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      - name: Select Xcode 26.4 or later
        id: xcode
        env:
          XCODE: '26.4+'
        run: &select_xcode |
          set -eo pipefail
          # XCODE_ROOT exists for scripts/ci/ios-native-workflow.test.mjs; the runner uses /Applications.
          root="${XCODE_ROOT:-/Applications}"
          xcode=''
          case "$XCODE" in
            16.4)
              if [ -d "$root/Xcode_16.4.app" ]; then xcode="$root/Xcode_16.4.app"; fi
              ;;
            26.4+)
              for app in "$root"/Xcode_26.*.app; do
                if [[ "$app" =~ /Xcode_26\.([0-9]+)(\.[0-9]+)?\.app$ ]] && [ "${BASH_REMATCH[1]}" -ge 4 ]; then
                  xcode=$(printf '%s\n%s\n' "$xcode" "$app" | sed '/^$/d' | sort -V | tail -1)
                fi
              done
              ;;
          esac
          if [ -z "$xcode" ]; then
            echo "::error::Xcode $XCODE is required; installed: $(echo "$root"/Xcode*.app)"
            exit 1
          fi
          sudo xcode-select -s "$xcode/Contents/Developer"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          xcodebuild -version
          # The startup probe boots the simulator runtime of this SDK version.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          echo "iOS simulator SDK $sdk"
          case "$XCODE:$sdk" in
            16.4:18.5 | 26.4+:26.*) ;;
            *)
              echo "::error::Xcode $XCODE brought iOS simulator SDK $sdk"
              exit 1
              ;;
          esac
      - name: Disable Spotlight indexing on the disposable iOS runner
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'macOS'
          node scripts/ci/native-host-evidence.mjs sample before-indexing-disable --platform ios
          sudo mdutil -a -s
          sudo mdutil -a -i off
          sudo mdutil -s /System/Volumes/Data
          node scripts/ci/native-host-evidence.mjs sample after-indexing-disable --platform ios
      # storage-api runs on the Node major its Dockerfile pins; the repo's own Node
      # comes from the install step after this one and stays first on PATH.
      - name: Provision Node 22 for the native storage-api
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the Node 22 binary for the native storage-api
        run: echo "NATIVE_SUPABASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      # A local action is the dispatched commit's own code, and the shared install saves caches.
      - name: Install dependencies with the shared caches
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/install
      - name: Set up Node without a download cache for a dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies without a cache for a dispatch
        id: install
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: if [ "$DISPATCH" = true ]; then bash scripts/ci/install-dependencies.sh; fi
      - name: Verify startup deadline controls
        id: deadline_controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      # Most commits change no native input. Then the client of this key is already cached, this
      # job ends here and the shards restore it. On a miss the steps below build, scan and save it.
      # A dispatch skips the lookup and always builds the commit's own client.
      - name: Key the iOS development client by its native inputs
        id: native_key
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/native-build-cache.mjs key --platform ios >> "$GITHUB_OUTPUT"
      - name: Look up the development client of this fingerprint
        id: native_cache
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && github.event_name != 'workflow_dispatch' }}
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
          lookup-only: true
      - uses: actions/setup-java@v4
        id: java
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && steps.native_cache.outcome != 'failure' && steps.native_cache.outputs.cache-hit != 'true' }}
        with:
          distribution: temurin
          java-version: '21'
      # The macOS lane runs Supabase as native processes built from pinned,
      # checksum-verified sources (scripts/ci/native-supabase.mjs). Each build is
      # saved to the cache as soon as it exists, so a failed job still keeps it.
      - name: Pin the native Supabase build inputs
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        id: native
        run: node scripts/ci/native-supabase.mjs cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore PostgreSQL
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        id: postgres-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Build PostgreSQL from its verified source
        id: postgres_build
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.postgres-cache.outputs.cache-hit != 'true' }}
        run: node scripts/ci/native-supabase.mjs build postgres
      - name: Save PostgreSQL
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.postgres_build.outcome == 'success' && steps.postgres-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Restore Redis
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        id: redis-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Build Redis from its verified source
        id: redis_build
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.redis-cache.outputs.cache-hit != 'true' }}
        run: node scripts/ci/native-supabase.mjs build redis
      - name: Save Redis
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.redis_build.outcome == 'success' && steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Restore GoTrue
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        id: gotrue-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Fetch the pinned GoTrue source
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        run: node scripts/ci/native-supabase.mjs fetch gotrue
      - name: Provision Go for GoTrue
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/native-supabase/sources/auth/go.mod
          cache-dependency-path: ${{ runner.temp }}/native-supabase/sources/auth/go.sum
          # The module and build caches would save on a dispatch.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Build GoTrue
        id: gotrue_build
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        run: node scripts/ci/native-supabase.mjs build gotrue
      - name: Save GoTrue
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.gotrue_build.outcome == 'success' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Restore storage-api
        if: ${{ !cancelled() && steps.native.outcome == 'success' }}
        id: storage-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Build storage-api
        id: storage_build
        if: ${{ !cancelled() && steps.native.outcome == 'success' && steps.storage-cache.outputs.cache-hit != 'true' }}
        run: node scripts/ci/native-supabase.mjs build storage
      - name: Save storage-api
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.storage_build.outcome == 'success' && steps.storage-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Start the native Supabase stack
        id: supabase
        if: ${{ !cancelled() && steps.deadline_controls.outcome == 'success' && steps.java.outcome == 'success' && steps.native.outcome == 'success' && steps.postgres_build.outcome != 'failure' && steps.redis_build.outcome != 'failure' && steps.gotrue_build.outcome != 'failure' && steps.storage_build.outcome != 'failure' }}
        timeout-minutes: 8
        run: node scripts/ci/native-supabase.mjs start
      - name: Provision the local Storage buckets
        id: buckets
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        run: node scripts/local-storage-buckets.mjs provision
      - name: Prepare isolated UUID runtime and built renderer
        id: runtime
        if: ${{ !cancelled() && steps.buckets.outcome == 'success' }}
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status, so an early crash is
          # reported by the name of the service that stopped.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform ios > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      - name: Generate native development client
        id: prebuild
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs prebuild --platform ios
      - name: Mark the owned iOS build-service window
        id: build_window
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        run: node scripts/ci/native-build-daemons.mjs mark
      - name: Build native development client
        id: native_build
        if: ${{ !cancelled() && steps.build_window.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs build --platform ios
      - name: Release the owned iOS build services
        if: ${{ !cancelled() && steps.build_window.outcome == 'success' }}
        run: node scripts/ci/native-build-daemons.mjs stop
      # The repository is public, and a fork's pull request can restore this cache. The client may
      # carry the anon key of this job's loopback stack (a client key, signed by a secret that dies
      # with the job) and nothing else: no service role key, no owned environment value.
      - name: Refuse to cache a development client that embeds a secret
        id: app_scan
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: node scripts/ci/native-ios-app-secret-scan.mjs /tmp/cc68-ios-build/Build/Products/Debug-iphonesimulator/CoutureCastStory68.app "$CC68_HARNESS_DIR"
      - name: Save the scanned development client of this fingerprint
        id: native_save
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.app_scan.outcome == 'success' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      # A save that lost a race to a concurrent run leaves no entry of this run's own; the shards
      # need one, so the job fails here, once, ahead of the four shards.
      - name: Require the saved development client for the shards
        if: ${{ github.event_name != 'workflow_dispatch' && !cancelled() && steps.native_save.outcome == 'success' }}
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
          lookup-only: true
          fail-on-cache-miss: true
      # A dispatch saves no cache, so the scanned client reaches the shards and Expo Go as an
      # artifact of this run. A tar keeps the executable bit, which upload-artifact drops.
      - name: Pack the scanned development client for this dispatch
        id: client_pack
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && steps.app_scan.outcome == 'success' }}
        env:
          APP: ${{ steps.native_key.outputs.path }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ios-client"
          tar -C "$(dirname "$APP")" -cf "$RUNNER_TEMP/ios-client/client.tar" "$(basename "$APP")"
      - name: Hand the scanned development client to this dispatch's jobs
        if: ${{ github.event_name == 'workflow_dispatch' && !cancelled() && steps.client_pack.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-dev-client
          path: ${{ runner.temp }}/ios-client/client.tar
          retention-days: 1
          if-no-files-found: error
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ios
          CC68_CI_API: 0
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-ios-build
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: ${{ !cancelled() && failure() }}
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always()
        run: node scripts/ci/native-supabase.mjs stop
  # Four shards balanced by measured minutes (scripts/ci/native-matrix-shards.mjs): nominal jobs of
  # 33.7 to 35.3 minutes, from per-flow times of runs 41352898854 and 41429581850, where the
  # longest shard took 40.9 and 41.8. They run in parallel beside ios-expo-go, each installing the
  # scanned client ios-build cached or, on a dispatch, handed over.
  ios-shard:
    needs: ios-build
    if: ${{ !cancelled() && needs.ios-build.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ${{ inputs.ios26-canary && 'macos-26' || 'macos-15' }}
    timeout-minutes: 70
    env: *runtime_env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      # The run name carries this commit, which nightly triage matches; every job proves it
      # checked out exactly that commit before anything else.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      # Xcode 16.4 on the macOS 15 image carries the iOS 18.5 simulator the flows run on: the iOS
      # 26.5 simulator of macos-26 was not stable enough for them. The client built on macos-26
      # runs there unchanged.
      - name: Select Xcode 16.4 for the iOS 18.5 simulator, or 26.4 or later for the canary
        id: xcode
        env:
          XCODE: ${{ inputs.ios26-canary && '26.4+' || '16.4' }}
        run: *select_xcode
      - name: Disable Spotlight indexing on the disposable iOS runner
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'macOS'
          node scripts/ci/native-host-evidence.mjs sample before-indexing-disable --platform ios
          sudo mdutil -a -s
          sudo mdutil -a -i off
          sudo mdutil -s /System/Volumes/Data
          node scripts/ci/native-host-evidence.mjs sample after-indexing-disable --platform ios
      # storage-api runs on the Node major its Dockerfile pins; the repo's own Node
      # comes from the install step after this one and stays first on PATH.
      - name: Provision Node 22 for the native storage-api
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the Node 22 binary for the native storage-api
        run: echo "NATIVE_SUPABASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      # A local action is the dispatched commit's own code, and the shared install saves caches.
      - name: Install dependencies with the shared caches
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/install
      - name: Set up Node without a download cache for a dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies without a cache for a dispatch
        id: install
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: if [ "$DISPATCH" = true ]; then bash scripts/ci/install-dependencies.sh; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the iOS project generator
        run: brew install xcodegen
      # The macOS lane runs Supabase as native processes built from pinned,
      # checksum-verified sources (scripts/ci/native-supabase.mjs). Each build is
      # saved to the cache as soon as it exists, so a failed job still keeps it.
      - name: Pin the native Supabase build inputs
        id: native
        run: node scripts/ci/native-supabase.mjs cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore PostgreSQL
        id: postgres-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Build PostgreSQL from its verified source
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build postgres
      - name: Save PostgreSQL
        if: ${{ github.event_name != 'workflow_dispatch' && steps.postgres-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Restore Redis
        id: redis-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Build Redis from its verified source
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build redis
      - name: Save Redis
        if: ${{ github.event_name != 'workflow_dispatch' && steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Restore GoTrue
        id: gotrue-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Fetch the pinned GoTrue source
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs fetch gotrue
      - name: Provision Go for GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/native-supabase/sources/auth/go.mod
          cache-dependency-path: ${{ runner.temp }}/native-supabase/sources/auth/go.sum
          # The module and build caches would save on a dispatch.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Build GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build gotrue
      - name: Save GoTrue
        if: ${{ github.event_name != 'workflow_dispatch' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Restore storage-api
        id: storage-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Build storage-api
        if: steps.storage-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build storage
      - name: Save storage-api
        if: ${{ github.event_name != 'workflow_dispatch' && steps.storage-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Start the native Supabase stack
        timeout-minutes: 8
        run: node scripts/ci/native-supabase.mjs start
      - name: Provision the local Storage buckets
        run: node scripts/local-storage-buckets.mjs provision
      - name: Prepare isolated UUID runtime and built renderer
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status, so an early crash is
          # reported by the name of the service that stopped.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform ios > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      # ios-build resolved the key and, on a miss, saved the scanned client before this job started.
      - name: Restore the development client of this fingerprint
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ needs.ios-build.outputs.app-path }}
          key: ${{ needs.ios-build.outputs.app-key }}
          fail-on-cache-miss: true
      # A dispatch saves no cache: ios-build built and scanned this commit's client and handed it
      # over as an artifact of this run.
      - name: Download the scanned development client of this dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: ios-dev-client
          path: ${{ runner.temp }}/ios-client
      - name: Unpack the scanned development client of this dispatch
        id: client_unpack
        if: github.event_name == 'workflow_dispatch'
        env:
          APP: ${{ needs.ios-build.outputs.app-path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APP")"
          tar -C "$(dirname "$APP")" -xf "$RUNNER_TEMP/ios-client/client.tar"
          test -d "$APP"
      # Story 6.15 C-16: the client is built with Xcode 26 and runs on the selected runtime (iOS 18.5
      # on macos-15), which holds only while its deployment target is at most that runtime.
      - name: Compare the client's minimum iOS with the selected simulator runtime
        id: client_fits
        env:
          APP: ${{ needs.ios-build.outputs.app-path }}
        run: |
          set -euo pipefail
          min=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          node scripts/ci/native-ios-runtime-fits.mjs "$min" "$sdk"
      - name: iOS shard flows
        run: |
          shard='${{ matrix.shard }}/4'
          node scripts/e2e-share-card/warm-metro.mjs --platform ios
          node scripts/ci/native-ios-startup-probe.mjs --for-native-flow
          device=$(cat /tmp/cc68-simulator)
          node scripts/ci/native-host-evidence.mjs sample before-first-flow --platform ios
          node scripts/run-story68-native.mjs open --platform ios --device "$device"
          node scripts/ci/native-host-evidence.mjs first-flow passed --platform ios
          node scripts/ci/native-host-evidence.mjs metro --platform ios
          node scripts/ci/native-host-evidence.mjs sample after-first-flow --platform ios
          # The assignment fails the step when the command list fails.
          commands=$(node scripts/ci/native-ios-shards.mjs commands "$shard")
          test -n "$commands"
          for command in $commands; do
            node scripts/run-story68-native.mjs "$command" --platform ios --device "$device" --shard "$shard"
          done
      - name: Record closed iOS host, first-flow and Metro diagnostics
        if: ${{ !cancelled() && failure() }}
        run: |
          node scripts/ci/native-host-evidence.mjs sample failure --platform ios
          node scripts/ci/native-host-evidence.mjs first-flow failed --platform ios
          node scripts/ci/native-host-evidence.mjs metro --platform ios
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ios
          CC68_CI_API: 0
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-ios-shard-${{ matrix.shard }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: ${{ !cancelled() && failure() }}
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always()
        run: node scripts/ci/native-supabase.mjs stop
      - name: Delete owned CI simulator
        if: always()
        run: node scripts/ci/native-ios-device-cleanup.mjs

  # The Expo Go proof runs alone on a fresh simulator. The iOS checks that need no development
  # client follow it.
  ios-expo-go:
    needs: ios-build
    if: ${{ !cancelled() && needs.ios-build.result == 'success' }}
    runs-on: ${{ inputs.ios26-canary && 'macos-26' || 'macos-15' }}
    timeout-minutes: 60
    env: *runtime_env
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      # The run name carries this commit, which nightly triage matches; every job proves it
      # checked out exactly that commit before anything else.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      # Xcode 16.4 on the macOS 15 image carries the iOS 18.5 simulator the flows run on: the iOS
      # 26.5 simulator of macos-26 was not stable enough for them. The client built on macos-26
      # runs there unchanged.
      - name: Select Xcode 16.4 for the iOS 18.5 simulator, or 26.4 or later for the canary
        id: xcode
        env:
          XCODE: ${{ inputs.ios26-canary && '26.4+' || '16.4' }}
        run: *select_xcode
      - name: Disable Spotlight indexing on the disposable iOS runner
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'macOS'
          node scripts/ci/native-host-evidence.mjs sample before-indexing-disable --platform ios
          sudo mdutil -a -s
          sudo mdutil -a -i off
          sudo mdutil -s /System/Volumes/Data
          node scripts/ci/native-host-evidence.mjs sample after-indexing-disable --platform ios
      # storage-api runs on the Node major its Dockerfile pins; the repo's own Node
      # comes from the install step after this one and stays first on PATH.
      - name: Provision Node 22 for the native storage-api
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the Node 22 binary for the native storage-api
        run: echo "NATIVE_SUPABASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      # A local action is the dispatched commit's own code, and the shared install saves caches.
      - name: Install dependencies with the shared caches
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/install
      - name: Set up Node without a download cache for a dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Install dependencies without a cache for a dispatch
        id: install
        env:
          DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
        run: if [ "$DISPATCH" = true ]; then bash scripts/ci/install-dependencies.sh; fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the iOS project generator
        run: brew install xcodegen
      # The macOS lane runs Supabase as native processes built from pinned,
      # checksum-verified sources (scripts/ci/native-supabase.mjs). Each build is
      # saved to the cache as soon as it exists, so a failed job still keeps it.
      - name: Pin the native Supabase build inputs
        id: native
        run: node scripts/ci/native-supabase.mjs cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore PostgreSQL
        id: postgres-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Build PostgreSQL from its verified source
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build postgres
      - name: Save PostgreSQL
        if: ${{ github.event_name != 'workflow_dispatch' && steps.postgres-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Restore Redis
        id: redis-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Build Redis from its verified source
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build redis
      - name: Save Redis
        if: ${{ github.event_name != 'workflow_dispatch' && steps.redis-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Restore GoTrue
        id: gotrue-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Fetch the pinned GoTrue source
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs fetch gotrue
      - name: Provision Go for GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/native-supabase/sources/auth/go.mod
          cache-dependency-path: ${{ runner.temp }}/native-supabase/sources/auth/go.sum
          # The module and build caches would save on a dispatch.
          cache: ${{ github.event_name != 'workflow_dispatch' }}
      - name: Build GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build gotrue
      - name: Save GoTrue
        if: ${{ github.event_name != 'workflow_dispatch' && steps.gotrue-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Restore storage-api
        id: storage-cache
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Build storage-api
        if: steps.storage-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build storage
      - name: Save storage-api
        if: ${{ github.event_name != 'workflow_dispatch' && steps.storage-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5.1.0
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Start the native Supabase stack
        timeout-minutes: 8
        run: node scripts/ci/native-supabase.mjs start
      - name: Provision the local Storage buckets
        run: node scripts/local-storage-buckets.mjs provision
      - name: Prepare isolated UUID runtime and built renderer
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status, so an early crash is
          # reported by the name of the service that stopped.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform ios > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      # ios-build resolved the key and, on a miss, saved the scanned client before this job started.
      - name: Restore the development client of this fingerprint
        if: github.event_name != 'workflow_dispatch'
        uses: actions/cache/restore@v5.1.0
        with:
          path: ${{ needs.ios-build.outputs.app-path }}
          key: ${{ needs.ios-build.outputs.app-key }}
          fail-on-cache-miss: true
      # A dispatch saves no cache: ios-build built and scanned this commit's client and handed it
      # over as an artifact of this run.
      - name: Download the scanned development client of this dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@v4
        with:
          name: ios-dev-client
          path: ${{ runner.temp }}/ios-client
      - name: Unpack the scanned development client of this dispatch
        id: client_unpack
        if: github.event_name == 'workflow_dispatch'
        env:
          APP: ${{ needs.ios-build.outputs.app-path }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$APP")"
          tar -C "$(dirname "$APP")" -xf "$RUNNER_TEMP/ios-client/client.tar"
          test -d "$APP"
      # Story 6.15 C-16: the client is built with Xcode 26 and runs on the selected runtime (iOS 18.5
      # on macos-15), which holds only while its deployment target is at most that runtime.
      - name: Compare the client's minimum iOS with the selected simulator runtime
        id: client_fits
        env:
          APP: ${{ needs.ios-build.outputs.app-path }}
        run: |
          set -euo pipefail
          min=$(plutil -extract MinimumOSVersion raw "$APP/Info.plist")
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          node scripts/ci/native-ios-runtime-fits.mjs "$min" "$sdk"
      - name: Expo Go proof on a fresh simulator
        run: |
          node scripts/e2e-share-card/warm-metro.mjs --platform ios
          node scripts/ci/native-ios-startup-probe.mjs --for-native-flow
          device=$(cat /tmp/cc68-simulator)
          node scripts/ci/native-host-evidence.mjs sample before-first-flow --platform ios
          node scripts/run-story68-native.mjs expo-go-proof --platform ios --device "$device"
      - name: Record closed iOS host and Metro diagnostics
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ job.status }}" = failure ]; then
            node scripts/ci/native-host-evidence.mjs sample failure --platform ios
          fi
          node scripts/ci/native-host-evidence.mjs metro --platform ios
      # The iOS checks that need no development client run here, after the proof, so ios-build
      # stays a key lookup on most runs and the shards start minutes after the workflow does.
      - name: Provision pinned iOS accessibility browser
        id: ios_browser
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: npx --no-install playwright install chromium
      - name: Verify share-card harness and plugin suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - name: Check the iOS Maestro flows with the pinned CLI
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/ci/maestro-check-flows.mjs
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.ios_browser.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      - name: Verify native paragraph heading semantics
        if: ${{ !cancelled() }}
        run: bash scripts/ci/share-card-header-semantics.sh
      - name: Verify the iOS original PNG and cache-file guards
        id: png_file_guards
        if: ${{ !cancelled() }}
        # SwiftPM builds the validator from the checkout alone.
        run: |
          set -euo pipefail
          swift test --package-path apps/mobile/modules/share-card-photo-save/ios 2>&1 | tee "$RUNNER_TEMP/cc68-png-file-tests.log"
          # Some tests ran and none failed or was skipped: a skip changes the summary wording.
          summary=$(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/cc68-png-file-tests.log" | tail -1 || true)
          count=$(echo "$summary" | grep -Eo '^Executed [0-9]+' | grep -Eo '[0-9]+' || true)
          failures=$(echo "$summary" | grep -Eo 'with [0-9]+' | grep -Eo '[0-9]+' || true)
          if [ "${count:-0}" -eq 0 ] || [ "${failures:-1}" -ne 0 ]; then echo "::error::swift test ran zero tests or had failures"; exit 1; fi
          echo "swift test ran $count tests"
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ios
          CC68_CI_API: 0
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect Expo Go evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-ios-expo-go
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: ${{ !cancelled() && failure() }}
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always()
        run: node scripts/ci/native-supabase.mjs stop
      - name: Delete owned CI simulator
        if: always()
        run: node scripts/ci/native-ios-device-cleanup.mjs

  # The accessibility-focus module in a Release simulator app: the build alone takes 25 to 31
  # minutes, so it runs in parallel with the client build and the shards.
  ios-app-build:
    name: iOS app build
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        id: checkout
        with:
          ref: ${{ inputs.sha }}
      # The run name carries this commit, which nightly triage matches; every job proves it
      # checked out exactly that commit before anything else.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      - name: Select Xcode 26.4 or later
        id: xcode
        env:
          XCODE: '26.4+'
        run: *select_xcode

      - name: Setup Node
        id: node
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: ${{ github.event_name != 'workflow_dispatch' && 'npm' || '' }}

      - name: Install dependencies
        id: deps
        if: ${{ !cancelled() && steps.node.outcome == 'success' }}
        run: npm ci

      # The AccessibilityFocusTarget XCTest leaves out AccessibilityFocusModule.swift, which
      # needs ExpoModulesCore; the app build compiles it with its Expo dependency.
      - name: Generate the iOS project
        id: ios_project
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform ios

      - name: Build the release simulator app
        id: app_build
        if: ${{ !cancelled() && steps.ios_project.outcome == 'success' }}
        working-directory: apps/mobile/ios
        env:
          NODE_ENV: production
        run: |
          workspace=$(find . -maxdepth 1 -name '*.xcworkspace' | head -1)
          workspace=${workspace#./}
          scheme=${workspace%.xcworkspace}
          echo "scheme=$scheme" >> "$GITHUB_ENV"
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Release \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build

      - name: Check the app links and registers the module
        if: ${{ !cancelled() && steps.app_build.outcome == 'success' }}
        run: |
          bash scripts/ci/check-accessibility-focus-builds.sh ios-app \
            "apps/mobile/ios/build/Build/Products/Release-iphonesimulator/$scheme.app/$scheme" apps/mobile/ios

  # A skipped shard has no report, so this job fails.
  ios-evidence:
    if: always()
    needs: ios-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      # The run name carries this commit, which nightly triage matches; every job proves it
      # checked out exactly that commit before anything else.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ inputs.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-ios-shard-*
          path: /tmp/ios-shards
      - name: Require every iOS shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.ios-shard.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/ios-shards/share-card-ios-shard-*; do mv "$artifact" "/tmp/ios-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-ios-shards.mjs merge /tmp/ios-shards
