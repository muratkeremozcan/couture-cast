# Learning path Step 55: Expo SDK 58 upgrade for live font-scale layout.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-55-expo-sdk-58-upgrade-for-live-font-scale-layout
#
# Story 6.15 (Antigravity r6 P3, TEA ruling): the Android checks that ran only by hand, nightly on
# main and by manual dispatch, never on a pull request or a merge. Every job runs on Linux in
# parallel; scripts/ci/android-native-workflow.mjs holds the rules this file keeps.
#
#   android-release-builds    the app's release AAB with every shipped ABI and its
#                             minifiedDebuggable APK, from one Gradle run through the Worklets
#                             staging, then
#                             android-release-abis.mjs on the AAB (four ABIs, their native
#                             libraries and the bundled ReactNativeVersion, TEA-11) and
#                             minified-debuggable-evidence.mjs on the APK (a debuggable manifest
#                             and an R8 mapping, S4-15). About 60 minutes cold; limit 120.
#   android-network-timeout   the app's debug development client on an API 36 emulator, with
#                             Metro pointed at scripts/lib/network-tarpit.mjs, runs
#                             maestro/network-timeout/dev-client-timeout.yaml (S2-06): Home's
#                             15 s abort must end a request the API never answers. About 30
#                             minutes; limit 60.
#   android-google-sign-in    Story 6.17 M lane: the isolated Story 6.5 debug client on an API 36
#                             emulator runs maestro/google-sign-in/ through
#                             scripts/ci/android-google-sign-in.sh and scripts/run-google-native.mjs
#                             against local Supabase, the mock OIDC Google stand-in, an isolated
#                             database and its own API and Metro. Nightly and dispatch only: the
#                             debug client's Gradle build alone outruns the 20-minute PR job
#                             ceiling. About 45 minutes; limit 75.
#
# Both emulator jobs stop the build's Gradle and Kotlin daemons before the emulator boots
# (scripts/ci/stop-gradle-daemons.sh): they held about 5.5 GB of the runner's 16 GB through the
# Google sign-in flows (diag run 44008046979), and that job lost its runner in run 43964196075.
#
# The Android emulator lanes that run nightly today (pr-share-card-native.yml's android36 lanes,
# pr-accessibility-focus.yml's TalkBack job) also run on a merge or a pull request, and drive the
# Story 6.8 isolated client against its own runtime or a release app, so the flow gets its own
# schedule-only job here. No job uses a secret; each uploads its evidence for 7 days.
#
# Both builds go through the Worklets staging (scripts/lib/story68-worklets-staging.mjs, via
# scripts/ci/worklets-staged-gradle.mjs): the 2026-11-13 device run hit Reanimated's legacy
# libworklets.so race on the Debug x86_64 client and on :app:bundleRelease
# (buildCMakeRelWithDebInfo[arm64-v8a][reanimated]). The release run stages the four shipped ABIs
# and passes the same list to Gradle; its staging proofs upload with the release evidence. The
# minifiedDebuggable APK links each library's release variant, so the same staging covers it.
name: Android native

on:
  # 03:37 UTC, beside the 03:23 iOS nightly run; Linux runners have room for both.
  schedule:
    - cron: '37 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run per event and commit, so the nightly run and a dispatch each finish.
concurrency:
  group: android-native-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android-release-builds:
    name: Android release builds
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      - name: Record the build identity
        run: |
          mkdir -p "$RUNNER_TEMP/android-release-builds"
          git rev-parse HEAD > "$RUNNER_TEMP/android-release-builds/commit.txt"
      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      # Expo's generated gradle.properties gives the Gradle daemon 2 GiB of heap, which a release
      # build of four ABIs outgrows; the user-level file takes precedence over the project's.
      - name: Size the Gradle daemon for the release builds
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # NDK 27.1.12297006, CMake, build tools and the platform the Gradle build needs, with
      # retries, before Gradle runs: Gradle's own one-shot download of the NDK hit a 429 and
      # failed android36-controls in main run 43927343722 (scripts/ci/android-sdk-install.sh).
      - name: Install the Android SDK packages Gradle builds with
        # Normally about a minute; the script holds every attempt to a 420 s budget.
        timeout-minutes: 8
        run: bash scripts/ci/android-sdk-install.sh --gradle
      # Gradle's dependencies and transforms; main writes the cache, every other ref reads it.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android
      # Every shipped ABI, staged and built: the wrapper refuses a -PreactNativeArchitectures that
      # differs from the staged list, and the ABI check below expects all four in the AAB.
      - name: Build the release AAB and the minifiedDebuggable APK
        id: android_build
        timeout-minutes: 100
        env:
          NODE_ENV: production
        run: node scripts/ci/worklets-staged-gradle.mjs --project apps/mobile/android --configuration Release --abis armeabi-v7a,arm64-v8a,x86,x86_64 --evidence "$RUNNER_TEMP/android-release-builds/worklets" -- :app:bundleRelease :app:assembleMinifiedDebuggable -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 --console=plain
      - name: Check the minifiedDebuggable build is debuggable and went through R8
        id: minified_debuggable
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/lib/minified-debuggable-evidence.mjs --android apps/mobile/android | tee "$RUNNER_TEMP/android-release-builds/minified-debuggable.json"
      - name: Check the release AAB carries every ABI and the installed React Native
        id: release_abis
        if: ${{ !cancelled() && steps.android_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          node scripts/ci/android-release-abis.mjs apps/mobile/android/app/build/outputs/bundle/release/app-release.aab | tee "$RUNNER_TEMP/android-release-builds/release-abis.txt"
      - name: Collect the release build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-builds
          path: ${{ runner.temp }}/android-release-builds/
          retention-days: 7
          if-no-files-found: error

  android-network-timeout:
    name: Android network timeout
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      - name: Record the build identity
        run: |
          mkdir -p "$RUNNER_TEMP/android-network-timeout"
          git rev-parse HEAD > "$RUNNER_TEMP/android-network-timeout/commit.txt"
      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # NDK 27.1.12297006, CMake, build tools and the platform the Gradle build needs, with
      # retries, before Gradle runs: Gradle's own one-shot download of the NDK hit a 429 and
      # failed android36-controls in main run 43927343722 (scripts/ci/android-sdk-install.sh).
      - name: Install the Android SDK packages Gradle builds with
        # Normally about a minute; the script holds every attempt to a 420 s budget.
        timeout-minutes: 8
        run: bash scripts/ci/android-sdk-install.sh --gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-install
      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android
      # Through the Worklets staging (scripts/ci/worklets-staged-gradle.mjs): a plain Debug build
      # raced Reanimated's legacy libworklets.so import on the 2026-11-13 device run. Its staging
      # proof lands in the evidence directory.
      - name: Build the debug development client
        id: client_build
        timeout-minutes: 35
        run: node scripts/ci/worklets-staged-gradle.mjs --project apps/mobile/android --configuration Debug --abis x86_64 --evidence "$RUNNER_TEMP/android-network-timeout/worklets" -- :app:assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
      # The build's Gradle daemon, Kotlin compile daemons and javac workers would idle through the
      # emulator step: about 5.5 GB of the runner's 16 GB (diag run 44008046979), beside a job that
      # lost its runner in run 43964196075 (scripts/ci/stop-gradle-daemons.sh).
      - name: Stop the build's Gradle and Kotlin daemons
        run: bash scripts/ci/stop-gradle-daemons.sh apps/mobile/android
      - name: Install the pinned Maestro CLI
        run: node scripts/maestro-install.mjs
      - name: Enable and verify Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the uevent; wait until the rule has applied before testing.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Network timeout flow against the tarpit
        id: network_timeout
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        env:
          NETWORK_TIMEOUT_EVIDENCE: ${{ runner.temp }}/android-network-timeout
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/ci/android-network-timeout.sh
      - name: Collect the network timeout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-network-timeout
          path: ${{ runner.temp }}/android-network-timeout/
          retention-days: 7
          if-no-files-found: error

  android-google-sign-in:
    name: Android Google sign-in
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      MAESTRO_CLI_NO_ANALYTICS: '1'
      # The job owns this Redis service, so no other stack shares the run's queues.
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and LOCAL_DATABASE_URL from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk
      # Mailpit stays: the cancel flow requests an email code after the cancelled chooser.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images
        with:
          exclude: 'realtime,studio,postgres-meta,logflare,vector,edge-runtime,supavisor,imgproxy'
      - name: Record the build identity
        run: |
          mkdir -p "$RUNNER_TEMP/android-google-sign-in"
          git rev-parse HEAD > "$RUNNER_TEMP/android-google-sign-in/commit.txt"
      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      # NDK 27.1.12297006, CMake, build tools and the platform the Gradle build needs, with
      # retries, before Gradle runs: Gradle's own one-shot download of the NDK hit a 429 and
      # failed android36-controls in main run 43927343722 (scripts/ci/android-sdk-install.sh).
      - name: Install the Android SDK packages Gradle builds with
        # Normally about a minute; the script holds every attempt to a 420 s budget.
        timeout-minutes: 8
        run: bash scripts/ci/android-sdk-install.sh --gradle
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Start local Supabase services with Mailpit
        id: supabase
        uses: ./.github/actions/start-local-supabase
        timeout-minutes: 10
        with:
          exclude: 'realtime,studio,postgres-meta,logflare,vector,edge-runtime,supavisor,imgproxy'
      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the Supabase containers a failed start left
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup
      # The isolated Story 6.5 client (com.couturecast.story65, scheme couturecast-story65): the
      # only build whose development bundle may use the OAuth stand-in (D10). app.config.ts
      # requires local API and Auth origins for it; Metro serves the real ones at run time.
      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
          STORY65_NATIVE_TEST_BUILD: '1'
          EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:4079
          EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
        run: npx expo prebuild --platform android --no-install
      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android
      - name: Build the isolated debug development client
        id: google_client_build
        timeout-minutes: 35
        run: node scripts/ci/worklets-staged-gradle.mjs --project apps/mobile/android --configuration Debug --abis x86_64 --evidence "$RUNNER_TEMP/android-google-sign-in/worklets" -- :app:assembleDebug -PreactNativeArchitectures=x86_64 --console=plain
      # The build's Gradle daemon, Kotlin compile daemons and javac workers would idle through the
      # emulator step: about 5.5 GB of the runner's 16 GB (diag run 44008046979), beside a job that
      # lost its runner in run 43964196075 (scripts/ci/stop-gradle-daemons.sh).
      - name: Stop the build's Gradle and Kotlin daemons
        run: bash scripts/ci/stop-gradle-daemons.sh apps/mobile/android
      - name: Install the pinned Maestro CLI
        run: node scripts/maestro-install.mjs
      - name: Enable and verify Android hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Google sign-in flows against the stand-in
        id: google_sign_in
        timeout-minutes: 35
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GOOGLE_NATIVE_EVIDENCE: ${{ runner.temp }}/android-google-sign-in
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          script: bash scripts/ci/android-google-sign-in.sh
      - name: Collect the Google sign-in evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-google-sign-in
          path: ${{ runner.temp }}/android-google-sign-in/
          retention-days: 7
          if-no-files-found: error
