# Keeps the Actions cache under its 10 GB limit by deleting what no job will read again: the
# caches of pull requests that are no longer open and keys nobody has read for 48 hours
# (superseded by a newer lockfile, browser or image version). GitHub's own eviction past the
# limit removes the least recently used entry, which pushed the Supabase image and AVD caches
# toward cold paths (10.28 GB on 2026-11-12). scripts/ci/prune-actions-cache.mjs decides.
name: Prune Actions cache

on:
  schedule:
    - cron: '17 9 * * *'
  pull_request:
    types: [closed]
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  pull-requests: read

concurrency:
  group: actions-cache-prune
  cancel-in-progress: false

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A fork's pull request gets a read-only token, and its cache entries are pruned daily.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      # The default branch's script decides, whatever the closed pull request changed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Delete caches no job will read again
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci/prune-actions-cache.mjs
