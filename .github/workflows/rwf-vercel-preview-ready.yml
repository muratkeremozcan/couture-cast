name: "Resolve and wait for Vercel previews"

# Provides the web and API preview deployments for one commit and waits until both serve it.
# Branch pushes create no Vercel deployment (git.deploymentEnabled in each vercel.json); when
# the preview checks need this branch, the preview-deploy job reuses a ready deployment built
# from the same inputs and configuration or creates one from the exact commit, and everything
# after it uses that deployment's own URL.

on:
  workflow_call:
    inputs:
      git_ref:
        description: "Branch the previews were built from"
        type: string
        required: true
      expected_sha:
        description: "Commit SHA under test"
        type: string
        required: true
      deploy_web:
        description: "Provide the web preview (false when the caller tests a URL of its own)"
        type: boolean
        default: true
      deploy_api:
        description: "Provide the API preview (false when the caller tests a URL of its own)"
        type: boolean
        default: true
      force_build:
        description: "Build fresh deployments even when a ready one has the same inputs and configuration"
        type: boolean
        default: false
    secrets:
      VERCEL_TOKEN:
        required: true
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: true
    outputs:
      required:
        description: "Whether this branch needs web/API preview deployments"
        value: ${{ jobs.preview-scope.outputs.required }}
      web_url:
        description: "Web preview deployment URL"
        value: ${{ jobs.deploy-web.outputs.url }}
      web_sha:
        description: "Commit the web preview was built from: expected_sha, or an earlier commit with the same web inputs and configuration"
        value: ${{ jobs.deploy-web.outputs.sha }}
      api_url:
        description: "API preview deployment URL"
        value: ${{ jobs.deploy-api.outputs.url }}

jobs:
  preview-scope:
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.scope.outputs.required }}
    steps:
      - name: Checkout preview inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Check shared Vercel preview inputs
        id: scope
        run: node scripts/vercel-preview-inputs.mjs

  # One job per project, each with its own 20 minute budget: Hobby builds one deployment at a
  # time, so the second waits behind the first. Every Vercel request times out after 30 s.
  # VERCEL_TOKEN reaches this job, which runs the PR's own script; GitHub withholds it from
  # fork PRs, and the e2e job already receives it (deployment guide, preview deployments).
  deploy-web:
    needs: preview-scope
    if: needs.preview-scope.outputs.required == 'true' && inputs.deploy_web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.web_url }}
      sha: ${{ steps.deploy.outputs.web_sha }}
    steps:
      - name: Checkout preview inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Web preview deployment
        id: deploy
        env: &deploy-env
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          GIT_REF: ${{ inputs.git_ref }}
          FORCE_BUILD: ${{ inputs.force_build }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_WEB_PROJECT_SLUG: ${{ vars.VERCEL_WEB_PROJECT_SLUG || 'couture-cast-web' }}
          VERCEL_API_PROJECT_SLUG: ${{ vars.VERCEL_API_PROJECT_SLUG || 'couture-cast-api' }}
          VERCEL_TEAM_SLUG: ${{ vars.VERCEL_TEAM_SLUG || 'muratkeremozcans-projects' }}
        run: node scripts/vercel-preview-deploy.mjs web

  deploy-api:
    needs: preview-scope
    if: needs.preview-scope.outputs.required == 'true' && inputs.deploy_api
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      url: ${{ steps.deploy.outputs.api_url }}
      sha: ${{ steps.deploy.outputs.api_sha }}
    steps:
      - name: Checkout preview inputs
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: API preview deployment
        id: deploy
        env: *deploy-env
        run: node scripts/vercel-preview-deploy.mjs api

  wait-web:
    needs: deploy-web
    uses: ./.github/workflows/vercel-wait-for-deployment.yml
    with:
      health_url: ${{ needs.deploy-web.outputs.url }}/api/health
      expected_sha: ${{ needs.deploy-web.outputs.sha }}
      # The deployment is already READY; this confirms it serves its commit through the bypass.
      retries: 10
      sleep_seconds: 15
    secrets:
      vercel_bypass_secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

  wait-api:
    needs: deploy-api
    uses: ./.github/workflows/vercel-wait-for-deployment.yml
    with:
      health_url: ${{ needs.deploy-api.outputs.url }}/api/health
      expected_sha: ${{ needs.deploy-api.outputs.sha }}
      retries: 10
      sleep_seconds: 15
    secrets:
      vercel_bypass_secret: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
