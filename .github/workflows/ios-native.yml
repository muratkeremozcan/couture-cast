# Story 6.15 D6: the iOS jobs (ios-native-jobs.yml), nightly on main and by manual dispatch. No
# macOS job runs on a pull request or gates a merge (owner rule, 2026-11-13): macOS queues are
# unpredictable, so iOS native coverage comes from this run and the iOS 26.5 canary
# (ios-native-canary.yml), and a red nightly run goes to TEA for triage. The nightly run is main's
# own code, so it keeps the development client and native Supabase caches warm; a dispatch builds
# its client in ios-build and hands it to the shards as an artifact, and saves no cache.
name: iOS native
run-name: iOS native ${{ github.sha }}

on:
  schedule:
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One run per event and commit, so the nightly run and a dispatch each finish.
concurrency:
  group: ios-native-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  ios-native:
    uses: ./.github/workflows/ios-native-jobs.yml
    with:
      sha: ${{ github.sha }}
