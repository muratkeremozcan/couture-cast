# Story 6.15 D6 and C-14: the iOS jobs (ios-native-jobs.yml) on main. A merge runs them when it
# changed a native iOS input or JavaScript the Release bundle holds, and the nightly run covers
# the rest unless its commit already passed. Both are trusted runs of main's own code, so they
# keep the development client and native Supabase caches warm. A pull request's commit runs them
# through ios-native-dispatch.yml, with a read-only cache.
name: iOS native
run-name: iOS native ${{ github.sha }}

on:
  # A merge runs it only when one of these changed, and ios-changes then skips it when only
  # dependencies that apps/mobile does not install changed; the nightly run covers the rest. The
  # first block is the JavaScript of apps/mobile and packages/* (PUSH_ONLY_PATHS in
  # scripts/ci/ios-native-inputs.mjs), which needs no dispatch on a pull request; the rest are the
  # native iOS inputs a pull request needs one for, the evidence classifier and judge among them.
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/**'
      - '!packages/db/**'
      - '!apps/mobile/**/*.test.*'
      - '!apps/mobile/**/*.spec.*'
      - '!apps/mobile/**/*.md'
      - '!packages/**/*.test.*'
      - '!packages/**/*.spec.*'
      - '!packages/**/*.md'
      - '.github/workflows/ios-native.yml'
      - '.github/workflows/ios-native-jobs.yml'
      - '.github/actions/install/**'
      - '.github/actions/node-dependencies/**'
      - '.nvmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/plugins/**'
      - '!apps/mobile/plugins/**/*.test.js'
      - 'apps/mobile/modules/*/expo-module.config.json'
      - 'apps/mobile/modules/*/ios/**'
      - 'apps/mobile/targets/**'
      - 'apps/mobile/locales/**'
      - 'apps/mobile/assets/images/notification-icon.png'
      - 'apps/mobile/native-tests/**'
      - 'maestro/story65/**'
      - 'maestro/story67/**'
      - 'maestro/story68/**'
      - 'scripts/ci/native-*'
      - 'scripts/ci/android-talkback.sh'
      - 'scripts/ci/check-accessibility-focus-builds.sh'
      - 'scripts/ci/install-dependencies.sh'
      - 'scripts/ci/ios-native-evidence.mjs'
      - 'scripts/ci/ios-native-inputs.mjs'
      - 'scripts/ci/maestro-check-flows.mjs'
      - 'scripts/ci/node-test-gate.mjs'
      - 'scripts/ci/node-test-suites.json'
      - 'scripts/ci/share-card-header-semantics.sh'
      - 'scripts/ci/verify-dependency-tree.mjs'
      - 'scripts/ci/workflow-step-shadowing.mjs'
      - 'scripts/e2e-real-session/**'
      - 'scripts/e2e-share-card/**'
      - 'scripts/lib/caller-owned-env.mjs'
      - 'scripts/lib/database-tls.mjs'
      - 'scripts/lib/expo-*.mjs'
      - 'scripts/lib/local-supabase-ports.cjs'
      - 'scripts/lib/local-supabase-ports.mjs'
      - 'scripts/lib/maestro-*.mjs'
      - 'scripts/lib/mobile-e2e-*.mjs'
      - 'scripts/lib/native-*.mjs'
      - 'scripts/lib/package-manager-readiness.mjs'
      - 'scripts/lib/prisma-migrate-connection.mjs'
      - 'scripts/lib/share-card-*.mjs'
      - 'scripts/lib/story68-*.mjs'
      - '!scripts/lib/story68-gradle-precondition.mjs'
      - '!scripts/lib/story68-release-live-font-fixtures.mjs'
      - 'scripts/lib/story69-share-sheet.mjs'
      - 'scripts/lib/test-disk-space.mjs'
      - 'scripts/lib/weather-provider-double-data.mjs'
      - 'scripts/e2e-stack-pid.mjs'
      - 'scripts/install-expo-go.mjs'
      - 'scripts/local-e2e-database.mjs'
      - 'scripts/local-storage-buckets.mjs'
      - 'scripts/maestro-flow-durations.json'
      - 'scripts/maestro-install.mjs'
      - 'scripts/maestro-version.mjs'
      - 'scripts/prisma-migrate-deploy.mjs'
      - 'scripts/run-maestro.mjs'
      - 'scripts/run-story68-native.mjs'
      - 'scripts/start-api-e2e-with-workers.mjs'
      - 'scripts/start-ios-simulator.sh'
      - 'scripts/weather-provider-double.mjs'
      - '!scripts/**/*.test.mjs'
  schedule:
    - cron: '23 3 * * *'

permissions:
  contents: read

jobs:
  # A merge matches the push paths by name, and package-lock.json and package.json are shared by
  # every workspace, so this job reads what the merge changed in them and lets the iOS jobs run only
  # when it touched what apps/mobile installs (scripts/ci/ios-native-inputs.mjs). The nightly run
  # tests its commit unless an iOS run on main already passed on it: a merge or nightly run, or a
  # dispatch naming it.
  ios-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # actions: read lets the nightly run find a passing iOS run on its commit.
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.changes.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      # Every job proves it checked out exactly the commit the run name carries.
      - name: Stop unless HEAD is the commit under test
        env:
          SHA: ${{ github.sha }}
        run: |
          echo "$SHA" | grep -Eqx '[0-9a-f]{40}' || { echo "::error::sha must be a full 40-character commit SHA, got '$SHA'"; exit 1; }
          test "$(git rev-parse HEAD)" = "$SHA" || { echo "::error::checked out $(git rev-parse HEAD), expected $SHA"; exit 1; }
      - name: Decide whether this merge changed a native iOS input
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/ios-native-inputs.mjs push-changes

  # Only a run whose ios-changes decided run=true joins a group, so ios-changes itself runs
  # ungrouped. A merge waits for the merge run in progress, which finishes, and GitHub keeps only
  # the newest pending one, so merges less than a run apart still test main's newest commit; the
  # nightly run has its own group.
  ios-native:
    needs: ios-changes
    if: ${{ needs.ios-changes.outputs.run == 'true' }}
    concurrency:
      group: ${{ github.event_name == 'schedule' && 'ios-native-nightly' || 'ios-native-main-push' }}
      cancel-in-progress: false
    uses: ./.github/workflows/ios-native-jobs.yml
    with:
      sha: ${{ github.sha }}
