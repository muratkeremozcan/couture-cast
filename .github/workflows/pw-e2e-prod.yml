name: "Prod E2E (Playwright)"

# Runs E2E tests against production after each deployment, and once a day as the
# production status check (the README badge reads this workflow on main).
# Waits for health endpoint to return correct SHA before testing.

on:
  push:
    branches:
      - main
  schedule:
    # Production status between pushes: proves production still serves main and still works
    # when nothing merged (expired secrets, provider outages, quota limits, data drift).
    # 11:41 UTC is 05:41 in Chicago (06:41 in summer): a fresh status before the workday.
    - cron: '41 11 * * *'
  workflow_dispatch:

permissions:
  # The shard balancer reads the run's artifacts and jobs.
  actions: read
  contents: read

# One run per ref. Web and API serve only the newest main commit, so a run left
# going after the next push tests a deployment that moves under it (web-health-sha
# then reads the newer SHA). The newer push supersedes the older run.
# The daily scheduled run has its own group: in the push group it would cancel a running
# push verification or replace a pending one. A push that deploys while the scheduled run
# is testing can fail that scheduled run's SHA check; the push run then gives the verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'schedule' && '-status' || '' }}
  cancel-in-progress: true

jobs:
  # The ignored build step (ignoreCommand in apps/web/vercel.json and apps/api/vercel.json)
  # skips a production build whose inputs equal the deployed ones, so a project can keep
  # serving an earlier commit that builds the same source. Each wait accepts the commits on
  # main's first-parent history with this commit's inputs (scripts/vercel-build-inputs.mjs).
  served-commits:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      web: ${{ steps.commits.outputs.web }}
      api: ${{ steps.commits.outputs.api }}
    steps:
      - name: Checkout main's recent history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          # The whole history: the commit still serving can be any number of merges back.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - name: Commits each project may serve
        id: commits
        run: |
          node scripts/vercel-build-inputs.mjs equivalent web "$GITHUB_SHA"
          node scripts/vercel-build-inputs.mjs equivalent api "$GITHUB_SHA"

  wait-web:
    needs: served-commits
    uses: ./.github/workflows/rwf-wait-for-deployment.yml
    with:
      health_url: https://couture-cast-web.vercel.app/api/health
      expected_sha: ${{ needs.served-commits.outputs.web }}
      retries: 20
      sleep_seconds: 30

  wait-api:
    # Web and API deploy independently, so the API is held to its own commits.
    # Its health endpoint is public; /api/v1/events/poll needs a bearer token.
    needs: served-commits
    uses: ./.github/workflows/rwf-wait-for-deployment.yml
    with:
      health_url: https://couture-cast-api.vercel.app/api/health
      expected_sha: ${{ needs.served-commits.outputs.api }}
      retries: 20
      sleep_seconds: 30

  run-prod-tests:
    needs: [wait-web, wait-api]
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: "prod"
      test_command: "npm run test:pw-prod"
      gh_ref: ${{ github.sha }}
      deployment_ref: main
      custom_base_url: ''
      # The web health test checks the commit the web deployment serves.
      expected_web_sha: ${{ needs.wait-web.outputs.observed_sha }}
    secrets: inherit
