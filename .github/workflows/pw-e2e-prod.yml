name: "Prod E2E (Playwright)"

# Runs E2E tests against production after deployment
# Waits for health endpoint to return correct SHA before testing

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# One run per ref. Web and API serve only the newest main commit, so a run left
# going after the next push tests a deployment that moves under it (web-health-sha
# then reads the newer SHA). The newer push supersedes the older run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wait-web:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/rwf-wait-for-deployment.yml
    with:
      health_url: https://couture-cast-web.vercel.app/api/health
      expected_sha: ${{ github.sha }}
      retries: 20
      sleep_seconds: 30

  wait-api:
    # Web and API deploy independently, so the API is held to the same SHA.
    # Its health endpoint is public; /api/v1/events/poll needs a bearer token.
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    uses: ./.github/workflows/rwf-wait-for-deployment.yml
    with:
      health_url: https://couture-cast-api.vercel.app/api/health
      expected_sha: ${{ github.sha }}
      retries: 20
      sleep_seconds: 30

  run-prod-tests:
    needs: [wait-web, wait-api]
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: "prod"
      test_command: "npm run test:pw-prod"
      gh_ref: ${{ github.sha }}
      deployment_ref: main
      custom_base_url: ''
    secrets: inherit
