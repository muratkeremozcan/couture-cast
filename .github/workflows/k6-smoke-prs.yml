name: k6 smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/**'
      - 'k6/**'
      - 'packages/k6-utils/**'
      - 'packages/api-client/src/contracts/http/**'
      - 'packages/db/prisma/**'
      - 'package*.json'
      - '.github/workflows/k6-smoke-prs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    # timeout-minutes = measured work + the Supabase start budget + cache.
    # Measured on recent green runs (2026-10-22), work excluding the Supabase
    # step peaked at 4.5 min across 6 runs; start-local-supabase may spend up to its
    # time-budget-seconds (600 s = 10 min) on start attempts, restoring its
    # image cache adds about 3 min, and a job that missed the cache saves it
    # for the others (about 2 min more).
    # 4.5 + 10 + 3 + 2 = 19.5 min, so 25 keeps some margin.
    timeout-minutes: 25
    env:
      TEST_ENV: local
      ALLOW_DEV_GUARDIAN_SECRET: 'true'
      GUARDIAN_INVITE_WEB_BASE_URL: http://127.0.0.1:3005
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and the URLs derived from them from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
        with:
          # Every step here runs against the local Supabase database.
          database-url: 'true'

      - name: Setup Node environment
        uses: ./.github/actions/install

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start local Supabase services
        id: supabase
        uses: ./.github/actions/start-local-supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Reset local database
        run: npm run db:reset

      - name: Run k6 PR smoke
        id: k6
        continue-on-error: true
        env:
          CI: 'true'
          GIT_SHA: ${{ github.sha }}
          K6_RUN_MODE: smoke
          SUMMARY_OUTPUT: k6/summary.json
        run: npm run test:k6:local

      - name: k6 report and comment
        if: always()
        continue-on-error: true
        uses: ./.github/actions/k6-report-comment
        with:
          summary-glob: k6/summary-*.json
          report-name: k6-smoke-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.k6.outcome }}
          run-mode: smoke

      - name: Fail if k6 smoke failed
        if: steps.k6.outcome == 'failure'
        run: exit 1
