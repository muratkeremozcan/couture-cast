name: k6 smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/api/**'
      - 'k6/**'
      - 'packages/k6-utils/**'
      - 'packages/api-client/src/contracts/http/**'
      - 'packages/db/prisma/**'
      - 'package*.json'
      - '.github/workflows/k6-smoke-prs.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  k6-smoke:
    runs-on: ubuntu-latest
    # 4.8 minutes at p50, 5.2 at p95 (last 20 runs, 2026-11-12). The Supabase
    # start stops at its own 10 minute step limit.
    timeout-minutes: 15
    env:
      TEST_ENV: local
      ALLOW_DEV_GUARDIAN_SECRET: 'true'
      GUARDIAN_INVITE_WEB_BASE_URL: http://127.0.0.1:3005
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and the URLs derived from them from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
        with:
          # Every step here runs against the local Supabase database.
          database-url: 'true'
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images

      - name: Setup Node environment
        uses: ./.github/actions/install

      - name: Install k6
        uses: grafana/setup-k6-action@v1

      - name: Start local Supabase services
        id: supabase
        uses: ./.github/actions/start-local-supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup

      - name: Reset local database
        run: npm run db:reset

      - name: Run k6 PR smoke
        id: k6
        continue-on-error: true
        env:
          CI: 'true'
          GIT_SHA: ${{ github.sha }}
          K6_RUN_MODE: smoke
          SUMMARY_OUTPUT: k6/summary.json
        run: npm run test:k6:local

      - name: k6 report and comment
        if: always()
        continue-on-error: true
        uses: ./.github/actions/k6-report-comment
        with:
          summary-glob: k6/summary-*.json
          report-name: k6-smoke-${{ github.event.pull_request.number || github.sha }}
          test-outcome: ${{ steps.k6.outcome }}
          run-mode: smoke

      - name: Fail if k6 smoke failed
        if: steps.k6.outcome == 'failure'
        run: exit 1
