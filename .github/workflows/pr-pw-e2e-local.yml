# Step 7 step 2 owner: searchable owner anchor
name: Playwright e2e

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: playwright-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # On a pull request or a push the playwright-unit job of pr-checks.yml runs the Playwright
  # helper unit tests, so `prepare:playwright` in the jobs here skips its own copy of them; a
  # manual run, which pr-checks.yml does not accompany, still runs them.
  PLAYWRIGHT_UNIT_LANE: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && '1' || '' }}

jobs:
  # The lanes this push wakes (scripts/ci/lanes.mjs). Each job a lane gates needs this one and
  # is skipped when its lane is false; this job's summary says why. It installs nothing, so it
  # holds the jobs it gates for seconds.
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.lanes.outputs.plan }}
      coverage_shards: ${{ steps.lanes.outputs.coverage_shards }}
    steps:
      - name: Checkout the lane map and workspace manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/ci/lanes.mjs
            apps/*/package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Plan the lanes
        id: lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANES_WORKFLOW: pr-pw-e2e-local.yml
        run: node scripts/ci/lanes.mjs

  # Burn-in plans first and waits on nothing: the SKIP_BURN_IN label comes straight from the
  # event payload, and its plan job lists only the changed specs it needs.
  burn-in:
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'SKIP_BURN_IN') }}
    uses: ./.github/workflows/rwf-burn-in.yml
    with:
      base-ref: ${{ github.event.pull_request.base.sha || github.base_ref || 'main' }}
      test-directory: 'playwright/'
      install-command: npm ci
    secrets: inherit

  pw-e2e:
    # Burn-in runs beside the lanes: it still fails the gate, and waiting for it put the
    # lanes 14 to 16 minutes after the push (scripts/ci/pr-pipeline-shape.test.mjs).
    needs: [lanes]
    if: fromJSON(needs.lanes.outputs.plan)['web-e2e']
    # 11.3 minutes at p50, 12.4 at p95 (40 shard runs, 2026-11-11 to 12). The
    # Supabase start stops at its own 10 minute step limit.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # LOCAL_DATABASE_URL and the Supabase ports come from configure-ci-supabase-ports
    # (.github/supabase-ci-ports.env), the first step after checkout, so CI never
    # depends on a default it did not choose.
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2]
        shardTotal: [2]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and the URLs derived from them from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images

      - name: Record git SHA
        id: git_sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Export expected SHA
        # Align health check SHA with the build we just produced; using HEAD here
        # avoids comparing against a merge/ref SHA that differs from the built app.
        run: |
          echo "EXPECTED_SHA=${{ steps.git_sha.outputs.sha }}" >> "$GITHUB_ENV"
          echo "GITHUB_SHA=${{ steps.git_sha.outputs.sha }}" >> "$GITHUB_ENV"

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Cache Playwright browsers
        uses: ./.github/actions/setup-playwright-browsers

      - name: Start local Supabase services
        id: supabase
        uses: ./.github/actions/start-local-supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup

      - name: Reset local Playwright database
        run: npm run db:reset
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}

      # Story 6.13: local Supabase is the one PR job whose application role is the real non-superuser,
      # so this is where the catalog proof of the append-only enforcement means something.
      - name: Verify moderation history enforcement
        run: npx tsx scripts/verify-moderation-history.mjs
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}

      - name: Build web app
        run: npm run build --workspace web

      - name: Install Playwright Chromium only
        run: npx playwright install chromium

      # Balances the shards by past test durations: it exports PSP_ARGS for the
      # Playwright command below, and its post step publishes this shard's
      # test times (from main only) and a run record for the finish step.
      - name: Balance Playwright shards by duration
        uses: muratkeremozcan/playwright-smart-parallelization@v1

      - name: Run Playwright local suite
        # PSP_ARGS stays unquoted, as the Action requires: it is empty when
        # balancing is off and can carry more than one argument.
        run: |
          # shellcheck disable=SC2086
          npm run test:pw-local -- --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} --reporter=blob $PSP_ARGS
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
          GUARDIAN_INVITE_JWT_SECRET: ${{ secrets.GUARDIAN_INVITE_JWT_SECRET }}

      - name: Copy trace files to blob-report
        if: always()
        run: |
          mkdir -p blob-report/trace
          cp -r playwright/test-results/**/*.zip blob-report/trace || true

      # Blocks the upload when a report or trace carries a secret this job
      # holds. Fails closed: if the scan cannot run, nothing is uploaded.
      - name: Check Playwright artifacts for secret values
        id: secret_scan
        if: always()
        env:
          GUARDIAN_INVITE_JWT_SECRET: ${{ secrets.GUARDIAN_INVITE_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-artifact-secrets.mjs --names GUARDIAN_INVITE_JWT_SECRET,GH_TOKEN blob-report

      - name: Upload Playwright artifacts (shard)
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: |
            blob-report
          retention-days: 5

  # Story 6.5 real-session acceptance: the product sign-in UI with a real local
  # Supabase Auth OTP, verifyOtp, refresh, account switch and identity mapping.
  # The pw-e2e lane skips these specs (it has no owned harness), so they run
  # here against a stack scripts/e2e-real-session/run.mjs owns: an isolated
  # tea_community_<32 hex> database, the OTP Auth proxy, the API on 4077 and a
  # NEXT_PUBLIC_E2E_AUTH=false web build on 3077. See playwright/README.md.
  real-session-e2e:
    name: Real-session community E2E
    needs: [lanes]
    if: fromJSON(needs.lanes.outputs.plan)['web-e2e']
    # 7.0 minutes at p50, 7.8 at p95 (last 20 runs, 2026-11-12).
    timeout-minutes: 15
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # LOCAL_DATABASE_URL, from configure-ci-supabase-ports, is the source server
      # for the isolated database. The run's migrations and app rows never touch
      # that database; only Supabase Storage keeps its buckets and seed objects
      # there (start-local-supabase provisions the buckets).
      # The job owns this Redis service, so no other stack shares its queues.
      REDIS_URL: redis://127.0.0.1:6379
      STORY65_REAL_SESSION_DIR: ${{ github.workspace }}/.real-session-e2e
      # Explicit, so a Mailpit that failed to start fails the run instead of
      # quietly downgrading it to generated codes.
      STORY65_REAL_SESSION_OTP_MODE: real-email
      # A spec skip reason throws instead of skipping: six skipped specs exit 0.
      # run.mjs sets it for Playwright too, and checks the JUnit counts.
      STORY65_REAL_SESSION_REQUIRED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      # First step after checkout: every later step reads the CI Supabase ports
      # (.github/supabase-ci-ports.env) and the URLs derived from them from here.
      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images
        with:
          exclude: 'realtime,studio,postgres-meta,logflare,vector,edge-runtime,supavisor,imgproxy'

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Cache Playwright browsers
        uses: ./.github/actions/setup-playwright-browsers

      - name: Start local Supabase services with Mailpit
        id: supabase
        uses: ./.github/actions/start-local-supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10
        with:
          # The action's default list without mailpit: the real-email path reads
          # the first sign-in code from Mailpit (SUPABASE_LOCAL_MAILPIT_URL).
          exclude: 'realtime,studio,postgres-meta,logflare,vector,edge-runtime,supavisor,imgproxy'
      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup

      - name: Install Playwright Chromium only
        run: npx playwright install chromium

      - name: Run real-session specs
        run: npm run test:pw-real-session

      # A fake cannot prove storage refuses an expired token, and this is the job with real Storage.
      # Its own isolated database, so a real-session failure neither hides this nor shares state with it.
      - name: Prove Storage refuses a late community upload
        if: ${{ !cancelled() }}
        env:
          INTEGRATION_TEST_DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}
        run: npm run test:community-storage -w apps/api

      # run.mjs deletes its users itself; this covers a run that was killed first.
      - name: Delete the Auth users the run created
        if: always()
        run: node scripts/e2e-real-session/cleanup-users.mjs

      # Fails closed: nothing is uploaded unless run.mjs finished publishing the
      # redacted set (its completion record matches the upload directory byte for
      # byte) and the scan then finds no key, no issued OTP code and no JWT in it.
      # A run killed mid-teardown leaves no record, so its raw output never ships.
      - name: Check real-session artifacts for secret values
        id: secret_scan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/e2e-real-session/artifacts.mjs verify
          node scripts/check-artifact-secrets.mjs \
            --names SUPABASE_SERVICE_ROLE_KEY,SUPABASE_ANON_KEY,GH_TOKEN \
            --otp-file "$STORY65_REAL_SESSION_DIR/issued-otps.json" \
            --reject-jwt \
            "$STORY65_REAL_SESSION_DIR/artifacts"

      - name: Upload redacted real-session artifacts
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: real-session-e2e
          path: ${{ env.STORY65_REAL_SESSION_DIR }}/artifacts
          include-hidden-files: true
          retention-days: 5

  # Story 6.14 TEA-15: the complimentary access spec turns every member flag off
  # globally, so it runs here against a database scripts/e2e-complimentary/run.mjs
  # owns (tea_cc614_e2e_<32 hex>), with the API on 4079 and the web on 3079, and
  # never inside the sharded suite above, which seeds those flags true.
  complimentary-access-e2e:
    name: Complimentary access E2E
    needs: [lanes]
    if: fromJSON(needs.lanes.outputs.plan)['web-e2e']
    # Measured locally: about 66 s for the runner with built packages. Estimated in
    # CI: about 3 min install and browsers, the Supabase start budget (600 s), about
    # 3 min for the API and web builds, under 2 min for the five tests.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # The source server for the owned database is LOCAL_DATABASE_URL, from
      # configure-ci-supabase-ports. The run creates and drops its own database
      # there; Storage keeps its buckets in that one, for the posted look.
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Configure the CI Supabase host ports
        uses: ./.github/actions/configure-ci-supabase-ports
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Cache Playwright browsers
        uses: ./.github/actions/setup-playwright-browsers

      - name: Start local Supabase services
        id: supabase
        uses: ./.github/actions/start-local-supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Upload the Supabase start log
        # The start's own log names the command that failed or hung.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        uses: actions/upload-artifact@v4
        with:
          name: supabase-start-log-${{ github.job }}-${{ strategy.job-index }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/supabase-start/start.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup

      - name: Install Playwright Chromium only
        run: npx playwright install chromium

      - name: Run the complimentary access spec on its own database
        run: npm run test:pw-complimentary

      - name: Check complimentary artifacts for secret values
        id: secret_scan
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/check-artifact-secrets.mjs --names GH_TOKEN playwright/artifacts

      - name: Upload complimentary artifacts
        # Only artifacts that passed the secret scan leave the runner.
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: complimentary-access-e2e
          path: playwright/artifacts
          retention-days: 5

  # Passes whatever the suites did: the gate reads their own jobs. A suite the lane plan
  # skipped left no blob, so the install is skipped too and the comment says skipped.
  merge-reports:
    needs: [burn-in, pw-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # 1.5 minutes at p50, 1.7 at p95 (last 20 runs, 2026-11-12).
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node environment
        if: ${{ needs.pw-e2e.result != 'skipped' }}
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Merge, upload, and comment
        uses: ./.github/actions/playwright-merge-report-comment
        with:
          environment: local
          burn-in-result: ${{ needs.burn-in.result || 'skipped' }}
          shards: '2'
          e2e-result: ${{ needs.pw-e2e.result || 'unknown' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Proves every test ran in exactly one shard and writes the shard times to
      # the job summary. Reads the shards' psp-record-* artifacts and the jobs
      # API, which is why this job keeps actions: read.
      - name: Check shard coverage and timing
        if: ${{ !cancelled() }}
        uses: muratkeremozcan/playwright-smart-parallelization/finish@v1
