# Step 7 step 6 owner: searchable owner anchor
name: Deploy mobile (main)

on:
  workflow_dispatch:

concurrency:
  group: deploy-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify required secrets
        run: |
          if [ -z "${{ secrets.EXPO_TOKEN }}" ]; then
            echo "EXPO_TOKEN is missing; set repo secret to enable EAS builds." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Full history: the release hold reads lift artifacts and lockfiles at their commits.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: ./.github/actions/setup-node-env
        with:
          use-npm-ci: 'true'

      # Story 6.15 D12: no production build while apps/mobile/release-hold.json holds the app's
      # SDK (the SDK 56 Hermes memory regression) and no measured lift releases it.
      - name: Refuse a production build under the release hold
        run: node scripts/ci/mobile-release-hold.mjs

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Authenticate EAS
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
        run: eas whoami

      - name: Build with EAS (Android only)
        env:
          EXPO_TOKEN: ${{ env.EXPO_TOKEN }}
          EAS_NO_VCS: 1
        working-directory: apps/mobile
        run: |
          eas build --platform android --profile production --non-interactive --no-wait

      - name: Summary
        run: |
          {
            echo "## Deploy mobile (main)";
            echo "- Trigger: \`${{ github.event_name }}\`";
            echo "- Profile: production";
            echo "- Platform: android (iOS disabled until Apple Developer enrollment/credentials are available)";
          } >> "$GITHUB_STEP_SUMMARY"
