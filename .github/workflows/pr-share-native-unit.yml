# Story 6.9: unit tests for the share-card native modules, without a prebuild. The native app
# lanes skip pull requests, so this path-filtered workflow runs, on every PR that touches the
# share module, its Robolectric tests from its standalone Gradle project, which compiles the pure
# Android sources without Expo or the generated app. The Swift packages of the share and
# photo-save modules run in pr-apple-native.yml, the one macOS job a pull request may run
# (story 6.15 D6). The test step fails when it ran zero tests, skipped tests not counted. PR Gate
# makes the job required whenever it runs.
name: Share native unit tests

on:
  pull_request:
    paths:
      - 'apps/mobile/modules/share-card-native-share/**'
      - '.github/workflows/pr-share-native-unit.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/modules/share-card-native-share/**'
      - '.github/workflows/pr-share-native-unit.yml'
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:

concurrency:
  group: share-native-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  robolectric:
    name: Android Robolectric tests (SDK 34 and 36)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Robolectric's SDK 35+ runtimes need Java 21.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-36

      # The version the app's React Native 0.81 wrapper pins; AGP 8.11 does not support Gradle 9.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Cache Robolectric Android runtimes
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('apps/mobile/modules/share-card-native-share/android/unit-tests/build.gradle') }}

      - name: Robolectric tests for the share module
        run: |
          set -euo pipefail
          project=apps/mobile/modules/share-card-native-share/android/unit-tests
          gradle -p "$project" testDebugUnitTest --console=plain
          shopt -s nullglob
          reports=("$project"/build/test-results/testDebugUnitTest/TEST-*.xml)
          count=0
          skipped=0
          for report in "${reports[@]}"; do
            suite=$(grep -Eo '<testsuite [^>]*>' "$report" | head -1 || true)
            tests=$(echo "$suite" | grep -Eo ' tests="[0-9]+"' | grep -Eo '[0-9]+' || true)
            skips=$(echo "$suite" | grep -Eo ' skipped="[0-9]+"' | grep -Eo '[0-9]+' || true)
            count=$((count + ${tests:-0}))
            skipped=$((skipped + ${skips:-0}))
          done
          ran=$((count - skipped))
          if [ "$ran" -le 0 ]; then echo "::error::testDebugUnitTest ran zero tests ($count reported, $skipped skipped)"; exit 1; fi
          echo "testDebugUnitTest ran $ran tests ($skipped skipped)"

      - name: Upload Robolectric reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: share-native-robolectric-reports
          path: apps/mobile/modules/share-card-native-share/android/unit-tests/build/reports/tests
          if-no-files-found: warn
