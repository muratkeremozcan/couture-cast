# Story 6.7: the accessibility-focus native module. CI has no development-build
# lane for the mobile app, so this workflow unit-tests the module's Android side,
# builds a release Android app that compiles and registers it, and runs its
# instrumentation tests against real TalkBack on an emulator, with a
# suppressed-focus control that must fail on the OS focus report. The full Home
# teaser flow under TalkBack is local evidence (scripts/run-story67-talkback.mjs).
# PR Gate makes every job that runs here required.
#
# The iOS side needs macOS, which runs nightly and on demand only (owner rule,
# 2026-11-13): the AccessibilityFocusTarget XCTest in the ios job here, and the
# Release simulator app build with its link and registration check in
# ios-native-jobs.yml (story 6.15 D6). PRs and pushes keep the Android module
# tests and build, and the TalkBack run.
name: Accessibility focus module

on:
  pull_request:
    paths:
      - 'apps/mobile/modules/accessibility-focus/**'
      - 'apps/mobile/src/lib/accessibility-focus.ts'
      - 'apps/mobile/src/features/home/use-home-spotlight-teaser.ts'
      - 'apps/mobile/components/home/home-spotlight-teaser.tsx'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/app.json'
      - 'package-lock.json'
      - 'scripts/ci/android-talkback.sh'
      - 'scripts/ci/accessibility-focus-device-tests.sh'
      - 'scripts/ci/fetch-gradle-wrapper.sh'
      - 'scripts/ci/check-accessibility-focus-results.mjs'
      - 'scripts/ci/check-accessibility-focus-builds.sh'
      - 'scripts/run-story67-talkback.mjs'
      - '.github/workflows/pr-accessibility-focus.yml'
      - '.github/actions/free-runner-disk/**'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/modules/accessibility-focus/**'
      - 'apps/mobile/src/lib/accessibility-focus.ts'
      - 'apps/mobile/src/features/home/use-home-spotlight-teaser.ts'
      - 'apps/mobile/components/home/home-spotlight-teaser.tsx'
      - 'apps/mobile/package.json'
      - 'apps/mobile/app.config.ts'
      - 'apps/mobile/app.json'
      - 'package-lock.json'
      - 'scripts/ci/android-talkback.sh'
      - 'scripts/ci/accessibility-focus-device-tests.sh'
      - 'scripts/ci/fetch-gradle-wrapper.sh'
      - 'scripts/ci/check-accessibility-focus-results.mjs'
      - 'scripts/ci/check-accessibility-focus-builds.sh'
      - 'scripts/run-story67-talkback.mjs'
      - '.github/workflows/pr-accessibility-focus.yml'
      - '.github/actions/free-runner-disk/**'
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  # The event keeps a push from cancelling a scheduled or dispatched run, the iOS jobs' only runs.
  group: accessibility-focus-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  ANDROID_API_LEVEL: '35'
  # The Play image: the plain google_apis image carries no TalkBack.
  ANDROID_TARGET: google_apis_playstore
  ANDROID_ARCH: x86_64
  ANDROID_PROFILE: medium_phone

jobs:
  # The Robolectric tests run in their own job beside this build: together they took
  # 14.8 minutes at p50 and 17.0 at p95 (last 20 runs, 2026-11-12), too close to the
  # 20 minute PR job limit; apart, the build is about 13 and the tests about 7.
  android:
    name: Android app build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Expo's generated gradle.properties gives the Gradle daemon 2 GiB of heap and
      # 512 MiB of metaspace. The release app, its lint and the module's test APK in one
      # build ran out of both: D8 hit OutOfMemoryError in run 41251255523, and the daemon
      # ran out of metaspace before packageDebugAndroidTest failed in run 41256192629.
      # The user-level gradle.properties takes precedence over the project's.
      - name: Size the Gradle daemon for the release build
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Generate the Android project
        id: android_project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android

      # The release app must keep React Native's native libraries, which the
      # module's build.gradle leaves out of its own androidTest APK only.
      - name: Build the release app and the module's test APK
        id: apk_build
        if: ${{ !cancelled() && steps.android_project.outcome == 'success' }}
        working-directory: apps/mobile/android
        env:
          NODE_ENV: production
        run: ./gradlew :app:assembleRelease :accessibility-focus:assembleDebugAndroidTest -PreactNativeArchitectures=x86_64 --console=plain

      - name: Check what each APK carries
        if: ${{ !cancelled() && steps.apk_build.outcome == 'success' }}
        run: |
          bash scripts/ci/check-accessibility-focus-builds.sh android-app apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          bash scripts/ci/check-accessibility-focus-builds.sh android-test apps/mobile/modules/accessibility-focus/android/build/outputs/apk/androidTest/debug/accessibility-focus-debug-androidTest.apk

  android-robolectric:
    name: Android module tests
    runs-on: ubuntu-latest
    # Robolectric 3.6 minutes (p95 4.1) after about 3 minutes of setup.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android

      - name: Robolectric tests for the focus observer
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npm run test:accessibility-focus:android

  ios:
    name: iOS module tests
    # macOS runs nightly and on demand only (owner rule, 2026-11-13).
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: XCTest for the focus target decisions
        working-directory: apps/mobile/modules/accessibility-focus/ios
        run: |
          device=$(xcrun simctl list devices available | grep -m1 -oE 'iPhone [0-9]+[^(]*' | sed 's/ *$//')
          echo "Simulator: $device"
          xcodebuild test -scheme AccessibilityFocusTarget -destination "platform=iOS Simulator,name=$device"

  android-talkback:
    name: Android module against TalkBack (API 35)
    runs-on: ubuntu-latest
    # 10.0 minutes at p50, 12.0 at p95, 12.8 at most (last 20 runs, 2026-11-12).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk
        uses: ./.github/actions/free-runner-disk

      - name: Setup Node environment
        uses: ./.github/actions/install
        with:
          install-command: npm ci

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Generate the Android project
        working-directory: apps/mobile
        env:
          CI: '1'
          EXPO_NO_GIT_STATUS: '1'
        run: npx expo prebuild --platform android --no-install

      - name: Fetch the Gradle wrapper
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The API 35 Play image carries TalkBack and starts it from adb; the API 34
      # image on these runners has none (probed 2026-10-23, run 40034636703).
      - name: Instrumentation tests with TalkBack, then the suppressed-focus control
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: ${{ env.ANDROID_TARGET }}
          arch: ${{ env.ANDROID_ARCH }}
          profile: ${{ env.ANDROID_PROFILE }}
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: bash scripts/ci/accessibility-focus-device-tests.sh

      - name: Upload both runs' results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-focus-talkback-results
          path: apps/mobile/modules/accessibility-focus/android/build/talkback-results
          if-no-files-found: warn
