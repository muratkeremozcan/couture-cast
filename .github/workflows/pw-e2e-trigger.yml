name: "Manual E2E Tests"
run-name: E2E - ${{ inputs.test_env }} - Manual

on:
  workflow_dispatch:
    inputs:
      test_env:
        type: choice
        description: "Test Environment"
        required: true
        options:
          - preview
          - prod
      custom_base_url:
        description: "Custom base URL (optional override)"
        type: string
        required: false

# rwf-e2e.yml requests id-token: write, and a caller that does not grant it
# fails at startup before any job runs.
permissions:
  contents: read
  id-token: write

# if this workflow is triggered back to back, cancel the older run, but allow different test environments to run parallel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_env }}
  cancel-in-progress: true

jobs:
  preview-ready:
    # Without this wait a run dispatched right after a push pins deployments
    # that are still building and tests Vercel's placeholder pages.
    if: inputs.test_env == 'preview'
    uses: ./.github/workflows/rwf-vercel-preview-ready.yml
    with:
      git_ref: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets: inherit

  run-preview-tests:
    needs: preview-ready
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: "npm run test:pw-preview"
      gh_ref: ${{ github.sha }}
      deployment_ref: ${{ github.ref_name }}
      custom_base_url: ${{ inputs.custom_base_url || needs.preview-ready.outputs.web_url }}
      custom_api_base_url: ${{ needs.preview-ready.outputs.api_url }}
    secrets: inherit

  run-prod-tests:
    if: inputs.test_env == 'prod'
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: "npm run test:pw-prod"
      gh_ref: ${{ github.ref_name }}
      custom_base_url: ${{ inputs.custom_base_url }}
    secrets: inherit
