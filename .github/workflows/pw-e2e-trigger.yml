name: "Manual E2E Tests"
run-name: E2E - ${{ inputs.test_env }} - Manual

on:
  workflow_dispatch:
    inputs:
      test_env:
        type: choice
        description: "Test Environment"
        required: true
        options:
          - preview
          - prod
      custom_base_url:
        description: "Custom base URL (optional override)"
        type: string
        required: false
      custom_api_base_url:
        description: "Custom API base URL (optional override)"
        type: string
        required: false
      force_preview_build:
        description: "Build fresh preview deployments even when ready ones have the same inputs and configuration"
        type: boolean
        default: false
      scope:
        # A choice, never free text: each value selects a fixed command below.
        type: choice
        description: "Preview scope"
        required: false
        default: full
        options:
          - full
          - o1-realtime-probe

permissions:
  # The shard balancer reads the run's artifacts and jobs.
  actions: read
  contents: read

# if this workflow is triggered back to back, cancel the older run, but allow different test environments to run parallel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_env }}
  cancel-in-progress: true

jobs:
  preview-ready:
    # Branch pushes create no Vercel deployment, so this provides each preview the run does not
    # name a custom URL for, and waits until it serves. A custom URL names its own target.
    if: inputs.test_env == 'preview' && (inputs.custom_base_url == '' || inputs.custom_api_base_url == '')
    uses: ./.github/workflows/rwf-vercel-preview-ready.yml
    with:
      git_ref: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
      deploy_web: ${{ inputs.custom_base_url == '' }}
      deploy_api: ${{ inputs.custom_api_base_url == '' }}
      force_build: ${{ inputs.force_preview_build }}
    secrets: inherit

  run-preview-tests:
    needs: preview-ready
    if: >-
      !cancelled() && inputs.test_env == 'preview' &&
      contains(fromJSON('["success","skipped"]'), needs.preview-ready.result) &&
      ((inputs.custom_base_url != '' && inputs.custom_api_base_url != '') ||
       needs.preview-ready.outputs.required == 'true')
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: ${{ inputs.scope == 'o1-realtime-probe' && 'npm run test:pw-preview -- playwright/tests/community-engagement-preview.spec.ts' || 'npm run test:pw-preview' }}
      realtime_probe: ${{ inputs.scope == 'o1-realtime-probe' }}
      gh_ref: ${{ github.sha }}
      deployment_ref: ${{ github.ref_name }}
      custom_base_url: ${{ inputs.custom_base_url || needs.preview-ready.outputs.web_url }}
      custom_api_base_url: ${{ inputs.custom_api_base_url || needs.preview-ready.outputs.api_url }}
      # A custom web URL serves whatever it serves; only a resolved preview has a known commit.
      expected_web_sha: ${{ inputs.custom_base_url == '' && needs.preview-ready.outputs.web_sha || '' }}
    secrets: inherit

  run-prod-tests:
    if: inputs.test_env == 'prod'
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: "npm run test:pw-prod"
      gh_ref: ${{ github.sha }}
      custom_base_url: ${{ inputs.custom_base_url }}
      custom_api_base_url: ${{ inputs.custom_api_base_url }}
    secrets: inherit
