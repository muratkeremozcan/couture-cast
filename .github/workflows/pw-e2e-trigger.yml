name: "Manual E2E Tests"
run-name: E2E - ${{ inputs.test_env }} - Manual

on:
  workflow_dispatch:
    inputs:
      test_env:
        type: choice
        description: "Test Environment"
        required: true
        options:
          - preview
          - prod
      custom_base_url:
        description: "Custom base URL (optional override)"
        type: string
        required: false
      custom_api_base_url:
        description: "Custom API base URL (optional override)"
        type: string
        required: false
      scope:
        # A choice, never free text: each value selects a fixed command below.
        type: choice
        description: "Preview scope"
        required: false
        default: full
        options:
          - full
          - o1-realtime-probe

permissions:
  contents: read

# if this workflow is triggered back to back, cancel the older run, but allow different test environments to run parallel
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.test_env }}
  cancel-in-progress: true

jobs:
  preview-ready:
    # Without this wait a run dispatched right after a push pins deployments
    # that are still building and tests Vercel's placeholder pages. A custom
    # URL names its own target, so the branch previews are not awaited.
    if: inputs.test_env == 'preview' && inputs.custom_base_url == '' && inputs.custom_api_base_url == ''
    uses: ./.github/workflows/rwf-vercel-preview-ready.yml
    with:
      git_ref: ${{ github.ref_name }}
      expected_sha: ${{ github.sha }}
    secrets: inherit

  run-preview-tests:
    needs: preview-ready
    if: >-
      !cancelled() && inputs.test_env == 'preview' &&
      contains(fromJSON('["success","skipped"]'), needs.preview-ready.result)
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: ${{ inputs.scope == 'o1-realtime-probe' && 'npm run test:pw-preview -- playwright/tests/community-engagement-preview.spec.ts' || 'npm run test:pw-preview' }}
      realtime_probe: ${{ inputs.scope == 'o1-realtime-probe' }}
      gh_ref: ${{ github.sha }}
      deployment_ref: ${{ github.ref_name }}
      custom_base_url: ${{ inputs.custom_base_url || needs.preview-ready.outputs.web_url }}
      custom_api_base_url: ${{ inputs.custom_api_base_url || needs.preview-ready.outputs.api_url }}
    secrets: inherit

  run-prod-tests:
    if: inputs.test_env == 'prod'
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: ${{ inputs.test_env }}
      test_command: "npm run test:pw-prod"
      gh_ref: ${{ github.sha }}
      custom_base_url: ${{ inputs.custom_base_url }}
      custom_api_base_url: ${{ inputs.custom_api_base_url }}
    secrets: inherit
