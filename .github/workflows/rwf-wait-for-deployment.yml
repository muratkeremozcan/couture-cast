name: "Wait for deployment"

# Generic reusable workflow: polls a health endpoint until SHA matches expected
# Works with any deployment platform (Vercel, Netlify, Railway, etc.)

on:
  workflow_call:
    inputs:
      health_url:
        description: "Health endpoint URL to poll (must return JSON with .status and .gitSha)"
        type: string
        required: true
      secondary_url:
        description: "Optional secondary endpoint URL to poll for 200"
        type: string
        required: false
      expected_sha:
        description: "Commit SHA to match (first 7 chars), or several separated by spaces: commits with the same build inputs, any of which the deployment may serve"
        type: string
        required: true
      retries:
        description: "Max polling attempts"
        type: number
        required: false
        default: 20
      sleep_seconds:
        description: "Delay between attempts (seconds)"
        type: number
        required: false
        default: 30
    outputs:
      observed_sha:
        description: "The commit the deployment serves, one of expected_sha"
        value: ${{ jobs.wait.outputs.observed_sha }}

jobs:
  wait:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      observed_sha: ${{ steps.health_check.outputs.observed_sha }}
    steps:
      - name: Wait for health + SHA
        id: health_check
        env:
          HEALTH_URL: ${{ inputs.health_url }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RETRIES: ${{ inputs.retries }}
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          echo "Waiting for deployment at ${HEALTH_URL}"
          # A production build whose inputs equal the deployed ones is skipped
          # (scripts/vercel-build-inputs.mjs), so the caller may accept several commits.
          read -r -a EXPECTED <<< "${EXPECTED_SHA}"
          if [ "${#EXPECTED[@]}" -eq 0 ]; then
            echo "❌ expected_sha names no commit."
            exit 1
          fi
          EXPECTED_LABEL="${EXPECTED[0]:0:7}"
          if [ "${#EXPECTED[@]}" -gt 1 ]; then
            EXPECTED_LABEL="${EXPECTED_LABEL} or one of $(( ${#EXPECTED[@]} - 1 )) earlier commits with the same inputs"
          fi
          expected() {
            local sha
            for sha in "${EXPECTED[@]}"; do
              [ "${sha:0:7}" = "${1:0:7}" ] && return 0
            done
            return 1
          }

          MATCHED=false
          OBSERVED=""

          for i in $(seq 1 "${RETRIES}"); do
            RESPONSE=$(curl -s -f "${HEALTH_URL}" || true)

            if [ -z "${RESPONSE}" ]; then
              echo "⏳ Waiting for health... (attempt ${i}/${RETRIES})"
              sleep "${SLEEP_SECONDS}"
              continue
            fi

            STATUS=$(echo "${RESPONSE}" | jq -r '.status // "unknown"')
            DEPLOYED_SHA=$(echo "${RESPONSE}" | jq -r '.gitSha // "unknown"')
            DEPLOYED_SHORT="${DEPLOYED_SHA:0:7}"

            if [ "${STATUS}" != "ok" ]; then
              echo "⏳ Health endpoint not ready (status=${STATUS})... (attempt ${i}/${RETRIES})"
              sleep "${SLEEP_SECONDS}"
              continue
            fi

            if [ "${DEPLOYED_SHA}" = "unknown" ]; then
              echo "⏳ Health OK but gitSha unknown... retrying (attempt ${i}/${RETRIES})"
              sleep "${SLEEP_SECONDS}"
              continue
            fi

            if expected "${DEPLOYED_SHA}"; then
              echo "✅ Deployment healthy with expected SHA: ${DEPLOYED_SHORT}"
              MATCHED=true
              OBSERVED="${DEPLOYED_SHA}"
              break
            fi

            echo "⏳ Health OK but waiting for correct deployment... (attempt ${i}/${RETRIES})"
            echo "   Expected SHA: ${EXPECTED_LABEL}"
            echo "   Deployed SHA: ${DEPLOYED_SHORT}"
            sleep "${SLEEP_SECONDS}"
          done

          # Final verification
          if ! curl -f "${HEALTH_URL}" > /dev/null; then
            echo "❌ Deployment failed to become healthy after waiting."
            exit 1
          fi

          if [ "${MATCHED}" = "false" ]; then
            FINAL_SHA=$(curl -s -f "${HEALTH_URL}" | jq -r '.gitSha // "unknown"')
            if [ "${FINAL_SHA}" = "unknown" ]; then
              echo "❌ Deployment never reported gitSha; refusing to continue without SHA match."
              exit 1
            fi

            if ! expected "${FINAL_SHA}"; then
              echo "❌ Deployed SHA (${FINAL_SHA}) doesn't match expected (${EXPECTED_SHA}) after waiting."
              exit 1
            fi
            OBSERVED="${FINAL_SHA}"
          fi
          echo "observed_sha=${OBSERVED}" >> "$GITHUB_OUTPUT"

      - name: Poll secondary endpoint (optional)
        if: ${{ inputs.secondary_url != '' }}
        env:
          SECONDARY_URL: ${{ inputs.secondary_url }}
          RETRIES: ${{ inputs.retries }}
          SLEEP_SECONDS: ${{ inputs.sleep_seconds }}
        run: |
          echo "Waiting for secondary endpoint at ${SECONDARY_URL}"

          for i in $(seq 1 "${RETRIES}"); do
            STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "${SECONDARY_URL}" || true)

            if [ "${STATUS_CODE}" = "200" ]; then
              echo "✅ Secondary endpoint responded with 200"
              SECONDARY_OK=true
              break
            fi

            echo "⏳ Secondary endpoint not ready (status=${STATUS_CODE})... (attempt ${i}/${RETRIES})"
            sleep "${SLEEP_SECONDS}"
          done

          if [ "${SECONDARY_OK}" != "true" ]; then
            FINAL_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${SECONDARY_URL}" || true)
            echo "❌ Secondary endpoint failed to return 200 after waiting (status=${FINAL_STATUS})."
            exit 1
          fi
