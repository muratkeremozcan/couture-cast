# Step 7 step 4 owner: searchable owner anchor
name: Vercel Preview e2e

on:
  pull_request:
    # Branch pushes create no Vercel deployment, so opening a PR must provide its previews too.
    types: [opened, reopened, labeled, synchronize]

permissions:
  # The shard balancer reads the run's artifacts and jobs.
  actions: read
  contents: read

concurrency:
  # A label other than PREVIEW or PREVIEW-REBUILD runs nothing, so it gets its own group and
  # never cancels the run providing this PR's previews.
  group: vercel-preview-${{ github.event.pull_request.number }}${{ github.event.action == 'labeled' && github.event.label.name != 'PREVIEW' && github.event.label.name != 'PREVIEW-REBUILD' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  # The lanes this push wakes (scripts/ci/lanes.mjs). Each job a lane gates needs this one and
  # is skipped when its lane is false; this job's summary says why. It installs nothing, so it
  # holds the jobs it gates for seconds.
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.lanes.outputs.plan }}
      coverage_shards: ${{ steps.lanes.outputs.coverage_shards }}
    steps:
      - name: Checkout the lane map and workspace manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/ci/lanes.mjs
            apps/*/package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Plan the lanes
        id: lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANES_WORKFLOW: pr-pw-e2e-vercel-preview.yml
        run: node scripts/ci/lanes.mjs

  preview-ready:
    # Find the exact web and API preview URLs for this PR commit and wait until
    # both projects serve it. Fork PRs get no VERCEL_TOKEN, so they skip previews.
    # The lane plan skips a pull request that changes nothing a preview builds or tests
    # (scripts/vercel-preview-inputs.mjs asks the same lane); adding PREVIEW-REBUILD
    # still builds fresh previews.
    needs: lanes
    if: |
      github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' ||
      github.event.label.name == 'PREVIEW' || github.event.label.name == 'PREVIEW-REBUILD') &&
      (fromJSON(needs.lanes.outputs.plan)['preview'] ||
      (github.event.action == 'labeled' && github.event.label.name == 'PREVIEW-REBUILD'))
    uses: ./.github/workflows/rwf-vercel-preview-ready.yml
    with:
      git_ref: ${{ github.head_ref }}
      expected_sha: ${{ github.event.pull_request.head.sha }}
      # Adding the PREVIEW-REBUILD label builds fresh deployments even when ready ones match.
      # Later pushes reuse as usual; remove and add the label again to force another build.
      force_build: ${{ github.event.action == 'labeled' && github.event.label.name == 'PREVIEW-REBUILD' }}
      # The lane plan already chose the preview lane (the diff, or the ALL-LANES label), so the
      # reusable workflow's own scope check keeps that choice; deployments are still reused.
      require_previews: ${{ fromJSON(needs.lanes.outputs.plan)['preview'] }}
    secrets: inherit

  pw-e2e:
    # Pass the exact URLs through so the test command does not re-resolve previews.
    needs: [lanes, preview-ready]
    if: needs.preview-ready.outputs.required == 'true' && (fromJSON(needs.lanes.outputs.plan)['preview'] || (github.event.action == 'labeled' && github.event.label.name == 'PREVIEW-REBUILD'))
    uses: ./.github/workflows/rwf-e2e.yml
    with:
      test_env: preview
      test_command: npm run test:pw-preview
      gh_ref: ${{ github.event.pull_request.head.sha }}
      deployment_ref: ${{ github.head_ref }}
      custom_base_url: ${{ needs.preview-ready.outputs.web_url }}
      custom_api_base_url: ${{ needs.preview-ready.outputs.api_url }}
      expected_web_sha: ${{ needs.preview-ready.outputs.web_sha }}
    secrets: inherit
