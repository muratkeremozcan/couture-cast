# Event-driven gate: recomputes the verdict on each CI completion event and
# publishes it as the `gate` check run, the ONE required check in the ruleset.
# Uses the vendored pr-gate action (.github/actions/pr-gate, mode: watch),
# replacing kachick/wait-other-jobs. Seconds per event instead of holding a
# runner for the length of the slowest job.
name: PR Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_run:
    types: [completed]
    workflows: ['**'] # every workflow; an omitted list disables the trigger

# Serializes per commit so two events cannot race the same check run.
# cancel-in-progress would drop a terminal verdict and leave the PR pending.
concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha || github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Do not re-trigger on your own completion. workflow_run fires for this
    # workflow too, and GitHub chains it three levels deep before stopping.
    if: github.event.workflow_run.path != '.github/workflows/pr-gate.yml'
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      # The action runs with checks: write, so its code must come from the
      # default branch, never from the PR being gated. On workflow_run,
      # GITHUB_SHA already is the default-branch tip.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.repository.default_branch || github.sha }}
      - uses: ./.github/actions/pr-gate
        with:
          mode: watch
