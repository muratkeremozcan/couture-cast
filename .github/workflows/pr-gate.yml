# Event-driven gate: recomputes the verdict on each CI completion event and
# publishes it as the `gate` check run, the ONE required check in the ruleset.
# Uses the vendored pr-gate action (.github/actions/pr-gate, mode: watch),
# replacing kachick/wait-other-jobs. Seconds per event instead of holding a
# runner for the length of the slowest job.
#
# workflow_run is the only trigger on purpose. It always runs the default
# branch's copy of this file and this action, so the checks: write token below
# never executes code from the PR being gated. Six workflows here run on every
# pull_request with no path filter, so the gate always gets an event to fire on.
name: PR Gate

on:
  workflow_run:
    types: [completed]
    workflows: ['**'] # every workflow; an omitted list disables the trigger

# Serializes per commit so two events cannot race the same check run.
# cancel-in-progress would drop a terminal verdict and leave the PR pending.
concurrency:
  group: pr-gate-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  watch:
    name: watch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Do not re-trigger on your own completion. workflow_run fires for this
    # workflow too, and GitHub chains it three levels deep before stopping.
    if: github.event.workflow_run.path != '.github/workflows/pr-gate.yml'
    permissions:
      contents: read
      checks: write
      actions: read
    steps:
      # On workflow_run, GITHUB_SHA is the default-branch tip, so the default
      # checkout is the trusted copy. The action reads the PR's head SHA from
      # the event payload rather than from the working tree.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/pr-gate
        with:
          mode: watch
