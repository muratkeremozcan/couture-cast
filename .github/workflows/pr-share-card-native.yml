      - name: Verify share-card harness and plugin suites
        id: harness_suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        id: android_sdk
        if: ${{ !cancelled() }}
        with:
          packages: platform-tools
      - name: Verify startup deadline controls
        id: deadline_controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - uses: ./.github/actions/start-local-supabase
        if: ${{ !cancelled() && steps.deadline_controls.outcome == 'success' }}
        id: supabase
      - name: Prepare isolated UUID runtime and built renderer
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status so an early crash is
          # reported by name instead of surfacing as an unrelated later failure.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform android > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      - name: Verify the owned API database entry guard
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          npx vitest run scripts/lib/story68-api-entry.test.mjs --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/story68-api-entry.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/story68-api-entry.json`, 'utf8'))
          if (report.numTotalTests < 2 || report.numPassedTests !== report.numTotalTests ||
              report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
            throw new Error('Incomplete API entry guard execution')
          JS
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      # Most commits change no native input, so each lane restores the development client of its
      # native fingerprint and builds it only on a miss (scripts/ci/native-build-cache.mjs). The
      # client loads its JavaScript from this job's Metro, so the journey still tests this commit.
      - name: Key the native development client by its native inputs
        id: native_key
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.java.outcome == 'success' }}
        run: node scripts/ci/native-build-cache.mjs key --platform ${{ matrix.platform }} >> "$GITHUB_OUTPUT"
      - name: Generate native development client
        id: prebuild
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs prebuild --platform ${{ matrix.platform }}
      - name: Restore the development client of this fingerprint
        id: native_cache
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && steps.prebuild.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      - name: Verify fresh Worklets variant and ABI staging
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs worklets-staging
      - name: Build native development client
        id: native_build
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true' }}
        run: node scripts/run-story68-native.mjs build --platform ${{ matrix.platform }}
      - name: Verify modal status-bar styling on both Android SDK branches
        id: modal_system_bars
        # Robolectric compiles the module inside the generated Android project.
        # Its inputs are part of the fingerprint, so a restored client already passed it.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :modal-system-bars:testDebugUnitTest --tests expo.modules.modalsystembars.ModalSystemBarsTest
          # Both SDK branches ran, and none was skipped.
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' ../modules/modal-system-bars/android/build/test-results/testDebugUnitTest/TEST-expo.modules.modalsystembars.ModalSystemBarsTest.xml
