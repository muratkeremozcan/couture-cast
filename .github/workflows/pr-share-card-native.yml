name: Share-card native originals
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: share-card-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supabase-images:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reserve-supabase-ports
      - uses: ./.github/actions/install
      - name: Verify startup deadline controls
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - uses: ./.github/actions/start-local-supabase
      - name: Pin the complete amd64 image archive
        run: node scripts/ci/share-card-supabase-artifact.mjs pack
      - uses: actions/upload-artifact@v4
        with:
          name: cc68-supabase-amd64
          path: |
            ${{ runner.temp }}/supabase-image-cache/images.tar.zst
            ${{ runner.temp }}/supabase-image-cache/registry
            ${{ runner.temp }}/supabase-image-cache/image-artifact.json
          if-no-files-found: error
          retention-days: 1
      - name: Stop the owned image-prewarm stack
        if: always()
        run: npx supabase stop --no-backup
  original-resource:
    needs: supabase-images
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 32
            target: google_apis
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
          - os: macos-15-intel
            platform: ios
            api: 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CC68_HARNESS_DIR: _bmad-output/test-artifacts/story-6-8/runtime
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/reserve-supabase-ports
        if: runner.os == 'Linux'
      - uses: ./.github/actions/install
      - name: Provision pinned iOS accessibility browser
        if: matrix.platform == 'ios'
        timeout-minutes: 6
        run: npx --no-install playwright install chromium
      - name: Provision pinned share-card browser dependencies
        if: matrix.platform == 'android'
        timeout-minutes: 12
        run: |
          node scripts/ci/node-test-gate.mjs browser-deps
          if [ '${{ matrix.api }}' = '32' ]; then
            node scripts/ci/share-card-browser-deps.mjs --chromium-only
          else
            node scripts/ci/share-card-browser-deps.mjs
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Start owned Docker VM for local Auth on macOS
        if: runner.os == 'macOS'
        run: |
          bash scripts/ci/share-card-ios-host.sh
      - name: Verify startup deadline controls
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - name: Download the independently prewarmed amd64 images
        if: runner.os == 'macOS'
        uses: actions/download-artifact@v4
        with:
          name: cc68-supabase-amd64
          path: ${{ runner.temp }}/share-card-supabase-artifact
      - name: Verify and load the exact Supabase image archive
        id: supabase-artifact
        if: runner.os == 'macOS'
        timeout-minutes: 12
        run: node scripts/ci/share-card-supabase-artifact.mjs load
      - uses: ./.github/actions/start-local-supabase
        with:
          image-registry: ${{ steps.supabase-artifact.outputs.registry || 'ghcr.io' }}
          # The Mac loads the prewarmed artifact; its own Actions cache would add a
          # second full docker save through the SSH-forwarded Colima socket.
          image-cache: ${{ runner.os != 'macOS' }}
      - name: Prepare isolated UUID runtime and built renderer
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1 &
          node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1 &
          node scripts/run-story68-native.mjs metro > /tmp/cc68-metro.log 2>&1 &
          node scripts/maestro-install.mjs
      - name: Verify the owned API database entry guard
        run: |
          npx vitest run scripts/lib/story68-api-entry.test.mjs --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/story68-api-entry.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/story68-api-entry.json`, 'utf8'))
          if (report.numTotalTests < 2 || report.numPassedTests !== report.numTotalTests ||
              report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
            throw new Error('Incomplete API entry guard execution')
          JS
      - name: Verify localized native accessibility announcements and focus bridge
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - name: Verify native paragraph heading semantics
        if: runner.os == 'macOS'
        run: bash scripts/ci/share-card-header-semantics.sh
      - name: Generate native development client
        run: node scripts/run-story68-native.mjs prebuild --platform ${{ matrix.platform }}
      - name: Verify fresh Worklets variant and ABI staging
        if: matrix.platform == 'android'
        run: node scripts/ci/node-test-gate.mjs worklets-staging
      - name: Build native development client
        run: node scripts/run-story68-native.mjs build --platform ${{ matrix.platform }}
      - name: Genuine browser share-card acceptance matrix
        if: matrix.platform == 'android' && matrix.api == 36
        run: |
          node scripts/e2e-share-card/web.mjs > "$CC68_HARNESS_DIR/web-startup-private.log" 2>&1 &
          node scripts/e2e-share-card/wait-web.mjs
          npx playwright test --config playwright/share-card.config.ts
          node scripts/e2e-share-card/assert-web-matrix.mjs
      - name: Enable and verify Android hardware acceleration
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the uevent; wait until the rule has applied before testing.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android real original and API32 denied/permanent permission proof
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC68_ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          avd-name: cc68-api${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/ci/share-card-android.sh
      - name: iOS original Photos resource and add-only save
        if: matrix.platform == 'ios'
        run: |
          device=$(xcrun simctl create cc68-ci 'iPhone 16 Pro')
          echo "$device" > /tmp/cc68-simulator
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          xcrun simctl install "$device" /tmp/cc68-ios-build/Build/Products/Debug-iphonesimulator/CoutureCastStory68.app
          node scripts/run-story68-native.mjs open --platform ios --device "$device"
          node scripts/run-story68-native.mjs signin --platform ios --device "$device"
          node scripts/run-story68-native.mjs proof --platform ios --device "$device"
          node scripts/run-story68-native.mjs matrix --platform ios --device "$device"
          node scripts/run-story68-native.mjs rapid-watermark --platform ios --device "$device"
          node scripts/run-story68-native.mjs a11y --platform ios --device "$device"
          node scripts/run-story68-native.mjs fallback-focus --platform ios --device "$device"
          node scripts/run-story68-native.mjs expo-go-proof --platform ios --device "$device"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Delete owned CI simulator
        if: always() && matrix.platform == 'ios'
        run: |
          if [ -f /tmp/cc68-simulator ]; then
            xcrun simctl delete "$(cat /tmp/cc68-simulator)"
          fi
