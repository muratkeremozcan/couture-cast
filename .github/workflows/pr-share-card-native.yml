        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC68_ANDROID_API: ${{ matrix.api }}
          CC68_ANDROID_SUITE: ${{ matrix.suite }}
        with:
          api-level: ${{ matrix.api }}
          avd-name: cc68-api${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/ci/share-card-android.sh
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.suite }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
  android36-original:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: original
            journey_timeout: 25
    env: *runtime_env
    steps: *android36_steps
  # The rapid watermark, TalkBack and fallback focus proofs. Run 41202706840 ran them in 6.5
  # minutes after an emulator, install and sign-in setup of 5.5 (12.0 in all).
  android36-controls:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: controls
            journey_timeout: 25
    env: *runtime_env
    steps: *android36_steps
  # Story 6.9 share-sheet and the Release font proof: 21.2 minutes on run 41202706840.
  android36-interaction:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
