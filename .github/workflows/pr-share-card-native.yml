name: Share-card native originals
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: share-card-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  original-resource:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 32
            target: google_apis
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
          - os: macos-15
            platform: ios
            api: 0
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CC68_HARNESS_DIR: _bmad-output/test-artifacts/story-6-8/runtime
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Disable Spotlight indexing on the disposable iOS runner
        if: matrix.platform == 'ios'
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'macOS'
          node scripts/ci/native-host-evidence.mjs sample before-indexing-disable --platform ios
          sudo mdutil -a -s
          sudo mdutil -a -i off
          sudo mdutil -s /System/Volumes/Data
          node scripts/ci/native-host-evidence.mjs sample after-indexing-disable --platform ios
      - uses: ./.github/actions/reserve-supabase-ports
        if: runner.os == 'Linux'
      # storage-api runs on the Node major its Dockerfile pins; the repo's own Node
      # comes from the install step after this one and stays first on PATH.
      - name: Provision Node 22 for the native storage-api
        if: runner.os == 'macOS'
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the Node 22 binary for the native storage-api
        if: runner.os == 'macOS'
        run: echo "NATIVE_SUPABASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
      - name: Provision pinned iOS accessibility browser
        if: matrix.platform == 'ios'
        timeout-minutes: 6
        run: npx --no-install playwright install chromium
      - name: Provision pinned share-card browser dependencies
        if: matrix.platform == 'android'
        timeout-minutes: 12
        run: |
          node --test scripts/ci/share-card-browser-deps.test.mjs
          if [ '${{ matrix.api }}' = '32' ]; then
            node scripts/ci/share-card-browser-deps.mjs --chromium-only
          else
            node scripts/ci/share-card-browser-deps.mjs
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        if: matrix.platform == 'android'
        with:
          packages: platform-tools
      - name: Verify startup deadline controls
        run: node --test scripts/ci/supabase-start-deadline.test.mjs scripts/ci/native-supabase.test.mjs scripts/ci/native-supabase-gateway.test.mjs scripts/e2e-share-card/runtime-sources.test.mjs scripts/ci/native-host-evidence.test.mjs scripts/ci/native-build-daemons.test.mjs scripts/ci/native-ios-quiesce.test.mjs scripts/ci/native-ios-flow-deadline.test.mjs scripts/e2e-share-card/warm-metro.test.mjs
      - uses: ./.github/actions/start-local-supabase
        if: runner.os == 'Linux'
      - name: Install the iOS project generator
        if: runner.os == 'macOS'
        run: brew install xcodegen
      # The macOS lane runs Supabase as native processes built from pinned,
      # checksum-verified sources (scripts/ci/native-supabase.mjs). Each build is
      # saved to the cache as soon as it exists, so a failed job still keeps it.
      - name: Pin the native Supabase build inputs
        id: native
        if: runner.os == 'macOS'
        run: node scripts/ci/native-supabase.mjs cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore PostgreSQL
        id: postgres-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Build PostgreSQL from its verified source
        if: runner.os == 'macOS' && steps.postgres-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build postgres
      - name: Save PostgreSQL
        if: runner.os == 'macOS' && steps.postgres-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Restore Redis
        id: redis-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Build Redis from its verified source
        if: runner.os == 'macOS' && steps.redis-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build redis
      - name: Save Redis
        if: runner.os == 'macOS' && steps.redis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Restore GoTrue
        id: gotrue-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Fetch the pinned GoTrue source
        if: runner.os == 'macOS' && steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs fetch gotrue
      - name: Provision Go for GoTrue
        if: runner.os == 'macOS' && steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/native-supabase/sources/auth/go.mod
          cache-dependency-path: ${{ runner.temp }}/native-supabase/sources/auth/go.sum
      - name: Build GoTrue
        if: runner.os == 'macOS' && steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build gotrue
      - name: Save GoTrue
        if: runner.os == 'macOS' && steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Restore storage-api
        id: storage-cache
        if: runner.os == 'macOS'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Build storage-api
        if: runner.os == 'macOS' && steps.storage-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build storage
      - name: Save storage-api
        if: runner.os == 'macOS' && steps.storage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Start the native Supabase stack
        if: runner.os == 'macOS'
        timeout-minutes: 8
        run: node scripts/ci/native-supabase.mjs start
      - name: Provision the local Storage buckets
        if: runner.os == 'macOS'
        run: node scripts/local-storage-buckets.mjs provision
      - name: Prepare isolated UUID runtime and built renderer
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1 &
          node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1 &
          node scripts/run-story68-native.mjs metro > /tmp/cc68-metro.log 2>&1 &
          node scripts/maestro-install.mjs
      - name: Verify localized native accessibility announcements and focus bridge
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
          node --test apps/mobile/plugins/with-share-card-permissions.test.js apps/mobile/plugins/with-story68-release-network.test.js
          node --test scripts/lib/story68-rapid-watermark.test.mjs scripts/lib/story68-rapid-watermark-control.test.mjs scripts/lib/story68-rapid-watermark-flow.test.mjs scripts/lib/story68-native-build-env.test.mjs scripts/lib/story68-fallback-post.test.mjs scripts/lib/story68-fallback-focus.test.mjs scripts/lib/story68-cold-font-scale.test.mjs scripts/lib/story68-release-live-font.test.mjs scripts/lib/story68-ios-focus-observation.test.mjs scripts/lib/story68-browser-watermark.test.mjs
          node --test scripts/ci/share-card-native-failure.spec.mjs scripts/ci/share-card-android.test.mjs scripts/lib/share-card-native-diagnostics.test.mjs scripts/lib/story68-bridge-unit-result.test.mjs scripts/e2e-share-card/wait-web.test.mjs
      - name: Verify native paragraph heading semantics
        if: runner.os == 'macOS'
        run: bash scripts/ci/share-card-header-semantics.sh
      - name: Generate native development client
        run: node scripts/run-story68-native.mjs prebuild --platform ${{ matrix.platform }}
      - name: Verify fresh Worklets variant and ABI staging
        if: matrix.platform == 'android'
        run: node --test scripts/lib/story68-worklets-staging.test.mjs
      - name: Mark the owned iOS build-service window
        if: matrix.platform == 'ios'
        run: node scripts/ci/native-build-daemons.mjs mark
      - name: Build native development client
        run: node scripts/run-story68-native.mjs build --platform ${{ matrix.platform }}
      - name: Release the owned iOS build services
        if: matrix.platform == 'ios'
        run: node scripts/ci/native-build-daemons.mjs stop
      - name: Genuine browser share-card acceptance matrix
        if: matrix.platform == 'android' && matrix.api == 36
        run: |
          node scripts/e2e-share-card/web.mjs > "$CC68_HARNESS_DIR/web-startup-private.log" 2>&1 &
          node scripts/e2e-share-card/wait-web.mjs
          npx playwright test --config playwright/share-card.config.ts
          node scripts/e2e-share-card/assert-web-matrix.mjs
      - name: Enable and verify Android hardware acceleration
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the uevent; wait until the rule has applied before testing.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android real original and API32 denied/permanent permission proof
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC68_ANDROID_API: ${{ matrix.api }}
        with:
          api-level: ${{ matrix.api }}
          avd-name: cc68-api${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/ci/share-card-android.sh
      - name: iOS original Photos resource and add-only save
        if: matrix.platform == 'ios'
        run: |
          # XCUITest (Maestro's driver and the accessibility audit) runs through
          # the selected Xcode, which drives only a simulator on its own SDK
          # version; an unpinned create takes the newest installed runtime.
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-version)
          runtime=$(xcrun simctl list runtimes -j | jq -r --arg v "$sdk" \
            '[.runtimes[] | select(.platform == "iOS" and .isAvailable and (.version == $v or (.version | startswith($v + "."))))] | last | .identifier // empty')
          if [ -z "$runtime" ]; then
            echo "::error::No available iOS ${sdk} simulator runtime for $(xcodebuild -version | head -1)."
            xcrun simctl list runtimes
            exit 1
          fi
          echo "iOS simulator runtime ${runtime} for SDK ${sdk}"
          node scripts/e2e-share-card/warm-metro.mjs --platform ios
          node scripts/ci/native-host-evidence.mjs sample before-simulator-boot --platform ios
          device=$(xcrun simctl create cc68-ci 'iPhone 16 Pro' "$runtime")
          echo "$device" > /tmp/cc68-simulator
          xcrun simctl boot "$device"
          xcrun simctl bootstatus "$device" -b
          node scripts/ci/native-host-evidence.mjs sample after-simulator-boot --platform ios
          xcrun simctl install "$device" /tmp/cc68-ios-build/Build/Products/Debug-iphonesimulator/CoutureCastStory68.app
          node scripts/ci/native-ios-quiesce.mjs "$device"
          node scripts/ci/native-host-evidence.mjs sample before-first-flow --platform ios
          node scripts/run-story68-native.mjs open --platform ios --device "$device"
          node scripts/ci/native-host-evidence.mjs first-flow passed --platform ios
          node scripts/ci/native-host-evidence.mjs metro --platform ios
          node scripts/ci/native-host-evidence.mjs sample after-first-flow --platform ios
          node scripts/run-story68-native.mjs signin --platform ios --device "$device"
          node scripts/run-story68-native.mjs proof --platform ios --device "$device"
          node scripts/run-story68-native.mjs matrix --platform ios --device "$device"
          node scripts/run-story68-native.mjs rapid-watermark --platform ios --device "$device"
          node scripts/run-story68-native.mjs a11y --platform ios --device "$device"
          node scripts/run-story68-native.mjs fallback-focus --platform ios --device "$device"
          node scripts/run-story68-native.mjs expo-go-proof --platform ios --device "$device"
      - name: Record closed iOS host, first-flow and Metro diagnostics
        if: failure() && matrix.platform == 'ios'
        run: |
          node scripts/ci/native-host-evidence.mjs sample failure --platform ios
          node scripts/ci/native-host-evidence.mjs first-flow failed --platform ios
          node scripts/ci/native-host-evidence.mjs metro --platform ios
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: failure() && runner.os == 'macOS'
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always() && runner.os == 'macOS'
        run: node scripts/ci/native-supabase.mjs stop
      - name: Delete owned CI simulator
        if: always() && matrix.platform == 'ios'
        run: |
          if [ -f /tmp/cc68-simulator ]; then
            xcrun simctl delete "$(cat /tmp/cc68-simulator)"
          fi
