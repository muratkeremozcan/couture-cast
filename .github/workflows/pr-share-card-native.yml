        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ios
          CC68_CI_API: 0
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-ios-shard-${{ matrix.shard }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: ${{ !cancelled() && failure() }}
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always()
        run: node scripts/ci/native-supabase.mjs stop
      - name: Delete owned CI simulator
        if: always()
        run: node scripts/ci/native-ios-device-cleanup.mjs

  # The Expo Go proof runs alone on a fresh simulator, skipped on pull requests like every other
  # device lane and required by share-card-lanes-gate. The iOS checks that need no development
  # client follow it.
  ios-expo-go:
    needs: ios-build
    if: github.event_name != 'pull_request'
    runs-on: macos-15
    timeout-minutes: 60
    env: *runtime_env
    steps:
      - uses: actions/checkout@v4
      - name: Disable Spotlight indexing on the disposable iOS runner
        run: |
          test "$GITHUB_ACTIONS" = 'true'
          test "$RUNNER_ENVIRONMENT" = 'github-hosted'
          test "$RUNNER_OS" = 'macOS'
          node scripts/ci/native-host-evidence.mjs sample before-indexing-disable --platform ios
          sudo mdutil -a -s
          sudo mdutil -a -i off
          sudo mdutil -s /System/Volumes/Data
          node scripts/ci/native-host-evidence.mjs sample after-indexing-disable --platform ios
      # storage-api runs on the Node major its Dockerfile pins; the repo's own Node
      # comes from the install step after this one and stays first on PATH.
      - name: Provision Node 22 for the native storage-api
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Record the Node 22 binary for the native storage-api
        run: echo "NATIVE_SUPABASE_NODE=$(command -v node)" >> "$GITHUB_ENV"
      - uses: ./.github/actions/install
        id: install
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the iOS project generator
        run: brew install xcodegen
      # The macOS lane runs Supabase as native processes built from pinned,
      # checksum-verified sources (scripts/ci/native-supabase.mjs). Each build is
      # saved to the cache as soon as it exists, so a failed job still keeps it.
      - name: Pin the native Supabase build inputs
        id: native
        run: node scripts/ci/native-supabase.mjs cache-keys >> "$GITHUB_OUTPUT"
      - name: Restore PostgreSQL
        id: postgres-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Build PostgreSQL from its verified source
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build postgres
      - name: Save PostgreSQL
        if: steps.postgres-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.postgres-path }}
          key: ${{ steps.native.outputs.postgres-key }}
      - name: Restore Redis
        id: redis-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Build Redis from its verified source
        if: steps.redis-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build redis
      - name: Save Redis
        if: steps.redis-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.redis-path }}
          key: ${{ steps.native.outputs.redis-key }}
      - name: Restore GoTrue
        id: gotrue-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Fetch the pinned GoTrue source
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs fetch gotrue
      - name: Provision Go for GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: ${{ runner.temp }}/native-supabase/sources/auth/go.mod
          cache-dependency-path: ${{ runner.temp }}/native-supabase/sources/auth/go.sum
      - name: Build GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build gotrue
      - name: Save GoTrue
        if: steps.gotrue-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.gotrue-path }}
          key: ${{ steps.native.outputs.gotrue-key }}
      - name: Restore storage-api
        id: storage-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Build storage-api
        if: steps.storage-cache.outputs.cache-hit != 'true'
        run: node scripts/ci/native-supabase.mjs build storage
      - name: Save storage-api
        if: steps.storage-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native.outputs.storage-path }}
          key: ${{ steps.native.outputs.storage-key }}
      - name: Start the native Supabase stack
        timeout-minutes: 8
        run: node scripts/ci/native-supabase.mjs start
      - name: Provision the local Storage buckets
        run: node scripts/local-storage-buckets.mjs provision
      - name: Prepare isolated UUID runtime and built renderer
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status so an early crash is
          # reported by name instead of surfacing as an unrelated later failure.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform ios > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      # ios-build resolved the key and, on a miss, saved the scanned client before this job started.
      - name: Restore the development client of this fingerprint
        uses: actions/cache/restore@v4
        with:
          path: ${{ needs.ios-build.outputs.app-path }}
          key: ${{ needs.ios-build.outputs.app-key }}
          fail-on-cache-miss: true
      - name: Expo Go proof on a fresh simulator
        run: |
          node scripts/e2e-share-card/warm-metro.mjs --platform ios
          node scripts/ci/native-ios-startup-probe.mjs --for-native-flow
          device=$(cat /tmp/cc68-simulator)
          node scripts/ci/native-host-evidence.mjs sample before-first-flow --platform ios
          node scripts/run-story68-native.mjs expo-go-proof --platform ios --device "$device"
      - name: Record closed iOS host and Metro diagnostics
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ job.status }}" = failure ]; then
            node scripts/ci/native-host-evidence.mjs sample failure --platform ios
          fi
          node scripts/ci/native-host-evidence.mjs metro --platform ios
      # The iOS checks that need no development client run here, after the proof, so ios-build
      # stays a key lookup on most runs and the shards start minutes after the workflow does.
      - name: Provision pinned iOS accessibility browser
        id: ios_browser
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: npx --no-install playwright install chromium
      - name: Verify share-card harness and plugin suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - name: Check the iOS Maestro flows with the pinned CLI
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/ci/maestro-check-flows.mjs
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.ios_browser.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      - name: Verify native paragraph heading semantics
        if: ${{ !cancelled() }}
        run: bash scripts/ci/share-card-header-semantics.sh
      - name: Verify the iOS original PNG and cache-file guards
        id: png_file_guards
        if: ${{ !cancelled() }}
        # SwiftPM builds the validator from the checkout alone.
        run: |
          set -euo pipefail
          swift test --package-path apps/mobile/modules/share-card-photo-save/ios 2>&1 | tee "$RUNNER_TEMP/cc68-png-file-tests.log"
          # Some tests ran and none failed or was skipped: a skip changes the summary wording.
          summary=$(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' "$RUNNER_TEMP/cc68-png-file-tests.log" | tail -1 || true)
          count=$(echo "$summary" | grep -Eo '^Executed [0-9]+' | grep -Eo '[0-9]+' || true)
          failures=$(echo "$summary" | grep -Eo 'with [0-9]+' | grep -Eo '[0-9]+' || true)
          if [ "${count:-0}" -eq 0 ] || [ "${failures:-1}" -ne 0 ]; then echo "::error::swift test ran zero tests or had failures"; exit 1; fi
          echo "swift test ran $count tests"
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ios
          CC68_CI_API: 0
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect Expo Go evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-ios-expo-go
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
      - name: Show the native Supabase service logs
        if: ${{ !cancelled() && failure() }}
        run: node scripts/ci/native-supabase.mjs logs
      - name: Stop the owned native Supabase stack
        if: always()
        run: node scripts/ci/native-supabase.mjs stop
      - name: Delete owned CI simulator
        if: always()
        run: node scripts/ci/native-ios-device-cleanup.mjs

  # A skipped or partial shard has no complete report, so these jobs fail; the lanes gate also
  # requires their results.
  original-resource-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: original-resource
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-android-32-all-*
          path: /tmp/android32-shards
      - name: Require every API32 shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.original-resource.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/android32-shards/share-card-android-32-all-*; do mv "$artifact" "/tmp/android32-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-matrix-shards.mjs merge android-32 /tmp/android32-shards
  android36-matrix-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: android36-native-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-android-36-matrix-*
          path: /tmp/android-matrix-shards
      - name: Require every Android matrix shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.android36-native-matrix.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/android-matrix-shards/share-card-android-36-matrix-*; do mv "$artifact" "/tmp/android-matrix-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-matrix-shards.mjs merge android-36 /tmp/android-matrix-shards
  # A skipped shard has no report, so this job fails; the lanes gate also requires its result.
  ios-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: ios-shard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-ios-shard-*
          path: /tmp/ios-shards
      - name: Require every iOS shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.ios-shard.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/ios-shards/share-card-ios-shard-*; do mv "$artifact" "/tmp/ios-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-ios-shards.mjs merge /tmp/ios-shards
  # Not named gate: the required ruleset context gate is a commit status from pr-gate.yml,
  # and a check run with that name could satisfy or fail it independently.
  share-card-lanes-gate:
    name: share-card-lanes-gate
    if: always()
    needs:
      - original-resource
      - original-resource-evidence
      - ios-build
      - ios-shard
      - ios-evidence
      - ios-expo-go
      - browser-acceptance
      - android36-native-matrix
      - android36-matrix-evidence
      - android36-original
      - android36-controls
      - android36-interaction
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every native and browser lane
        env:
          CC68_JOB_RESULTS: ${{ toJSON(needs) }}
          CC68_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci/share-card-job-gate.mjs
