name: Share-card native originals
# Pull requests run the browser lane and the lanes gate only. Every device lane takes over an hour,
# so the Android lanes run on main, nightly and on demand, and the iOS lanes, which need macOS,
# nightly and on demand only (owner rule, 2026-11-13). The gate requires each skip where its
# condition skips it and a success everywhere else.
on:
  pull_request:
  # A merge to main once ran every device lane (10 jobs, 4 on macOS, 41 to 118 minutes), which
  # held half of the account's 20 concurrent jobs. The iOS lanes run in ios-native.yml, nightly
  # and on demand only (story 6.15 D6), so every lane here runs on Linux. It runs only when a
  # file the lanes build, run or read changed; the nightly run covers everything.
  # scripts/ci/share-card-paths.test.mjs checks the filter against representative inputs and the
  # last 20 commits on main.
  push:
    branches: [main]
    paths:
      # Root files: package.json, package-lock.json, tsconfig.json, app.json, .nvmrc.
      - '*'
      - '.nvmrc'
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - 'scripts/**'
      - 'maestro/**'
      - 'playwright/share-card.config.ts'
      - 'playwright/tests/share-card-*.spec.ts'
      - 'playwright/support/**'
      - '.github/actions/**'
      - '.github/workflows/pr-share-card-native.yml'
      - '!**/*.md'
      # App unit and integration tests run in other workflows, except the ones this workflow
      # runs: the share-card-plugins gate suite (scripts/ci/node-test-suites.json) and the
      # unit files of bridge-a11y.mjs (scripts/e2e-share-card/bridge-a11y-files.mjs).
      - '!apps/**/*.test.*'
      - '!apps/**/*.spec.*'
      - '!apps/api/integration/**'
      - 'apps/mobile/plugins/with-share-card-permissions.test.js'
      - 'apps/mobile/plugins/with-story68-release-network.test.js'
      - 'apps/mobile/components/share-card-composer.test.tsx'
      - 'apps/mobile/src/lib/share-card-focus.spec.ts'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  contents: read
# Each event has its own group: GitHub starts the 03:17 cron hours late, and a merge to main during
# it cancelled it (scheduled run 41435261779), which kept the README badge from turning green. A
# dispatch needs its own too, since the iOS lanes run only nightly and on demand.
concurrency:
  group: share-card-native-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true
jobs:
  # The lanes this push wakes (scripts/ci/lanes.mjs). Each job a lane gates needs this one and
  # is skipped when its lane is false; this job's summary says why. It installs nothing, so it
  # holds the jobs it gates for seconds.
  lanes:
    name: Lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      plan: ${{ steps.lanes.outputs.plan }}
      coverage_shards: ${{ steps.lanes.outputs.coverage_shards }}
    steps:
      - name: Checkout the lane map and workspace manifests
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            scripts/ci/lanes.mjs
            apps/*/package.json
            packages/*/package.json
          sparse-checkout-cone-mode: false

      - name: Plan the lanes
        id: lanes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANES_WORKFLOW: pr-share-card-native.yml
        run: node scripts/ci/lanes.mjs

  # The API32 journey runs as three shards (scripts/ci/native-matrix-shards.mjs), each on its own
  # emulator with its own services and sign-in. Run 41202706840 ran it as one 62.7 minute
  # journey in an 83 minute job, and two shards still took 30.4 and 34.0 minute journeys on main
  # run 41312266186. Shard 1 runs proof, pre-locale and rapid-watermark; shards 2 and 3 grant
  # storage and run the rest (26.7, 25.5 and 25.1 nominal minutes). The 45 minute budget still
  # holds on a runner 1.5x slower. original-resource-evidence proves every shard reported its
  # exact cases.
  original-resource:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 32
            target: google_apis
            suite: all-1
            journey_timeout: 45
          - os: ubuntu-latest
            platform: android
            api: 32
            target: google_apis
            suite: all-2
            journey_timeout: 45
          - os: ubuntu-latest
            platform: android
            api: 32
            target: google_apis
            suite: all-3
            journey_timeout: 45
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env: &runtime_env
      PLAYWRIGHT_SKIP_DB_RESET: 'true'
      CC68_HARNESS_DIR: _bmad-output/test-artifacts/story-6-8/runtime
      MAESTRO_CLI_NO_ANALYTICS: '1'
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: ./.github/actions/configure-ci-supabase-ports
      - uses: ./.github/actions/free-runner-disk
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images
      - uses: ./.github/actions/install
        id: install
      - name: Provision pinned share-card browser dependencies
        id: browser_deps
        if: matrix.platform == 'android'
        timeout-minutes: 12
        run: |
          node scripts/ci/node-test-gate.mjs browser-deps
          node scripts/ci/share-card-browser-deps.mjs --chromium-only
      # These suites need only the installed dependencies, so a browser, Supabase or
      # runtime failure cannot hide them. They follow the browser steps only so those
      # keep their plain platform conditions.
      - name: Verify share-card harness and plugin suites
        id: harness_suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        id: android_sdk
        if: ${{ !cancelled() && matrix.platform == 'android' }}
        with:
          packages: platform-tools
      # A restored client skips the Debug build, so the Gradle work left in the journey (the
      # share-sheet androidTest, the Release font build, the TalkBack androidTest) starts cold:
      # 13 minutes more in android36-interaction on run 41332254336. This restores Gradle's
      # dependencies and transforms; main writes the cache, every other ref reads it.
      - uses: gradle/actions/setup-gradle@v4
        id: gradle_cache
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify startup deadline controls
        id: deadline_controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - uses: ./.github/actions/start-local-supabase
        if: ${{ !cancelled() && steps.deadline_controls.outcome == 'success' }}
        id: supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Show the Supabase start log
        # The start's own log names the command that failed or hung. This workflow
        # uploads no log files (share-card-lanes.mjs), so it goes to the job log.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        run: tail -n 300 "$RUNNER_TEMP/supabase-start/start.log" || true
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup
      - name: Prepare isolated UUID runtime and built renderer
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status so an early crash is
          # reported by name instead of surfacing as an unrelated later failure.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform ${{ matrix.platform }} > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      - name: Verify the owned API database entry guard
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          npx vitest run scripts/lib/story68-api-entry.test.mjs --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/story68-api-entry.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/story68-api-entry.json`, 'utf8'))
          if (report.numTotalTests < 2 || report.numPassedTests !== report.numTotalTests ||
              report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
            throw new Error('Incomplete API entry guard execution')
          JS
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      # Most commits change no native input, so each lane restores the development client of its
      # native fingerprint and builds it only on a miss (scripts/ci/native-build-cache.mjs). The
      # client loads its JavaScript from this job's Metro, so the journey still tests this commit.
      - name: Key the native development client by its native inputs
        id: native_key
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.java.outcome == 'success' }}
        run: node scripts/ci/native-build-cache.mjs key --platform ${{ matrix.platform }} >> "$GITHUB_OUTPUT"
      - name: Generate native development client
        id: prebuild
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs prebuild --platform ${{ matrix.platform }}
      - name: Restore the development client of this fingerprint
        id: native_cache
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && steps.prebuild.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      - name: Verify fresh Worklets variant and ABI staging
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.prebuild.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs worklets-staging
      - name: Fetch the Gradle wrapper
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.prebuild.outcome == 'success' && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android
      - name: Build native development client
        id: native_build
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true' }}
        run: node scripts/run-story68-native.mjs build --platform ${{ matrix.platform }}
      - name: Verify modal status-bar styling on both Android SDK branches
        id: modal_system_bars
        # Robolectric compiles the module inside the generated Android project.
        # Its inputs are part of the fingerprint, so a restored client already passed it.
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.native_build.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :modal-system-bars:testDebugUnitTest --tests expo.modules.modalsystembars.ModalSystemBarsTest
          # Both SDK branches ran, and none was skipped.
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' ../modules/modal-system-bars/android/build/test-results/testDebugUnitTest/TEST-expo.modules.modalsystembars.ModalSystemBarsTest.xml
      - name: Verify the persisted task cleanup against the task manager restore
        id: task_manager_migration
        # P0-07: an install upgraded from SDK 54 must restore no retired task consumer.
        # Its inputs are part of the fingerprint, so a restored client already passed it.
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.native_build.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :task-manager-migration:testDebugUnitTest --tests expo.modules.taskmanagermigration.PersistedTaskConsumersTest
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' ../modules/task-manager-migration/android/build/test-results/testDebugUnitTest/TEST-expo.modules.taskmanagermigration.PersistedTaskConsumersTest.xml
      # A fork's pull request can restore this cache, so the APK is scanned like the iOS client:
      # only the publishable anon key of this job's loopback stack may ride along.
      - name: Refuse to cache a development client that embeds a secret
        id: apk_scan
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.modal_system_bars.outcome == 'success' && steps.task_manager_migration.outcome == 'success' }}
        run: |
          rm -rf "$RUNNER_TEMP/cc68-apk"
          unzip -q "${{ steps.native_key.outputs.path }}" -d "$RUNNER_TEMP/cc68-apk"
          node scripts/ci/native-ios-app-secret-scan.mjs "$RUNNER_TEMP/cc68-apk" "$CC68_HARNESS_DIR"
      - name: Save the development client of this fingerprint
        if: ${{ !cancelled() && steps.apk_scan.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      - name: Enable and verify Android hardware acceleration
        id: kvm
        if: ${{ !cancelled() && matrix.platform == 'android' }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the uevent; wait until the rule has applied before testing.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      - name: Android isolated native journey
        timeout-minutes: ${{ matrix.journey_timeout }}
        if: ${{ !cancelled() && matrix.platform == 'android' && (steps.native_build.outcome == 'success' || steps.native_cache.outputs.cache-hit == 'true') && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC68_ANDROID_API: ${{ matrix.api }}
          CC68_ANDROID_SUITE: ${{ matrix.suite }}
        with:
          api-level: ${{ matrix.api }}
          avd-name: cc68-api${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/ci/share-card-android.sh
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.suite }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
  # The API36 partitions run on separate free runners with no dependency on each
  # other. Each one prepares, signs in and cleans up its own UUID runtime, so they share
  # steps (the alias) but never state. API32 stays in original-resource above; this list
  # is its Android path.
  # The matrix runs as three shards (scripts/ci/native-matrix-shards.mjs), each on its own
  # emulator with its own services and sign-in. Two shards took 33.8 and 34.1 minute journeys on
  # main run 41312266186; three are 18.7, 19.2 and 18.0 nominal minutes, and the 35 minute budget
  # still holds on a runner 1.5x slower. android36-matrix-evidence proves every shard reported its
  # exact cases.
  android36-native-matrix:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: matrix-1
            journey_timeout: 35
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: matrix-2
            journey_timeout: 35
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: matrix-3
            journey_timeout: 35
    env: *runtime_env
    steps: &android36_steps
      - uses: actions/checkout@v4
        id: checkout
      - uses: ./.github/actions/configure-ci-supabase-ports
      - uses: ./.github/actions/free-runner-disk
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images
      - uses: ./.github/actions/install
        id: install
      - name: Provision pinned share-card browser dependencies
        id: browser_deps
        timeout-minutes: 12
        run: |
          node scripts/ci/node-test-gate.mjs browser-deps
          node scripts/ci/share-card-browser-deps.mjs --chromium-only
      - name: Verify share-card harness and plugin suites
        id: harness_suites
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          node scripts/ci/node-test-gate.mjs share-card-plugins
          node scripts/ci/node-test-gate.mjs native-harness
      - uses: actions/setup-java@v4
        if: ${{ !cancelled() }}
        id: java
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        id: android_sdk
        if: ${{ !cancelled() }}
        with:
          packages: platform-tools
      # A restored client skips the Debug build, so the Gradle work left (the share-receive APKs,
      # the Release font build, the TalkBack androidTest) starts cold: 13 minutes more in
      # android36-interaction on run 41332254336. This restores Gradle's dependencies and
      # transforms; main writes the cache, every other ref reads it.
      - uses: gradle/actions/setup-gradle@v4
        id: gradle_cache
        if: ${{ !cancelled() && steps.java.outcome == 'success' }}
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Verify startup deadline controls
        id: deadline_controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - uses: ./.github/actions/start-local-supabase
        if: ${{ !cancelled() && steps.deadline_controls.outcome == 'success' }}
        id: supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Show the Supabase start log
        # The start's own log names the command that failed or hung. This workflow
        # uploads no log files (share-card-lanes.mjs), so it goes to the job log.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        run: tail -n 300 "$RUNNER_TEMP/supabase-start/start.log" || true
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup
      - name: Prepare isolated UUID runtime and built renderer
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status so an early crash is
          # reported by name instead of surfacing as an unrelated later failure.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
          (node scripts/run-story68-native.mjs metro --platform android > /tmp/cc68-metro.log 2>&1; echo $? > /tmp/cc68-metro.exit) &
          node scripts/maestro-install.mjs
      - name: Verify the owned API database entry guard
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          npx vitest run scripts/lib/story68-api-entry.test.mjs --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/story68-api-entry.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/story68-api-entry.json`, 'utf8'))
          if (report.numTotalTests < 2 || report.numPassedTests !== report.numTotalTests ||
              report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
            throw new Error('Incomplete API entry guard execution')
          JS
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      # Most commits change no native input, so each lane restores the development client of its
      # native fingerprint and builds it only on a miss (scripts/ci/native-build-cache.mjs). The
      # client loads its JavaScript from this job's Metro, so the journey still tests this commit.
      - name: Key the native development client by its native inputs
        id: native_key
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.java.outcome == 'success' }}
        run: node scripts/ci/native-build-cache.mjs key --platform ${{ matrix.platform }} >> "$GITHUB_OUTPUT"
      - name: Generate native development client
        id: prebuild
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs prebuild --platform ${{ matrix.platform }}
      - name: Restore the development client of this fingerprint
        id: native_cache
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && steps.prebuild.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      - name: Verify fresh Worklets variant and ABI staging
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs worklets-staging
      - name: Fetch the Gradle wrapper
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.prebuild.outcome == 'success' && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true' }}
        run: bash scripts/ci/fetch-gradle-wrapper.sh apps/mobile/android
      - name: Build native development client
        id: native_build
        if: ${{ !cancelled() && steps.prebuild.outcome == 'success' && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' && steps.native_cache.outcome == 'success' && steps.native_cache.outputs.cache-hit != 'true' }}
        run: node scripts/run-story68-native.mjs build --platform ${{ matrix.platform }}
      - name: Verify modal status-bar styling on both Android SDK branches
        id: modal_system_bars
        # Robolectric compiles the module inside the generated Android project.
        # Its inputs are part of the fingerprint, so a restored client already passed it.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :modal-system-bars:testDebugUnitTest --tests expo.modules.modalsystembars.ModalSystemBarsTest
          # Both SDK branches ran, and none was skipped.
          grep -q 'tests="2" skipped="0" failures="0" errors="0"' ../modules/modal-system-bars/android/build/test-results/testDebugUnitTest/TEST-expo.modules.modalsystembars.ModalSystemBarsTest.xml
      - name: Verify the persisted task cleanup against the task manager restore
        id: task_manager_migration
        # P0-07: an install upgraded from SDK 54 must restore no retired task consumer.
        # Its inputs are part of the fingerprint, so a restored client already passed it.
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        working-directory: apps/mobile/android
        run: |
          ./gradlew --no-daemon --max-workers=2 :task-manager-migration:testDebugUnitTest --tests expo.modules.taskmanagermigration.PersistedTaskConsumersTest
          grep -q 'tests="3" skipped="0" failures="0" errors="0"' ../modules/task-manager-migration/android/build/test-results/testDebugUnitTest/TEST-expo.modules.taskmanagermigration.PersistedTaskConsumersTest.xml
      # A fork's pull request can restore this cache, so the APK is scanned like the iOS client:
      # only the publishable anon key of this job's loopback stack may ride along.
      - name: Refuse to cache a development client that embeds a secret
        id: apk_scan
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' && steps.modal_system_bars.outcome == 'success' && steps.task_manager_migration.outcome == 'success' }}
        run: |
          rm -rf "$RUNNER_TEMP/cc68-apk"
          unzip -q "${{ steps.native_key.outputs.path }}" -d "$RUNNER_TEMP/cc68-apk"
          node scripts/ci/native-ios-app-secret-scan.mjs "$RUNNER_TEMP/cc68-apk" "$CC68_HARNESS_DIR"
      - name: Save the development client of this fingerprint
        if: ${{ !cancelled() && steps.apk_scan.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.native_key.outputs.path }}
          key: ${{ steps.native_key.outputs.key }}
      # The share-sheet receive test needs two more Gradle builds: the module's androidTest APK and
      # the second app it shares to. Inside the journey they started cold and took about 11 of the
      # 17.1 share-sheet minutes on main run 41352898854. The lane that runs share-sheet builds them
      # here, before the emulator, and caches them with the manifests the test asserts, keyed by the
      # client's native key and the harness that names the Gradle tasks.
      - name: Key the share-receive APKs of the share-sheet lane
        id: share_receive_key
        if: ${{ !cancelled() && steps.native_key.outcome == 'success' && steps.prebuild.outcome == 'success' }}
        env:
          CC68_ANDROID_SUITE: ${{ matrix.suite }}
          CC68_SHARE_RECEIVE_KEY: ${{ steps.native_key.outputs.key }}-share-receive-${{ hashFiles('scripts/lib/story69-share-sheet.mjs') }}
        # Only the interaction suite runs share-sheet (scripts/ci/share-card-android.sh); every
        # other lane leaves the key empty and skips the share-receive steps.
        run: |
          if [ "$CC68_ANDROID_SUITE" = interaction ]; then
            echo "key=$CC68_SHARE_RECEIVE_KEY" >> "$GITHUB_OUTPUT"
          fi
      - name: Restore the share-receive APKs of this fingerprint
        id: share_receive_cache
        if: ${{ !cancelled() && steps.share_receive_key.outcome == 'success' && steps.share_receive_key.outputs.key != '' }}
        uses: actions/cache/restore@v4
        with:
          path: &share_receive_files |
            apps/mobile/modules/share-card-native-share/android/build/outputs/apk/androidTest/debug/share-card-native-share-debug-androidTest.apk
            apps/mobile/modules/share-card-native-share/android/test-receiver/build/outputs/apk/debug/test-receiver-debug.apk
            apps/mobile/modules/share-card-native-share/android/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml
            apps/mobile/modules/share-card-native-share/android/build/intermediates/packaged_manifests/debugAndroidTest/processDebugAndroidTestManifest/AndroidManifest.xml
          key: ${{ steps.share_receive_key.outputs.key }}
      # Built only for a journey that can run: a client restored or built on this runner.
      - name: Build the share-receive APKs
        id: share_receive_build
        if: ${{ !cancelled() && steps.share_receive_cache.outcome == 'success' && steps.share_receive_cache.outputs.cache-hit != 'true' && (steps.native_build.outcome == 'success' || steps.native_cache.outputs.cache-hit == 'true') && steps.java.outcome == 'success' && steps.android_sdk.outcome == 'success' }}
        run: node scripts/run-story68-native.mjs share-receive-build --platform ${{ matrix.platform }}
      # A fork's pull request can restore these like the client, so they are scanned the same way.
      - name: Refuse to cache share-receive APKs that embed a secret
        id: share_receive_scan
        if: ${{ !cancelled() && steps.share_receive_build.outcome == 'success' }}
        run: |
          rm -rf "$RUNNER_TEMP/cc69-share-receive"
          # unzip creates only the last directory of -d, so the scan root exists first.
          mkdir -p "$RUNNER_TEMP/cc69-share-receive/manifests"
          unzip -q apps/mobile/modules/share-card-native-share/android/build/outputs/apk/androidTest/debug/share-card-native-share-debug-androidTest.apk -d "$RUNNER_TEMP/cc69-share-receive/receive-test"
          unzip -q apps/mobile/modules/share-card-native-share/android/test-receiver/build/outputs/apk/debug/test-receiver-debug.apk -d "$RUNNER_TEMP/cc69-share-receive/receiver"
          cp apps/mobile/modules/share-card-native-share/android/build/intermediates/merged_manifest/debug/processDebugManifest/AndroidManifest.xml "$RUNNER_TEMP/cc69-share-receive/manifests/library.xml"
          cp apps/mobile/modules/share-card-native-share/android/build/intermediates/packaged_manifests/debugAndroidTest/processDebugAndroidTestManifest/AndroidManifest.xml "$RUNNER_TEMP/cc69-share-receive/manifests/android-test.xml"
          node scripts/ci/native-ios-app-secret-scan.mjs "$RUNNER_TEMP/cc69-share-receive" "$CC68_HARNESS_DIR"
      - name: Save the share-receive APKs of this fingerprint
        id: share_receive_save
        if: ${{ !cancelled() && steps.share_receive_scan.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          path: *share_receive_files
          key: ${{ steps.share_receive_key.outputs.key }}
      - name: Enable and verify Android hardware acceleration
        id: kvm
        if: ${{ !cancelled() }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          # trigger only queues the uevent; wait until the rule has applied before testing.
          sudo udevadm settle --timeout=30
          ls -l /dev/kvm
          test -r /dev/kvm && test -w /dev/kvm
      # The share-sheet lane runs only with both share-receive APKs restored or built and scanned;
      # CC68_SHARE_RECEIVE_PREBUILT tells share-sheet to install them without building.
      - name: Android isolated native journey
        timeout-minutes: ${{ matrix.journey_timeout }}
        if: ${{ !cancelled() && (steps.native_build.outcome == 'success' || steps.native_cache.outputs.cache-hit == 'true') && steps.share_receive_key.outcome == 'success' && (steps.share_receive_key.outputs.key == '' || steps.share_receive_cache.outputs.cache-hit == 'true' || steps.share_receive_save.outcome == 'success') && steps.kvm.outcome == 'success' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CC68_ANDROID_API: ${{ matrix.api }}
          CC68_ANDROID_SUITE: ${{ matrix.suite }}
          CC68_SHARE_RECEIVE_PREBUILT: ${{ (steps.share_receive_cache.outputs.cache-hit == 'true' || steps.share_receive_save.outcome == 'success') && '1' || '0' }}
        with:
          api-level: ${{ matrix.api }}
          avd-name: cc68-api${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-linux-hw-accel: false
          disable-animations: true
          script: bash scripts/ci/share-card-android.sh
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api metro; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.suite }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
  android36-original:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: original
            journey_timeout: 25
    env: *runtime_env
    steps: *android36_steps
  # The rapid watermark, TalkBack and fallback focus proofs. Run 41202706840 ran them in 6.5
  # minutes after an emulator, install and sign-in setup of 5.5 (12.0 in all).
  android36-controls:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: controls
            journey_timeout: 25
    env: *runtime_env
    steps: *android36_steps
  # Story 6.9 share-sheet. On main run 41352898854 this lane also ran the Release font proof and
  # took 48 minutes: setup 10.5, emulator boot, install, open and signin 7, share-sheet 17.1 (about
  # 11 of it the two share-receive Gradle builds, cold) and the Release font proof 13. The proof
  # now runs in android36-release-font and the share-receive APKs come from their cache, so this
  # lane takes about 24 minutes on a hit. A miss builds them before the emulator starts.
  android36-interaction:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: interaction
            journey_timeout: 30
    env: *runtime_env
    steps: *android36_steps
  # The Release font proof on its own emulator. On main run 41352898854 it took 13 minutes inside
  # android36-interaction: about 11 for the Release prebuild --clean and Gradle build, then the
  # install and the proof. Every suite first spends about 17.5 minutes on setup (10.5) and the
  # emulator boot, install, open and signin (7), so this lane takes about 30 minutes.
  android36-release-font:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
            api: 36
            target: google_apis_playstore
            suite: release-font
            journey_timeout: 35
    env: *runtime_env
    steps: *android36_steps
  # The one lane a pull request runs, and only when its diff touches a file the lane builds,
  # runs or reads (the share-card lane of scripts/ci/lanes.mjs); every other event runs it.
  browser-acceptance:
    needs: lanes
    if: fromJSON(needs.lanes.outputs.plan)['share-card']
    runs-on: ubuntu-latest
    # 14.5 minutes at p50, 17.6 at p95, 17.7 at most (last 20 runs, 2026-11-12). The
    # steps that have stalled (install, browser dependencies, Supabase, the matrix)
    # each stop on their own limit first.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            api: 36
            suite: browser
    env: *runtime_env
    steps:
      - uses: actions/checkout@v4
        id: checkout
      - uses: ./.github/actions/configure-ci-supabase-ports
      - uses: ./.github/actions/free-runner-disk
      # Loads the cached Supabase images while the dependencies install.
      - name: Preload the Supabase images
        uses: ./.github/actions/preload-supabase-images
      - uses: ./.github/actions/install
        id: install
        # 1.3 minutes at p50, 6.2 at most.
        timeout-minutes: 8
      # These suites need only the installed dependencies, so they run in the background
      # while the browsers, Supabase and the runtime are prepared (about 2 minutes saved).
      # The collect step before the bridge reports them.
      - name: Start share-card harness and plugin suites in the background
        id: harness_start
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs --start share-card-plugins native-harness
      # The browsers' Ubuntu package files, restored only by the exact key of the package
      # list Playwright pins, so a hit downloads none of them. A miss saves them once the
      # step succeeds; a failed install drops them before its retry (apt-install.sh).
      - name: Key the Ubuntu package cache
        id: ubuntu_packages_key
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/ubuntu-package-cache.mjs >> "$GITHUB_OUTPUT"
      - name: Restore the Ubuntu package files
        id: ubuntu_packages_cache
        if: ${{ !cancelled() && steps.ubuntu_packages_key.outcome == 'success' }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.ubuntu_packages_key.outputs.key }}
          path: ${{ steps.ubuntu_packages_key.outputs.path }}/*.deb
      - name: Provision pinned share-card browser dependencies
        id: browser_deps
        if: ${{ !cancelled() && matrix.platform == 'android' && steps.install.outcome == 'success' }}
        timeout-minutes: 12
        env:
          APT_INSTALL_ARCHIVES: ${{ steps.ubuntu_packages_key.outputs.path }}
        run: |
          node scripts/ci/node-test-gate.mjs browser-deps
          node scripts/ci/share-card-browser-deps.mjs
      - name: Save the Ubuntu package files
        if: ${{ !cancelled() && steps.ubuntu_packages_key.outcome == 'success' && steps.ubuntu_packages_cache.outputs.cache-hit != 'true' && steps.browser_deps.outcome == 'success' }}
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.ubuntu_packages_key.outputs.key }}
          path: ${{ steps.ubuntu_packages_key.outputs.path }}/*.deb
      - name: Verify startup deadline controls
        id: deadline_controls
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: node scripts/ci/node-test-gate.mjs startup-deadline
      - uses: ./.github/actions/start-local-supabase
        if: ${{ !cancelled() && steps.deadline_controls.outcome == 'success' }}
        id: supabase
        # Normal start 2 minutes (p95 2.4, 300 runs); a stuck one fails here, named.
        timeout-minutes: 10

      - name: Show the Supabase start log
        # The start's own log names the command that failed or hung. This workflow
        # uploads no log files (share-card-lanes.mjs), so it goes to the job log.
        if: ${{ !cancelled() && steps.supabase.outcome == 'failure' }}
        run: tail -n 300 "$RUNNER_TEMP/supabase-start/start.log" || true
      - name: Stop the Supabase containers a failed start left
        # The start stops what each failed attempt leaves, unless its budget or the
        # step timeout ended it first; this clears the rest.
        if: ${{ always() && steps.supabase.outcome == 'failure' }}
        timeout-minutes: 2
        run: timeout --kill-after=10 90 npx supabase stop --no-backup
      - name: Prepare isolated UUID runtime and built renderer
        if: ${{ !cancelled() && steps.supabase.outcome == 'success' }}
        id: runtime
        run: |
          npm run db:generate
          npm run build:packages
          npm run build --workspace api
          node scripts/e2e-share-card/prepare.mjs
          node scripts/lib/story68-built-render.mjs
          # Each long-running service records its exit status so an early crash is
          # reported by name instead of surfacing as an unrelated later failure.
          (node scripts/e2e-share-card/auth.mjs > /tmp/cc68-auth.log 2>&1; echo $? > /tmp/cc68-auth.exit) &
          (node scripts/run-story68-native.mjs serve > /tmp/cc68-api.log 2>&1; echo $? > /tmp/cc68-api.exit) &
      - name: Verify the owned API database entry guard
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' }}
        run: |
          npx vitest run scripts/lib/story68-api-entry.test.mjs --reporter=default --reporter=json --outputFile="$RUNNER_TEMP/story68-api-entry.json"
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          const report = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/story68-api-entry.json`, 'utf8'))
          if (report.numTotalTests < 2 || report.numPassedTests !== report.numTotalTests ||
              report.numPendingTests !== 0 || report.numFailedTests !== 0 || report.numTodoTests !== 0)
            throw new Error('Incomplete API entry guard execution')
          JS
      # Waits only on its start step, so a browser, Supabase or runtime failure cannot
      # hide a harness failure. It runs before the bridge and the matrix need the CPU.
      - name: Verify share-card harness and plugin suites
        id: harness_collect
        if: ${{ !cancelled() && steps.harness_start.outcome == 'success' }}
        timeout-minutes: 12
        run: node scripts/ci/node-test-gate.mjs --collect share-card-plugins native-harness
      # The device lanes run this too, but they skip pull requests. Running it here makes
      # a test title change (a Vitest upgrade reformatting test.each names) fail the PR.
      - name: Verify localized native accessibility announcements and focus bridge
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        run: |
          node scripts/e2e-share-card/bridge-a11y.mjs
      - name: Genuine browser share-card acceptance matrix
        # 7.0 minutes at p50, 8.7 at p95, 9.0 at most.
        timeout-minutes: 12
        if: ${{ !cancelled() && steps.runtime.outcome == 'success' && steps.browser_deps.outcome == 'success' }}
        run: |
          # A production build served by next start: no route compiles during the matrix.
          node scripts/e2e-share-card/web.mjs build
          node scripts/e2e-share-card/web.mjs start > "$CC68_HARNESS_DIR/web-startup-private.log" 2>&1 &
          node scripts/e2e-share-card/wait-web.mjs
          npx playwright test --config playwright/share-card.config.ts
          node scripts/e2e-share-card/assert-web-matrix.mjs
      - name: Report owned background service exits
        if: always()
        # Logs stay private: they can carry owned-runtime credentials.
        run: |
          status=0
          for service in auth api; do
            if [ -f "/tmp/cc68-$service.exit" ]; then
              echo "::error::owned $service service exited early with status $(cat "/tmp/cc68-$service.exit"); its private log has $(wc -l < "/tmp/cc68-$service.log") lines"
              status=1
            fi
          done
          exit "$status"
      - name: Select and scan closed evidence
        if: always()
        env:
          CC68_CI_PLATFORM: ${{ matrix.platform }}
          CC68_CI_API: ${{ matrix.api }}
          CC68_CI_JOB_STATUS: ${{ job.status }}
        run: node scripts/e2e-share-card/public-evidence.mjs
      - name: Collect original PNG proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-${{ matrix.platform }}-${{ matrix.api }}-${{ matrix.suite }}
          path: _bmad-output/test-artifacts/story-6-8/runtime/public-evidence/
          if-no-files-found: error
      - name: Clean exact owned runtime
        if: always()
        run: node scripts/e2e-share-card/cleanup.mjs
  # The iOS journey, its development client and the Expo Go proof run in ios-native-jobs.yml,
  # nightly and on demand only (story 6.15 D6).
  # A skipped or partial shard has no complete report, so these jobs fail; the lanes gate also
  # requires their results.
  original-resource-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: original-resource
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-android-32-all-*
          path: /tmp/android32-shards
      - name: Require every API32 shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.original-resource.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/android32-shards/share-card-android-32-all-*; do mv "$artifact" "/tmp/android32-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-matrix-shards.mjs merge android-32 /tmp/android32-shards
  android36-matrix-evidence:
    if: always() && github.event_name != 'pull_request'
    needs: android36-native-matrix
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: share-card-android-36-matrix-*
          path: /tmp/android-matrix-shards
      - name: Require every Android matrix shard to report its exact cases
        env:
          CC68_SHARD_RESULT: ${{ needs.android36-native-matrix.result }}
        run: |
          test "$CC68_SHARD_RESULT" = success
          for artifact in /tmp/android-matrix-shards/share-card-android-36-matrix-*; do mv "$artifact" "/tmp/android-matrix-shards/shard-${artifact##*-}"; done
          node scripts/ci/native-matrix-shards.mjs merge android-36 /tmp/android-matrix-shards
  # Not named gate: the required ruleset context gate is a commit status from pr-gate.yml,
  # and a check run with that name could satisfy or fail it independently.
  share-card-lanes-gate:
    name: share-card-lanes-gate
    if: always()
    needs:
      - original-resource
      - original-resource-evidence
      - browser-acceptance
      - android36-native-matrix
      - android36-matrix-evidence
      - android36-original
      - android36-controls
      - android36-interaction
      - android36-release-font
      # Only for its plan: a pull request may skip browser-acceptance when the plan did.
      - lanes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every native and browser lane
        env:
          CC68_JOB_RESULTS: ${{ toJSON(needs) }}
          CC68_EVENT_NAME: ${{ github.event_name }}
          CC68_LANE_PLAN: ${{ needs.lanes.outputs.plan }}
        run: node scripts/ci/share-card-job-gate.mjs
