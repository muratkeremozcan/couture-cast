name: "Reusable E2E (Playwright)"
run-name: E2E - ${{ inputs.test_env }} - ${{ inputs.test_command }}

on:
  workflow_call:
    inputs:
      test_env:
        type: string
        description: "Test environment (local|preview|prod)"
        required: true
      test_command:
        type: string
        description: "Playwright command to run (e.g., npm run test:pw-preview)"
        required: true
      gh_ref:
        type: string
        description: "Ref to checkout"
        required: false
        default: ${{ github.sha }}
      custom_base_url:
        type: string
        description: "Optional override for base URL"
        required: false
      custom_api_base_url:
        type: string
        description: "Optional override for API base URL"
        required: false
      deployment_ref:
        type: string
        description: "Git ref from deployment event (branch name)"
        required: false
      vercel_web_project_slug:
        type: string
        description: "Vercel web project slug used for Preview URL resolution"
        required: false
        default: couture-cast-web
      vercel_api_project_slug:
        type: string
        description: "Vercel API project slug used for Preview URL resolution"
        required: false
        default: couture-cast-api
      vercel_team_slug:
        type: string
        description: "Vercel team slug used for Preview URL resolution"
        required: false
        default: muratkeremozcans-projects
      realtime_probe:
        type: boolean
        description: "Story 6.5 O1 hosted realtime probe run (preview only)"
        required: false
        default: false
    secrets:
      VERCEL_AUTOMATION_BYPASS_SECRET:
        required: false
      VERCEL_TOKEN:
        required: false
      DATABASE_URL_PROD:
        required: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    # The O1 probe holds one socket through the server's 295 s recycle (about 8 minutes).
    # A local run starts Supabase: its 600 s start budget plus about 3 min of
    # image cache on top of the full unsharded Playwright suite, which runs
    # about twice one pr-pw-e2e-local shard's 9.1 min peak. Preview runs start
    # nothing locally and keep their budgets.
    timeout-minutes: ${{ inputs.test_env == 'local' && 40 || inputs.realtime_probe && 30 || 20 }}
    env:
      LOCAL_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.gh_ref }}

      - name: Resolve expected SHA
        id: expected_sha
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Setup Node + deps
        uses: ./.github/actions/install

      - name: Setup Playwright browsers
        uses: ./.github/actions/setup-playwright-browsers

      - name: Start local Supabase services
        if: inputs.test_env == 'local'
        uses: ./.github/actions/start-local-supabase

      - name: Reset local E2E database
        if: inputs.test_env == 'local'
        run: npm run db:reset
        env:
          DATABASE_URL: ${{ env.LOCAL_DATABASE_URL }}

      - name: Resolve branch name from SHA
        id: resolve_branch
        if: inputs.deployment_ref != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # Inputs travel through env so a dispatched value cannot inject shell.
          INPUT_GH_REF: ${{ inputs.gh_ref }}
          INPUT_DEPLOYMENT_REF: ${{ inputs.deployment_ref }}
        run: |
          # deployment_ref might be a SHA, not a branch name
          # Query GitHub API to find which branch has this commit as HEAD
          sha="$INPUT_GH_REF"
          deployment_ref="$INPUT_DEPLOYMENT_REF"

          branch_name=""

          # If deployment_ref looks like a branch name (not a 40-char hex), use it directly
          if [[ "$deployment_ref" =~ ^[a-f0-9]{40}$ ]]; then
            echo "deployment_ref is a SHA, querying GitHub for branch name..."
            # Query GitHub API for branches where this SHA is HEAD
            branch_name=$(gh api "/repos/${{ github.repository }}/commits/${sha}/branches-where-head" --jq '.[0].name' 2>/dev/null || true)

            # Fallback: check if this is a PR and get head ref
            if [ -z "$branch_name" ]; then
              # Try to find PR associated with this SHA
              pr_branch=$(gh api "/repos/${{ github.repository }}/commits/${sha}/pulls" --jq '.[0].head.ref' 2>/dev/null || true)
              if [ -n "$pr_branch" ]; then
                branch_name="$pr_branch"
              fi
            fi
          else
            # deployment_ref is already a branch name
            branch_name="$deployment_ref"
          fi

          echo "Resolved branch name: $branch_name"
          echo "branch=$branch_name" >> "$GITHUB_OUTPUT"

      - name: Run Playwright
        shell: bash
        env:
          TEST_ENV: ${{ inputs.test_env }}
          # Prod only: preview runs execute PR code and must not hold the prod credential.
          DATABASE_URL_PROD: ${{ inputs.test_env == 'prod' && secrets.DATABASE_URL_PROD || '' }}
          EXPECTED_SHA: ${{ steps.expected_sha.outputs.sha }}
          GITHUB_SHA: ${{ steps.expected_sha.outputs.sha }}
          GH_TOKEN: ${{ github.token }}
          # Preview only: production is not behind Vercel protection, and the
          # preview config turns traces off whenever this is set because the
          # bypass cookie it mints would be recorded in them.
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ inputs.test_env == 'preview' && secrets.VERCEL_AUTOMATION_BYPASS_SECRET || '' }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # O1 probe run only (opt-in for community-engagement-preview.spec.ts). The ids are
          # non-secret repository variables: stable probe identities the owner targets with
          # the community_read_enabled flag. PREVIEW_WEB_FIXTURE_AUTH enables the browser half.
          O1_REALTIME_PROBE: ${{ inputs.test_env == 'preview' && inputs.realtime_probe && '1' || '' }}
          PROBE_READER_USER_ID: ${{ inputs.test_env == 'preview' && inputs.realtime_probe && vars.PREVIEW_PROBE_READER_USER_ID || '' }}
          PROBE_WRITER_USER_ID: ${{ inputs.test_env == 'preview' && inputs.realtime_probe && vars.PREVIEW_PROBE_WRITER_USER_ID || '' }}
          PREVIEW_WEB_FIXTURE_AUTH: ${{ inputs.test_env == 'preview' && inputs.realtime_probe && vars.PREVIEW_WEB_FIXTURE_AUTH || '' }}
          VERCEL_WEB_PROJECT_SLUG: ${{ inputs.vercel_web_project_slug }}
          VERCEL_API_PROJECT_SLUG: ${{ inputs.vercel_api_project_slug }}
          VERCEL_TEAM_SLUG: ${{ inputs.vercel_team_slug }}
          # Pass resolved branch name for URL construction
          VERCEL_GIT_COMMIT_REF: ${{ steps.resolve_branch.outputs.branch }}
          # Enable debug logging for URL resolution scripts
          DEBUG: true
          # Fallback resolution inside this 20-minute job polls for the commit's
          # deployment for at most two minutes, then uses the branch alias.
          RESOLVE_SHA_TIMEOUT_SECONDS: '120'
          # Dispatch inputs travel through env so they cannot inject shell.
          CUSTOM_BASE_URL: ${{ inputs.custom_base_url }}
          CUSTOM_API_BASE_URL: ${{ inputs.custom_api_base_url }}
        run: |
          case "$TEST_ENV" in
            local) export DATABASE_URL="${LOCAL_DATABASE_URL}" ;;
            prod) export DATABASE_URL="${DATABASE_URL_PROD}" ;;
            # Preview runs have no direct database access by design; specs that
            # need one skip themselves. No preview database secret exists.
            preview) unset DATABASE_URL ;;
            *)
              echo "Unsupported TEST_ENV=$TEST_ENV. Expected local, preview, or prod."
              exit 1
              ;;
          esac

          if [ "$TEST_ENV" != "preview" ] && [ -z "$DATABASE_URL" ]; then
            echo "Warning: DATABASE_URL is empty for TEST_ENV=$TEST_ENV"
          fi

          custom_base_url="$CUSTOM_BASE_URL"
          custom_api_base_url="$CUSTOM_API_BASE_URL"
          # Callers can pin the exact URLs they already resolved and waited for.
          # That is stronger than letting the test command rediscover previews on its own.
          if [ -n "$custom_base_url" ]; then
            case "$TEST_ENV" in
              local) export WEB_E2E_BASE_URL="$custom_base_url" ;;
              preview)
                export PREVIEW_WEB_E2E_BASE_URL="$custom_base_url"
                ;;
              prod) export PROD_WEB_E2E_BASE_URL="$custom_base_url" ;;
            esac
          fi

          if [ -n "$custom_api_base_url" ]; then
            case "$TEST_ENV" in
              local) export API_BASE_URL="$custom_api_base_url" ;;
              preview)
                export PREVIEW_API_BASE_URL="$custom_api_base_url"
                export VERCEL_API_BASE_URL="$custom_api_base_url"
                export VERCEL_API_BRANCH_URL="$custom_api_base_url"
                ;;
              prod) export PROD_API_BASE_URL="$custom_api_base_url" ;;
            esac
          elif [ "$TEST_ENV" = "preview" ] && [ -z "$PREVIEW_API_BASE_URL" ] && [ -z "$VERCEL_API_BASE_URL" ]; then
            # Fallback path: if the caller did not pin an API preview URL, resolve one
            # here so preview tests still have an API origin to target.
            echo "Resolving API URL via Vercel REST API..."
            if api_url=$(node scripts/resolve-api-preview-url.mjs) && [ -n "$api_url" ]; then
              echo "Resolved API URL: $api_url"
              export PREVIEW_API_BASE_URL="$api_url"
              export VERCEL_API_BASE_URL="$api_url"
              export VERCEL_API_BRANCH_URL="$api_url"
            else
              echo "Warning: Could not resolve API URL from Vercel API"
            fi
          fi

          # DEBUG env var already set at workflow level
          ${{ inputs.test_command }}

      # Blocks the upload when a report or trace carries a secret this job
      # holds. Fails closed: if the scan cannot run, nothing is uploaded.
      - name: Check Playwright artifacts for secret values
        id: secret_scan
        if: always()
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          # Same scoping as the run step: preview never holds the prod credential.
          DATABASE_URL_PROD: ${{ inputs.test_env == 'prod' && secrets.DATABASE_URL_PROD || '' }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/check-artifact-secrets.mjs
          --names VERCEL_AUTOMATION_BYPASS_SECRET,VERCEL_TOKEN,DATABASE_URL_PROD,GH_TOKEN
          --storage-state playwright/.auth/vercel-bypass.json
          playwright/artifacts playwright/playwright-report

      - name: Upload Playwright artifacts
        if: always() && steps.secret_scan.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: pw-artifacts-${{ inputs.test_env }}
          path: |
            playwright/artifacts/**
            playwright/playwright-report/**
          retention-days: 5
