name: Reserve the local Supabase host ports
description: >-
  Add every host port supabase/config.toml assigns to
  net.ipv4.ip_local_reserved_ports, so the kernel never hands one to an
  outgoing connection as its local port. The ports (5432x) sit inside Linux's
  ephemeral range (32768-60999), and a client socket on one makes Docker's bind
  of 0.0.0.0:<port> fail with "address already in use" (mobile e2e run
  40162761978 lost a shard to that on 54322). A reservation only steers new
  connections; a socket opened before it keeps its port until it closes. Run
  this as the first step after checkout in every job that starts local
  Supabase, since a local action needs the checkout and every later step adds
  network traffic. start-local-supabase runs it again, which changes nothing
  when the ports are already reserved.

runs:
  using: composite
  steps:
    - name: Reserve the Supabase host ports from ephemeral use
      shell: bash
      run: |
        set -u -o pipefail
        mapfile -t ports < <(
          grep -E '^[[:space:]]*(shadow_)?port[[:space:]]*=[[:space:]]*[0-9]+' supabase/config.toml |
            grep -oE '[0-9]+' | sort -un
        )
        if [ "${#ports[@]}" -eq 0 ]; then
          echo "::warning::supabase/config.toml assigns no host ports to reserve."
          exit 0
        fi
        if [ "$(uname -s)" != Linux ] || ! sudo -n true 2> /dev/null; then
          echo "::warning::Reserving the Supabase host ports needs Linux and passwordless sudo; skipped."
          exit 0
        fi

        # The sysctl holds a comma list of ports and lo-hi ranges.
        reserved="$(sysctl -n net.ipv4.ip_local_reserved_ports 2> /dev/null || true)"
        IFS=, read -r -a entries <<< "${reserved// /}"
        missing=()
        for port in "${ports[@]}"; do
          covered=false
          for entry in "${entries[@]}"; do
            [ -n "$entry" ] || continue
            if [ "$port" -ge "${entry%-*}" ] && [ "$port" -le "${entry#*-}" ]; then
              covered=true
              break
            fi
          done
          if [ "$covered" = false ]; then missing+=("$port"); fi
        done

        if [ "${#missing[@]}" -eq 0 ]; then
          echo "The Supabase host ports are already reserved: ${reserved}."
          exit 0
        fi
        additions="$(IFS=,; echo "${missing[*]}")"
        # Existing reservations stay; the new ports are appended.
        if sudo -n sysctl -q -w "net.ipv4.ip_local_reserved_ports=${reserved:+${reserved},}${additions}"; then
          echo "Reserved the Supabase host ports from ephemeral use: ${additions}."
        else
          echo "::warning::Could not reserve the Supabase host ports ${additions}."
        fi
