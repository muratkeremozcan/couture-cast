name: Mobile e2e report and comment

# IMPORTANT: Check out the repo before using this action, and run it from a job
# that `needs:` the sharded Maestro job so every shard has finished uploading.
description: 'Summarise the sharded Maestro run from its JUnit reports, write a step summary, and post a sticky PR comment'

# ─── Why this exists ───────────────────────────────────────────────────
#
# Every other tier in this repo reports itself on the pull request. The mobile
# suite did not: four sharded Android jobs each uploaded an artifact and the
# only signal on the PR was a red or green check, so learning WHICH flow broke
# meant opening four zips. This closes that gap with the same shape the other
# report actions use -- a sticky comment keyed by an HTML marker, a step
# summary, and a status derived from evidence rather than from a job result.
#
# The evidence is the JUnit reports the suite already writes. The job result is
# used only as a second opinion: a shard that died before Maestro ran (emulator
# boot failure, install failure) leaves no report at all, and reporting SUCCESS
# over zero flows is exactly the hollow green this suite was cleaned of.

inputs:
  artifact-pattern:
    description: 'Artifact name pattern for the per-shard Maestro artifacts'
    required: false
    default: 'android-test-results-shard-*'
  artifacts-path:
    description: 'Directory to download the shard artifacts into'
    required: false
    default: 'mobile-e2e-artifacts'
  suite-result:
    description: 'Result of the sharded Maestro job (success/failure/cancelled/skipped)'
    required: true
  shards:
    description: 'Number of shards the suite was split across'
    required: false
    default: '4'
  platform:
    description: 'Platform label for the summary/comment'
    required: false
    default: 'Android'
  device-label:
    description: 'Device description for the summary/comment (API level, profile)'
    required: false
    default: ''
  comment-on-pr:
    description: 'Whether to post a PR comment'
    required: false
    default: 'true'
  github-token:
    description: 'Token to use for GitHub API (pass GITHUB_TOKEN)'
    required: false
    default: ''

outputs:
  passed:
    description: 'Number of flows the reports recorded as passed'
    value: ${{ steps.summarize.outputs.passed }}
  failed:
    description: 'Number of flows the reports recorded as failed'
    value: ${{ steps.summarize.outputs.failed }}
  total:
    description: 'Number of flows described by the reports'
    value: ${{ steps.summarize.outputs.total }}
  has-results:
    description: 'Whether any JUnit report was found at all'
    value: ${{ steps.summarize.outputs.has_results }}

runs:
  using: composite
  steps:
    # Unmerged on purpose: `merge-multiple: true` would flatten every shard into
    # one directory, and per-flow report filenames are identical across shards,
    # so the last writer would win and flows would silently vanish from the
    # count. Keeping one directory per artifact also leaves the shard number in
    # the path, which is how the summariser attributes a flow to its shard.
    - name: Download shard artifacts
      uses: actions/download-artifact@v4
      continue-on-error: true
      with:
        path: ${{ inputs.artifacts-path }}
        pattern: ${{ inputs.artifact-pattern }}

    # No `npm ci` here. The summariser uses only Node builtins, so this job
    # needs a checkout and nothing else, which keeps the reporting job at well
    # under a minute rather than paying an install to print a table.
    - name: Summarise Maestro reports
      id: summarize
      shell: bash
      env:
        ARTIFACTS_PATH: ${{ inputs.artifacts-path }}
      run: |
        set -euo pipefail
        if [ ! -d "${ARTIFACTS_PATH}" ]; then
          echo "No shard artifacts were downloaded; creating an empty directory so the summariser reports zero flows."
          mkdir -p "${ARTIFACTS_PATH}"
        fi
        node scripts/summarize-maestro-junit.mjs "${ARTIFACTS_PATH}" > "${RUNNER_TEMP}/maestro-summary.json"
        node scripts/summarize-maestro-junit.mjs "${ARTIFACTS_PATH}" --pretty
        echo "summary_path=${RUNNER_TEMP}/maestro-summary.json" >> "$GITHUB_OUTPUT"
        node -e "
        const fs = require('fs');
        const s = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/maestro-summary.json', 'utf8'));
        fs.appendFileSync(process.env.GITHUB_OUTPUT, [
          'total=' + s.totals.total,
          'passed=' + s.totals.passed,
          'failed=' + s.totals.failed,
          'skipped=' + s.totals.skipped,
          'shards_seen=' + s.shards.length,
          'has_results=' + (s.totals.total > 0),
          '',
        ].join('\n'));
        "

    - name: Build report body
      id: report
      uses: actions/github-script@v7
      env:
        SUMMARY_PATH: ${{ steps.summarize.outputs.summary_path }}
        INPUT_SUITE_RESULT: ${{ inputs.suite-result }}
        INPUT_SHARDS: ${{ inputs.shards }}
        INPUT_PLATFORM: ${{ inputs.platform }}
        INPUT_DEVICE_LABEL: ${{ inputs.device-label }}
        INPUT_ARTIFACT_PATTERN: ${{ inputs.artifact-pattern }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const fs = require('fs');
          const summary = JSON.parse(fs.readFileSync(process.env.SUMMARY_PATH, 'utf8'));
          const { totals, shards, flows } = summary;

          const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;

          // Link the artifacts the shards already uploaded rather than
          // re-uploading a merged copy. A Maestro artifact carries screenshots
          // and a full debug dump per flow, so merging four of them would
          // duplicate hundreds of megabytes to gain nothing a per-shard link
          // does not already give.
          const pattern = new RegExp(
            '^' + process.env.INPUT_ARTIFACT_PATTERN.replace(/[.+?^${}()|[\]\\]/g, '\\$&').replace(/\*/g, '.*') + '$'
          );
          let artifactLinks = [];
          try {
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
              per_page: 100,
            });
            artifactLinks = artifacts
              .filter((a) => pattern.test(a.name))
              .sort((a, b) => a.name.localeCompare(b.name))
              .map((a) => {
                const shard = /shard-(\d+)/.exec(a.name)?.[1];
                const label = shard ? `shard ${shard}` : a.name;
                return `[${label}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}/artifacts/${a.id})`;
              });
          } catch (e) {
            core.warning(`Could not list run artifacts: ${e.message}`);
          }

          const suiteResult = process.env.INPUT_SUITE_RESULT.toLowerCase();

          // Green needs BOTH: reports that describe passing flows, and a job
          // that did not fail. Reports alone would call a run green when a
          // shard died before writing one; the job result alone is the exit
          // code this suite has learned not to trust on its own.
          const hasResults = totals.total > 0;

          // And every shard has to be accounted for. A green matrix over three
          // shards' worth of reports is a suite that silently ran three
          // quarters of itself, which no other check here would catch: the
          // download is a single step, so an artifact missing from it leaves no
          // failure behind, only a smaller flow count.
          //
          // The exemption is real rather than defensive. `workflow_dispatch`
          // with `suite: smoke` hands three flows to four shards, and the
          // workflow's own "Resolve this shard's flow list" step treats an empty
          // shard as legitimate exactly when there are fewer flows than shards
          // and as a hard error otherwise. Same rule, same shape, applied to the
          // evidence: only demand full coverage of a run big enough to fill
          // every shard.
          const expectedShards = Number(process.env.INPUT_SHARDS) || 0;
          const shardsExpectedToReport =
            expectedShards > 0 && totals.total < expectedShards ? totals.total : expectedShards;
          const shardsMissing = Math.max(0, shardsExpectedToReport - shards.length);

          const isSuccess =
            hasResults &&
            shardsMissing === 0 &&
            totals.failed === 0 &&
            totals.skipped === 0 &&
            suiteResult === 'success';
          const statusEmoji = isSuccess ? '✅' : '❌';
          const statusText = isSuccess ? 'SUCCESS' : 'FAILURE';

          const duration = (seconds) => {
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            return mins > 0 ? `${mins}m ${secs}s` : `${secs}s`;
          };

          const cell = (value) =>
            String(value ?? '').replace(/\|/g, '\\|').replace(/\r?\n/g, ' ').trim();

          const truncate = (value, max) =>
            value.length > max ? `${value.slice(0, max - 1)}…` : value;

          const deviceLabel = process.env.INPUT_DEVICE_LABEL || summary.devices.join(', ') || 'unknown device';

          const lines = [
            `## 📱 Mobile E2E (Maestro): ${statusEmoji} **${statusText}**`,
            '',
            '| Metric | Value |',
            '|--------|-------|',
            `| Platform | ${cell(process.env.INPUT_PLATFORM)} |`,
            `| Device | ${cell(deviceLabel)} |`,
            `| Shards | ${cell(process.env.INPUT_SHARDS)} |`,
            `| Flows | ${totals.passed} passed · ${totals.failed} failed · ${totals.skipped} skipped (${totals.total} total) |`,
            `| Device time | ${duration(totals.seconds)} across all shards |`,
            `| Job result | ${cell(suiteResult)} |`,
            '',
          ];

          if (!hasResults) {
            lines.push(
              `> No JUnit report was found in any shard artifact. The suite did not get as far as running a flow, so there is nothing to attribute a failure to. Start from the [job logs](${runUrl}).`,
              ''
            );
          } else if (shardsMissing > 0) {
            lines.push(
              `> ⚠️ Only ${shards.length} of ${shardsExpectedToReport} shards reported. The flow counts above describe part of the suite, so treat a clean result as unproven and start from the [job logs](${runUrl}).`,
              ''
            );
          }

          const failed = flows.filter((f) => f.status === 'failed' || f.status === 'skipped');
          if (failed.length > 0) {
            lines.push(
              `### Failing flows (${failed.length})`,
              '',
              '| Flow | Shard | Duration | Reason |',
              '|------|-------|----------|--------|'
            );
            for (const flow of failed) {
              const reason =
                flow.status === 'skipped'
                  ? 'skipped — asserted nothing'
                  : truncate(cell(flow.failure ?? 'no failure message in the report'), 160);
              lines.push(
                `| \`${cell(flow.file ?? flow.name)}\` | ${flow.shard ?? '—'} | ${duration(flow.seconds)} | ${reason} |`
              );
            }
            lines.push('');
          }

          if (shards.length > 0) {
            const shardRows = shards
              .map(
                (s) =>
                  `| ${s.shard} | ${s.passed} passed · ${s.failed} failed · ${s.skipped} skipped | ${duration(s.seconds)} |`
              )
              .join('\n');
            lines.push(
              '<details><summary>Per-shard breakdown</summary>',
              '',
              '| Shard | Flows | Device time |',
              '|-------|-------|-------------|',
              shardRows,
              '',
              '</details>',
              ''
            );
          }

          if (summary.unreadable.length > 0) {
            lines.push(
              `⚠️ ${summary.unreadable.length} report file(s) could not be read: ${summary.unreadable.map((u) => cell(u)).join('; ')}`,
              ''
            );
          }

          if (artifactLinks.length > 0) {
            lines.push(`📦 **Artifacts:** ${artifactLinks.join(' · ')}`);
            lines.push('_Screenshots, Maestro logs and JUnit reports, one download per shard_');
          } else {
            lines.push(`📦 **[Workflow run](${runUrl})** — no shard artifacts were found for this run`);
          }

          core.setOutput('body', lines.join('\n'));
          core.setOutput('status_text', statusText);
          await core.summary.addRaw(lines.join('\n')).write();

    - name: Comment mobile e2e result on PR
      if: ${{ always() && github.event_name == 'pull_request' && inputs.comment-on-pr == 'true' && github.event.pull_request.head.repo.full_name == github.event.pull_request.base.repo.full_name }}
      uses: actions/github-script@v7
      env:
        INPUT_BODY: ${{ steps.report.outputs.body }}
      with:
        github-token: ${{ inputs.github-token || github.token }}
        script: |
          const marker = '<!-- mobile-e2e-report -->';
          const body = [marker, process.env.INPUT_BODY].join('\n');

          const comments = await github.paginate(github.rest.issues.listComments, {
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
            per_page: 100,
          });

          // Who this action posts as, so it only ever edits its own comment.
          // `getAuthenticated` is the direct answer but is not available to the
          // default GITHUB_TOKEN, which is an App installation token and gets a
          // 403 -- hence the fallback rather than a hard dependency on it. A
          // custom PAT resolves to its own login and the sticky comment keeps
          // working under that token too.
          let selfLogin = null;
          try {
            const { data: self } = await github.rest.users.getAuthenticated();
            selfLogin = self.login;
          } catch (e) {
            core.debug(`getAuthenticated unavailable for this token: ${e.message}`);
          }

          // `startsWith`, not `includes`: the marker is the first line of what
          // this action writes, so anything merely QUOTING the marker -- a
          // reviewer pasting the comment back, another bot summarising it --
          // does not get hijacked and overwritten. The author check is the
          // second half of that: without it, the first such quote on the PR
          // becomes the comment this action edits for the rest of the PR's life.
          const isOwnComment = (c) =>
            selfLogin ? c.user?.login === selfLogin : c.user?.type === 'Bot';
          const existing = comments.find((c) => c.body?.startsWith(marker) && isOwnComment(c));

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
            core.info(`Updated existing mobile e2e comment (id: ${existing.id})`);
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
            core.info('Created new mobile e2e comment');
          }

    # The reports are the authority, so a green matrix that the reports do not
    # support is a failure and this is the step that says so. `run-maestro.mjs`
    # already fails a shard whose report records a failed or skipped flow, so
    # the only way to reach this is for evidence to have gone missing between
    # the shard and here: an artifact that never uploaded, a report that never
    # got written. Passing over that would restore exactly the hollow green this
    # suite was cleaned of -- a run reported successful having proven nothing.
    #
    # Deliberately after the comment step: the comment is more useful than the
    # exit code, so it gets posted either way.
    - name: Fail if the reports do not support a green suite
      if: ${{ always() && inputs.suite-result == 'success' }}
      shell: bash
      env:
        TOTAL: ${{ steps.summarize.outputs.total }}
        FAILED: ${{ steps.summarize.outputs.failed }}
        SKIPPED: ${{ steps.summarize.outputs.skipped }}
        SHARDS_SEEN: ${{ steps.summarize.outputs.shards_seen }}
        SHARDS_EXPECTED: ${{ inputs.shards }}
      run: |
        set -euo pipefail
        if [ "${TOTAL:-0}" -eq 0 ]; then
          echo "::error::The Maestro matrix reported success but no JUnit report was found in any shard artifact. Nothing proves a flow ran."
          exit 1
        fi
        if [ "${FAILED:-0}" -ne 0 ] || [ "${SKIPPED:-0}" -ne 0 ]; then
          echo "::error::The Maestro matrix reported success but the reports record ${FAILED} failed and ${SKIPPED} skipped flow(s)."
          exit 1
        fi
        # Same exemption the report body applies: a suite with fewer flows than
        # shards (the smoke dispatch) legitimately leaves shards with nothing to
        # run and nothing to upload.
        EXPECTED="${SHARDS_EXPECTED:-0}"
        if [ "${EXPECTED}" -gt 0 ] && [ "${TOTAL}" -lt "${EXPECTED}" ]; then
          EXPECTED="${TOTAL}"
        fi
        if [ "${SHARDS_SEEN:-0}" -lt "${EXPECTED}" ]; then
          echo "::error::The Maestro matrix reported success but only ${SHARDS_SEEN} of ${EXPECTED} shards left reports. Part of the suite is unaccounted for."
          exit 1
        fi
        echo "Reports support the green result: ${TOTAL} flow(s) across ${SHARDS_SEEN} shard(s), none failed or skipped."
