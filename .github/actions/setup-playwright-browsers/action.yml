name: Setup Playwright browsers
description: Setup Playwright browsers for testing

inputs:
  browser-cache-bust:
    description: 'Set to true to ignore existing browser cache'
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Cache Playwright browsers
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ inputs.browser-cache-bust }}
        restore-keys: |
          playwright-${{ runner.os }}-

    # WebKit runs the iPhone guards (the webkit-iphone projects in playwright/config): the owner's
    # 2026-11-16 sign-in loop and header overflow were seen in iPhone Safari. Its Ubuntu packages
    # are not on the hosted image, so they install through apt-install.sh, bounded.
    - name: Install Playwright browsers (chromium, webkit)
      shell: bash
      run: |
        timeout --kill-after=10 600 bash scripts/ci/apt-install.sh --playwright webkit
        npx playwright install chromium webkit
