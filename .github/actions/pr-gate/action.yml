name: 'PR Gate'
description: |
  Waits for every other check run on the commit to finish, then succeeds only if
  they all passed. This is the single required status check configured in the
  branch ruleset, so adding or renaming a CI job never needs a matching
  branch-protection edit.

  Why this exists as an action we own rather than a third-party one:

    - A required gate must not go red because a GitHub API call blipped. This
      action retries transient API failures (5xx, 429, secondary rate limits,
      network errors) and does NOT retry a genuine job failure. Those are
      different things and conflating them either hides real failures or
      produces false reds on green PRs.
    - It runs no third-party JavaScript. Wrapping a poller in a retry action
      reintroduces supply-chain exposure: a SHA-pinned wrapper can delegate at
      runtime to a mutable tag, so the pin freezes the wrapper and not the code
      that executes. On self-hosted runners that is not academic.
    - Zero dependencies. No node_modules, no bundling, no install step. It uses
      the runtime's global fetch against the GraphQL API.

  Input names and formats match kachick/wait-other-jobs so migrating a caller is
  a one-line change to `uses:`. Durations accept ISO 8601 (`PT15S`) or plain
  seconds (`15`).

  Two modes. `wait` blocks a job until the siblings finish, which is simple but
  occupies a runner for as long as the slowest job. `watch` recomputes the
  verdict on each CI completion event and publishes it as a check run, costing
  seconds per event instead of minutes of idling.

  Copy-paste workflows for both modes are in pr-gate/README.md. They are not
  repeated here, because Actions evaluates expression syntax anywhere in this file
  including inside a description, and the watch-mode example needs an expression
  for its concurrency group.

inputs:
  mode:
    description: |
      Required, with no default. The two modes need different permissions and
      different triggers, so a caller that did not say which one it wanted is
      misconfigured, and a default would hide that.

      'wait' occupies this job until every sibling check run finishes, then sets
      the job's own exit code. 'watch' computes the verdict once from the current
      state of the commit, publishes it as the check run named by check-name, and
      exits immediately. Watch mode needs `checks: write` and is meant to be
      driven by workflow_run completion events.
    required: true
  check-name:
    description: |
      Watch mode only. Name of the published check run, which is also the status
      context a branch ruleset requires. Must stay stable, and must not collide
      with the name of the job running this action.
    required: false
    default: 'gate'
  github-token:
    description: 'Token used for the GitHub API. Needs read access to checks and actions; watch mode also needs checks: write to publish the verdict.'
    required: false
    default: '${{ github.token }}'
  github-api-url:
    description: 'GitHub API base URL. Set automatically; override only for GHES.'
    required: false
    default: '${{ github.api_url }}'
  ref:
    description: 'Commit SHA to inspect. Defaults to the PR head SHA on pull_request events, otherwise the pushed SHA.'
    required: false
    default: ''
  warmup-delay:
    description: |
      Wait this long before the first poll, so sibling jobs have had a chance to
      register their check runs. ISO 8601 duration or plain seconds.
    required: false
    default: 'PT10S'
  minimum-interval:
    description: 'Minimum wait between polls. ISO 8601 duration or plain seconds.'
    required: false
    default: 'PT15S'
  retry-method:
    description: "How the poll interval grows: 'equal_intervals' or 'exponential_backoff'."
    required: false
    default: 'equal_intervals'
  attempt-limits:
    description: |
      Maximum number of polls before giving up. This bounds how long the gate
      waits for siblings to finish. It is a timeout, not an error retry; see
      api-retry-limit for that.
    required: false
    default: '180'
  api-retry-limit:
    description: |
      How many times to retry a single failed API call before giving up.
      This is the reason this action exists: a transient 5xx or rate limit must
      not turn a required gate red on a PR whose jobs all passed.
    required: false
    default: '5'
  api-retry-base-delay:
    description: 'Base delay for API retry backoff, doubled per attempt with jitter. ISO 8601 duration or plain seconds.'
    required: false
    default: 'PT2S'
  skip-same-workflow:
    description: "Ignore check runs belonging to this job's own workflow, so the gate does not wait on itself."
    required: false
    default: 'true'
  skip-list:
    description: |
      JSON array of check runs to ignore, e.g.
      [{"workflowFile":"claude-code-review.yaml","jobName":"review","jobMatchMode":"prefix"}]
      jobMatchMode is "exact" (default) or "prefix". Omit jobName to skip a whole workflow file.
    required: false
    default: '[]'
  early-exit:
    description: 'Fail as soon as a sibling job fails, instead of waiting for the rest to finish.'
    required: false
    default: 'true'
  dry-run:
    description: 'Report what the gate sees and always succeed. For verifying a rollout before enforcing.'
    required: false
    default: 'false'

outputs:
  polls:
    description: 'Number of polls performed'
  conclusion:
    description: >-
      'success', 'failure' or 'timed_out' in wait mode. Watch mode adds 'pending',
      for when siblings are still running and the gate stays unconcluded.

runs:
  using: node24
  main: 'main.js'
