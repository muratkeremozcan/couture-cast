name: Start local Supabase
description: >-
  Start local Supabase services from a cached image set when one exists, else
  pull with retries that move to the next image registry after a failed pull,
  back off exponentially with jitter, and never run past a total time budget.
  The Supabase host ports are reserved from the kernel's ephemeral range
  (reserve-supabase-ports, which callers also run right after checkout), and
  each attempt first waits, bounded, for any socket on a port it binds to close
  on its own. Sockets this action does not own are never closed by it.

inputs:
  max-attempts:
    description: >-
      Maximum number of startup attempts. An attempt whose pull failed or ran
      out of time moves to the next registry in image-registry and
      fallback-registries; any other failure retries the same registry, whose
      images are already present. The time budget can end the loop earlier.
    required: false
    default: '6'
  base-delay-seconds:
    description: >-
      First retry delay in seconds. Each later retry doubles it, capped at
      max-delay-seconds, and adds up to base-delay-seconds of random jitter so
      parallel shards do not hit the registry in lockstep.
    required: false
    default: '20'
  max-delay-seconds:
    description: Upper bound in seconds for one backoff delay, before jitter.
    required: false
    default: '120'
  time-budget-seconds:
    description: >-
      Total seconds the start attempts and the waits between them may take. A
      running attempt is cut off when the budget ends, a wait is shortened to
      leave room for one more attempt, and no attempt starts with less than
      min-attempt-seconds left. Callers size timeout-minutes to this budget plus
      their own work. Image cache restore and save run outside it.
    required: false
    default: '600'
  min-attempt-seconds:
    description: >-
      Fewest budget seconds an attempt needs to be worth starting. A cold pull
      and start measured 100 to 160 seconds on hosted runners.
    required: false
    default: '90'
  exclude:
    description: >-
      Comma-separated containers not to start. Services no test uses are skipped
      to pull less: the dashboard and its metadata API, log shipping, edge
      functions, the pooler, mail capture, image transforms (disabled in
      supabase/config.toml), and Realtime (the app pushes through Redis). Keep
      gotrue, postgrest and kong: CLI 2.62.5 leaves API_URL and the keys out of
      `supabase status` without them.
    required: false
    default: 'realtime,studio,postgres-meta,logflare,vector,edge-runtime,supavisor,mailpit,imgproxy'
  image-registry:
    description: >-
      Registry the first attempt pulls the Supabase images from, passed to the
      CLI as SUPABASE_INTERNAL_IMAGE_REGISTRY. Supabase mirrors the same tags to
      ghcr.io, which the job token authenticates against, and to public.ecr.aws,
      the CLI default, which caps anonymous data per runner IP.
    required: false
    default: 'ghcr.io'
  fallback-registries:
    description: >-
      Comma-separated registries a failed pull moves on to after
      image-registry. Any one of them can answer "toomanyrequests" on a busy
      runner pool; rotating means one throttled registry cannot fail a shard.
      docker.io serves the upstream names the CLI pins (supabase/postgres,
      postgrest/postgrest, library/kong, ...), verified for CLI 2.62.5 with
      `docker manifest inspect`.
    required: false
    default: 'public.ecr.aws,docker.io'
  image-cache:
    description: >-
      Restore the Supabase images from the Actions cache before starting. The
      key covers the Supabase CLI version, supabase/config.toml and the exclude
      list, so a hit holds every image this start needs and pulls nothing.
    required: false
    default: 'true'
  save-image-cache:
    description: >-
      Save the pulled images to the Actions cache after a start that missed it,
      so the first job anywhere that gets its images seeds the cache for every
      other. Concurrent saves of one key are safe: the first upload wins and
      the rest are skipped, and the save step never fails the job.
    required: false
    default: 'true'
  provision-storage-buckets:
    description: >-
      Create or update the Storage buckets the Prisma migrations define, through
      the Storage API, right after the start (scripts/local-storage-buckets.mjs).
      The migrations insert them only into a database that has the Storage
      schema, so a job that migrates an isolated database (the real-session lane)
      would otherwise seed against no bucket. Every job that starts a local
      Supabase gets the same buckets from this one step.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Callers run this right after checkout; here it is a no-op for them and a
    # late reservation for any caller that did not.
    - name: Reserve the Supabase host ports
      uses: ./.github/actions/reserve-supabase-ports

    - name: Compute the Supabase image cache key
      id: cache-key
      if: inputs.image-cache == 'true'
      shell: bash
      env:
        EXCLUDE: ${{ inputs.exclude }}
        CONFIG_HASH: ${{ hashFiles('supabase/config.toml') }}
      run: |
        set -u -o pipefail
        cli_version="$(node -p "require('supabase/package.json').version")"
        exclude_hash="$(printf '%s' "$EXCLUDE" | sha256sum | cut -c1-16)"
        {
          echo "key=supabase-images-v1-${RUNNER_OS}-cli${cli_version}-config${CONFIG_HASH:0:16}-exclude${exclude_hash}"
          echo "dir=${RUNNER_TEMP}/supabase-image-cache"
        } >> "$GITHUB_OUTPUT"

    - name: Restore the Supabase image cache
      id: cache-restore
      if: inputs.image-cache == 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Load the cached Supabase images
      id: cache-load
      if: inputs.image-cache == 'true' && steps.cache-restore.outputs.cache-hit == 'true'
      shell: bash
      env:
        CACHE_DIR: ${{ steps.cache-key.outputs.dir }}
      run: |
        set -u -o pipefail
        # A cache that does not load is treated as a miss: the start pulls.
        if [ -s "$CACHE_DIR/images.tar.zst" ] && [ -s "$CACHE_DIR/registry" ] &&
          zstd -dc "$CACHE_DIR/images.tar.zst" | docker load; then
          echo "registry=$(cat "$CACHE_DIR/registry")" >> "$GITHUB_OUTPUT"
          echo "loaded=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::The Supabase image cache did not load; pulling instead."
          echo "loaded=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Start local Supabase with retry
      id: start
      shell: bash
      env:
        MAX_ATTEMPTS: ${{ inputs.max-attempts }}
        BASE_DELAY: ${{ inputs.base-delay-seconds }}
        MAX_DELAY: ${{ inputs.max-delay-seconds }}
        TIME_BUDGET: ${{ inputs.time-budget-seconds }}
        MIN_ATTEMPT: ${{ inputs.min-attempt-seconds }}
        EXCLUDE: ${{ inputs.exclude }}
        PRIMARY_REGISTRY: ${{ inputs.image-registry }}
        FALLBACK_REGISTRIES: ${{ inputs.fallback-registries }}
        CACHE_LOADED: ${{ steps.cache-load.outputs.loaded == 'true' }}
        CACHED_REGISTRY: ${{ steps.cache-load.outputs.registry }}
        SAVE_IMAGE_CACHE: ${{ inputs.image-cache == 'true' && inputs.save-image-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
        CACHE_DIR: ${{ steps.cache-key.outputs.dir }}
        REGISTRY_TOKEN: ${{ github.token }}
      run: |
        set -u -o pipefail
        # One collation for every sorted image list, so `comm` compares them reliably.
        export LC_ALL=C

        for setting in MAX_ATTEMPTS BASE_DELAY MAX_DELAY TIME_BUDGET MIN_ATTEMPT; do
          if ! [[ "${!setting}" =~ ^[0-9]+$ ]]; then
            echo "::error::${setting} must be a non-negative integer, got '${!setting}'."
            exit 2
          fi
        done
        if [ "$MAX_ATTEMPTS" -lt 1 ]; then
          echo "::error::max-attempts must be at least 1."
          exit 2
        fi

        exclude="$EXCLUDE"
        registries=()
        # A loaded cache holds images tagged for the registry they were pulled
        # from, so that registry goes first and the first attempt pulls nothing.
        if [ "$CACHE_LOADED" = true ] && [ -n "$CACHED_REGISTRY" ]; then
          registries+=("$CACHED_REGISTRY")
        fi
        for registry in "$PRIMARY_REGISTRY" ${FALLBACK_REGISTRIES//,/ }; do
          if [ -n "$registry" ] && [[ " ${registries[*]-} " != *" ${registry} "* ]]; then
            registries+=("$registry")
          fi
        done
        if [ "${#registries[@]}" -eq 0 ]; then
          echo "::error::No image registry configured."
          exit 2
        fi
        ghcr_logged_in=false
        # The token stays a shell variable, out of the environment every npx and
        # docker child inherits.
        registry_token="$REGISTRY_TOKEN"
        unset REGISTRY_TOKEN
        started_at=$(date +%s)
        cached_images=""
        if [ "$CACHE_LOADED" = true ]; then
          cached_images="$(docker images --format '{{.Repository}}:{{.Tag}}' | sort -u)"
        fi

        remaining_seconds() {
          echo $(( TIME_BUDGET - ($(date +%s) - started_at) ))
        }

        # The host ports this start publishes: [api] and [db] always, and an
        # optional service's port only when it is enabled and its container is
        # not excluded. They sit inside Linux's ephemeral range (32768-60999),
        # so an outgoing connection can hold one as its local port, and Docker's
        # bind of 0.0.0.0:<port> then fails with "address already in use" while
        # `ss -ltn` shows no listener (mobile e2e run 40162761978, port 54322).
        section_value() {
          awk -v section="[$1]" -v key="$2" '
            $0 == section { inside = 1; next }
            /^\[/ { inside = 0 }
            inside && $1 == key && $2 == "=" { print $3; exit }
          ' supabase/config.toml
        }
        bound_ports=()
        for service in api:- db:- studio:studio inbucket:mailpit analytics:logflare db.pooler:supavisor; do
          section="${service%%:*}"
          container="${service#*:}"
          if [ "$container" != - ]; then
            if [[ ",${EXCLUDE}," == *",${container},"* ]]; then continue; fi
            if [ "$(section_value "$section" enabled)" = false ]; then continue; fi
          fi
          port="$(section_value "$section" port)"
          if [[ "$port" =~ ^[0-9]+$ ]]; then bound_ports+=("$port"); fi
        done
        port_filter=""
        for port in "${bound_ports[@]}"; do
          port_filter+="${port_filter:+ or }sport = :${port}"
        done
        if [ -n "$port_filter" ]; then port_filter="( ${port_filter} )"; fi
        port_guard=false
        if [ -n "$port_filter" ] && [ "$(uname -s)" = Linux ] && command -v ss > /dev/null; then
          port_guard=true
        fi
        # Root lets ss name the process behind each socket.
        ss_sockets() {
          if sudo -n true 2> /dev/null; then sudo -n ss "$@"; else ss "$@"; fi
        }

        # The reservation keeps new connections off the ports, but a socket
        # opened before it keeps its port until its owner closes it. Whoever
        # owns it, this action leaves it alone and waits: a short-lived client
        # finishes, and TIME_WAIT or an orphaned FIN-WAIT-2 ends after 60
        # seconds. The wait stops at 75 seconds, inside the budget and leaving
        # room for the attempt; a socket still there fails the attempt, named.
        #
        # TIME_WAIT blocks only sometimes. One left by a listener that is gone
        # (a previous attempt's own database) carries SO_REUSEADDR, and Docker
        # binds over it. One left by an outgoing connection that held the port
        # does not, and Docker's bind fails on it exactly as on a live one
        # (measured on kernel 6.10). ss cannot show that flag, so a TIME_WAIT
        # port counts as held only while a SO_REUSEADDR bind of 0.0.0.0 on it,
        # the bind Docker makes, fails. Node's listen sets SO_REUSEADDR.
        bind_blocked() {
          ! node -e '
            const server = require("node:net").createServer()
            server.once("error", () => process.exit(1))
            server.listen({ port: Number(process.argv[1]), host: "0.0.0.0" }, () =>
              server.close(() => process.exit(0)))
          ' "$1" 2> /dev/null
        }

        # Prints the sockets that would stop the start: any listener or
        # connection in a state other than TIME_WAIT, then TIME_WAIT sockets on
        # a port Docker could not bind.
        blocking_sockets() {
          local others tw port on_port
          others="$(ss_sockets -Htanp state all exclude time-wait "$port_filter" 2> /dev/null || true)"
          if [ -n "$others" ]; then printf '%s\n' "$others"; fi
          # Listed through `state all`: a single-state listing drops the State
          # column and shifts the local address out of field 4.
          tw="$(ss_sockets -Htanp state all "$port_filter" 2> /dev/null | awk '$1 == "TIME-WAIT"' || true)"
          if [ -z "$tw" ]; then return 0; fi
          for port in "${bound_ports[@]}"; do
            # Field 4 is the local address; its last ':' part is the port.
            on_port="$(awk -v port="$port" '{ n = split($4, part, ":"); if (part[n] == port) print }' <<< "$tw")"
            if [ -n "$on_port" ] && bind_blocked "$port"; then printf '%s\n' "$on_port"; fi
          done
        }

        wait_for_free_ports() {
          local waited=0 wait_cap held owners step
          wait_cap=$(( $(remaining_seconds) - MIN_ATTEMPT ))
          if [ "$wait_cap" -gt 75 ]; then wait_cap=75; fi
          if [ "$wait_cap" -lt 0 ]; then wait_cap=0; fi
          while held="$(blocking_sockets)" && [ -n "$held" ]; do
            if [ "$waited" -eq 0 ]; then
              echo "Waiting up to ${wait_cap}s for sockets on the Supabase host ports to close:"
              printf '%s\n' "$held"
            fi
            if [ "$waited" -ge "$wait_cap" ]; then
              owners="$(grep -oE 'users:\(\("[^"]+",pid=[0-9]+' <<< "$held" |
                sed -E 's/users:\(\("([^"]+)",pid=([0-9]+)/\1 (pid \2)/' | sort -u | paste -sd, - || true)"
              echo "::error::Supabase host ports are still in use after ${waited}s: $(awk '{print $4}' <<< "$held" | sort -u | paste -sd' ' -), held by ${owners:-no process (a kernel timer state, or ss without root)}. This attempt is skipped."
              return 1
            fi
            step=$(( wait_cap - waited < 5 ? wait_cap - waited : 5 ))
            sleep "$step"
            waited=$(( waited + step ))
          done
          if [ "$waited" -gt 0 ]; then echo "The Supabase host ports are free (waited ${waited}s)."; fi
          return 0
        }

        diagnose_ports() {
          echo "::group::Supabase host port diagnostics"
          echo "Containers and their published ports:"
          docker ps --all --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          if [ "$port_guard" = true ]; then
            echo "Sockets in any state on the Supabase host ports (${bound_ports[*]}):"
            ss_sockets -tanp state all "$port_filter" || true
          else
            echo "No host ports to check (none found in supabase/config.toml, or no Linux ss)."
          fi
          echo "::endgroup::"
        }

        export_supabase_environment() {
          # `supabase status` leaves a field out when the service behind it is
          # excluded; a missing field must stop here, not reach $GITHUB_ENV as "null".
          npx supabase status -o json | jq -er '
            if (.API_URL and .ANON_KEY and .SERVICE_ROLE_KEY) then
              "SUPABASE_URL=\(.API_URL)",
              "SUPABASE_ANON_KEY=\(.ANON_KEY)",
              "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"
            else
              error("supabase status lacks API_URL, ANON_KEY or SERVICE_ROLE_KEY")
            end
          ' >> "$GITHUB_ENV"
        }

        # Only ghcr.io takes the job token; the other mirrors are pulled anonymously.
        # Anonymous pulls still work if the login fails, so it does not stop the job.
        login_for() {
          if [ "$1" = 'ghcr.io' ] && [ "$ghcr_logged_in" = false ]; then
            if printf '%s' "$registry_token" | docker login ghcr.io -u "${GITHUB_ACTOR:-github-actions}" --password-stdin; then
              ghcr_logged_in=true
            else
              echo "::warning::ghcr.io login failed; pulling anonymously."
            fi
          fi
        }

        # Exponential backoff capped at MAX_DELAY, plus up to BASE_DELAY of jitter.
        backoff_seconds() {
          local delay=$(( BASE_DELAY * (1 << ($1 - 1)) ))
          if [ "$delay" -gt "$MAX_DELAY" ] || [ "$1" -gt 16 ]; then delay=$MAX_DELAY; fi
          echo $(( delay + RANDOM % (BASE_DELAY + 1) ))
        }

        # The images this project's containers run from, under the names they
        # were pulled as. Mirrors use <registry>/supabase/<name>; docker.io keeps
        # the upstream names, so the containers are the registry-neutral source.
        project_images() {
          docker ps --all --filter label=com.supabase.cli.project \
            --format '{{.Image}}' | sort -u
        }

        # Saves exactly the images this start used, so a later hit loads them
        # under the same names and the CLI finds every one already present.
        write_image_cache() {
          local registry=$1 images
          images="$(project_images)"
          if [ -z "$images" ]; then
            echo "::warning::No Supabase project images to cache."
            return 0
          fi
          mkdir -p "$CACHE_DIR"
          # shellcheck disable=SC2086 # one image reference per word
          if docker save $images | zstd -T0 -3 -q -o "$CACHE_DIR/images.tar.zst"; then
            printf '%s' "$registry" > "$CACHE_DIR/registry"
            echo "cache_written=true" >> "$GITHUB_OUTPUT"
            echo "Cached $(wc -l <<< "$images") Supabase images from ${registry}."
          else
            echo "::warning::Saving the Supabase images failed; the cache is skipped."
            : > "$CACHE_DIR/images.tar.zst"
          fi
        }

        # A hit must pull nothing: every image a project container runs from has
        # to come from the loaded set, or the key missed an input and is stale.
        check_cache_hit_pulled_nothing() {
          local pulled
          pulled="$(comm -13 <(printf '%s\n' "$cached_images") <(project_images))"
          if [ -n "$pulled" ]; then
            echo "::warning::Supabase image cache hit, but these were pulled: $(tr '\n' ' ' <<< "$pulled")"
          else
            echo "Supabase image cache hit: nothing was pulled."
          fi
        }

        run_start() {
          if command -v timeout > /dev/null; then
            timeout --kill-after=15 "$1" npx supabase start ${exclude:+--exclude "$exclude"}
          else
            npx supabase start ${exclude:+--exclude "$exclude"}
          fi
        }

        # A pull that failed or ran out of time says the registry is throttled
        # or slow, so the next attempt tries another one. Any other failure (a
        # container that would not start or bind) happened with the images
        # present, and moving registries would only force a cold pull of
        # differently named images: run 40162761978 traded a port clash on
        # cached ghcr.io images for "toomanyrequests" on public.ecr.aws.
        pull_failed() {
          [ "$1" -eq 124 ] || [ "$1" -eq 137 ] ||
            grep -qE 'failed to pull|toomanyrequests' "$attempt_log"
        }

        attempt_log="$(mktemp)"
        registry_index=0
        tried_registries=()
        attempt=1
        exit_code=1
        while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
          remaining=$(remaining_seconds)
          if [ "$remaining" -lt "$MIN_ATTEMPT" ]; then
            echo "::error::Supabase start time budget (${TIME_BUDGET}s) exhausted after $(( attempt - 1 )) attempts; ${remaining}s left is under min-attempt-seconds (${MIN_ATTEMPT}s)."
            exit "$exit_code"
          fi
          # The wait spends at most the budget above min-attempt-seconds, so a
          # start that follows it still has room to run.
          ports_free=true
          if [ "$port_guard" = true ] && ! wait_for_free_ports; then ports_free=false; fi
          remaining=$(remaining_seconds)
          registry="${registries[$(( registry_index % ${#registries[@]} ))]}"
          export SUPABASE_INTERNAL_IMAGE_REGISTRY="$registry"
          : > "$attempt_log"

          if [ "$ports_free" = false ]; then
            # The start would only fail on the bind; the wait above named why.
            exit_code=1
          else
            if [[ " ${tried_registries[*]-} " != *" ${registry} "* ]]; then
              tried_registries+=("$registry")
            fi
            login_for "$registry"
            echo "::group::Start local Supabase (attempt ${attempt}/${MAX_ATTEMPTS}, registry ${registry}, ${remaining}s of budget left)"

            # tee keeps the live log and a copy for pull_failed; pipefail makes
            # the pipeline's status the start's own.
            if run_start "$remaining" 2>&1 | tee "$attempt_log"; then
              echo "Supabase services started successfully from ${registry}."
              npx supabase status || true
              # Without -e a failed export would fall through to success and leave
              # later steps without SUPABASE_URL or the keys.
              if ! export_supabase_environment; then
                echo "::endgroup::"
                echo "::error::Supabase started but its URL and keys could not be exported."
                exit 1
              fi
              echo "::endgroup::"
              if [ "$CACHE_LOADED" = true ]; then check_cache_hit_pulled_nothing; fi
              if [ "$SAVE_IMAGE_CACHE" = true ]; then write_image_cache "$registry"; fi
              exit 0
            else
              exit_code=$?
            fi

            if [ "$exit_code" -eq 124 ] || [ "$exit_code" -eq 137 ]; then
              echo "Supabase startup was cut off by the time budget (exit ${exit_code}, registry ${registry})."
            else
              echo "Supabase startup failed with exit code ${exit_code} (registry ${registry})."
            fi
            npx supabase status || true
            echo "::endgroup::"
          fi
          diagnose_ports

          if [ "$attempt" -eq "$MAX_ATTEMPTS" ]; then
            echo "::error::Failed to start local Supabase after ${MAX_ATTEMPTS} attempts across: ${tried_registries[*]-no registry, the host ports never came free}."
            exit "$exit_code"
          fi

          if [ "$ports_free" = false ]; then
            echo "No start ran; the next attempt waits for the host ports again."
          elif pull_failed "$exit_code"; then
            registry_index=$(( registry_index + 1 ))
            echo "The pull from ${registry} failed; the next attempt uses ${registries[$(( registry_index % ${#registries[@]} ))]}."
          else
            echo "The images from ${registry} are present; the next attempt keeps that registry."
          fi

          # Clear whatever this attempt left half started, so the next one
          # starts clean, from the same registry or another.
          npx supabase stop --no-backup || true

          # Wait, but always leave room for one more attempt inside the budget.
          sleep_seconds=$(backoff_seconds "$attempt")
          room=$(( $(remaining_seconds) - MIN_ATTEMPT ))
          if [ "$room" -lt "$sleep_seconds" ]; then sleep_seconds=$(( room > 0 ? room : 0 )); fi
          echo "Retrying Supabase startup in ${sleep_seconds}s..."
          sleep "$sleep_seconds"
          attempt=$(( attempt + 1 ))
        done

    - name: Provision the local Storage buckets
      if: inputs.provision-storage-buckets == 'true'
      shell: bash
      run: node scripts/local-storage-buckets.mjs provision

    - name: Save the Supabase image cache
      # Any caller, only on a miss, and only after a start that produced the
      # archive; a failed or empty archive is never published. A lost race for
      # the key or a cache service error must not fail the job.
      continue-on-error: true
      if: >-
        inputs.image-cache == 'true' && inputs.save-image-cache == 'true' &&
        steps.cache-restore.outputs.cache-hit != 'true' && steps.start.outputs.cache_written == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ steps.cache-key.outputs.dir }}
        key: ${{ steps.cache-key.outputs.key }}

    - name: Log out of the image registry
      # Later steps run PR code; drop any stored ghcr.io credential once the
      # images are pulled. Logging out without a login is a harmless no-op.
      if: always()
      shell: bash
      run: docker logout ghcr.io || true
