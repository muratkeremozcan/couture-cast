name: Start local Supabase
description: Start local Supabase services with retry/backoff for transient registry pull failures.

inputs:
  max-attempts:
    description: Maximum number of startup attempts
    required: false
    default: '4'
  base-delay-seconds:
    description: Base delay in seconds used for linear backoff between attempts
    required: false
    default: '20'
  exclude:
    description: >-
      Comma-separated containers not to start. CI pulls every image from a registry
      that rate-limits anonymous data ("toomanyrequests: Data limit exceeded"), so
      services no test uses are skipped: the dashboard and its metadata API, log
      shipping, edge functions, the pooler, mail capture, and image transforms
      (disabled in supabase/config.toml).
    required: false
    default: 'studio,postgres-meta,logflare,vector,edge-runtime,supavisor,mailpit,imgproxy'

runs:
  using: composite
  steps:
    - name: Start local Supabase with retry
      shell: bash
      run: |
        set -u -o pipefail

        max_attempts='${{ inputs.max-attempts }}'
        base_delay='${{ inputs.base-delay-seconds }}'
        exclude='${{ inputs.exclude }}'
        attempt=1

        diagnose_db_port() {
          echo "::group::Supabase database port diagnostics"
          echo "Containers publishing port 54322:"
          docker ps --all --filter publish=54322 \
            --format 'table {{.ID}}\t{{.Names}}\t{{.Status}}\t{{.Ports}}' || true
          echo "Host listeners on port 54322:"
          ss -ltnp '( sport = :54322 )' || true
          echo "::endgroup::"
        }

        export_supabase_environment() {
          npx supabase status -o json | jq -r '
            "SUPABASE_URL=\(.API_URL)",
            "SUPABASE_ANON_KEY=\(.ANON_KEY)",
            "SUPABASE_SERVICE_ROLE_KEY=\(.SERVICE_ROLE_KEY)"
          ' >> "$GITHUB_ENV"
        }

        while [ "$attempt" -le "$max_attempts" ]; do
          echo "::group::Start local Supabase (attempt ${attempt}/${max_attempts})"

          if npx supabase start ${exclude:+--exclude "$exclude"}; then
            echo "Supabase services started successfully."
            npx supabase status || true
            export_supabase_environment
            echo "::endgroup::"
            exit 0
          else
            exit_code=$?
          fi

          echo "Supabase startup failed with exit code ${exit_code}."
          npx supabase status || true
          echo "::endgroup::"
          diagnose_db_port

          if [ "$attempt" -eq "$max_attempts" ]; then
            echo "::error::Failed to start local Supabase after ${max_attempts} attempts."
            exit "$exit_code"
          fi

          sleep_seconds=$(( base_delay * attempt ))
          echo "Retrying Supabase startup in ${sleep_seconds}s..."
          sleep "$sleep_seconds"
          attempt=$(( attempt + 1 ))
        done
