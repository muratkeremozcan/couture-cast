# Step 7 support owner: searchable owner anchor
name: Install
description: Install repository dependencies with a fixed npm command

inputs:
  install-mode:
    description: 'Dependency install mode: ci or install'
    required: false
    default: 'ci'
  node-version-file:
    description: 'Path to .nvmrc or version file'
    required: false
    default: '.nvmrc'

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: npm

    - name: Install dependencies
      shell: bash
      env:
        INSTALL_MODE: ${{ inputs.install-mode }}
      run: |
        case "$INSTALL_MODE" in
          ci) npm ci ;;
          install) npm install ;;
          *)
            echo "Unsupported install mode: $INSTALL_MODE"
            exit 1
            ;;
        esac
