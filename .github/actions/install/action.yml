# Step 7 support owner: searchable owner anchor
name: Install
description: Install dependencies using npm ci or a custom command

inputs:
  install-command:
    description: 'Command to install dependencies (default npm ci)'
    required: false
    default: 'npm ci'
  node-version-file:
    description: 'Path to .nvmrc or version file'
    required: false
    default: '.nvmrc'

runs:
  using: composite
  steps:
    # Node and the dependency tree, restored whole when the lockfile matches.
    - name: Setup Node and dependencies
      uses: ./.github/actions/node-dependencies
      with:
        install-command: ${{ inputs.install-command }}
        node-version-file: ${{ inputs.node-version-file }}
