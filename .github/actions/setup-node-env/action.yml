name: Setup Node Environment
description: Common setup steps for Node.js projects - node setup, caching, and dependency installation

inputs:
  use-npm-ci:
    description: 'Use npm ci instead of npm install'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Node and the dependency tree, restored whole when the lockfile matches. The cache step
    # this action had saved ~/.npm and node_modules under every lockfile and restored a
    # partial match, then still ran the install.
    - name: Setup Node and dependencies
      uses: ./.github/actions/node-dependencies
      with:
        install-command: ${{ inputs.use-npm-ci == 'true' && 'npm ci' || 'npm install' }}
