plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.couturecast'
version = '1.0.0'

android {
  namespace "expo.modules.accessibilityfocus"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
  }
  // The TalkBack instrumentation tests drive only Android framework views, while the test APK
  // would bundle React Native and Expo native libraries for every ABI (about 170 MB) and fails
  // to install on an emulator with little free storage. This library ships no native code of
  // its own, so these excludes only reach that test APK.
  packaging {
    jniLibs {
      excludes += ["**/*.so"]
    }
  }
  // Pure waiting logic shared by the instrumented TalkBack test and its JVM unit tests.
  sourceSets {
    test.java.srcDirs += 'src/testShared/java'
    androidTest.java.srcDirs += 'src/testShared/java'
  }
  testOptions {
    unitTests {
      includeAndroidResources = true
    }
  }
}

dependencies {
  testImplementation "junit:junit:4.13.2"
  testImplementation "org.robolectric:robolectric:4.11.1"
  testImplementation "androidx.test:core:1.5.0"
  androidTestImplementation "junit:junit:4.13.2"
  androidTestImplementation "androidx.test:core:1.5.0"
  androidTestImplementation "androidx.test:runner:1.5.2"
  androidTestImplementation "androidx.test.ext:junit:1.1.5"
}
