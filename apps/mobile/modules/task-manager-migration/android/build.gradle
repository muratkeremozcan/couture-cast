import groovy.json.JsonSlurper

plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.couturecast'
version = '1.0.0'
android {
  namespace 'expo.modules.taskmanagermigration'
  defaultConfig { versionCode 1; versionName '1.0.0' }
  testOptions { unitTests { includeAndroidResources = true } }
}

/**
 * The regression drives expo-task-manager's own TaskService restore after the cleanup. Expo ships
 * that module precompiled, as the Maven publication its expo-module.config.json names, so the
 * test resolves the installed one; a source checkout of the module links it as a project.
 */
def expoTaskManagerTestDependency() {
  def packageJson = new File(
    providers.exec {
      workingDir(projectDir)
      commandLine('node', '--print', "require.resolve('expo-task-manager/package.json')")
    }.standardOutput.asText.get().trim()
  )
  def config = new JsonSlurper().parse(new File(packageJson.parentFile, 'expo-module.config.json'))
  def publication = config.android?.publication
  if (publication == null) return project(':expo-task-manager')
  def version = publication.version ?: new JsonSlurper().parse(packageJson).version
  return "${publication.groupId}:${publication.artifactId}:${version}"
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.11.1'
  testImplementation 'androidx.test:core:1.5.0'
  testImplementation expoTaskManagerTestDependency()
}
