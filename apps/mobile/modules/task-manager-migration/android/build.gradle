plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'com.couturecast'
version = '1.0.0'
android {
  namespace 'expo.modules.taskmanagermigration'
  defaultConfig { versionCode 1; versionName '1.0.0' }
  testOptions { unitTests { includeAndroidResources = true } }
}
dependencies {
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.11.1'
  testImplementation 'androidx.test:core:1.5.0'
  // The regression drives expo-task-manager's own TaskService restore after the cleanup.
  testImplementation project(':expo-task-manager')
}
