// Standalone build of the persisted task cleanup and its Robolectric regression (Story 6.15
// P0-07). The module's own build.gradle needs the generated app; this one needs neither a
// prebuild nor React Native, so the PR job (pr-share-native-unit.yml) runs it directly:
//   gradle -p apps/mobile/modules/task-manager-migration/android/unit-tests testDebugUnitTest
// The regression drives the installed expo-task-manager's own TaskService restore, which Expo
// ships precompiled in a local Maven repository inside the package, with the app loader beside it.
def installedPackage(String name) {
  def packageJson = providers.exec {
    workingDir(settingsDir)
    commandLine('node', '--print', "require.resolve('${name}/package.json')")
  }.standardOutput.asText.get().trim()
  return new File(packageJson).parentFile
}

pluginManagement {
  repositories {
    google()
    mavenCentral()
    gradlePluginPortal()
  }
}
dependencyResolutionManagement {
  repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
  repositories {
    google()
    mavenCentral()
    for (name in ['expo-task-manager', 'unimodules-app-loader']) {
      maven { url = new File(installedPackage(name), 'local-maven-repo').toURI() }
    }
  }
}
gradle.ext.expoModulesCore = installedPackage('expo-modules-core')
gradle.ext.expoTaskManager = installedPackage('expo-task-manager')
rootProject.name = 'task-manager-migration-unit-tests'
