// N-AND-RECEIVE's second app: a separate package, so its own UID, that the receive androidTest
// picks in the real system chooser. It reads the shared stream with only the grant the chooser
// forwarded and reports what it saw back to the test package. Built from unit-tests/:
//   gradle -p unit-tests :test-receiver:assembleDebug
// It is never part of the app build.
plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
}

android {
  namespace 'expo.modules.sharecardnativeshare.receiver'
  compileSdk 36
  defaultConfig {
    applicationId 'expo.modules.sharecardnativeshare.receiver'
    minSdk 24
    targetSdk 36
    versionCode 1
    versionName '1.0.0'
  }
  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }
  kotlinOptions {
    jvmTarget = '17'
  }
}
