# Learning path Step 32: Wardrobe onboarding and silhouette setup.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-32-wardrobe-onboarding-and-silhouette-setup
# Story 4.4 Task 8: wardrobe onboarding and silhouette surfaces in one
# non-English locale. tr-TR is deliberately chosen over de-DE/fr-FR/fr-CA/
# it-IT: those four keep "Silhouette" as an approved cognate (see Task 5's
# completion notes), so a literal string match there would not actually
# prove translation happened. Turkish has a genuinely distinct translation
# for every key exercised below.
appId: ${MAESTRO_APP_ID}
name: 'Wardrobe onboarding and silhouette localization'
tags:
  - e2e
  - wardrobe
  - onboarding
  - localization
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow:
    when:
      visible: 'Sign in with Google'
    commands:
      - tapOn:
          text: 'close'
          optional: true
      - tapOn:
          point: '9%,29%'

- runFlow: subflows/open-app.yaml

# This flow asserts Turkish copy, so it has to put the app into Turkish
# itself rather than inherit it from whatever ran before it.
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: tr-TR

- extendedWaitUntil:
    visible:
      id: 'tab-wardrobe'
    timeout: 60000

- runFlow:
    file: subflows/open-wardrobe.yaml
    label: 'Open the Wardrobe tab'

# wardrobe.onboarding.title / wardrobe.onboarding.permission_body
#
# Asserted as ONE composed string, because that is what exists on the device.
# `wardrobe-onboarding-card` is a Pressable, so React Native marks it a single
# accessibility element and merges both of its Text children into one name
# joined with ", ". The two child strings therefore never appear as separate
# nodes, and Maestro matches a text selector against a whole node, so asserting
# either half alone could not pass against a correctly rendered, correctly
# translated card. Measured from the hierarchy dump of a failing run.
#
# Asserting the composed name is also stricter than the two separate assertions
# were: it pins title-before-body reading order, which is what a screen reader
# announces.
- assertVisible:
    id: 'wardrobe-onboarding-card'
    label: 'Onboarding entry card is offered'

- assertVisible:
    text: 'Gardırobunu oluştur, CoutureCast, kıyafetlerini yakalamak için kamera veya kitaplık erişimine ihtiyaç duyar.'
    label: 'Onboarding entry card title and body are localized, in reading order'

# wardrobe.silhouette.title, on the hub's own entry-point link.
- assertVisible:
    text: 'Silüet'
    label: 'Silhouette entry-point link is localized'

- tapOn:
    id: 'wardrobe-silhouette-link'

- extendedWaitUntil:
    visible:
      id: 'wardrobe-silhouette-screen'
    timeout: 15000

# wardrobe.silhouette.height_slider_label / build_slider_label
- assertVisible:
    text: 'Boy'
    label: 'Height slider label is localized'

- assertVisible:
    text: 'Yapı'
    label: 'Build slider label is localized'

# wardrobe.silhouette.mode_default / mode_my_form
- assertVisible:
    text: 'Ayarlanabilir silüet'
    label: 'Default mannequin tab label is localized'

- tapOn:
    id: 'silhouette-tab-my-form'

- assertVisible:
    text: 'Formum fotoğrafı'
    label: 'My Form tab label is localized'

# wardrobe.silhouette.my_form_guidance
- assertVisible:
    text: 'En temiz kaplama için düz beyaz veya siyah kıyafet giyip düz bir arka plan kullanın.'
    label: 'My Form guidance copy is localized'

- takeScreenshot:
    path: maestro/artifacts/wardrobe-onboarding-localization-flow

# --- Restore the shared fixture ---------------------------------------------
#
# Every flow in this suite runs as the single user `scripts/run-maestro.mjs`
# signs up, and the locale is synced to that user's profile, so it outlives
# `clearState: true`. Leaving Turkish behind makes every later flow in the run
# assert English copy against a Turkish app.
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: en-US

- extendedWaitUntil:
    visible: 'Language'
    timeout: 15000
    label: 'Locale is back to English for the flows that follow'
