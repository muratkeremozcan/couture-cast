# Learning path Step 32: Wardrobe onboarding and silhouette setup.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-32-wardrobe-onboarding-and-silhouette-setup
# Story 4.4 Task 8: wardrobe onboarding and silhouette surfaces in one
# non-English locale. tr-TR is deliberately chosen over de-DE/fr-FR/fr-CA/
# it-IT: those four keep "Silhouette" as an approved cognate (see Task 5's
# completion notes), so a literal string match there would not actually
# prove translation happened. Turkish has a genuinely distinct translation
# for every key exercised below.
appId: ${MAESTRO_APP_ID}
name: 'Wardrobe onboarding and silhouette localization'
tags:
  - e2e
  - wardrobe
  - onboarding
  - localization
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow:
    when:
      visible: 'Sign in with Google'
    commands:
      - tapOn:
          text: 'close'
          optional: true
      - tapOn:
          point: '9%,29%'

- runFlow: subflows/open-app.yaml

# This flow asserts Turkish copy, so it has to put the app into Turkish
# itself rather than inherit it from whatever ran before it.
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: tr-TR

- extendedWaitUntil:
    visible:
      id: 'tab-wardrobe'
    timeout: 60000

- runFlow:
    file: subflows/open-wardrobe.yaml
    label: 'Open the Closet tab'

# tabs.closet, as the Closet top bar title (CC-7.11 D1). By id: Android reports
# the bar's title beside app-top-bar, not under it (CI 3d7af2a2).
- assertVisible:
    id: 'app-top-bar-title'
    text: 'Dolap'
    label: 'Closet title is localized'

# CC-7.11 D5: Closet setup and Silhouette moved from the hub's card and header
# link into the Closet More menu. wardrobe.menu.setup / wardrobe.menu.silhouette
- tapOn:
    id: 'closet-more-menu'
    label: 'Open the Closet More menu'
- extendedWaitUntil:
    visible:
      id: 'closet-more-setup'
    timeout: 15000
- assertVisible:
    id: 'closet-more-setup'
    text: 'Dolap kurulumu'
    label: 'Closet setup row is localized'
- assertVisible:
    id: 'closet-more-silhouette'
    text: 'Silüet'
    label: 'Silhouette row is localized'

# wardrobe.onboarding.title / wardrobe.onboarding.permission_body, now on the
# setup screen itself: the title in its top bar, the body in its first step.
- tapOn:
    id: 'closet-more-setup'
- extendedWaitUntil:
    visible:
      id: 'wardrobe-onboarding-screen'
    timeout: 15000
- assertVisible:
    id: 'app-top-bar-title'
    # Story CC-7.11 D5: the setup route is titled by wardrobe.menu.setup.
    text: 'Dolap kurulumu'
    label: 'Setup screen title is localized'
- extendedWaitUntil:
    visible:
      id: 'onboarding-permission-step'
    timeout: 15000
- assertVisible:
    text: 'Parça eklemek için uygulamanın kamerana ya da fotoğraflarına erişmesine izin ver.'
    label: 'Setup permission body is localized'

- tapOn:
    id: 'app-top-bar-back'
    label: 'Back to Closet'
- extendedWaitUntil:
    visible:
      id: 'wardrobe-screen'
    timeout: 15000

- tapOn:
    id: 'closet-more-menu'
    label: 'Reopen the Closet More menu'
- extendedWaitUntil:
    visible:
      id: 'closet-more-silhouette'
    timeout: 15000
- tapOn:
    id: 'closet-more-silhouette'

- extendedWaitUntil:
    visible:
      id: 'wardrobe-silhouette-screen'
    timeout: 15000

# wardrobe.silhouette.height_slider_label / build_slider_label
- assertVisible:
    text: 'Boy'
    label: 'Height slider label is localized'

- assertVisible:
    text: 'Yapı'
    label: 'Build slider label is localized'

# wardrobe.silhouette.mode_default / mode_my_form
- assertVisible:
    text: 'Ayarlanabilir silüet'
    label: 'Default mannequin tab label is localized'

- tapOn:
    id: 'silhouette-tab-my-form'

- assertVisible:
    text: 'Formum fotoğrafı'
    label: 'My Form tab label is localized'

# wardrobe.silhouette.my_form_guidance
- assertVisible:
    text: 'En temiz kaplama için düz beyaz veya siyah kıyafet giyip düz bir arka plan kullanın.'
    label: 'My Form guidance copy is localized'

- takeScreenshot:
    path: maestro/artifacts/wardrobe-onboarding-localization-flow

# --- Restore the shared fixture ---------------------------------------------
#
# Every flow in this suite runs as the single user `scripts/run-maestro.mjs`
# signs up, and the locale is synced to that user's profile, so it outlives
# `clearState: true`. Leaving Turkish behind makes every later flow in the run
# assert English copy against a Turkish app.
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: en-US

- extendedWaitUntil:
    visible: 'Language'
    timeout: 15000
    label: 'Locale is back to English for the flows that follow'
