# Learning path Step 12: Cross-surface E2E confidence.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-12-cross-surface-e2e-confidence
# Step 12 step 3 owner: searchable owner anchor
appId: ${MAESTRO_APP_ID}
name: 'Mobile smoke sanity'
tags:
  - smoke
  - maestro
env:
  SETTINGS_TITLE: 'Language'
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: false
    stopApp: false

- runFlow: subflows/open-app.yaml

# Tapped by testID, never by screen coordinate. The blind `75%,94%` tap this
# replaces was calibrated for an older tab bar; once Community was added it
# landed one tab short and every run failed on the assertion below.
- runFlow: subflows/open-settings.yaml

- assertVisible: ${SETTINGS_TITLE}

- takeScreenshot:
    path: maestro/artifacts/tab-navigation.png
