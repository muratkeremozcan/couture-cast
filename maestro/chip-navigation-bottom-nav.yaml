# Learning path Step 26: Chip navigation and sticky bottom nav.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-26-chip-navigation-and-sticky-bottom-nav
# Story 3.6: Mobile chip navigation and bottom navigation E2E verification
appId: ${MAESTRO_APP_ID}
name: 'Chip navigation & sticky bottom nav flow'
tags:
  - e2e
  - navigation
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# Verify chip selection is available on the mobile Home screen
- assertVisible:
    id: 'chip-personal'
- assertVisible:
    id: 'chip-community'
- assertVisible:
    id: 'chip-sponsored'

- tapOn:
    id: 'chip-community'

- takeScreenshot:
    path: maestro/artifacts/chip-navigation-community-selected

- assertVisible:
    id: 'chip-community'
    selected: true

- assertVisible:
    id: 'tab-wardrobe'
- assertVisible:
    id: 'tab-community'
- assertVisible:
    id: 'tab-settings'

- tapOn:
    id: 'tab-community'
- assertVisible:
    id: 'community-screen'

- takeScreenshot:
    path: maestro/artifacts/chip-navigation-bottom-nav
