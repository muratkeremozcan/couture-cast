# Story 6.5 owner: Settings tab > Community notifications > Sign in, through the product UI.
appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: 'tab-settings'
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 15000
- scrollUntilVisible:
    element: ${MAESTRO_TITLE}
    direction: DOWN
    timeout: 20000
- tapOn: ${MAESTRO_TITLE}
- extendedWaitUntil:
    visible: ${MAESTRO_SIGNIN}
    timeout: 15000
