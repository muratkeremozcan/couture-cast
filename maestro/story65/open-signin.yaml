# Story 6.5 owner: Settings tab > Community notifications > Sign in, through the product UI.
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-settings-tab.yaml
# Centered, because iOS Settings has a fixed band above the tab bar that clips the bottom.
- scrollUntilVisible:
    element: ${MAESTRO_TITLE}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: ${MAESTRO_TITLE}
- extendedWaitUntil:
    visible: ${MAESTRO_SIGNIN}
    timeout: 15000
