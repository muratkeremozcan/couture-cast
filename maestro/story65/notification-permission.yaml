# Story 6.5 owner: turn engagement notifications on through the product settings screen and
# answer the real OS permission dialog with ${MAESTRO_DIALOG_CHOICE}. The runner sets the OS
# permission state beforehand and checks the server binding afterwards.
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-app.yaml
- runFlow: open-settings-tab.yaml
# Centered, because iOS Settings has a fixed band above the tab bar that clips the bottom.
- scrollUntilVisible:
    element: ${MAESTRO_TITLE}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn: ${MAESTRO_TITLE}
- extendedWaitUntil:
    visible: ${MAESTRO_ENABLED}
    timeout: 30000
# The label and the Switch share one accessible name. Only the Switch can be checked, so
# "not visible as checked" means the Switch is off. Tree order differs by platform: the
# runner passes MAESTRO_SWITCH_INDEX (Android 1, iOS 0), and the checked assertion proves
# the Switch itself changed.
# A session refresh right after load can rebuild the draft, so retry until the Switch holds.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            notVisible:
              text: ${MAESTRO_ENABLED}
              checked: true
          commands:
            - tapOn:
                text: ${MAESTRO_ENABLED}
                index: ${MAESTRO_SWITCH_INDEX}
      - waitForAnimationToEnd
      - assertVisible:
          text: ${MAESTRO_ENABLED}
          checked: true
- tapOn: ${MAESTRO_SAVE}
- runFlow:
    when:
      visible: ${MAESTRO_DIALOG_CHOICE}
    commands:
      - takeScreenshot:
          path: os-dialog-${MAESTRO_CASE}
      - tapOn: ${MAESTRO_DIALOG_CHOICE}
- extendedWaitUntil:
    visible: ${MAESTRO_EXPECT_TEXT}
    timeout: 30000
- takeScreenshot:
    path: result-${MAESTRO_CASE}
