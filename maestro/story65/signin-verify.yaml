# Story 6.5 owner: real sign-in UI, step 2. MAESTRO_OTP arrives only as process environment
# (never argv or artifacts); the runner keeps this flow's debug output private.
appId: ${MAESTRO_APP_ID}
---
# iOS taps the code field by its testID. The label text and the input share one accessible name,
# so the index-1 match depends on layout order. (The focused attribute lands on a child node of
# the field in iOS hierarchies, so focus is recorded at failure, not gated here.)
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible:
            id: 'signin-code-input'
          timeout: 15000
      - tapOn:
          id: 'signin-code-input'
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          text: ${MAESTRO_CODE_LABEL}
          index: 1
- waitForAnimationToEnd
- inputText: ${MAESTRO_OTP}
- assertVisible: ${MAESTRO_OTP}
# iOS reports a failure when the simulator shows no software keyboard.
- hideKeyboard:
    optional: true
- tapOn: ${MAESTRO_VERIFY}
# verifyNativeOtp resolves the canonical app account, then the screen returns to settings,
# which renders the owner's preference controls.
- runFlow: wait-notification-settings.yaml
