# Story 6.5 owner: the runner opens the dev client on the owned Metro URL. This confirms the
# iOS open prompt, absorbs the dev-client onboarding sheet (it covers the tab bar on first
# load), returns from pushed stack screens and waits for the tab bar. Only ids and
# dev-client/OS text are matched, so it works in every app locale.
appId: ${MAESTRO_APP_ID}
---
- retry:
    maxRetries: 3
    commands:
      # An Android "isn't responding" dialog takes window focus, so the driver sees the dialog and
      # not the app behind it. Run 40908968432 (interaction lane, first flow): the failed step's
      # screen is the system dialog (android-anr, buttons "Close app" and "Wait") and tab-home was
      # never visible. A starved process on the runner raises it, not the app under test, and
      # maestro/subflows/open-app.yaml dismisses the same dialog for the mobile suite. "Wait" keeps
      # every process alive; "Close app" would kill one.
      - runFlow:
          when:
            platform: Android
            visible:
              id: 'android:id/aerr_wait'
          commands:
            - tapOn:
                id: 'android:id/aerr_wait'
                label: 'Dismiss an Android application-not-responding dialog'
      - extendedWaitUntil:
          visible: 'Open in .*|This is the developer menu.*|Connected to:'
          timeout: 10000
          optional: true
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
            - extendedWaitUntil:
                visible: 'This is the developer menu.*|Connected to:'
                timeout: 60000
                optional: true
      - runFlow:
          when:
            visible: 'This is the developer menu.*'
          commands:
            - tapOn: 'Continue'
      # Continue leaves the full dev menu open over the app; close it.
      - runFlow:
          when:
            visible: 'Connected to:'
          commands:
            - tapOn: 'Close'
      # Return from pushed stack screens (sign-in, notification settings) to the tabs.
      - repeat:
          times: 3
          commands:
            - runFlow:
                when:
                  visible: 'Navigate up'
                commands:
                  - tapOn: 'Navigate up'
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: 'BackButton'
                commands:
                  - tapOn:
                      id: 'BackButton'
                  - waitForAnimationToEnd
            - runFlow:
                when:
                  visible:
                    id: 'comments-close'
                commands:
                  - tapOn:
                      id: 'comments-close'
                  - waitForAnimationToEnd
            # iOS 18 exposes the native stack back item by its localized label only (no
            # BackButton id); the runner supplies the app locale's common.back.
            - runFlow:
                when:
                  platform: iOS
                  visible: ${MAESTRO_BACK}
                commands:
                  - tapOn: ${MAESTRO_BACK}
                  - waitForAnimationToEnd
      # An Android "isn't responding" dialog takes window focus, so the driver sees the dialog and
      # not the app behind it. Run 40908968432 (interaction lane, first flow): the failed step's
      # screen is the system dialog (android-anr, buttons "Close app" and "Wait") and tab-home was
      # never visible. A starved process on the runner raises it, not the app under test, and
      # maestro/subflows/open-app.yaml dismisses the same dialog for the mobile suite. "Wait" keeps
      # every process alive; "Close app" would kill one.
      - runFlow:
          when:
            platform: Android
            visible:
              id: 'android:id/aerr_wait'
          commands:
            - tapOn:
                id: 'android:id/aerr_wait'
                label: 'Dismiss an Android application-not-responding dialog'
      - extendedWaitUntil:
          visible:
            id: 'tab-home'
          timeout: 30000
