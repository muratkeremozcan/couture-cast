# Story 6.5 owner: select ${MAESTRO_LOCALE} through the real Settings language buttons. The
# choice syncs to the signed-in profile, so the runner selects a locale before every tap
# case (en-US included) instead of relying on what an earlier case left behind.
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-settings-tab.yaml
- scrollUntilVisible:
    element:
      id: 'locale-btn-${MAESTRO_LOCALE}'
    direction: UP
    # A top-row button cannot be centered beyond the scroll boundary.
    centerElement: false
    timeout: 15000
# tapOn reports COMPLETED whether or not the product received the press (run 40964148653:
# the fr-FR tap completed, the next screen was still English). The product disables a
# language button while it is the current locale and while a change is in flight (every
# button), and a failed change rolls back and enables the target again. So a tap is judged by
# the enabled attribute alone, which is device proven on iOS, in this order: tap only while
# the target reads enabled; (1) wait for the target to read disabled, so the press landed or
# the change started (another button reads enabled before a late press lands, so it cannot
# come first); (2) wait for a different language button to read enabled, so the change
# finished; (3) require the target to read disabled again, so it stayed selected. A lost press
# fails (1); a rollback enables the target and fails (3); either takes the next attempt.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: 'locale-btn-${MAESTRO_LOCALE}'
              enabled: true
          commands:
            - tapOn:
                id: 'locale-btn-${MAESTRO_LOCALE}'
      - extendedWaitUntil:
          visible:
            id: 'locale-btn-${MAESTRO_LOCALE}'
            enabled: false
          timeout: 6000
      # The id is a full-match regex that excludes the target; no locale id prefixes another.
      - extendedWaitUntil:
          visible:
            id: 'locale-btn-(?!${MAESTRO_LOCALE}).+'
            enabled: true
          timeout: 15000
      - extendedWaitUntil:
          visible:
            id: 'locale-btn-${MAESTRO_LOCALE}'
            enabled: false
          timeout: 6000
- waitForAnimationToEnd
