# Learning path Step 43: Realtime engagement and push notifications.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-43-realtime-engagement-and-push-notifications
# Story 6.5 owner: after the runner ends the app process and reopens it, the secure session
# must restore without a new sign-in. Today must load for the restored member (P2),
# the iOS back button must carry the localized label (P3), and the
# notification settings must render the member's controls.
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-app.yaml
- extendedWaitUntil:
    visible:
      id: 'weather-header'
    timeout: 30000
- assertNotVisible:
    id: 'home-session-unavailable'
- assertNotVisible:
    id: 'hero-retry'
- takeScreenshot:
    path: home-restored-${MAESTRO_CASE}
- runFlow: open-notification-settings.yaml
- runFlow:
    when:
      true: ${MAESTRO_PLATFORM == 'ios'}
    commands:
      - assertVisible: ${MAESTRO_BACK}
- runFlow: wait-notification-settings.yaml
- takeScreenshot:
    path: settings-restored-${MAESTRO_CASE}
