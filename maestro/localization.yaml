# Learning path Step 22: Localization infrastructure and quality gates.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-22-localization-infrastructure-and-quality-gates
# Story 3.2: End-user localization verification flow
appId: ${MAESTRO_APP_ID}
name: 'Mobile locale switch and localized hero'
tags:
  - e2e
  - localization
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# set-locale.yaml navigates to settings itself. This flow used to tap a
# `settings-tab` id, which `(tabs)/_layout.tsx` has never declared — it is
# `tab-settings` — so that step could only ever fail with "Element not found".
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: tr-TR

- assertVisible: 'Ayarlar'
- assertVisible: 'Dil'
- assertVisible: 'Türkçe'

- tapOn:
    text: 'Ana Sayfa'
    retryTapIfNoChange: true

- assertVisible: 'Sabah gezisi'
- assertVisible: 'Saatlik tahmin'
- assertVisible: 'Genişlet (48 sa)'

- takeScreenshot:
    path: maestro/artifacts/localization-tr-TR

# --- Restore the shared fixture ---------------------------------------------
#
# Every flow in this suite runs as the one user `scripts/run-maestro.mjs` signs
# up, and the locale choice is synced to that user's profile, not just to device
# storage. So a Turkish locale left behind here does not stop at the next
# `clearState: true` — it is refetched with the profile and every later flow in
# the run asserts English copy against a Turkish app. This flow must put the
# locale back the way it found it, exactly as commerce-affiliate.yaml restores
# the affiliate opt-out it toggles.
- runFlow:
    file: subflows/set-locale.yaml
    env:
      LOCALE: en-US

- extendedWaitUntil:
    visible: 'Language'
    timeout: 15000
    label: 'Locale is back to English for the flows that follow'
