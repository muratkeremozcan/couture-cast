# Learning path Step 44: Community city spotlight.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-44-community-city-spotlight
# Learning path Step 72: Calm Community with an empty state.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-72-calm-community-with-an-empty-state
# The isolated CI API seeds a read-only Chicago cohort with seven ranked looks.
appId: ${MAESTRO_APP_ID}
name: 'Community City Spotlight'
tags:
  - e2e
  - community
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-community-tab.yaml
- tapOn:
    id: 'community-climate-filter'
- tapOn:
    id: 'community-filter-chip-all'
- extendedWaitUntil:
    visible:
      id: 'community-card-image-loaded-seed-spotlight-1'
    timeout: 20000
- scrollUntilVisible:
    element:
      id: 'community-card-near-you-seed-spotlight-1'
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertVisible:
    id: 'community-card-near-you-seed-spotlight-1'
    text: 'Near you'
- tapOn:
    id: 'community-card-title-seed-spotlight-1'
- extendedWaitUntil:
    visible:
      id: 'community-spotlight-detail-rank'
    timeout: 10000
- assertVisible:
    id: 'community-spotlight-detail-rank'
    text: 'Rank 1'
- assertVisible:
    id: 'community-post-card-seed-spotlight-1'
    below:
      id: 'community-spotlight-detail-rank'
- tapOn:
    id: 'app-top-bar-back'
- extendedWaitUntil:
    notVisible:
      id: 'community-spotlight-detail-rank'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'community-spotlight-view-more'
    direction: DOWN
    centerElement: true
    timeout: 60000
- tapOn:
    id: 'community-spotlight-view-more'
- scrollUntilVisible:
    element:
      id: 'community-card-near-you-seed-spotlight-7'
    direction: UP
    timeout: 30000
- assertVisible:
    id: 'community-card-near-you-seed-spotlight-7'
    text: 'Near you'
- assertNotVisible:
    id: 'community-spotlight-view-more'
