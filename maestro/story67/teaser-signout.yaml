# Story 6.7 owner: the identity change behind the teaser fallback. Signs out through the
# product UI while Home is in the background; Home drops the member's teaser at once.
appId: ${MAESTRO_APP_ID}
---
- runFlow: ../story65/open-notification-settings.yaml
# Sign out is the last control; on an iPhone SE it starts below the fold.
- scrollUntilVisible:
    element: ${MAESTRO_SIGNOUT}
    direction: DOWN
    timeout: 15000
- tapOn: ${MAESTRO_SIGNOUT}
- extendedWaitUntil:
    notVisible: ${MAESTRO_ENABLED}
    timeout: 15000
    label: 'The member controls are gone: signed out'
# Back to the Settings tab root, so one Android back from here is the way Home.
- repeat:
    while:
      notVisible:
        id: 'settings-screen'
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Navigate up'
          commands:
            - tapOn: 'Navigate up'
      # CC-7.9 D6: Back is the shared top bar control; it replaced the native
      # iOS `BackButton` header item on notification settings.
      - runFlow:
          when:
            visible:
              id: 'app-top-bar-back'
          commands:
            - tapOn:
                id: 'app-top-bar-back'
            - waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: 'settings-screen'
    timeout: 15000
    label: 'The Settings tab is up, one back away from Home'
