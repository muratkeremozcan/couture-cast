# Learning path Step 33: Affiliate "Shop this look" CTA.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-33-affiliate-shop-this-look-cta
# Story 5.1: affiliate "Shop this look" CTA, disclosure placement, and opt-out.
#
# Runs against the seeded `sample-partner` catalog (decision 14) plus the
# public-API user the Maestro runner creates. There is no public catalog API and
# there is not supposed to be one, so the offer rows must already be in the
# database; `scripts/run-maestro.mjs` only creates the user, the location, and
# the first ritual.
#
# The fresh user owns no garments, so every outfit slot is a
# `default-{category}` placeholder. Those match only wildcard offers, which is
# exactly what the seed publishes: `comfort_range: null` at `locale_region: '*'`.
appId: ${MAESTRO_APP_ID}
name: 'Affiliate shop this look CTA and opt-out'
tags:
  - e2e
  - commerce
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- extendedWaitUntil:
    visible: 'Morning commute'
    timeout: 30000

# --- AC 1: the CTA renders, disclosed, on an eligible card -------------------

# The affiliate block is the last child of the outfit card, below the comfort
# notes, the reasoning badges and the garment tiles, so it starts off-screen on
# every device this suite runs on. Maestro only sees what is rendered *and* on
# screen, so this has to scroll rather than wait: waiting alone would time out
# against a perfectly healthy card.
#
# Scroll to the block's LAST element rather than the block itself.
# `scrollUntilVisible` stops the moment its target becomes visible, and the
# container qualifies as soon as its first line does, which left the CTA below
# the fold and failed the very next assertion. Targeting the trailing line puts
# the whole block on screen, which the `below:` reading-order checks need anyway.
- scrollUntilVisible:
    element:
      id: 'shop-this-look-opens-in-browser'
    direction: DOWN
    timeout: 30000
    label: 'Bring the whole affiliate block on screen'

- assertVisible:
    id: 'shop-this-look-block'

- assertVisible: 'Paid partnership. CoutureCast may earn a commission.'
- assertVisible: 'Presented by Sample Partner'
- assertVisible: 'Opens in an in-app browser'

# The CTA is asserted by id, and its accessible name asserted separately in
# full.
#
# `assertVisible: 'Shop this look'` could never pass here, and not because the
# control was missing. The Pressable sets its own `accessibilityLabel`, which
# collapses the inner Text into the composed name, so the only node in the
# native hierarchy carrying those words reads "Shop this look. Presented by
# Sample Partner. Opens in an in-app browser". Maestro matches a text selector
# against the whole string, so the substring never matched a healthy, fully
# rendered CTA.
#
# Asserting the composed name in full is also the stronger check: decision 16
# fixes that order deliberately -- control label first, so a speech-input user's
# accessible name begins with what they can actually read -- and this pins it.
- assertVisible:
    id: 'shop-this-look-cta'
    label: 'The affiliate CTA control is on screen'
- assertVisible:
    text: 'Shop this look. Presented by Sample Partner. Opens in an in-app browser'
    label: 'Accessible name leads with the visible control label (decision 16)'

# PRD FR5.1 accepts only a disclosure that is visible BEFORE the click, so the
# relative position is the assertion, not merely that both are on screen. A
# disclosure moved below the control, into a tooltip, or into a post-tap
# interstitial fails here.
- assertVisible:
    id: 'shop-this-look-cta'
    below:
      text: 'Paid partnership. CoutureCast may earn a commission.'
    label: 'Disclosure renders above the control in reading order'

- assertVisible:
    text: 'Presented by Sample Partner'
    below:
      text: 'Paid partnership. CoutureCast may earn a commission.'

- takeScreenshot:
    path: maestro/artifacts/commerce-affiliate-cta-disclosed

# --- AC 3: the settings section discloses the integration --------------------

- runFlow: subflows/open-settings.yaml

- extendedWaitUntil:
    visible: 'Shopping and partners'
    timeout: 15000

# PRD NFR Security 4 wants the third-party disclosure alongside the toggle, not
# behind it, so the paragraph is asserted in full rather than by its heading.
- assertVisible:
    text: 'When affiliate suggestions are on, tapping one opens a partner site and tells that partner the visit came from CoutureCast. CoutureCast may earn a commission. No wardrobe photos or personal details are shared.'
    label: 'Third-party disclosure is visible in settings'

- assertVisible:
    id: 'commerce-opt-out-toggle'
    below:
      text: 'Shopping and partners'
    label: 'Disclosure and heading precede the toggle'

- takeScreenshot:
    path: maestro/artifacts/commerce-affiliate-settings-disclosure

# --- AC 3: turning the opt-out off hides the CTA -----------------------------

# Tapped by id rather than by text: the visible label embeds escaped double
# quotes (`Show "Shop this look" suggestions`), which no Maestro text selector
# should have to carry.
- tapOn:
    id: 'commerce-opt-out-toggle'
    retryTapIfNoChange: true
    label: 'Turn affiliate suggestions off'

- extendedWaitUntil:
    visible: 'Shopping preferences updated'
    timeout: 15000
    label: 'The write round-tripped to the API'

- takeScreenshot:
    path: maestro/artifacts/commerce-affiliate-opted-out

# Relaunch WITHOUT clearing state. The device ritual cache is minutes old, so
# this is the exact path decision 6 exists to close: the cached payload is still
# young enough to be served without a network call, and it must not resurrect a
# CTA the user just switched off.
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: false
    stopApp: true

- runFlow: subflows/open-app.yaml

- extendedWaitUntil:
    visible: 'Morning commute'
    timeout: 30000

# Scroll to where the block would be before asserting it is not there.
#
# `assertNotVisible` on content that is merely below the fold passes for the
# wrong reason: the CTA could still be rendering happily and this flow would
# call it hidden. Scrolling to the garment tiles, which sit immediately above
# the affiliate block, and then one screen further puts the assertion at the
# bottom of the card where the block would be if it existed. That is what makes
# the absence falsifiable.
- runFlow: subflows/scroll-to-card-bottom.yaml

- assertNotVisible:
    id: 'shop-this-look-block'
    label: 'A cache-served payload never renders a CTA'
- assertNotVisible:
    text: 'Paid partnership. CoutureCast may earn a commission.'
- assertNotVisible: 'Presented by Sample Partner'

# Relaunch WITH a cleared state. No device cache survives, so the card can only
# come from a fresh GET /api/v1/ritual. That proves the server itself is now
# emitting `shopThisLook: null`, which is the enforcement the client-side rule
# above deliberately does not rely on.
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: true

- runFlow: subflows/open-app.yaml

- extendedWaitUntil:
    visible: 'Morning commute'
    timeout: 30000

- runFlow: subflows/scroll-to-card-bottom.yaml

- assertNotVisible:
    id: 'shop-this-look-block'
    label: 'The server withholds the offer for an opted-out user'
- assertNotVisible:
    text: 'Paid partnership. CoutureCast may earn a commission.'
# By id, not by text. `assertNotVisible: 'Shop this look'` passed here for the
# wrong reason: no node ever carries that text on its own, so the assertion was
# green whether or not the CTA rendered -- the same non-falsifiable shape the
# opt-out checks above were already fixed for.
- assertNotVisible:
    id: 'shop-this-look-cta'

- takeScreenshot:
    path: maestro/artifacts/commerce-affiliate-cta-hidden

# --- AC 3: turning it back on restores the CTA -------------------------------
#
# Also leaves the shared fixture the way it was found, so a later flow on the
# same account does not inherit an opt-out it never made.

- runFlow: subflows/open-settings.yaml

- extendedWaitUntil:
    visible: 'Shopping and partners'
    timeout: 15000

- tapOn:
    id: 'commerce-opt-out-toggle'
    retryTapIfNoChange: true
    label: 'Turn affiliate suggestions back on'

- extendedWaitUntil:
    visible: 'Shopping preferences updated'
    timeout: 15000

- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: true

- runFlow: subflows/open-app.yaml

- scrollUntilVisible:
    element:
      id: 'shop-this-look-opens-in-browser'
    direction: DOWN
    timeout: 30000
    label: 'The CTA returns once affiliate suggestions are on again'

- assertVisible: 'Paid partnership. CoutureCast may earn a commission.'
- assertVisible:
    id: 'shop-this-look-cta'
    label: 'The CTA control is back'

- takeScreenshot:
    path: maestro/artifacts/commerce-affiliate-cta-restored
