# Learning path Step 38: Community feed by climate band.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-38-community-feed-by-climate-band
# Learning path Step 72: Calm Community with an empty state.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-72-calm-community-with-an-empty-state
# The runner signs in a synthetic member against the isolated CI API. The seeded
# Spotlight cohort is shared and read-only. Cancel the report without creating one.
appId: ${MAESTRO_APP_ID}
name: 'Community feed by climate band'
tags:
  - e2e
  - community
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-community-tab.yaml
- extendedWaitUntil:
    visible:
      id: 'community-new-post-button'
    timeout: 20000
- assertVisible:
    text: 'Post'

- tapOn:
    id: 'community-climate-filter'
- extendedWaitUntil:
    visible:
      id: 'community-climate-sheet'
    timeout: 10000
- assertVisible:
    id: 'community-filter-chip-auto'
- assertVisible:
    id: 'community-filter-chip-all'
- assertNotVisible:
    id: 'community-band-unresolved'
- tapOn:
    id: 'community-filter-chip-all'
- extendedWaitUntil:
    notVisible:
      id: 'community-climate-sheet'
    timeout: 10000
- assertVisible:
    text: 'All climates'
- extendedWaitUntil:
    visible:
      id: 'community-card-image-loaded-seed-spotlight-1'
    timeout: 20000
- assertNotVisible:
    id: 'community-feed-empty'
- assertNotVisible:
    id: 'community-feed-error'
- takeScreenshot:
    path: maestro/artifacts/community-feed-populated

- scrollUntilVisible:
    element:
      id: 'community-card-title-seed-spotlight-1'
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'community-card-actions'
    index: 0
- assertVisible:
    id: 'community-card-report-seed-spotlight-1'
- assertNotVisible:
    id: 'community-card-withdraw-seed-spotlight-1'
# Story 6.7 R57: the report dialog with the keyboard up. Its translucent window is
# edge to edge, so only the dialog's own keyboard view keeps its buttons above the
# keyboard. Cancel sits below the details field: a tap that landed on the keyboard
# instead would leave the dialog open, and the assertion after it would fail.
- tapOn:
    id: 'community-card-report-seed-spotlight-1'
- extendedWaitUntil:
    visible:
      id: 'submit-report-button'
    timeout: 15000
# The details field sits below the reasons, inside the dialog's own scroll view.
# Centered, so the dialog really scrolls on iOS too: Maestro's iOS hierarchy gives a
# clipped field its whole frame, counts it visible without scrolling, and the tap
# landed on Cancel below it (R64).
- scrollUntilVisible:
    element:
      id: 'report-details-input'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'report-details-input'
# A three-line value, so the field shows its multiline height above the keyboard.
- inputText: 'Keyboard check'
- pressKey: Enter
- inputText: 'second line'
- pressKey: Enter
- inputText: 'third line'
# The counter under the field proves the whole value reached it: 14 + 1 + 11 + 1 + 10.
- assertVisible:
    id: 'report-details-count'
    text: '37 of 500 characters'
# R66: while the member writes details the reasons leave the layout, so no reason row
# is cut by the scroll edge above the field, and the field and its counter show whole.
- assertNotVisible:
    id: 'report-reason-spam'
- takeScreenshot:
    path: maestro/artifacts/community-report-keyboard
- tapOn:
    id: 'cancel-report-button'
    label: 'Cancel, with the keyboard still up, sends nothing'
- assertNotVisible:
    id: 'report-details-input'

# --- The compose entry point opens and closes -------------------------------

- tapOn:
    id: 'community-new-post-button'
    retryTapIfNoChange: true
    label: 'Open the compose sheet'

- extendedWaitUntil:
    visible:
      id: 'community-post-sheet-content'
    timeout: 15000
    label: 'Compose sheet is presented'

- assertVisible:
    text: 'Share your look'
    label: 'Localized sheet title'

- assertVisible:
    id: 'community-pick-image-button'
    label: 'Photo selection is the first step of the compose flow'

# Alt text is required and must be CONFIRMED before publishing; the contract
# types `altTextConfirmed` as a literal `true` so an unconfirmed publish is
# impossible. Both controls therefore have to exist before a photo is chosen.
- assertVisible:
    id: 'community-alt-text-input'
    label: 'Alt text is part of composing, not an afterthought'

- assertVisible:
    id: 'community-confirm-alt-text'
    label: 'The author must confirm the alt text they publish'

- takeScreenshot:
    path: maestro/artifacts/community-compose-sheet

# Story 6.7 R57: the caption with the keyboard up. The sheet's keyboard view lifts it
# above the keyboard; the screenshot shows the field and its counter there.
- tapOn:
    id: 'community-caption-input'
- inputText: 'Keyboard check'
- assertVisible:
    id: 'community-caption-count'
    text: '14 of 280 characters'
# R16: iOS reports an element the scroll view clips as visible, so the two checks
# above pass for a field hidden under the pinned Publish button. The sheet renders
# this marker only while the caption's label row, counter and field all lie inside
# the scroll view's visible frame, computed from its scroll state.
- extendedWaitUntil:
    visible:
      id: 'community-caption-in-view'
    timeout: 5000
    label: 'The focused caption and its counter are inside the visible scroll frame'
- takeScreenshot:
    path: maestro/artifacts/community-compose-keyboard
# R65: Publish sits below the caption and stays disabled without a photo, so a tap on
# it changes nothing when the sheet is lifted. A sheet left under the keyboard would
# put that tap on a key and type into the caption, and the counter would move.
- assertVisible:
    id: 'community-caption-input'
- assertVisible:
    id: 'community-publish-button'
- tapOn:
    id: 'community-publish-button'
    label: 'Tap Publish with the keyboard still up'
- assertVisible:
    id: 'community-caption-count'
    text: '14 of 280 characters'
    label: 'The tap reached Publish, above the keyboard, and typed nothing'

# R20: writing alt text means looking at the photo. With the description field
# focused and the keyboard up, the member scrolls the sheet back to the photo, and
# the frame must stay there. It used to snap back to the focused field on every
# scroll. iOS reports a control the frame clips as visible, so the check reads
# `community-photo-in-view`, which the sheet renders only while the whole photo
# section lies inside the frame, from its scroll state. The swipes drag inside the
# sheet, above the keyboard, and the marker is checked after the frame settles,
# so a snap back fails here.
- tapOn:
    id: 'community-alt-text-input'
    label: 'Focus the image description with the keyboard up'
- repeat:
    while:
      notVisible:
        id: 'community-photo-in-view'
    times: 4
    commands:
      - swipe:
          start: '50%, 20%'
          end: '50%, 50%'
          duration: 600
      - waitForAnimationToEnd
- waitForAnimationToEnd
- assertVisible:
    id: 'community-photo-in-view'
    label: 'The whole photo stays in view after the member scrolls to it'
- assertVisible:
    id: 'community-pick-image-button'
# The field kept focus while out of view: what is typed now lands in it.
- inputText: 'A'
- repeat:
    while:
      notVisible:
        id: 'community-alt-text-input'
        text: 'A'
    times: 4
    commands:
      - swipe:
          start: '50%, 45%'
          end: '50%, 25%'
          duration: 600
      - waitForAnimationToEnd
- assertVisible:
    id: 'community-alt-text-input'
    text: 'A'
    label: 'The image description kept focus while the member looked at the photo'
- takeScreenshot:
    path: maestro/artifacts/community-compose-alt-focused

- tapOn:
    id: 'community-post-sheet-close'
    label: 'Close the sheet without publishing'

# Story CC-7.11 D13: the draft holds an image description, so X asks before it drops it.
- extendedWaitUntil:
    visible: 'Discard this post\?'
    timeout: 10000
    label: 'A dirty draft asks before it is dropped'
- tapOn:
    text: '(?i)^discard$'
    label: 'Discard the draft'

- assertNotVisible:
    id: 'community-post-sheet-content'

# Nothing was published, so nothing needs cleaning up: the filter selection is
# component state that the next flow's `launchApp: clearState: true` discards,
# and this flow pushed no route. `chip-navigation-bottom-nav.yaml` likewise ends
# on this tab. The sheet IS closed above, because leaving a modal open would
# cover the next flow's first assertion on this device.
- assertVisible:
    id: 'community-screen'
    label: 'The flow ends where it started, with no modal covering the screen'
