# Story 6.15 live font-scale proof (scripts/run-live-font-proof.mjs). Learning path Step 55.
# A React update after the scale change: the watermark toggle re-renders the preview block.
appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: share-card-watermark
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded.*
    timeout: 30000
