# Story 6.15 live font-scale proof (scripts/run-live-font-proof.mjs). Learning path Step 55.
# A React update after the scale change. Show every band, then return to the viewer's band (revert-community.yaml).
appId: ${MAESTRO_APP_ID}
---
- scrollUntilVisible:
    element:
      id: community-filter-chip-all
    direction: DOWN
    timeout: 20000
- tapOn:
    id: community-filter-chip-all
- waitForAnimationToEnd
