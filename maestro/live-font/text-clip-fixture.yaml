# Story 6.15 F-00i: the text layout probe's native fixture (apps/mobile/app/text-clip-fixture.tsx),
# opened by deep link in a probe build (COUTURE_TEXT_LAYOUT_PROBE=1 and
# EXPO_PUBLIC_TEXT_LAYOUT_PROBE=1). The Story 6.8 test build's scheme is the default; pass
# APP_SCHEME for another build. Learning path Step 55.
appId: ${MAESTRO_APP_ID}
env:
  APP_SCHEME: couturecast-story68
---
- openLink: ${APP_SCHEME}://text-clip-fixture
# iOS sometimes asks before handing the link to the app (Open in "CoutureCast Story68"?, seen
# 2026-11-14 on accessibility-medium, absent on the next launches). Answer it when it shows.
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: 'Open'
- extendedWaitUntil:
    visible:
      id: text-clip-healthy
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: text-clip-mutant
    timeout: 30000
