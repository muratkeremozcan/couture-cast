# Story 6.15 live font-scale proof (scripts/run-live-font-proof.mjs). Learning path Step 55.
# A React update after the scale change. Pick another English locale, then return (revert-settings.yaml).
appId: ${MAESTRO_APP_ID}
---
- scrollUntilVisible:
    element:
      id: locale-btn-en-CA
    direction: DOWN
    timeout: 20000
- tapOn:
    id: locale-btn-en-CA
- waitForAnimationToEnd
