# Story 6.15 live font-scale proof (scripts/run-live-font-proof.mjs). Learning path Step 55.
# Home loads the Shop this look offer after the outfit, so the flow waits for it below the fold
# before returning to the top; otherwise a capture can miss text a later one shows.
appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: current-temperature
    direction: UP
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: current-condition
    timeout: 30000
- scrollUntilVisible:
    element:
      id: shop-this-look-offer-title
    direction: DOWN
    timeout: 30000
- scrollUntilVisible:
    element:
      id: current-temperature
    direction: UP
    timeout: 30000
