# Story 6.15 live font-scale proof (scripts/run-live-font-proof.mjs). Learning path Step 55.
# Opens the share-card composer from Home's outfit, as Story 6.8's Release flow does.
appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: weather-header(-skeleton)?
    direction: UP
    timeout: 30000
- scrollUntilVisible:
    element:
      id: outfit-share-card-open
    direction: DOWN
    timeout: 30000
    centerElement: true
# At the largest text sizes the sticky header and chip row grow, and a centered button can still
# sit under them. Maestro's hierarchy ignores occlusion, so it rates that button visible and the
# tap lands on a chip (iOS accessibility-medium, 2026-11-14: the Community chip). Scrolling the
# content down brings the button below the chip row before the tap.
- scrollUntilVisible:
    element:
      id: outfit-share-card-open
      below:
        id: chip-sponsored
    direction: UP
    timeout: 30000
    label: 'Bring the share button below the sticky chip row'
- tapOn:
    id: outfit-share-card-open
    below:
      id: chip-sponsored
# A tap that missed the button and selected a chip fails here, with its own message, instead of
# timing out on the composer below. With the composer open, the chip row is hidden behind it.
- assertNotVisible:
    id: chip-community
    selected: true
    label: 'open-composer tapped the Community chip instead of the share button'
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded.*
    timeout: 30000
