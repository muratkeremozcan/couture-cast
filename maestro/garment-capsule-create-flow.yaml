# Learning path Step 31: Outfit capsule builder.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-31-outfit-capsule-builder
# Story 4.3 Task 8: mobile capsule creation and reopen, verifying persisted order.
appId: ${MAESTRO_APP_ID}
name: 'Outfit capsule create and reopen'
tags:
  - e2e
  - wardrobe
  - capsules
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# `wardrobe-capsules-link` lives on the wardrobe hub, but the app opens on
# Home, so this flow never had a step to get there and the tap could only
# ever report the link "not found".
- runFlow: subflows/open-wardrobe-tab.yaml

- runFlow: subflows/open-capsules.yaml

- tapOn:
    id: 'create-capsule-button'

- assertVisible:
    id: 'capsule-name-input'

- tapOn:
    id: 'capsule-name-input'

# Cleared before typing, and the result checked.
#
# A sharded Android run committed a capsule called `MMaestro capsule` — the
# leading character duplicated. `inputText` reaches an Android device through
# adb rather than the soft keyboard, and under the load of four emulators the
# first character can arrive twice. Nothing downstream notices: the capsule
# saves, the library shows it, and the flow only fails much later at
# `assertVisible: 'Maestro capsule'`, several steps from the cause.
#
# `text:` is matched against the WHOLE element, so `Maestro capsule` does not
# match `MMaestro capsule` and the assertion is right to reject it. That is
# worth keeping in mind before treating a name assertion as too strict: here the
# strictness is the only reason a corrupted name was ever noticed.
#
# `eraseText` first, because the field may already hold a partial value from a
# previous attempt, and the retry proves what was actually typed rather than
# trusting that `inputText` delivered it.
- retry:
    maxRetries: 3
    commands:
      - eraseText
      - inputText: 'Maestro capsule'
      - assertVisible:
          text: 'Maestro capsule'
          label: 'The capsule name field holds exactly the intended name'

# Dismiss the keyboard before touching the garment list, on iOS only.
#
# The software keyboard stays up after `inputText` and covers the lower half of
# the builder, which is where the garment checkboxes live. Maestro reported both
# selection taps COMPLETED because it found the elements in the hierarchy, but
# the touches landed on the keyboard: nothing was selected, so the garment-order
# section -- which only renders once at least one garment is selected -- was
# absent from the hierarchy entirely, and the reorder step failed looking for
# controls the app had no reason to draw.
#
# On Android the same command closes the builder. Maestro dismisses the keyboard
# there with a key press that React Native also treats as a request to dismiss
# the modal, so the whole capsule builder goes with it. The step statuses show it
# exactly: the `create-capsule-button` tap COMPLETED, `capsule-name-input`
# asserted visible and was typed into, `hideKeyboard` COMPLETED, and then the
# first `garment-checkbox-.*` tap failed with the capsule *library* on screen and
# `create-capsule-button` visible on it again. Nothing else runs between those
# two steps.
#
# Android does not need it in the first place: text arrives through adb rather
# than the soft keyboard, so there is nothing covering the checkboxes to dismiss.
- runFlow:
    when:
      platform: iOS
    commands:
      - hideKeyboard

# Select two garments BY ID, not by position.
#
# These were `garment-checkbox-.*` with `index: 0` and `index: 1`. `index`
# resolves against what is currently RENDERED, and with ten seeded garments the
# list is virtualized, so the second tap landed somewhere other than the second
# garment. Nothing caught it: the flow asserted no count, so the builder sat on
# `Garments (1 of 10 selected)` while the flow believed it held two, and every
# later step still passed. The reorder controls render for a single garment, so
# even those did not object.
#
# The runner seeds these garments through the public API and now passes two of
# their ids, the same way it already passes WEATHER_ALERT_ID. Selecting by id is
# independent of render order, scroll position and wardrobe size.
#
# Scrolled to, not merely tapped. Selecting by id removed the positional
# ambiguity but not the virtualization that caused it: the builder renders ten
# seeded garments in a virtualized list, so a garment below the fold is not in
# the hierarchy at all and `tapOn` reports it as
# `Element not found: Id matching regex: garment-checkbox-<uuid>`. That is the
# exact failure this flow hit on Android. Both are scrolled to rather than only
# the second, because which ids land above the fold depends on seeding order,
# screen height and platform, none of which this flow should be sensitive to.
- scrollUntilVisible:
    element:
      id: 'garment-checkbox-${GARMENT_A_ID}'
    direction: DOWN
    centerElement: true
    timeout: 15000
    label: 'Bring the first seeded garment on screen'
- waitForAnimationToEnd

# Tap, then prove the tap took, and retry the pair if it did not.
#
# `tapOn` reports COMPLETED once it has resolved the element and dispatched a
# touch, which is not the same as the app having handled it. Measured here in
# isolation: the tap on the FIRST garment completed in 2.4s, the checkbox was
# present, `clickable=true`, and unobstructed at the exact point tapped
# (`[45,1807][1035,1924]`, nothing above it in the hierarchy at 540,1865) — and
# the label still read `Garments (0 of 10 selected)` ten seconds later. The
# touch is lost somewhere between the driver and React Native's handler.
#
# The assertion inside the retry is the real one, so this tolerates a lost touch
# without weakening what the flow proves: after this block a garment IS
# selected, or the flow fails. Asserting per tap rather than once at the end is
# what identified which of the two taps was losing, since both reported
# COMPLETED and only the end-of-sequence count disagreed.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'garment-checkbox-${GARMENT_A_ID}'
          label: 'Select the first seeded garment'
      - extendedWaitUntil:
          visible:
            text: 'Garments \(1 of .* selected\)'
          timeout: 10000
          label: 'The first garment registered as selected'

# Back to the top of the builder before searching for the second garment.
#
# `scrollUntilVisible` only ever travels in the direction it is given, and the
# search for the first garment has already scrolled the list down. The wardrobe
# renders newest-first, so the second seeded garment is ABOVE the first, and a
# second DOWN search starts past it and travels further away. Measured here:
# the two land adjacent (`[45,1690]` and `[45,1807]`), so today the second is
# still on screen and the DOWN search is a harmless no-op — but that is the
# wardrobe size and seeding order of this fixture, not a property the flow
# should depend on.
#
# Returning to a known position first makes the second search identical to the
# first: from the top, going down, whatever the order. The capsule name input is
# the builder's own first field, so it is the top of this scroll container.
- scrollUntilVisible:
    element:
      id: 'capsule-name-input'
    direction: UP
    timeout: 15000
    label: 'Return to the top of the capsule builder'
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: 'garment-checkbox-${GARMENT_B_ID}'
    direction: DOWN
    centerElement: true
    timeout: 15000
    label: 'Bring the second seeded garment on screen'
- waitForAnimationToEnd

# Same shape as the first garment, and for the same reason: a tap that reports
# COMPLETED is not a tap the app handled.
- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'garment-checkbox-${GARMENT_B_ID}'
          label: 'Select the second seeded garment'
      - extendedWaitUntil:
          visible:
            text: 'Garments \(2 of .* selected\)'
          timeout: 10000
          label: 'The second garment registered as selected'

# The postcondition, so a mis-tap fails here rather than several steps later as
# a confusing message about a missing reorder button.
- assertVisible:
    # Parentheses escaped. Maestro treats `text:` as a regex, so the unescaped
    # form `Garments (2 of .* selected)` reads the brackets as a capture group
    # and requires the literal string `Garments 2 of ... selected`. The label on
    # screen is `Garments (2 of 10 selected)`, brackets included, so the
    # unescaped pattern could not match however many garments were selected.
    text: 'Garments \(2 of .* selected\)'
    label: 'Both garments are actually selected'

# Reorder through the accessible controls, never through drag alone.
#
# Scrolled to first: the reorder section sits below the full garment list inside
# the builder's scrolling modal, so with a seeded four-garment wardrobe the
# controls start off-screen and a bare tap reports them "not found".
- scrollUntilVisible:
    element:
      id: 'move-down-button-.*'
    direction: DOWN
    centerElement: true
    timeout: 15000
    label: 'Bring the garment-order controls on screen'
- waitForAnimationToEnd

- tapOn:
    id: 'move-down-button-.*'
    index: 0
    label: 'Move the first garment down'

- tapOn:
    id: 'save-capsule-button'

- assertVisible:
    text: 'Maestro capsule'
    label: 'Committed capsule appears in the library'

# Reopen and confirm the order survived the round trip.
- tapOn:
    id: 'edit-capsule-button-.*'
    index: 0

- assertVisible:
    id: 'reorder-row-.*'
    label: 'Garment order list is restored'

- tapOn:
    id: 'close-modal-button'

# Public-API cleanup: remove the capsule created by this flow.
- tapOn:
    id: 'delete-capsule-button-.*'
    index: 0
- tapOn:
    text: 'Delete capsule'
    label: 'Confirm the destructive action'

- assertNotVisible:
    text: 'Maestro capsule'
