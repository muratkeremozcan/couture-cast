# Learning path Step 64: Garment delete.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-64-garment-delete
# Story 7.6 test plan 7.6-MAE-001: on Android, delete a ready garment from its detail. The hub
# hides it with Deleted and Undo; Undo brings it back; a second Delete commits once the window
# ends. The flow's after hook proves that commit reached the API.
#
# The garment is this flow's own: `FLOW_STATE_HOOKS` (scripts/lib/mobile-e2e-flow-state.mjs,
# GARMENT_DELETE_FLOW) seeds one ready dress before every attempt. After the flow it waits until
# the dress is no longer active (purged, or pending the sweep) and fails the flow with
# `garment_delete_not_committed` if it stays active, then removes what is left. The flow itself
# never relaunches after the commit: the DELETE leaves when the window closes and a force stop
# could cancel it in flight. `run-maestro.mjs` lists the flow in USER_SCOPED_FLOWS, the serial
# runs that call these hooks.
#
# The Undo window is five seconds of real time, so only the steps that must happen inside it
# (the Undo bar, the hidden card, the Undo tap) run between Delete and Undo.
# No other flow seeds or selects a dress, so the shared top, bottom, outerwear and shoes that the
# capsule and tag-edit flows use are never touched. The dress has no stored photo, so its card
# shows the placeholder and is found by its category label. It is the newest garment, so the
# closet lists it first.
appId: ${MAESTRO_APP_ID}
name: 'Garment delete with Undo'
tags:
  - e2e
  - wardrobe
  - garment-delete
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- runFlow: subflows/open-wardrobe-tab.yaml

- scrollUntilVisible:
    element:
      id: 'garment-open-.*'
      text: '.*[Dd]ress.*'
    direction: DOWN
    timeout: 20000

- tapOn:
    id: 'garment-open-.*'
    text: '.*[Dd]ress.*'

- extendedWaitUntil:
    visible:
      id: 'garment-detail'
    timeout: 15000
- assertVisible:
    id: 'garment-detail-category'
    text: 'Dress'

# An unused piece: no prompt, the detail pops back to the hub and the piece is hidden at once.
- scrollUntilVisible:
    element:
      id: 'garment-delete'
    direction: DOWN
- tapOn:
    id: 'garment-delete'

# Inside the window: the Undo bar is up and the dress is hidden. An Undo bar means no prompt
# opened, so the unused piece never asked.
- extendedWaitUntil:
    visible:
      id: 'status-bar-action-undo'
    timeout: 10000
- assertNotVisible:
    id: 'garment-open-.*'
    text: '.*[Dd]ress.*'

# Undo inside the window: nothing is sent and the piece is back.
- tapOn:
    id: 'status-bar-action-undo'
- extendedWaitUntil:
    visible:
      text: 'Undone'
    timeout: 5000
- scrollUntilVisible:
    element:
      id: 'garment-open-.*'
      text: '.*[Dd]ress.*'
    direction: UP
    timeout: 10000

# Delete again and let the window end: the DELETE is sent and the notice closes. Nothing here is
# timed against the window, so the bar's copy and the screenshot are taken now.
- tapOn:
    id: 'garment-open-.*'
    text: '.*[Dd]ress.*'
- extendedWaitUntil:
    visible:
      id: 'garment-detail'
    timeout: 15000
- scrollUntilVisible:
    element:
      id: 'garment-delete'
    direction: DOWN
- tapOn:
    id: 'garment-delete'
# The bar's container carries the test id and its child Text carries the copy, so the two are
# asserted separately: one native element never holds both.
- extendedWaitUntil:
    visible:
      id: 'status-bar-action-undo'
    timeout: 10000
- assertVisible:
    id: 'status-feedback-bar'
- assertVisible:
    text: 'Deleted'
- assertVisible:
    id: 'wardrobe-screen'
- assertNotVisible:
    id: 'garment-open-.*'
    text: '.*[Dd]ress.*'
- takeScreenshot:
    path: maestro/artifacts/garment-delete-undo-window
- extendedWaitUntil:
    notVisible:
      id: 'status-bar-action-undo'
    timeout: 20000
- assertNotVisible:
    id: 'garment-open-.*'
    text: '.*[Dd]ress.*'

- takeScreenshot:
    path: maestro/artifacts/garment-delete-flow
