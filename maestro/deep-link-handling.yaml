# Learning path Step 27: Widget and notification deep-link handling.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-27-widget-and-notification-deep-link-handling
# Story 3.7: Widget / Notification Deep Link Handling
appId: ${MAESTRO_APP_ID}
name: 'Widget & Notification Deep Link Handling'
tags:
  - e2e
  - deep-link
  - notification
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# Verify default state
- assertVisible:
    id: 'hero-experience-scrollview'

# Test Severe Weather Notification Deep Link
- openLink: '${APP_URL}?source=notification&type=severe_weather&alertId=${WEATHER_ALERT_ID}'
- assertVisible:
    id: 'severe-weather-alert-focused'
- takeScreenshot:
    path: maestro/artifacts/deep-link-severe-weather

# Test Invalid Deep Link Fallback & Info Banner
- openLink: '${APP_URL}?source=invalid_src&slot=bad_slot'
- assertVisible:
    id: 'deep-link-info-banner'
- takeScreenshot:
    path: maestro/artifacts/deep-link-invalid-banner
