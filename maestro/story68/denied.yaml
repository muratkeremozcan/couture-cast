appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: tap-save.yaml
    env:
      MAESTRO_SAVE_EFFECT: "Don.t allow|Don’t Allow|Don't Allow"
- tapOn: "Don.t allow|Don’t Allow|Don't Allow"
- extendedWaitUntil:
    visible: ${MAESTRO_DENIED}
    timeout: 10000
- assertVisible:
    id: share-card-preview-loaded-.*
