appId: ${MAESTRO_APP_ID}
---
- runFlow: ../story65/open-notification-settings.yaml
# Sign out is the last control; on an iPhone SE it starts below the fold.
- scrollUntilVisible:
    element: ${MAESTRO_SIGNOUT}
    direction: DOWN
    timeout: 15000
- tapOn: ${MAESTRO_SIGNOUT}
# Sign out returns to Settings, whose shopping section reads the signed-out session.
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- scrollUntilVisible:
    element:
      id: commerce-settings-signed-out
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: share-card-title
