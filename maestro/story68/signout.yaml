appId: ${MAESTRO_APP_ID}
---
- runFlow: ../story65/open-notification-settings.yaml
# Sign out is the last control; on an iPhone SE it starts below the fold.
- scrollUntilVisible:
    element: ${MAESTRO_SIGNOUT}
    direction: DOWN
    timeout: 15000
- tapOn: ${MAESTRO_SIGNOUT}
# Profile returns first, then About and privacy shows the signed-out shopping state.
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 15000
- runFlow:
    file: ../subflows/open-profile-topic.yaml
    env: { PROFILE_TOPIC: 'about' }
- scrollUntilVisible:
    element:
      id: commerce-settings-signed-out
    direction: DOWN
    centerElement: true
    timeout: 20000
- assertNotVisible:
    id: share-card-title
