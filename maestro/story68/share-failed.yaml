appId: ${MAESTRO_APP_ID}
---
# M-SHARE-FAILED: fixture share_failed reports {none, failed, native_error} on both platforms. The
# merlot error shows `shareFailed` with no `shared` or `sentToApp` copy; the preview stays and Save
# stays enabled. The runner then saves and proves the original, so the global lock was released at
# settlement.
- runFlow:
    file: tap-share.yaml
    env:
      MAESTRO_SHARE_OUTCOME: ${MAESTRO_SHARE_FAILED}
- extendedWaitUntil:
    visible: ${MAESTRO_SHARE_FAILED}
    timeout: 20000
- assertNotVisible: ${MAESTRO_SHARED}
- assertNotVisible: ${MAESTRO_SENT_TO_APP}
- assertVisible:
    id: share-card-error
- assertVisible:
    id: share-card-preview-loaded-.*
- assertVisible:
    id: share-card-save
    enabled: true
