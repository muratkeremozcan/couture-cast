# Story 6.8 iOS Expo Go proof: the runner has built the launch bundle and sent exp:// to a fresh
# simulator with a fresh Expo Go. iOS first asks to open the link in Expo Go. Expo Go then loads the
# project and shows its developer-menu onboarding sheet over the app's lower half. That sheet lives
# in a window Maestro does not read (no text, id or button of it is in the hierarchy), so it is
# dismissed by a tap on its backdrop above the sheet, which lands on the Home title when no sheet
# is up. No wait sits in a `retry` or `repeat`: a wait that Maestro runs a second time returned in
# 0.4 s in run 41019906459.
appId: ${MAESTRO_APP_ID}
---
- extendedWaitUntil:
    visible: 'Open in .*'
    timeout: 30000
    optional: true
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn: 'Open'
# The open prompt belongs to SpringBoard, and a completed tap on its Open button can be lost. In
# run 41244230213 SpringBoard sat at 95% CPU, the tap completed, and 180 s later the prompt's Cancel
# and Open were still on screen: Expo Go logged nothing and Metro saw no socket and no bundle
# request. So the prompt has to leave, and Open is tapped once more only while it is still up.
# The second tap is optional because a prompt still fading out can leave the hierarchy before the
# tap finds it.
- extendedWaitUntil:
    notVisible: 'Open in .*'
    timeout: 15000
    optional: true
- runFlow:
    when:
      visible: 'Open in .*'
    commands:
      - tapOn:
          text: 'Open'
          optional: true
- extendedWaitUntil:
    notVisible: 'Open in .*'
    timeout: 15000
    label: 'expo_go_open_prompt_left_up'
# The Home chip row sits above the sheet, so it shows once the project has loaded.
- extendedWaitUntil:
    visible:
      id: 'mobile-chip-navigation'
    timeout: 180000
    label: 'expo_go_project_not_loaded'
- waitForAnimationToEnd
- tapOn:
    point: '50%,8%'
- extendedWaitUntil:
    visible:
      id: 'tab-home'
    timeout: 30000
    label: 'expo_go_developer_menu_left_open'
