# Story 6.8 iOS Expo Go proof: the runner has built the launch bundle and sent exp:// to the
# simulator. Expo Go is a fresh install, so its first load shows the iOS open prompt and then the
# developer-menu onboarding over the app, in a timing the host sets. Each attempt answers whichever
# of those screens is up, then waits for the tab bar; an overlay that covers the tab bar fails that
# wait and the next attempt answers it. The window is these waits and nothing else: an optional
# `extendedWaitUntil` returned in 0.8 s when nothing matched (run 41010366797), so the earlier loop
# held 54 s instead of its declared 160 s. A project that never loads fails on the named wait,
# inside the process budget, so the failed-step hierarchy is captured. Only ids and Expo Go text
# are matched.
appId: ${MAESTRO_APP_ID}
---
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible: 'Open in .*'
          commands:
            - tapOn: 'Open'
      - runFlow:
          when:
            visible: 'This is the developer menu.*'
          commands:
            - tapOn: 'Continue'
      # Continue leaves the full dev menu open over the app; close it.
      - runFlow:
          when:
            visible: 'Connected to:'
          commands:
            - tapOn: 'Close'
      - extendedWaitUntil:
          visible:
            id: 'tab-home'
          timeout: 45000
          label: 'expo_go_project_not_loaded'
