appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: share-card-save
# The first Save lazily bundles expo-media-library on the dev server (13.8 s in CI run
# 40726798107), so the permission prompt can arrive well after the tap. Wait for either
# the prompt or the permanent-denial message instead of probing once.
- extendedWaitUntil:
    visible: "Don.t allow|Don’t Allow|Don't Allow|${MAESTRO_PERMANENT}"
    timeout: 45000
- runFlow:
    when:
      visible: "Don.t allow|Don’t Allow|Don't Allow"
    commands:
      - tapOn: "Don.t allow|Don’t Allow|Don't Allow"
- extendedWaitUntil:
    visible: ${MAESTRO_PERMANENT}
    timeout: 10000
- assertVisible: ${MAESTRO_SETTINGS}
- assertVisible:
    id: share-card-preview-loaded-.*
