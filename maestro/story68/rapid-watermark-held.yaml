appId: ${MAESTRO_APP_ID}
---
- runScript:
    file: rapid-watermark-control.js
    env:
      MAESTRO_RAPID_ACTION: acquire
# rapid-ready-outfit.yaml proved this opener unique on this same screen just before the
# hold, so index 0 is that single opener. Each press below supersedes a prepare request,
# and none may wait at the held source for 12 s, so the steps between presses stay minimal.
# iOS cancels the opener's touch now and then: 7 of 54 burn-in attempts (runs 41426869137
# and 41433511439) got a press-in and no press, on hosts as idle as load 6, and the composer
# never opened; all 3 traced in the second run were a touch-cancel. A cancelled press starts
# no prepare request, so only the opener may be pressed again, and only while the composer
# is closed.
- retry:
    maxRetries: 2
    commands:
      - runFlow:
          when:
            notVisible:
              id: share-card-title
          commands:
            - tapOn:
                id: outfit-share-card-open
                index: 0
      - assertVisible: ${MAESTRO_PREPARING}
- assertNotVisible:
    id: share-card-preview-loaded-.*
- assertVisible:
    id: share-card-watermark
    checked: true
- tapOn:
    id: share-card-watermark
- assertVisible:
    id: share-card-watermark
    checked: false
- assertVisible: ${MAESTRO_PREPARING}
- assertNotVisible:
    id: share-card-preview-loaded-.*
- tapOn:
    id: share-card-watermark
- assertVisible:
    id: share-card-watermark
    checked: true
- assertVisible: ${MAESTRO_PREPARING}
- assertNotVisible:
    id: share-card-preview-loaded-.*
- runScript:
    file: rapid-watermark-control.js
    env:
      MAESTRO_RAPID_ACTION: release
