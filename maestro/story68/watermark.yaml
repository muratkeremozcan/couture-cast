appId: ${MAESTRO_APP_ID}
---
# ON/OFF/ON from the default ON preview, whose digest the harness passes as MAESTRO_ON_PREVIEW.
- assertVisible:
    id: share-card-preview-loaded-${MAESTRO_ON_PREVIEW}
- assertVisible:
    id: share-card-watermark
    checked: true
# A press that reaches the product flips the switch at once. Run 40898729331 shard 1: Maestro
# reported the OFF tap COMPLETED, the app logged no prepare for it and the switch stayed checked,
# so the press never registered. Each tap therefore sits in a bounded retry whose postcondition
# is the switch's own state, and it runs only while the switch is still in the state it
# started from, so a press that merely landed late is never undone by a second tap.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: share-card-watermark
              checked: true
          commands:
            - tapOn:
                id: share-card-watermark
      - extendedWaitUntil:
          visible:
            id: share-card-watermark
            checked: false
          timeout: 8000
- extendedWaitUntil:
    notVisible:
      id: share-card-preview-loaded-${MAESTRO_ON_PREVIEW}
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded-.*
    timeout: 20000
- assertNotVisible:
    id: share-card-preview-loaded-${MAESTRO_ON_PREVIEW}
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: share-card-watermark
              checked: false
          commands:
            - tapOn:
                id: share-card-watermark
      - extendedWaitUntil:
          visible:
            id: share-card-watermark
            checked: true
          timeout: 8000
# ON returns the exact original composition.
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded-${MAESTRO_ON_PREVIEW}
    timeout: 20000
- assertVisible:
    id: share-card-save
