appId: ${MAESTRO_APP_ID}
---
# Taps the outfit card opener until the share card sheet shows its title. Maestro reports a tap
# COMPLETED whether or not the product got it: nightly run 44078916466 shard 2 (open-outfit.yaml)
# tapped the opener clear of the chip bar and the tab bar, and the app logged opener-press-in and
# then opener-touch-cancel 0.2 s later, so the Home ScrollView took the touch and the sheet never
# opened. The title is the first thing an opened sheet shows, in every state (preparing, loaded,
# unavailable). The guard skips the tap when the title is on screen by its own read: under the
# pinned Maestro that is up to one hierarchy read plus a 500 ms search after the 8 s wait gives up,
# since the wait used up the guard's 7 s window. A title that draws later than that gets a second
# press; scripts/lib/story68-outfit-open-tap.test.mjs runs both sides of that boundary.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: outfit-share-card-open
            notVisible:
              id: share-card-title
          commands:
            - tapOn:
                id: outfit-share-card-open
      - extendedWaitUntil:
          visible:
            id: share-card-title
          timeout: 8000
