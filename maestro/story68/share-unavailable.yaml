appId: ${MAESTRO_APP_ID}
---
# M-SHARE-UNAVAILABLE: fixture share_unavailable reports {none, unavailable, chooser_unavailable}
# on Android only; iOS has no unavailable outcome. The merlot error shows `shareUnavailable`; the
# preview stays and Save stays enabled. The runner then saves and proves the original.
- runFlow:
    file: tap-share.yaml
    env:
      MAESTRO_SHARE_OUTCOME: ${MAESTRO_SHARE_UNAVAILABLE}
- extendedWaitUntil:
    visible: ${MAESTRO_SHARE_UNAVAILABLE}
    timeout: 20000
- assertVisible:
    id: share-card-error
- assertVisible:
    id: share-card-preview-loaded-.*
- assertVisible:
    id: share-card-save
    enabled: true
