appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: share-card-save
- runFlow:
    when:
      visible: 'Allow|Allow Adding Photos|Allow Access to All Photos|Add Photos Only'
    commands:
      - tapOn: 'Allow|Allow Adding Photos|Allow Access to All Photos|Add Photos Only'
- extendedWaitUntil:
    visible: ${MAESTRO_SAVED}
    timeout: 20000
- assertVisible:
    id: share-card-preview-loaded-.*
