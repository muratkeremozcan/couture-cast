appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: share-card-settings
    text: ${MAESTRO_SETTINGS}
# The OS Settings app must be in front; the harness reads it again before recording it.
- runFlow:
    when:
      platform: iOS
    commands:
      # The Settings status bar shows a breadcrumb back to this app on every Settings screen it
      # opened: the app pane or the root. A Settings row such as General is on the root only.
      - extendedWaitUntil:
          visible:
            id: breadcrumb
            text: Return to CoutureCast Story68
          timeout: 15000
- runFlow:
    when:
      platform: Android
    commands:
      - extendedWaitUntil:
          visible:
            id: com.android.settings:id/.*
          timeout: 15000
- assertNotVisible:
    id: share-card-title
