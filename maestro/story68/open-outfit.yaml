appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: outfit-share-card-open
    direction: DOWN
    timeout: 30000
    centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
- tapOn:
    id: outfit-share-card-open
    index: 0
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded-.*
    timeout: 20000
