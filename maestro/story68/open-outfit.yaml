appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-home
- runFlow:
    when:
      platform: iOS
    file: position-outfit-open.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: outfit-share-card-open
          direction: DOWN
          timeout: 30000
          centerElement: true
- tapOn:
    id: outfit-share-card-open
    index: 0
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded-.*
    timeout: 20000
