appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-home
- runFlow:
    when:
      platform: iOS
    file: position-outfit-open.yaml
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: outfit-share-card-open
          direction: DOWN
          timeout: 30000
          centerElement: true
- assertVisible:
    id: outfit-share-card-open
- assertNotVisible:
    id: share-card-title
- assertNotVisible:
    id: share-card-preview-loaded-.*
