appId: ${MAESTRO_APP_ID}
---
# The harness opens a fresh app runtime first, so Home starts at its top here.
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: outfit-share-card-open
    direction: DOWN
    timeout: 30000
    centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
- assertVisible:
    id: outfit-share-card-open
# Home renders one primary outfit card. Fail if a second opener ever appears.
- assertNotVisible:
    id: outfit-share-card-open
    index: 1
- assertNotVisible:
    id: share-card-title
- assertNotVisible:
    id: share-card-preview-loaded-.*
