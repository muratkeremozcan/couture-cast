appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      visible:
        id: community-post-sheet-close
    commands:
      - tapOn:
          id: community-post-sheet-close
- runFlow:
    when:
      notVisible:
        id: community-new-post-button
    commands:
      - tapOn:
          id: tab-community
- tapOn:
    id: community-new-post-button
- scrollUntilVisible:
    element:
      id: community-caption-input
    direction: DOWN
    centerElement: false
    visibilityPercentage: 95
- tapOn:
    id: community-caption-input
- inputText: A draft kept across background
# iOS reports a failure when the simulator shows no software keyboard (run 40761149989);
# the next scroll fails by its own name if the keyboard really stayed up.
- hideKeyboard:
    optional: true
- scrollUntilVisible:
    element:
      id: community-pick-image-button
    direction: UP
    centerElement: false
# A press that the starved CI host drops leaves the sheet as it was (run 40927902095), so the
# tap repeats only while the picker's Cancel is not up.
- retry:
    maxRetries: 3
    commands:
      - runFlow:
          when:
            visible:
              id: community-pick-image-button
              enabled: true
            notVisible: Cancel
          commands:
            - tapOn:
                id: community-pick-image-button
      - extendedWaitUntil:
          visible: Cancel
          timeout: 8000
- pressKey: Home
- launchApp:
    appId: ${MAESTRO_APP_ID}
    stopApp: false
    clearState: false
    # Preserve the current OS grants; Maestro otherwise pregrants every permission.
    permissions: {}
- extendedWaitUntil:
    visible: Cancel
    timeout: 15000
- tapOn: Cancel
- assertVisible:
    id: community-post-sheet-content
- scrollUntilVisible:
    element:
      id: community-caption-input
    direction: DOWN
    centerElement: false
    visibilityPercentage: 95
- assertVisible: A draft kept across background
- tapOn:
    id: community-post-sheet-close
