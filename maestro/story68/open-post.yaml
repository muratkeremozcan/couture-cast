appId: ${MAESTRO_APP_ID}
---
# Opens the owned post's Share card from the Community feed card. The feed mounts at the
# top, so the post is at most a few screens down; the walk is bounded, and each way the
# post can be missing fails with its own label instead of a timeout at the flow budget.
- tapOn:
    id: tab-community
- extendedWaitUntil:
    visible:
      id: community-screen
    timeout: 20000
    label: 'community_screen_absent'
- extendedWaitUntil:
    notVisible:
      id: community-feed-skeleton
    timeout: 30000
    label: 'feed_skeleton_still_showing'
- assertNotVisible:
    id: community-feed-error
    label: 'feed_error_state'
- assertNotVisible:
    id: community-feed-unavailable
    label: 'feed_unavailable_state'
- runFlow:
    when:
      platform: iOS
    commands:
      # Explicit list-region drags avoid the nested horizontal climate filter.
      - repeat:
          while:
            notVisible:
              id: community-card-author-${MAESTRO_POST_ID}
          times: 8
          commands:
            - swipe:
                start: 50%, 75%
                end: 50%, 40%
                duration: 800
            - waitForAnimationToEnd
      - assertVisible:
          id: community-card-author-${MAESTRO_POST_ID}
          label: 'post_not_within_8_swipes'
      - repeat:
          while:
            notVisible:
              id: community-share-card-open-${MAESTRO_POST_ID}
          times: 3
          commands:
            - swipe:
                start: 50%, 75%
                end: 50%, 55%
                duration: 800
            - waitForAnimationToEnd
      # AX can count the footer under the tab bar. Lift it a short distance.
      - swipe:
          start: 50%, 70%
          end: 50%, 55%
          duration: 1000
      - waitForAnimationToEnd
- runFlow:
    when:
      platform: Android
    commands:
      - scrollUntilVisible:
          element:
            id: community-share-card-open-${MAESTRO_POST_ID}
          direction: DOWN
          timeout: 30000
          centerElement: false
- tapOn:
    id: community-share-card-open-${MAESTRO_POST_ID}
- extendedWaitUntil:
    visible:
      id: share-card-preview-loaded-.*
    timeout: 20000
    label: 'share_card_preview_not_loaded'
