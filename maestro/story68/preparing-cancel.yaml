appId: ${MAESTRO_APP_ID}
---
- tapOn:
    id: tab-wardrobe
- tapOn:
    id: tab-home
- scrollUntilVisible:
    element:
      id: outfit-share-card-open
    direction: DOWN
    timeout: 30000
    centerElement: true
- runFlow:
    when:
      platform: iOS
    commands:
      - waitForAnimationToEnd
      - runFlow: position-outfit-open.yaml
      - tapOn:
          id: outfit-share-card-open
          below:
            id: header-info-modal
          index: 0
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: outfit-share-card-open
          index: 0
- extendedWaitUntil:
    visible: ${MAESTRO_PREPARING}
    timeout: 10000
- assertNotVisible:
    id: share-card-preview-loaded-.*
- tapOn:
    id: share-card-cancel
- assertNotVisible:
    id: share-card-title
