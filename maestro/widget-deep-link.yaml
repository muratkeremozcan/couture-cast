# Learning path Step 23: Home and lock-screen widgets.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-23-home-and-lock-screen-widgets
# Learning path Step 27: Widget and notification deep-link handling.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-27-widget-and-notification-deep-link-handling
# Story 3.3 Task 5 step 2 owner: define E2E Maestro routing verification scenarios in maestro/widget-deep-link.yaml
appId: ${MAESTRO_APP_ID}
name: 'Widget Deep Link Hydration'
tags:
  - e2e
  - widget
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    # `clearState: true`, like every other flow in this suite.
    #
    # It used to be false, on the reasoning that clearing Expo Go state removes
    # the project Expo CLI just opened and strands the simulator on the Expo
    # shell. That was true before `subflows/open-app.yaml` existed; the subflow
    # now re-opens `${APP_URL}` inside a retry and waits for the tab bar, which
    # is exactly the recovery that reasoning said was missing.
    #
    # Keeping it false made this flow inherit whatever screen its predecessor
    # left behind, and `openLink` re-enters the app without popping the
    # navigation stack. So when `wardrobe-onboarding-my-form-flow` started
    # passing -- it ends on the pushed silhouette screen -- this flow began
    # failing at `tab-home`, purely because of its position in the run. Pressing
    # back does not recover it either: measured on device, two `back` presses
    # both reported COMPLETED and the silhouette screen stayed put.
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# Verify default state
- assertVisible: 'Morning commute'

# Assert what the link DID, not that the screen it landed on still exists.
#
# This flow used to open the widget link and then assert `scenario-toggles` was
# visible. That container is part of the home screen the flow is already sitting
# on, so the assertion held whether or not the deep link did anything at all —
# and it did nothing on Android, where the URL was built with the app's own
# `mobile://` scheme that Expo Go cannot resolve. The flow was green in CI and
# red locally for the same reason: on one API level the intent resolved to
# something and `openLink` completed, on the other it errored outright. Neither
# outcome had anything to do with widget hydration.
#
# `slot=am` resolves deterministically to the `morning` scenario and
# `slot=evening` to `evening` (`resolveDeepLinkScenario` in `@couture/utils`),
# which drives `setActiveScenario` and therefore which toggle carries
# `accessibilityState.selected`. Asserting the SELECTED toggle is the smallest
# assertion that can only pass if the link was parsed, routed, and applied.
- openLink: ${WIDGET_MORNING_URL}

- extendedWaitUntil:
    visible:
      id: 'scenario-toggle-morning'
      selected: true
    timeout: 15000
    label: 'The am widget link selected the morning scenario'
- takeScreenshot:
    path: maestro/artifacts/widget-deep-link-morning

# The second link must MOVE the selection, which is what proves the first
# assertion was not simply the app's default state agreeing with it.
- openLink: ${WIDGET_EVENING_URL}

- extendedWaitUntil:
    visible:
      id: 'scenario-toggle-evening'
      selected: true
    timeout: 15000
    label: 'The evening widget link moved the selection to the evening scenario'
- assertNotVisible:
    id: 'scenario-toggle-morning'
    selected: true
    label: 'The morning scenario is no longer selected'
- takeScreenshot:
    path: maestro/artifacts/widget-deep-link-evening
