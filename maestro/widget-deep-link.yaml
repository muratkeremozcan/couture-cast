# Learning path Step 23: Home and lock-screen widgets.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-23-home-and-lock-screen-widgets
# Learning path Step 27: Widget and notification deep-link handling.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-27-widget-and-notification-deep-link-handling
# Story 3.3 Task 5 step 2 owner: define E2E Maestro routing verification scenarios in maestro/widget-deep-link.yaml
appId: ${MAESTRO_APP_ID}
name: 'Widget Deep Link Hydration'
tags:
  - e2e
  - widget
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    # `clearState: true`, like every other flow in this suite.
    #
    # It used to be false, on the reasoning that clearing Expo Go state removes
    # the project Expo CLI just opened and strands the simulator on the Expo
    # shell. That was true before `subflows/open-app.yaml` existed; the subflow
    # now re-opens `${APP_URL}` inside a retry and waits for the tab bar, which
    # is exactly the recovery that reasoning said was missing.
    #
    # Keeping it false made this flow inherit whatever screen its predecessor
    # left behind, and `openLink` re-enters the app without popping the
    # navigation stack. So when `wardrobe-onboarding-my-form-flow` started
    # passing -- it ends on the pushed silhouette screen -- this flow began
    # failing at `tab-home`, purely because of its position in the run. Pressing
    # back does not recover it either: measured on device, two `back` presses
    # both reported COMPLETED and the silhouette screen stayed put.
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# Verify default state
- assertVisible: 'Morning commute'

# Trigger the small-widget contract. The runner uses the production mobile://
# URL on Android and Expo Go's equivalent routed URL on iOS, where a third-party
# host app cannot register CoutureCast's native URL scheme.
- openLink: ${WIDGET_NOW_URL}

- assertVisible:
    id: 'scenario-toggles'
- takeScreenshot:
    path: maestro/artifacts/widget-deep-link-now

# Trigger the medium next-hour contract.
- openLink: ${WIDGET_NEXT_URL}

- assertVisible:
    id: 'scenario-toggles'
- takeScreenshot:
    path: maestro/artifacts/widget-deep-link-next
