# Learning path Step 31: Outfit capsule builder.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-31-outfit-capsule-builder
# Story 4.3 Task 8: repair a capsule and navigate from a recommendation.
appId: ${MAESTRO_APP_ID}
name: 'Outfit capsule repair and recommendation'
tags:
  - e2e
  - wardrobe
  - capsules
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# `wardrobe-capsules-link` lives on the wardrobe hub, but the app opens on
# Home, so this flow never had a step to get there and the tap could only
# ever report the link "not found".
- runFlow: subflows/open-wardrobe-tab.yaml

- runFlow: subflows/open-capsules.yaml

# A capsule holding an unavailable garment reports the count and stays manageable.
- assertVisible:
    id: 'capsule-unavailable-count-.*'
    optional: true
    label: 'Repair state is surfaced when seed data provides one'

- tapOn:
    id: 'edit-capsule-button-.*'
    index: 0

- assertVisible:
    id: 'capsule-repair-banner'
    optional: true
    label: 'Repair guidance explains the removed garments'

- tapOn:
    id: 'garment-checkbox-.*'
    index: 0
    label: 'Choose a replacement garment'

- tapOn:
    id: 'save-capsule-button'

# The save is proved by what the user can actually see, not by the live region.
#
# `capsule-status-region` is styled `{ height: 0, opacity: 0, width: 0 }` -- it
# is a deliberately visually-hidden `accessibilityLiveRegion` that exists to
# announce the save politely to a screen reader. `assertVisible` on it therefore
# could never pass: Maestro reports zero-size, zero-opacity nodes as not
# visible, so this step failed on a save that had in fact round-tripped
# perfectly. Measured on device, the library rendered "3 garments · Ready" at
# the moment this assertion failed.
- extendedWaitUntil:
    visible:
      id: 'capsule-card-.*'
    timeout: 15000
    label: 'Back on the capsule library after saving'

- assertVisible:
    text: '.* garments · Ready'
    label: 'The repaired capsule saved and reports a ready set'

# Favorite the repaired capsule, then confirm the ritual can surface it.
- tapOn:
    id: 'favorite-button-.*'
    index: 0

# Leave the capsule library the same way every other flow does.
#
# This was a bare `back`, which is documented as Android and Web only and whose
# iOS implementation is an empty method: on iOS it reported COMPLETED without
# moving the app. The assertion below was `optional: true`, so it could not fail
# either, and the pair could never have caught a regression on iOS.
# https://docs.maestro.dev/reference/commands-available/back
- tapOn:
    id: 'BackButton'
    optional: true
    label: 'Leave the capsule library'
- runFlow:
    when:
      platform: Android
    commands:
      - back

# The "Saved capsule" badge is deliberately NOT asserted here.
#
# It was, as `assertVisible: text: 'Saved capsule'` with `optional: true`, which
# could not fail and so proved nothing. It could not have passed either: the
# label is produced by the ritual service (`ritual.service.ts`) and rendered on
# the Home screen, and this flow ends on the wardrobe hub, which is where the
# preceding back press lands. The failure hierarchy confirms it: `wardrobe-screen`
# and `wardrobe-garment-list` on screen, no badge anywhere.
#
# The behaviour it was reaching for is asserted where it belongs, against the
# service that produces it, in `ritual.service.spec.ts` ("Saved capsule"). A
# mobile flow re-proving it would depend on a ritual refresh picking this
# capsule, which is not deterministic from here.
#
# What this flow does own is that the favourite persisted, which is asserted by
# the capsule library state above.
