# Story 5.5 Task 10: the 7-day outfit planner screen (Decision 7).
# Story CC-7.12 (Step 69): the settings row opens Looks on Plan, and the locked panel became the
# free preview (`plan-free-preview`, one `plan-upgrade`, `plan-free-day-0..6`).
#
# Honest scope, stated the same way premium-subscription.yaml and
# palette-advisor.yaml state their own. `run-maestro.mjs` signs up a FRESH
# public-API user and bakes that user's token into the Metro bundle via
# `EXPO_PUBLIC_E2E_ACCESS_TOKEN` before the Expo server starts; no Maestro flow
# in this repo signs in through the UI, and the app has no runtime token
# override. The harness user therefore has no Premium entitlement, so this
# flow can verify exactly one branch of the planner: the free preview
# (`screenState === 'locked'`, same panel `signed_out` renders), plus the
# settings entry point and navigation that reach it.
#
# It can never exercise the entitled, ready-week, or reshuffle branches.
# Reaching those needs the seeded `premium-active-user`
# (packages/db/prisma/seeds/commerce.ts), which is out of a Maestro run's
# reach for the same reason story 5.2 recorded, and the seven-day generation
# journey needs a real weather snapshot and wardrobe besides. Those journeys
# are proven at two other tiers instead: `planner-screen.test.tsx` drives
# every state (ready week, degraded weather, per-day error, reshuffle,
# unchanged, conflict, double-tap protection) through MSW, and
# `playwright/tests/planner.spec.ts` runs the real thing end to end against
# the seeded entitled user with a live API and database.
#
# What IS deterministic and asserted below: the premium settings block carries
# a link row to the planner; the row opens Looks on Plan; and Plan renders the
# localized tab title, the free preview's line, Upgrade and sample week --
# never a day card, weather line, or reshuffle control, all of which the
# entitlement guard rejects pre-handler.
appId: ${MAESTRO_APP_ID}
name: '7-day planner free preview'
tags:
  - e2e
  - commerce
  - premium
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- runFlow: subflows/open-settings.yaml

# --- Decision 7: the entry point is a link row in Premium settings ------------

# The row sits below the palette advisor row, well below the fold on a phone,
# so it is scrolled into view rather than merely waited for. Same viewport
# lesson `premium-subscription.yaml` and `palette-advisor.yaml` record:
# `extendedWaitUntil: visible` requires the element inside the VIEWPORT, and
# CI's `pixel_3a` profile is shorter than the local `medium_phone`.
# No `centerElement`: this row sits at the end of the Settings list and can
# never reach the middle of the screen. Maestro then spends five more settling
# swipes before it accepts the row, and on a slow emulator those outlast the
# timeout and the step reports a row it is showing as not found (Story 1.2b
# R25 verification run). A fully visible row is what the tap below needs.
- scrollUntilVisible:
    element:
      id: 'planner-link'
    direction: DOWN
    timeout: 15000
    label: 'Planner entry row is reachable from settings'

# Pin the list end. The row is at the bottom of Settings, where the scroll view
# stops with the row clear of the tab bar. iOS judges visibility from unclipped
# XCUI frames, so the step above can stop with the row half behind the tab bar
# and the tap below would land on a tab (Story 1.2b R27). One more scroll to the
# end settles the row in the same place on both platforms.
- scroll

- tapOn:
    id: 'planner-link'
    retryTapIfNoChange: true
    label: 'Open the 7-day planner'

# Story CC-7.12 (Step 69): the row opens the Looks tab on its Plan segment (the planner screen is
# no longer pushed), and a non-entitled reader sees the free preview: one line, one Upgrade and
# a sample week. The CC-7.11 locked panel (`planner-locked`, `planner-locked-cta`) is gone.
- extendedWaitUntil:
    visible:
      id: 'plan-free-preview'
    timeout: 15000
    label: 'Looks opens on Plan with the free preview after the entitlement check'

# --- AC 7: the screen renders from the locale catalogs, not from literals -----

# CC-7.9 D6: the shared top bar carries the localized title. Plan is a Looks segment now, so the
# bar names the tab and the Plan segment is the selected tab inside it.
- assertVisible:
    id: 'app-top-bar-title'
    text: 'Looks'
    label: 'Localized tab title in the top bar'
- assertVisible:
    id: 'looks-segment-plan'
    selected: true
    label: 'The Plan segment is the open one'

- assertVisible:
    text: 'Premium plans your whole week around your forecast.'
    label: 'The one line on what Premium adds renders in full'

# --- AC 5 (CC-7.12 D10): a non-entitled reader sees the free preview and no lock --

- assertVisible:
    id: 'plan-upgrade'
    text: 'Upgrade'
    label: 'One Upgrade, which opens Profile, not a dead control'
- assertVisible:
    id: 'plan-free-day-0'
    label: 'The sample week starts today'
- assertNotVisible:
    id: 'planner-locked'
- assertNotVisible:
    id: 'planner-locked-cta'
- assertNotVisible:
    text: 'The 7-Day Planner is a Premium feature'

# No day card, weather, or reshuffle control ever renders pre-entitlement --
# the guard rejects the request before the handler runs.
- assertNotVisible:
    id: 'planner-day-error'
- assertNotVisible:
    id: 'planner-disabled'
- assertNotVisible:
    id: 'planner-load-error'

- takeScreenshot:
    path: maestro/artifacts/premium-planner-free-preview

# Leave the device as this flow found it. `open-settings.yaml` can pop a pushed
# route on Android, but its iOS path cannot. CC-7.12: the row now switches tabs
# instead of pushing, so this back only steps the Android tab history back.
- runFlow:
    when:
      platform: Android
    commands:
      - back
