# Learning path Step 29: Garment capture flow.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-29-garment-capture-flow
# Story 4.1 Task 9 step 1 owner: Maestro E2E test script for mobile garment capture flow
appId: ${MAESTRO_APP_ID}
name: 'Garment capture flow'
tags:
  - e2e
  - wardrobe
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- runFlow: subflows/open-wardrobe-tab.yaml

- assertVisible:
    id: 'wardrobe-screen'

- assertVisible:
    id: 'garment-capture-open'

- tapOn:
    id: 'garment-capture-open'

- assertVisible:
    id: 'garment-source-camera'

- assertVisible:
    id: 'garment-source-library'

- tapOn:
    id: 'garment-e2e-fixture-source'

- assertVisible:
    id: 'garment-crop-preview'

- assertVisible:
    id: 'garment-aspect-square'

- tapOn:
    id: 'garment-aspect-portrait'

- assertVisible:
    id: 'garment-cleanup-toggle'

- assertVisible:
    id: 'garment-confirm-image'

- tapOn:
    id: 'garment-confirm-image'

- assertVisible:
    id: 'garment-capture-complete'

- tapOn:
    id: 'garment-capture-done'

# Wait, do not assert. The hub renders `wardrobe-garment-list` only once
# `garments.length > 0` and the load has settled, and the committed garment
# arrives through a refetch after the capture modal closes. A bare
# `assertVisible` on the next line races that round trip: it passed on one run
# and failed on the next against identical, correct behaviour. Same condition,
# given time to become true.
- extendedWaitUntil:
    visible:
      id: 'wardrobe-garment-list'
    timeout: 15000
    label: 'Committed garment appears in the hub list'

- takeScreenshot:
    path: maestro/artifacts/garment-capture-flow
