# Story 3.1: Mobile hero experience E2E verification flow
appId: ${MAESTRO_APP_ID}
name: 'Mobile hero experience ritual'
tags:
  - e2e
  - hero
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# CC-7.13: Today's live details are collapsed until the primary action is pressed.
- extendedWaitUntil:
    visible:
      id: 'today-primary-action'
    timeout: 30000
- assertNotVisible:
    id: 'outfit-comfort-notes'
- tapOn:
    id: 'today-primary-action'
- scrollUntilVisible:
    element:
      id: 'outfit-comfort-notes'
    direction: DOWN
    timeout: 15000
- takeScreenshot:
    path: maestro/artifacts/hero-outfit-details
