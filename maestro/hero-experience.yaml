# Story 3.1: Mobile hero experience E2E verification flow
appId: ${MAESTRO_APP_ID}
name: 'Mobile hero experience ritual'
tags:
  - e2e
  - hero
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

# Assert landing screen elements are visible
- assertVisible:
    id: 'scenario-toggles'
- assertVisible: 'Morning commute'
- assertVisible: 'Midday'
- assertVisible: 'Evening plans'

# The recommendation card and its comfort notes are asserted by testID, never by
# their copy. The exact strings this flow used to assert ("Warm and sunny
# midday. Light tee is perfect.") exist only in the mobile unit tests' MSW
# handlers; the live API composes comfortNotes from the templates in
# `ritual.service.ts`, so those assertions could never pass against a real
# server and this flow could only ever have gone green against mocks.
- assertVisible:
    id: 'outfit-recommendation-card'
- assertVisible:
    id: 'outfit-comfort-notes'

# Toggle Midday scenario
- tapOn:
    id: 'scenario-toggle-midday'
    retryTapIfNoChange: true
- assertVisible:
    id: 'outfit-comfort-notes'
- takeScreenshot:
    path: maestro/artifacts/hero-midday-scenario

# Toggle Evening plans scenario
- tapOn:
    id: 'scenario-toggle-evening'
    retryTapIfNoChange: true
- assertVisible:
    id: 'outfit-comfort-notes'
- takeScreenshot:
    path: maestro/artifacts/hero-evening-scenario
