# Story 0.14 Task 3 owner: mobile analytics validation flow.
appId: ${MAESTRO_APP_ID}
name: 'Mobile analytics validation'
tags:
  - analytics
  - maestro
env:
  SETTINGS_TITLE: 'Language'
  ALERT_EVENT: 'Analytics event: alert_received'
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: false
    stopApp: false

- runFlow: subflows/open-app.yaml

# Tabs are tapped by testID. The `25%,94%` / `75%,94%` coordinates these
# replace were calibrated for a three-tab bar; adding Community shifted every
# centre and the taps landed one tab short.
- tapOn:
    id: 'tab-home'
    retryTapIfNoChange: true
    label: 'Open home'

- assertVisible: 'Morning commute'
- tapOn:
    text: 'Evening plans'
    retryTapIfNoChange: true
- assertVisible: 'Evening plans'

- runFlow: subflows/open-settings.yaml
- assertVisible: ${SETTINGS_TITLE}

# The diagnostics panel is the last section on the settings screen, below
# Language, Shopping and Premium, so it is off-screen on a phone until scrolled
# to. Asserting it directly failed even with diagnostics correctly enabled.
- scrollUntilVisible:
    element:
      text: 'Mobile analytics diagnostics'
    direction: DOWN
    timeout: 15000
- assertVisible: 'Mobile analytics diagnostics'

- tapOn:
    text: 'Record weather alert analytics'
    retryTapIfNoChange: true
- scrollUntilVisible:
    element:
      text: ${ALERT_EVENT}
    direction: DOWN
    timeout: 10000
- assertVisible: ${ALERT_EVENT}
- takeScreenshot:
    path: maestro/artifacts/mobile-analytics-alert
