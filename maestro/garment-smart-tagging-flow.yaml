# Learning path Step 30: Smart tagging and comfort metadata.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-30-smart-tagging-and-comfort-metadata
# Learning path Step 76: Garment subtypes.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-76-garment-subtypes
# Learning path Step 83: Clean garment cutouts.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-83-clean-garment-cutouts
# Learning path Step 84: Suggested tags that are right.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-84-suggested-tags-that-are-right
# Story 4.2 mobile E2E: worker-backed smart tagging and persisted confirmation
appId: ${MAESTRO_APP_ID}
name: 'Garment smart tagging flow'
tags:
  - e2e
  - wardrobe
  - smart-tagging
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

# iOS can preserve an Authentication Services sheet across Expo Go app-data
# resets. Dismiss the QR panel and its parent browser before opening the test
# deep link so a prior interactive sign-in cannot mask the app under test.
- runFlow:
    when:
      visible: 'Sign in with Google'
    commands:
      - tapOn:
          text: 'close'
          optional: true
      - tapOn:
          point: '9%,29%'

- runFlow: subflows/open-app.yaml

- extendedWaitUntil:
    visible:
      id: 'tab-wardrobe'
    timeout: 60000

- runFlow:
    file: subflows/open-wardrobe.yaml
    label: 'Open the Wardrobe tab'

# Expo Go exposes the React Native test ID in the native hierarchy, while
# accessibility activation can fail to dispatch this outer Pressable's onPress.
- tapOn:
    text: 'Add a photo'
    label: 'Tap the visible Add a photo label'

- waitForAnimationToEnd

- runFlow:
    when:
      platform: iOS
      notVisible:
        id: 'garment-capture-modal'
    commands:
      - tapOn:
          point: '50%,27%'
          retryTapIfNoChange: true
          label: 'Physically tap Add a photo on iOS if accessibility activation was ignored'

- runFlow:
    when:
      platform: Android
      notVisible:
        id: 'garment-capture-modal'
    commands:
      - tapOn:
          point: '50%,24%'
          retryTapIfNoChange: true
          label: 'Physically tap Add a photo on Android if accessibility activation was ignored'

- extendedWaitUntil:
    visible:
      id: 'garment-capture-modal'
    timeout: 15000

- extendedWaitUntil:
    visible:
      id: 'garment-e2e-fixture-source'
    timeout: 15000

- tapOn:
    id: 'garment-e2e-fixture-source'

- extendedWaitUntil:
    visible:
      id: 'garment-crop-preview'
    timeout: 15000

- tapOn:
    id: 'garment-confirm-image'
    enabled: true

- extendedWaitUntil:
    visible:
      id: 'garment-capture-complete'
    timeout: 30000

- tapOn:
    id: 'garment-capture-done'

- extendedWaitUntil:
    visible:
      id: 'garment-tagging-modal'
    timeout: 30000

- tapOn:
    id: 'garment-tagging-close'

- tapOn: 'Needs tags'

- extendedWaitUntil:
    visible:
      id: 'garment-tagging-modal'
    timeout: 15000

- tapOn:
    id: 'garment-tag-category-bottom'

# Step 84: an override to a different category needs its own subtype decision.
- scrollUntilVisible:
    element:
      id: 'garment-tagging-subtype-none'
    direction: DOWN

- tapOn:
    id: 'garment-tagging-subtype-none'

- scrollUntilVisible:
    element:
      id: 'garment-tag-comfort-mild'
    direction: DOWN

- tapOn:
    id: 'garment-tag-comfort-mild'

- extendedWaitUntil:
    visible:
      id: 'garment-tagging-save'
      enabled: true
    timeout: 15000

- tapOn:
    id: 'garment-tagging-save'

- extendedWaitUntil:
    visible:
      id: 'garment-open-.+'
    timeout: 15000

- stopApp:
    appId: ${MAESTRO_APP_ID}

# Android requires an explicit relaunch after stopApp. openLink resumes either platform.
- runFlow:
    when:
      platform: Android
    commands:
      - launchApp:
          appId: ${MAESTRO_APP_ID}
          clearState: false

- runFlow: subflows/open-app.yaml

- extendedWaitUntil:
    visible:
      id: 'tab-wardrobe'
    timeout: 60000

- runFlow:
    file: subflows/open-wardrobe.yaml
    label: 'Reopen the Wardrobe tab after restart'

- extendedWaitUntil:
    visible:
      id: 'garment-open-.+'
    timeout: 30000

- takeScreenshot:
    path: maestro/artifacts/garment-smart-tagging-flow
