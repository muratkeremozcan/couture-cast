# Story 6.4 owner: real native compose, keyboard, draft reopening and private status.
appId: ${MAESTRO_APP_ID}
name: 'Screened community comments'
tags:
  - e2e
  - community
  - maestro
---
# ASCII words/spaces/digits keep the exact contextual-label regex literal-safe.
# A 273-unit root also exercises the longest reply context with the keyboard open.
- evalScript: ${output.commentRoot = 'A lovely rainy day look with soft layers and warm fabric '.repeat(5).slice(0, 260) + Date.now()}
- evalScript: ${output.commentReply = 'A matching scarf ' + Date.now()}
- evalScript: >-
    ${output.replyAction = '^Reply: .*' + output.commentRoot + String.fromCharCode(36)}
- evalScript: >-
    ${output.repliesAction = '^Replies \\(1\\): .*' + output.commentRoot + String.fromCharCode(36)}
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-community-tab.yaml
- tapOn:
    id: 'community-filter-chip-all'
- scrollUntilVisible:
    element:
      id: 'community-card-comments-lookbook-5'
    direction: DOWN
    # A fully visible action can remain below center at the scroll boundary.
    centerElement: false
    timeout: 15000
- tapOn:
    id: 'community-card-comments-lookbook-5'
- assertVisible: 'Close comments'
- scrollUntilVisible:
    element:
      id: 'comment-body'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-body'
- inputText: ${output.commentRoot}
- assertVisible:
    id: 'comment-submit'
- takeScreenshot:
    path: maestro/artifacts/community-comments-keyboard
- tapOn:
    id: 'comments-close'
- tapOn:
    id: 'community-card-comments-lookbook-5'
- assertVisible: ${output.commentRoot}
- tapOn:
    id: 'comment-submit'
# With live insertion the comment can be screened and published before the private
# "Your submissions" section ever renders, so that section cannot be awaited. The draft is
# cleared only after the server accepts the submission, and the send control returns to
# idle: both are stable once reached.
- extendedWaitUntil:
    visible: '^0 / 280 characters$'
    timeout: 15000
- assertVisible:
    id: 'comment-submit'
    text: 'Send comment'
- takeScreenshot:
    path: maestro/artifacts/community-comments-submitted
# With realtime connected, the published root is inserted live (about 2 s) and the
# "Published. Refresh the thread to view it." notice never appears. Wait for its public
# reply action instead, scrolling in case the live insert lands below the fold.
- scrollUntilVisible:
    element:
      id: 'comment-reply-.*'
      text: ${output.replyAction}
    direction: DOWN
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${output.commentRoot}
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-reply-.*'
    text: ${output.replyAction}
- scrollUntilVisible:
    element:
      id: 'comment-body'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-body'
- inputText: ${output.commentReply}
- assertVisible:
    id: 'comment-submit'
- takeScreenshot:
    path: maestro/artifacts/community-comments-reply-keyboard
- tapOn:
    id: 'comment-submit'
# Same acceptance proof for the reply: cleared draft and an idle send control.
- extendedWaitUntil:
    visible: '^0 / 280 characters$'
    timeout: 15000
- assertVisible:
    id: 'comment-submit'
    text: 'Send comment'
# The published reply is inserted live too; wait for the parent's replies action.
- scrollUntilVisible:
    element:
      id: 'comment-replies-.*'
      text: ${output.repliesAction}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'comment-replies-.*'
    text: ${output.repliesAction}
- assertVisible: ${output.commentReply}
- takeScreenshot:
    path: maestro/artifacts/community-comments-discussion
- tapOn:
    id: 'comments-close'
- assertVisible:
    id: 'community-screen'
