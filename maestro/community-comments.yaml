# Story 6.4 owner: real native compose, keyboard, draft reopening and private status.
appId: ${MAESTRO_APP_ID}
name: 'Screened community comments'
tags:
  - e2e
  - community
  - maestro
---
# ASCII words/spaces/digits keep the exact contextual-label regex literal-safe.
# The root stays short: typing a 273-unit one ran a single inputText past Maestro's
# 120 s per-command deadline on the local Play AVD.
- evalScript: ${output.commentRoot = 'Rainy day look with soft layers ' + Date.now()}
- evalScript: ${output.commentReply = 'A matching scarf ' + Date.now()}
- evalScript: >-
    ${output.replyAction = '^Reply: .*' + output.commentRoot + String.fromCharCode(36)}
- evalScript: >-
    ${output.repliesAction = '^Replies \\(1\\): .*' + output.commentRoot + String.fromCharCode(36)}
# The runner seeds COMMUNITY_COMMENTS_LONG_ROOT, a 270-unit published root by another
# seeded member, on lookbook-5 for this flow alone, and removes it afterwards
# (`mobileE2EFlowStateHooks` in scripts/lib/mobile-e2e-flow-state.mjs). Replying to it
# proves the longest reply context with the keyboard open.
- evalScript: >-
    ${output.longReplyAction = '^Reply: .*' + COMMUNITY_COMMENTS_LONG_ROOT + String.fromCharCode(36)}
- evalScript: >-
    ${output.longReplyContext = '^Replying to a comment: .*' + COMMUNITY_COMMENTS_LONG_ROOT + String.fromCharCode(36)}
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false
- runFlow: subflows/open-app.yaml
- runFlow: subflows/open-community-tab.yaml
- tapOn:
    id: 'community-filter-chip-all'
# The chip refetches the feed, and while it loads the list renders empty, which
# resets any scroll; scrolling starts only once the page is in.
- extendedWaitUntil:
    notVisible:
      id: 'community-feed-skeleton'
    timeout: 20000
# Story 6.6: the City Spotlight heads the list and the seeded spotlight posts
# lead the feed, so `lookbook-5` sits about eight screen-tall cards down. The
# card is reached first with long, steady swipes, as in community-feed.yaml.
- extendedWaitUntil:
    visible:
      id: 'community-spotlight-heading'
    timeout: 20000
# Long straight swipes, each moving most of a screen, reach the card in about
# half the steps of a scroll command, and each step checks for it first.
- repeat:
    while:
      notVisible:
        id: 'community-post-card-lookbook-5'
    times: 30
    commands:
      - swipe:
          start: '50%, 85%'
          end: '50%, 20%'
          duration: 500
- extendedWaitUntil:
    visible:
      id: 'community-post-card-lookbook-5'
    timeout: 10000
- scrollUntilVisible:
    element:
      id: 'community-card-comments-lookbook-5'
    direction: DOWN
    # A fully visible action can remain below center at the scroll boundary.
    centerElement: false
    timeout: 20000
- tapOn:
    id: 'community-card-comments-lookbook-5'
- assertVisible: 'Close comments'
# R52: the scrim covers the tab bar and the navigation bar, and the sheet ends above
# the gesture bar. The keyboard-up and dismissed shots below show the same sheet.
- takeScreenshot:
    path: maestro/artifacts/community-comments-sheet-open
- scrollUntilVisible:
    element:
      id: 'comment-reply-.*'
      text: ${output.longReplyAction}
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-reply-.*'
    text: ${output.longReplyAction}
- tapOn:
    id: 'comment-body'
# R51: the banner shows three lines at most; its accessibility label keeps the whole
# context, so the exact regex still matches the long root.
- assertVisible:
    id: 'comments-reply-context'
    text: ${output.longReplyContext}
- assertVisible:
    id: 'comment-submit'
    text: 'Send comment'
# The local iOS simulator runs headless (Xcode 27.1 ships no Simulator.app) with a
# hardware keyboard attached, so focusing the composer raises no software keyboard and
# the thread region stays in place. XCTest's typing switches the simulator to the
# software keyboard, so the keyboard-up checks below follow the first typed text on
# both platforms.
- runFlow:
    when:
      platform: iOS
    commands:
      - assertVisible:
          id: 'comments-thread'
      - takeScreenshot:
          path: maestro/artifacts/community-comments-long-reply-hardware-keyboard
# Typed text landing in the counter proves the composer holds keyboard focus; Maestro's
# iOS hierarchy reports every element unfocused.
- inputText: 'ok'
- assertVisible: '^2 / 280 characters$'
# R51: with the keyboard up the thread region is hidden, so no clipped sliver of a
# card shows under the title row.
- assertNotVisible:
    id: 'comments-thread'
- takeScreenshot:
    path: maestro/artifacts/community-comments-long-reply-keyboard
- eraseText: 2
- assertVisible: '^0 / 280 characters$'
# Closing the keyboard brings the thread region back. Android closes it with Back; iOS
# has no Back, so a tap on the sheet title outside the controls closes it.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn: '^Comments$'
- assertVisible:
    id: 'comments-thread'
- assertVisible:
    id: 'comments-reply-context'
    text: ${output.longReplyContext}
- takeScreenshot:
    path: maestro/artifacts/community-comments-long-reply-dismissed
# Cancel leaves the reply unsent; the root below starts from a top-level draft.
- tapOn: '^Cancel$'
- assertNotVisible: ${output.longReplyContext}
- scrollUntilVisible:
    element:
      id: 'comment-body'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-body'
- inputText: ${output.commentRoot}
- assertVisible:
    id: 'comment-submit'
- takeScreenshot:
    path: maestro/artifacts/community-comments-keyboard
- tapOn:
    id: 'comments-close'
- tapOn:
    id: 'community-card-comments-lookbook-5'
- assertVisible: ${output.commentRoot}
- tapOn:
    id: 'comment-submit'
# With live insertion the comment can be screened and published before the private
# "Your submissions" section ever renders, so that section cannot be awaited. The draft is
# cleared only after the server accepts the submission, and the send control returns to
# idle: both are stable once reached.
- extendedWaitUntil:
    visible: '^0 / 280 characters$'
    timeout: 15000
- assertVisible:
    id: 'comment-submit'
    text: 'Send comment'
- takeScreenshot:
    path: maestro/artifacts/community-comments-submitted
# With realtime connected, the published root is inserted live (about 2 s) and the
# "Published. Refresh the thread to view it." notice never appears. Wait for its public
# reply action instead, scrolling in case the live insert lands below the fold.
- scrollUntilVisible:
    element:
      id: 'comment-reply-.*'
      text: ${output.replyAction}
    direction: DOWN
    centerElement: true
    timeout: 20000
- scrollUntilVisible:
    element:
      text: ${output.commentRoot}
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-reply-.*'
    text: ${output.replyAction}
- scrollUntilVisible:
    element:
      id: 'comment-body'
    direction: DOWN
    centerElement: true
    timeout: 15000
- tapOn:
    id: 'comment-body'
- inputText: ${output.commentReply}
- assertVisible:
    id: 'comment-submit'
- takeScreenshot:
    path: maestro/artifacts/community-comments-reply-keyboard
- tapOn:
    id: 'comment-submit'
# Same acceptance proof for the reply: cleared draft and an idle send control.
- extendedWaitUntil:
    visible: '^0 / 280 characters$'
    timeout: 15000
- assertVisible:
    id: 'comment-submit'
    text: 'Send comment'
# The published reply is inserted live too; wait for the parent's replies action.
- scrollUntilVisible:
    element:
      id: 'comment-replies-.*'
      text: ${output.repliesAction}
    direction: DOWN
    centerElement: true
    timeout: 20000
- tapOn:
    id: 'comment-replies-.*'
    text: ${output.repliesAction}
- assertVisible: ${output.commentReply}
- takeScreenshot:
    path: maestro/artifacts/community-comments-discussion
- tapOn:
    id: 'comments-close'
- assertVisible:
    id: 'community-screen'
