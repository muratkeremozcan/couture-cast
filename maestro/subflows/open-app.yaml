# Shared launch preamble: get from a bare `launchApp` to the app actually
# mounted, reliably.
#
# Two Expo Go behaviours have to be absorbed here, and both were previously
# copy-pasted (inconsistently) into every flow:
#
# 1. Expo Go drops the first `openLink` when it is still coming up from
#    `clearState: true`. It processes the deep link before its own launcher has
#    finished starting and silently sits on the "Development servers / Enter URL
#    manually" screen. Every flow that opened the link exactly once failed on its
#    first assertion with the app never mounted; the two that happened to open it
#    twice passed. `retry` re-opens only when the mount actually failed, so the
#    healthy path still opens the link once — opening it again unconditionally
#    re-triggers the developer sheet described below.
#
# 2. Expo Go raises its one-time developer-menu sheet *after* the app has
#    mounted. It is a native modal with a dimmed backdrop over the top half and
#    the sheet itself over the bottom half. The app stays fully visible behind
#    it, so every `assertVisible` still passes — and then the backdrop eats the
#    flow's first tap. This was diagnosed for a long time as "Maestro cannot tap
#    this component", because the symptom is always the same: assertions fine,
#    first gesture silently ineffective, second gesture works.
#
# Callers keep their own `launchApp` because `clearState` differs per flow, then
# `- runFlow: subflows/open-app.yaml` immediately after it.
appId: ${MAESTRO_APP_ID}
---
- retry:
    maxRetries: 2
    commands:
      - openLink: ${APP_URL}

      # Dismiss an Android system "isn't responding" dialog before anything else.
      #
      # This is what kept CI red after the manifest fix. The app launched, Metro
      # bundled for the device and the app's own code ran, and every flow still
      # failed on `tab-home is visible` -- because the hierarchy at that moment
      # was an ANR dialog:
      #
      #   android:id/alertTitle   Pixel Launcher isn't responding
      #   android:id/aerr_wait    Wait
      #
      # An ANR dialog takes window focus, so an out-of-process driver sees the
      # dialog and not the app behind it. All three shards showed the identical
      # one, and the per-step hierarchies place it at step 9, well before this
      # subflow's own back presses -- so the harness does not cause it; a starved
      # launcher on a CI runner does.
      #
      # `settings put global hide_error_dialogs 1` is also set per device by the
      # runner, and is NOT sufficient on its own: ActivityManager latches that
      # value at boot and on configuration change, so setting it on a running
      # device did not prevent the dialog. This is the belt to that braces.
      #
      # "Wait" rather than "Close app": closing the launcher kills a process the
      # device immediately restarts, and this suite has no interest in either
      # outcome beyond getting the dialog off the screen.
      - runFlow:
          when:
            platform: Android
            visible:
              id: 'android:id/aerr_wait'
          commands:
            - tapOn:
                id: 'android:id/aerr_wait'
                label: 'Dismiss an Android application-not-responding dialog'

      # iOS asks for confirmation before handing an `exp://` link to Expo Go:
      # a system alert reading `Open in "Expo Go"?` with Cancel and Open. It is
      # per device and it is why a freshly created simulator behaves differently
      # from the one a developer has been using for months. Nobody answers it,
      # so Expo Go never opens the project and every flow fails on `tab-home`
      # having never mounted -- which is exactly how four parallel shards failed
      # identically on their first flow while the same flows passed serially on
      # an older simulator.
      #
      # Guarded on the alert's own title rather than tapping a bare `Open`, so
      # this can never fire a stray tap at the app.
      - runFlow:
          when:
            visible:
              text: 'Open in .*Expo Go.*'
          commands:
            - tapOn:
                text: 'Open'
                optional: true
                label: 'Confirm the iOS prompt that hands the deep link to Expo Go'

      - tapOn:
          text: 'Continue'
          optional: true
          label: 'Dismiss Expo Go first-run sheet when present'
      - tapOn:
          text: 'Open app'
          optional: true
          label: 'Dismiss Expo Go developer sheet when present'

      # Pop any pushed route the previous flow left behind.
      #
      # Flows launch with `stopApp: false`, and several end on a pushed screen
      # (the silhouette editor, the capsule library). Expo Go therefore stays on
      # that screen, and a `clearState: false` flow inherits it. `openLink`
      # re-enters the app but does NOT pop the navigation stack, so the tab bar
      # stays covered and every later step reports its target "not found" on a
      # perfectly healthy app. That is exactly how `widget-deep-link` came to
      # fail only when it ran eighteenth, behind a flow that had just started
      # succeeding.
      #
      # Guarded on `tab-home`, so this is a no-op whenever the app is already on
      # a tab screen and never fires a stray gesture at the home screen.
      # Tapping the native `BackButton` rather than issuing `back`.
      #
      # Maestro's `back` does nothing at all on iOS. The command is documented
      # as Android and Web only, and `IOSDriver.backPress()` is an empty method
      # in the driver, so it reports COMPLETED without touching the device.
      # That matches what was measured here: two `back` presses both COMPLETED
      # while the app sat unmoved on `wardrobe-silhouette-screen`. The same
      # hierarchy dump shows `resource-id: BackButton`, which Maestro can
      # address directly, so the header control is used instead.
      # https://docs.maestro.dev/reference/commands-available/back
      #
      # Two conditional passes rather than a `repeat`/`while`: each is a no-op
      # once the tab bar is showing, and the pair is bounded, so a screen that
      # never reveals the tab bar fails at the wait below with a clear message
      # instead of spinning.
      # The `back` is Android-only, and guarded on Expo Go not showing one of
      # its own screens. Both halves were learned from a CI run.
      #
      # Android-only because iOS gets nothing from it: `back` is documented as
      # Android and Web only and its iOS implementation is an empty method, so
      # there it is a no-op that still reports COMPLETED. That is why the
      # `BackButton` tap exists. On Android `back` is the system BACK key
      # (`input keyevent 4`) and does real work, so it is what actually pops the
      # stack on that platform, where `BackButton` is not in the hierarchy at
      # all.
      #
      # Guarded because `notVisible: tab-home` does not mean "a pushed route is
      # covering the tab bar". It is equally true when the app has not mounted,
      # and on a GitHub runner it was: Expo Go could not fetch the manifest and
      # was sitting on `Something went wrong.`. Both blocks then fired, and two
      # system BACK presses walked Expo Go out to its own home screen and then
      # to the Android launcher, so the failure was reported as `tab-home` never
      # appearing with the launcher on screen -- which points at everything
      # except the real cause. Without the back presses the run fails at the
      # wait below, still red, but pointing at the app that would not load.
      #
      # The error screen is not the only such state and it is not the common
      # one, so the guard lists every Expo Go screen measured here so far. The
      # local run under maestro/artifacts/2026-08-14_120603 has the whole
      # sequence in its hierarchy dumps: at step 13 the screen was Expo Go's
      # splash for this project (`Splash Screen Image` and `Couture Cast`, none
      # of the app yet) because the bundle was still loading, so the first block
      # fired and BACK landed on Expo Go's own home screen (`Development
      # servers`, `Enter URL manually`); the error-screen guard had nothing to
      # say about either, so the second block fired too, and step 20 dumps
      # `com.google.android.apps.nexuslauncher` -- the Android launcher, exactly
      # the walk this guard was added to stop. The flow then spent the 45s wait
      # below and its entire first `retry` attempt recovering.
      #
      # `Couture Cast` is the app `name` from apps/mobile/app.json, which Expo
      # Go paints under the splash image. It cannot collide with a screen of
      # ours: every user-facing string in the app spells it `CoutureCast`.
      - runFlow:
          when:
            notVisible:
              id: 'tab-home'
          commands:
            - tapOn:
                id: 'BackButton'
                optional: true
                label: 'Pop a pushed route left behind by the previous flow'
            - runFlow:
                when:
                  platform: Android
                  notVisible:
                    text: 'Something went wrong.|Development servers|Couture Cast'
                commands:
                  - back
            # Let the pop finish before the second block asks the same question.
            # The two blocks are independent evaluations of `notVisible:
            # tab-home`, and a stack transition still animating answers with the
            # screen that is on its way out, so the second pop fires on a
            # hierarchy that is already stale.
            - waitForAnimationToEnd
      - runFlow:
          when:
            notVisible:
              id: 'tab-home'
          commands:
            - tapOn:
                id: 'BackButton'
                optional: true
                label: 'Pop a second pushed route'
            - runFlow:
                when:
                  platform: Android
                  notVisible:
                    text: 'Something went wrong.|Development servers|Couture Cast'
                commands:
                  - back

      # The tab bar is the app's own first painted chrome, so a failure to mount
      # is reported here, at the launch step, rather than as a confusing
      # assertion failure deep inside the calling flow.
      - extendedWaitUntil:
          visible:
            id: 'tab-home'
          timeout: 45000
          label: 'App mounted and tab bar painted'

# Dismiss the developer sheet by spending a throwaway tap on its backdrop.
#
# It has to be a blind coordinate tap, and the reason is the whole reason this
# defect survived so long: **Maestro cannot see this sheet.** It is drawn by
# Expo Go itself rather than by the app under test, so it never appears in the
# hierarchy Maestro queries. The step log shows the consequence plainly — with
# the sheet filling the bottom half of the screen, `tapOn: text: 'Continue'`
# still reports the element as not found, and an `assertNotVisible` on the
# sheet's own body text passes. Nothing about the sheet can be asserted, which
# is exactly why every symptom pointed at the app instead: assertions all green,
# first gesture silently swallowed, second gesture fine.
#
# So the optional text taps below are kept only for the case where Expo Go
# renders a variant Maestro *can* reach; the `point` tap is what actually does
# the work. `50%,10%` is the navigation header, inert on the screen this subflow
# always lands on, so it costs nothing when no sheet is present.
#
# Two taps, separated by a settle, because the sheet rises a beat after
# `tab-home` paints and a single tap can land just before it appears. This
# cannot be replaced by a condition, for the reason above; `tab-home` is the
# only real post-condition available.
- tapOn:
    text: 'Continue'
    optional: true
    label: 'Finish Expo Go developer-menu onboarding if Maestro can reach it'
- tapOn:
    text: 'Open app'
    optional: true
    label: 'Dismiss the Expo Go developer sheet if Maestro can reach it'

- tapOn:
    point: '50%,10%'
    label: 'Absorb the developer sheet backdrop; inert on the app itself'
- waitForAnimationToEnd
- tapOn:
    point: '50%,10%'
    label: 'Absorb a sheet that rose after the first absorb tap'

# Recover from an absorb tap that took the app off screen.
#
# The two taps above are BLIND coordinate taps — they have to be, because the
# Expo Go developer sheet is drawn outside the app's hierarchy and Maestro cannot
# see it to guard on. The comment above calls `50%,10%` inert on the screen this
# subflow lands on, and on a fast device it is. On a contended one it is not:
# measured on 2026-09-05 across four parallel Android emulators running flows at
# 4-5x their recorded durations, the per-step hierarchy dumps show the app fully
# present at the step before these taps (`host.exp.exponent`,
# `hero-experience-scrollview`, `mobile-chip-navigation`, `tab-home`) and, three
# minutes later at the assertion below, NOTHING but `com.android.systemui` and
# its notification entries. Nothing runs between them except the absorb taps.
# Five flows across three shards and four unrelated stories failed that way in
# one run, which is what made it a harness problem rather than four flow bugs.
#
# Removing the absorb taps is not the fix: they are load-bearing for a sheet that
# eats the first real gesture of any flow that meets it, and trading a known
# failure for an unknown one is a bad trade. So the taps stay and their known
# side effect is recovered from instead — a stray tap now costs one re-entry
# rather than the whole flow.
#
# Guarded on `tab-home`, so this is a no-op on the healthy path and never fires a
# stray gesture. `back` is Android-only for the reason stated further up: its iOS
# implementation is an empty method that reports COMPLETED without touching the
# device. On Android it is the system BACK key, which is also what dismisses a
# notification shade.
- runFlow:
    when:
      notVisible:
        id: 'tab-home'
    commands:
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - waitForAnimationToEnd
      - openLink: ${APP_URL}
      - extendedWaitUntil:
          visible:
            id: 'tab-home'
          timeout: 30000
          label: 'Recovered the app after an absorb tap left it'

- assertVisible:
    id: 'tab-home'
    label: 'Still on the app after the absorb taps'

- waitForAnimationToEnd
