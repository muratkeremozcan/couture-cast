# Close whichever Expo Go developer sheet is covering the app, if one is.
#
# Expo Go raises one of two sheets over the app on a launch that followed
# `clearState`, a few seconds after the app has mounted. Both were reproduced on
# 2026-10-16 (Expo Go 54.0.8, Android emulator), and both are in the
# accessibility hierarchy once they have risen:
#
# - the onboarding sheet, "This is the developer menu ... Continue". Its own
#   Continue button closes it and persists Expo Go's "onboarding finished"
#   preference, so it does not return for the rest of the flow.
# - the full developer menu, "Connected to expo-cli", Reload, Go Home. A tap on
#   the dimmed backdrop above the sheet closes it.
#
# Android BACK closes neither: with either sheet up, it exits Expo Go to the
# launcher.
#
# Each dismissal is guarded on its sheet actually being there. The old version
# spent two unguarded `50%,10%` taps on the belief that Maestro cannot see these
# sheets; it was looking for Continue on the full menu, which has none. The
# unguarded taps raced the sheet, and in CI run 38934394685 a dimmed backdrop
# outlived them and swallowed every Settings tap.
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    when:
      visible:
        text: 'This is the developer menu.*'
    commands:
      - tapOn:
          text: 'Continue'
          label: 'Finish Expo Go developer-menu onboarding with its own button'
      - extendedWaitUntil:
          notVisible:
            text: 'This is the developer menu.*'
          timeout: 10000
          label: 'Developer-menu onboarding is gone'
- runFlow:
    when:
      visible:
        text: 'Connected to expo-cli'
    commands:
      - tapOn:
          point: '50%,10%'
          label: 'Close the Expo Go developer menu with a tap on its backdrop'
      - extendedWaitUntil:
          notVisible:
            text: 'Connected to expo-cli'
          timeout: 10000
          label: 'Developer menu is gone'
- tapOn:
    text: 'Open app'
    optional: true
    label: 'Dismiss the Expo Go developer sheet variant that offers Open app'
