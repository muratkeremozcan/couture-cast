# Learning path Step 73: Calm Closet and Profile.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-73-calm-closet-and-profile
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-settings.yaml
- scrollUntilVisible:
    element:
      id: 'profile-${PROFILE_TOPIC}-row'
    direction: DOWN
    timeout: 15000
# Reacquire the Profile row before another tap. On the small 2x Android device,
# the row's old coordinates can land on Tune my style after navigation.
- retry:
    maxRetries: 1
    commands:
      - runFlow:
          when:
            visible:
              id: 'profile-${PROFILE_TOPIC}-row'
          commands:
            - tapOn:
                id: 'profile-${PROFILE_TOPIC}-row'
                retryTapIfNoChange: false
      - extendedWaitUntil:
          visible:
            id: 'app-top-bar-back'
          timeout: 15000
