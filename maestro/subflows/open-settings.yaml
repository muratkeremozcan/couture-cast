# Navigate to the Settings tab and prove you actually landed there.
#
# A bare `tapOn: id: tab-settings` is not reliable in Expo Go. The developer
# sheet can rise over the lower half of the screen at any point after mount,
# which is exactly where the tab bar lives, so the tap is swallowed by the sheet
# and the flow carries on believing it navigated. The symptom is always a
# confusing downstream failure — `premium-settings-section` "not found",
# `locale-btn-tr-TR` "not found" — on a screen that renders both perfectly well.
#
# So the tap is paired with an assertion on the destination screen and the pair
# is retried. `settings-screen` is the testID on the settings container in
# `app/(tabs)/settings.tsx`.
#
# `subflows/absorb-expo-dev-sheet.yaml` runs before the tap; it closes the
# Expo Go onboarding sheet or full developer menu, whichever is up. Same sheets,
# same tab bar as the sibling `open-wardrobe-tab.yaml`.
appId: ${MAESTRO_APP_ID}
---
# Counts attempts so only a retry relaunches the app; see relaunch-app.yaml.
- evalScript: ${output.settingsTabAttempt = 0}
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${output.settingsTabAttempt = output.settingsTabAttempt + 1}
      - runFlow:
          when:
            true: ${output.settingsTabAttempt > 1}
          file: relaunch-app.yaml
          label: 'A tab tap was swallowed; relaunch the app before trying again'
      - runFlow: absorb-expo-dev-sheet.yaml
      # Pop a pushed route first. The tab bar is not reachable from the capsule
      # library or the silhouette editor, and a caller can arrive here with one
      # of those on top -- `garment-capsule-localization-flow` did, and reported
      # `tab-settings` "not found" while the capsule library sat on screen with
      # its `BackButton` plainly visible in the hierarchy. Optional, so this is a
      # no-op whenever a tab screen is already showing.
      - runFlow:
          when:
            notVisible:
              id: 'tab-settings'
          commands:
            - tapOn:
                id: 'BackButton'
                optional: true
                label: 'Leave a pushed route so the tab bar is reachable'
            # `BackButton` is an iOS identity and does not exist on Android, so
            # the optional tap above is a silent no-op there and the pushed
            # route stays on top. Confirmed from a failure hierarchy: the
            # silhouette editor exposed `wardrobe-silhouette-screen`,
            # `silhouette-editor` and its own controls, and no back affordance
            # Maestro could address. Three flows reported `tab-settings` "not
            # found" this way while sitting on a perfectly healthy pushed
            # screen.
            #
            # Android's system back pops the React Navigation stack directly, so
            # it is the right tool there. It stays platform-guarded because on
            # `back` is documented as Android and Web only, and its iOS
            # implementation is an empty method, so on iOS it would be a no-op
            # that still reported COMPLETED.
            # https://docs.maestro.dev/reference/commands-available/back
            - runFlow:
                when:
                  platform: Android
                commands:
                  - back
      - tapOn:
          id: 'tab-settings'
          retryTapIfNoChange: true
          label: 'Open settings'
      - extendedWaitUntil:
          visible:
            id: 'settings-screen'
          timeout: 15000
          label: 'Settings screen is the one on top'

# Land at the TOP of the settings screen, wherever a previous flow left it.
#
# The settings list is one long ScrollView and its scroll offset survives a tab
# switch, so a flow that scrolled down to the Premium section leaves the next
# flow looking at the middle of the page. `analytics` inherited exactly that and
# failed on "Language" — the first section on the screen — while the screenshot
# showed the Premium and diagnostics sections rendering perfectly well further
# down. Anchored on the en-US locale button rather than the "Language" heading
# because the testID is stable across locales and the heading is translated.
- scrollUntilVisible:
    element:
      id: 'locale-btn-en-US'
    direction: UP
    timeout: 10000
    label: 'Settings list is scrolled to the top'

- waitForAnimationToEnd
