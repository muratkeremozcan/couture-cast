# Navigate to the Wardrobe tab and prove you actually landed there.
#
# Same reasoning as `subflows/open-settings.yaml`: in Expo Go the developer
# sheet can rise over the tab bar after mount and silently eat the tap, so the
# tap is paired with an assertion on the destination and the pair is retried.
# Without it the failure surfaces much later as `wardrobe-garment-list` or
# `wardrobe-capsules-link` "not found" on a screen that renders both.
#
# `subflows/absorb-expo-dev-sheet.yaml` runs before the tap. PR #141 (story
# 5.5) saw CI fail here with `tab-wardrobe` reporting COMPLETED on all four
# retry attempts while Expo Go's full developer menu covered the tab bar. A lone
# `tapOn: text: 'Continue'` could not close it because that sheet has no
# Continue button; the shared subflow closes whichever sheet is actually up.
#
# This is the tab-bar route. `subflows/open-wardrobe.yaml` is the deep-link
# route (`${WARDROBE_URL}`) and is what flows should use when they are not
# specifically exercising tab navigation.
appId: ${MAESTRO_APP_ID}
---
# Counts attempts so only a retry relaunches the app; see relaunch-app.yaml.
- evalScript: ${output.wardrobeTabAttempt = 0}
- retry:
    maxRetries: 3
    commands:
      - evalScript: ${output.wardrobeTabAttempt = output.wardrobeTabAttempt + 1}
      - runFlow:
          when:
            true: ${output.wardrobeTabAttempt > 1}
          file: relaunch-app.yaml
          label: 'A tab tap was swallowed; relaunch the app before trying again'
      - runFlow: absorb-expo-dev-sheet.yaml
      - tapOn:
          id: 'tab-wardrobe'
          retryTapIfNoChange: true
          label: 'Open wardrobe'
      - extendedWaitUntil:
          visible:
            id: 'wardrobe-screen'
          timeout: 15000
          label: 'Wardrobe screen is the one on top'

- waitForAnimationToEnd
