# Story CC-7.9 (TEA): the four tabs' snapshots in one scheme. env: SCHEME (light or dark).
appId: ${MAESTRO_APP_ID}
---
- runFlow:
    file: shell-visual-tab.yaml
    env: { TAB_ID: 'tab-home', TITLE: 'Home', NAME: 'home', SCHEME: '${SCHEME}' }
- runFlow:
    file: shell-visual-tab.yaml
    env:
      { TAB_ID: 'tab-wardrobe', TITLE: 'Wardrobe', NAME: 'wardrobe', SCHEME: '${SCHEME}' }
- runFlow:
    file: shell-visual-tab.yaml
    env:
      {
        TAB_ID: 'tab-community',
        TITLE: 'Community',
        NAME: 'community',
        SCHEME: '${SCHEME}',
      }
- runFlow:
    file: shell-visual-tab.yaml
    env:
      { TAB_ID: 'tab-settings', TITLE: 'Profile', NAME: 'profile', SCHEME: '${SCHEME}' }
