# Navigate to the outfit capsule library: Looks tab, Saved segment, Capsules filter, then
# Manage capsules.
#
# Story CC-7.11 D8: Capsules left the Closet header (`wardrobe-capsules-link` is gone) and lives
# on the Looks tab. This subflow opens Looks itself, so callers no longer open the wardrobe tab
# first.
# Story CC-7.12 (Step 69): the CC-7.11 `looks-capsules-row` is gone. Capsules is a Saved filter
# (`looks-filter-capsules`), and its `looks-manage-capsules` row opens the library. A member with
# nothing saved opens Looks on Ideas, so the flow selects Saved first.
#
# Same reasoning as `open-wardrobe-tab.yaml` and `open-settings.yaml`: pair the
# tap with an assertion on the destination and retry the pair, rather than
# asserting immediately and hoping the navigation has landed. The row pushes
# `/wardrobe-capsules`, so the screen has to mount and fetch its capsules before
# its toolbar paints. A bare `assertVisible` on the next line races that and
# reports `create-capsule-button` "not found" on a screen that renders it a moment later.
appId: ${MAESTRO_APP_ID}
---
- runFlow: open-looks-tab.yaml

- retry:
    maxRetries: 3
    commands:
      - tapOn:
          id: 'looks-segment-saved'
          label: 'Open the Saved segment'
      - tapOn:
          id: 'looks-filter-capsules'
          label: 'Filter Saved to capsules'
      # The manage row renders under the filter's first read, below the capsule tiles.
      - scrollUntilVisible:
          element:
            id: 'looks-manage-capsules'
          direction: DOWN
          timeout: 15000
          label: 'Manage capsules row is on screen'
      - tapOn:
          id: 'looks-manage-capsules'
          label: 'Open the outfit capsule library'
      - extendedWaitUntil:
          visible:
            id: 'create-capsule-button'
          timeout: 15000
          label: 'Capsule library is the screen on top'

- waitForAnimationToEnd
