# Learning path Step 57: Google sign-in.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-57-google-sign-in
# Story 6.17 M lane (AC1, D2, D3): a Google identity with no account, from the Create account door,
# finishes with an adult birthdate and lands on Home as a member.
# Runner: scripts/run-google-native.mjs queues ${GOOGLE_EMAIL} on the mock OIDC provider, then
# checks one app user and an Auth user with a keycloak identity for it.
appId: ${MAESTRO_APP_ID}
name: 'Google new account'
tags:
  - google-sign-in
---
- runFlow: steps/open-home.yaml
- tapOn:
    id: 'home-create-account'
- extendedWaitUntil:
    visible:
      id: 'google-sign-in'
    timeout: 15000
    label: 'The Create account door shows Continue with Google'
- runFlow: steps/continue-with-google.yaml
- runFlow: steps/finish-step.yaml
- runFlow: steps/enter-birthdate.yaml
- runFlow: steps/assert-member-home.yaml
