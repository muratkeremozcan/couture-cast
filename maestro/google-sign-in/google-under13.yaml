# Learning path Step 57: Google sign-in.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-57-google-sign-in
# Story 6.17 M lane (AC3, D3): an under-13 birthdate on the finish step is refused. The client
# submits it so the server can delete the Google identity; the step shows the outcome text.
# Runner: passes a birthdate ten and a half years ago, then checks the Auth user is gone and no
# app user exists.
appId: ${MAESTRO_APP_ID}
name: 'Google under 13'
tags:
  - google-sign-in
---
- runFlow: steps/open-home.yaml
- tapOn:
    id: 'home-create-account'
- extendedWaitUntil:
    visible:
      id: 'google-sign-in'
    timeout: 15000
- runFlow: steps/continue-with-google.yaml
- runFlow: steps/finish-step.yaml
- runFlow: steps/enter-birthdate.yaml
- extendedWaitUntil:
    visible:
      id: 'finish-signup-outcome'
      text: ${UNDERAGE_TEXT}
    timeout: 30000
    label: 'The finish step shows the age refusal'
- assertNotVisible:
    id: 'finish-signup-birthdate'
