# Learning path Step 28: Accessibility hardening.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-28-accessibility-hardening
# Story 3.8: Deterministic navigation, state, modal, and target verification.
# Maestro does not validate screen-reader speech or visual contrast.
appId: ${MAESTRO_APP_ID}
name: 'Accessibility interaction contract'
tags:
  - e2e
  - accessibility
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- assertVisible:
    id: 'tab-home'
- assertVisible:
    id: 'tab-wardrobe'
# CC-7.11 D1: Looks sits between Closet and Community.
- assertVisible:
    id: 'tab-looks'
- assertVisible:
    id: 'tab-community'
- assertVisible:
    id: 'tab-settings'

- tapOn:
    id: 'tab-community'
- assertVisible:
    id: 'community-screen'
- tapOn:
    id: 'tab-home'

# Step 71: the picture's first slot opens Swap directly.
- extendedWaitUntil:
    visible:
      id: 'today-outfit-slot-0'
    timeout: 15000
- tapOn:
    id: 'today-outfit-slot-0'
- extendedWaitUntil:
    visible:
      id: 'today-outfit-swap'
    timeout: 15000
- assertVisible:
    id: 'today-outfit-swap-option-0'
    checked: true
- tapOn:
    id: 'today-outfit-swap-option-1'
- assertNotVisible:
    id: 'today-outfit-swap'
- assertVisible:
    id: 'today-outfit-slot-0'

- assertNotVisible:
    id: 'header-info-modal'
- runFlow:
    file: subflows/open-profile-topic.yaml
    env: { PROFILE_TOPIC: 'about' }
- assertVisible:
    id: 'settings-about-screen'
- assertVisible:
    id: 'app-top-bar-title'
    text: 'About and privacy'
- tapOn:
    id: 'app-top-bar-back'
- assertVisible:
    id: 'tab-settings'
    selected: true

- takeScreenshot:
    path: maestro/artifacts/accessibility-hardening
