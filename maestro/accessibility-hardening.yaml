# Learning path Step 28: Accessibility hardening.
# See _bmad-output/project-knowledge/learning-path-step-by-step.md#step-28-accessibility-hardening
# Story 3.8: Deterministic navigation, state, modal, and target verification.
# Maestro does not validate screen-reader speech or visual contrast.
appId: ${MAESTRO_APP_ID}
name: 'Accessibility interaction contract'
tags:
  - e2e
  - accessibility
  - maestro
---
- launchApp:
    appId: ${MAESTRO_APP_ID}
    clearState: true
    stopApp: false

- runFlow: subflows/open-app.yaml

- assertVisible:
    id: 'tab-home'
- assertVisible:
    id: 'tab-wardrobe'
- assertVisible:
    id: 'tab-community'
- assertVisible:
    id: 'tab-settings'

- assertVisible:
    id: 'chip-personal'
    selected: true
- tapOn:
    id: 'chip-community'
- assertVisible:
    id: 'chip-community'
    selected: true

- tapOn:
    id: 'tab-community'
- assertVisible:
    id: 'community-screen'
- tapOn:
    id: 'tab-home'

# Garment swap: selector state and modal dismissal.
#
# These steps used to name `classic-trench-coat` and `leather-jacket`. Those are
# MSW fixture names from the mobile unit tests; the live API seeds garments as
# `<userId>-garment-<n>`, so the ids are generated per fixture user and differ on
# every run. The flow could never have passed against a real server. What the
# story actually asks this flow to prove is data-independent, so it is now
# asserted that way: a garment tile opens the swap modal, the currently-worn
# option carries `accessibilityState.selected`, and choosing a different option
# dismisses the modal.
# `centerElement: true` is load-bearing, not a nicety.
#
# Without it `scrollUntilVisible` stops as soon as the tile is inside the
# viewport, which routinely leaves it at the very bottom of the screen -- and the
# bottom tab bar is a sticky overlay sitting on top of that band. Maestro judged
# the tile 100% visible and tapped the centre of its bounds; measured from the
# failing run, the tile landed at [16,797][386,861] and `tab-home` occupies
# [0,784][100,840], so the tap at (201,829) went to the Community tab instead of
# the tile. Every assertion up to that point passed, the tap reported COMPLETED,
# and the swap modal simply never opened -- the app was on another screen.
# Centering puts the tile in the middle of the viewport, clear of the overlay.
- scrollUntilVisible:
    element:
      id: 'garment-tile-.*'
    direction: DOWN
    centerElement: true
    timeout: 15000
# `scrollUntilVisible` returns as soon as the element is on screen, while the
# scroll view is still decelerating, and a tap delivered into a moving scroll
# view is absorbed stopping it. Settle first, then tap.
- waitForAnimationToEnd

- tapOn:
    id: 'garment-tile-.*'
    index: 0
- extendedWaitUntil:
    visible:
      id: 'garment-swap-modal'
    timeout: 15000
- assertVisible:
    id: 'swap-option-.*'
    selected: true
- tapOn:
    id: 'swap-option-.*'
    index: 1
- assertNotVisible:
    id: 'garment-swap-modal'
- assertVisible:
    id: 'outfit-recommendation-card'

- tapOn:
    id: 'header-info-modal'
- assertVisible:
    id: 'information-modal'
- tapOn:
    id: 'information-modal-close'
- assertVisible:
    id: 'tab-home'

- takeScreenshot:
    path: maestro/artifacts/accessibility-hardening
